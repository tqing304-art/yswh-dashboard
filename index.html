，必先杀心，绝恩长果，方结新局。什么叫杀心？什么叫绝恩长果？普通人眼里的转运是春风得意，是贵人相助。\n\n但是我告诉你真的错了，运势发生显著改变的前兆往往往往都伴随着极度的痛苦、背叛、孤独和六亲不认。\n\n这里我们要引入一个观点，就是天道要维持平衡，既然要维持平衡，那他就会让每一个人都平等的拥有好运。但是很多人为什么没有。\n\n就是因为他不懂这套规则，所以他有一颗泛滥的圣母心，有脆弱的自尊心，以及对底层烂人烂事的共情心。\n\n所以你就会发现，那些突然转运变好的人，根本不是懂得了什么高深的商业模式，也不是走了狗屎运，更不是出现了一个贵人帮他之类的。\n\n而是他们突然大彻大悟的明白了一个道理。\n\n就是，只要我还在顾及身边这些烂人烂事儿的感受，只要我还舍不得这些消耗我的关系，我就永远不配往上走。\n\n因为天道运行的底层逻辑是同频共振啊，对不对？你天天和一层底层人，和一群底层人在一起抱怨生活，天天为了几百块钱的得失纠结内耗，你为了照顾亲戚朋友的感受，然后委屈自己。\n\n等等无数种连你自己都知道很傻的行为。\n\n那你怎么可能还有多余的气血去维持你往上走，因为人的气血是有限的，一切都是用气血交换呢？\n\n那么这个时候，聪明人就知道要怎么做了。\n\n聪明人就明白怎么让自己好起来了，就3步。\n\n就记住3条铁律，你的运势将会不可逆转的变化。\n\n第一，物理隔绝对烂人烂事，多看的每一眼都是对自己的不负责任。不和任何人纠缠，戒掉所有无效社交，你不需要亲戚，不需要朋友。\n\n你不需要任何人。\n\n我相信很多人都会有这个经历，就是自己即将要好起来的时候，朋友叫去喝酒，亲近就要去帮忙，再或者朋友劝你踏实点儿，亲戚劝你别好高骛远，一来二去，机会错过，这就是底层社会的现状。\n\n因为没人希望你好啊，真的，你太好了，就显得他们不好了，他们烂在泥里，你也不能试图站起来。\n\n所以第一步就是断舍离，给自己一个干净的磁场。\n\n这是最底最底层的逻辑，这是你要为自己的好运打下的一个地基。\n\n第二就是借调自正。\n\n给人看卦。这些年我真的发现很多人一直倒霉，一直被消耗，就是因为他陷入了一个自证陷阱，他总想证明他是个好人。\n\n他总自我感动。\n\n但是你不需要证明你是个好人，别人怎么看你，跟你有什么关系？\n\n老板压榨你，你为了证明自己有能力，为了证明自己负责任，然后拼命的加班，亲戚朋友PUA你，你为了证明自己重感情，不自私，然后疯狂倒贴，这太傻了，别人怎么看你，跟你有什么关系？\n\n鬼谷子的第一篇百合篇里就有讲，阳动而行，阴止而藏。你说我自私，那我就自私，你说我冷血，那我就冷血，你说我变了，那我就变了。我没有向你解释的必要，我没有向你证明的必要，只要利益不发生冲突，所有的指责和误解，我直接照单全收，做自己想做的。\n\n因为没有人会为我的人生负责，我只能为自己的人生负责。\n\n第三就是课题分离。\n\n鬼谷子的角力篇里有讲，绝情定宁，万事之基。任何人生抉择，你所做的任何决定，都要以自己的感受，以自己的利益为先。比如当爱，比如当对方向你提出要求时，不管他是你的老板，还是合伙人，还是兄弟、闺蜜、伴侣，你只需要基于你的本心判断你是否愿意接受就可以了。至于对方被你拒绝以后，是愤怒，是伤心还是难过，在或者你的行为会给对方造成什么严重的后果，这本质上是对方的人生课题，和你没什么关系。\n\n所以永远记住啊，运势的逆转从来不是和风细雨的，它是一场极其残酷的洗髓换血。绝恩斩果不是让你变得没感情，不是让你变成没感情的畜生。绝恩斩果是让你绝对理智，对自己的命运负起百分百的责任。你不需要向任何人交代，你只需要向你自己交代，因为没有任何人会给你买单。", "account_name": "博闻文化（目清师兄）", "account_owner": "博闻文化（目清师兄）", "account_type": "竞品", "comment_analysis": null}, {"id": "7593243951096777984", "title": "#道家文化 #随拍", "date": "2026-01-09", "likes": 55530.0, "comments": 12309.0, "shares": 30378.0, "collects": 8319.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "", "account_name": "博闻文化（目清师兄）", "account_owner": "博闻文化（目清师兄）", "account_type": "竞品", "comment_analysis": null}, {"id": "75 己好起来。", "account_name": "洪洞师兄(目清)", "account_owner": "洪洞师兄(目清)", "account_type": "竞品", "comment_analysis": {"sentiment": "负面", "topics": ["熟人偷窃怀疑", "朋友来访后关系破裂", "不请客到家的习惯", "对陌生人进家的洁癖", "独来独往的生活方式"], "audience_keywords": ["多疑", "社交谨慎", "洁癖", "独居", "情感敏感", "自我保护", "女性", "中年"]}}, {"id": "7632208871808994623", "title": "命里一尺，难求一丈。人这一辈子，有四样东西早已注定 #目清师兄 #道家文化 #感悟人生 #学习", "date": "2026-04-24", "likes": 37366.0, "comments": 1456.0, "shares": 12704.0, "collects": 10735.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "命里一尺，难求一丈。人这一生，有四样东西从你出生那一刻就已经被定好了。年轻的时候你可能感觉这是封建迷信，但是当你感受过了大运的推背感，体验了快进快出的流水财富，经历了人来人往的因缘际会，你才能真正的明白什么叫命里有时终须有，命里无时莫强求。这条视频我绝对不是想让你认命啊，我是想让你知命。阴符经讲观天之道，执天之行，近矣。意思其实非常简单，就是看透规律才能知命，知命才能更好的驾驭命。首先第一注定的就是财富。我在这些年给人看卦的生涯中，我接触了非常多的客户，有两个我印象非常深刻，第一个就是从小学就辍学了，然后在工地上班，就是在他的人生看起来，当时就没有任何希望了，但他就是顺，他在工地遇到了一个天大的机缘，就几年的光景，赚了几个小目标。还有个客户，他父母都是生意人，零几年的时候就送他出国留学了，然后留学回来以后给了他一千万创业，然后半年亏完了，然后又拿一千，又没了，来来回回反反复复，就是甭管听起来多好的项目，沾边就亏，各种事情，各种意外，现在人在饭店上班，哦对，还有一个创业亏钱了，紧接着家里拆迁了，拆迁款亏完了，然后他父母房子又拆了，又亏了，紧接着他爷爷奶奶房子又拆了，这次不不创业了，老老实实生活，然后路过彩票店买了一张彩票，中了八百万，税后八百万。所以真的钱这个东西，真的挺让人无力的。有就是有，没有就是没有，穷日子穷打算，富日子富装扮，有钱把日子过好，没钱把身体养好。人的一生没有标准答案的，得了千钱想万钱，当了皇上想成仙，都挺好的。第二就是感情，我早些年讲过一个故事，后来被全网都抄袭了一遍，我估计很多人听过，大概就是我一个客户，大学毕业和他对象分开了，就是分隔两地嘛，去了可能一两两个人，相隔一两千公里的这么一个地方，几年之后在上海，快递员把楼上的快递送到他们家了，结果他给人家送上去，一敲门，开门的是他当年分开的男朋友，现在两个人已经结婚了，真的就挺有趣的，真的挺有趣的。任何人的相遇分开都根本不是当事人能决定的，是你的就是你的，不是你的你昂首挺胸，你竭尽全力，你也一样得不到。对于感情这个东西，我告诉你，不要预设和任何人共度余生就自然的相处，天有道，自不会让有情人分离，天若无道，人就该遵循天命。第三事业，所有人都在说应该去选择那些难而正确的事，但是我觉得这个纯属是扯淡。我在近些年给人看卦的生涯中，我总结出来了两条铁律。第一就是凡是需要你咬牙苦苦坚持的事，最后基本都是崩盘，而那些顺水推舟，因缘巧合的事情，反而极其丝滑的可以成了，因为凡为辛苦，皆为强求。对的事情不难，难的事情不对。第二就是阴符经讲宇宙在乎手，万物生乎身。事业这个东西，是你的你不需要争，不是你的你也争不来正。确的做法应该是在因上努力，然后果中随缘。意思非常简单，就是用事，用心把事情做好，不用太在意结果。因为做不做得好是你的事情，但是给不给你是上面的事情。第四就是寿命。人真的不是老了才会走的，人是随时都会走的，这个东西真的和年纪没什么关系。每个人都有每个人的使命，比如霍去病的使命是封狼居胥，二十三岁走了王勃的使命是写滕王阁序，二十七岁走了。人生在世，各有渡口，各有各州，真的没有标准答案，都很好，都独一无二。得到了是命，得不到也是命。用心把事情做好，至于结果，随与安就行，因为不是人能掌控的。", "account_name": "博闻文化（目清师兄）", "account_owner": "博闻文化（目清师兄）", "account_type": "竞品", "comment_analysis": {"sentiment": "混 "tags": [], "transcript": "一个看卦的告诉你啊，一个人要转运的时候，绝对不是越来越顺了，也不是越来越强了，这些都只是表象。给人看卦这些年我就发现，一个人真正要脱胎换骨，要开始变好了，都有一个明显的特点，就是他会经历一次彻底的失控。\n\n我曾经说过，一个没有真正被废过的人，他是好不起来的。\n\n这个本质其实是出自道德经的经典规律，反者道之动。一个人真正的转运，绝对不是在他风生水起的时候，而是在他最狼狈、最混乱、最失控的那个阶段。所以，如果你现在突然开始变得不想说话，不想社交，频繁质疑自己还能撑多久？\n\n这个时候你别怕，我告诉你，这并不是你的人生在崩塌，而是你的命运在翻篇儿。\n\n接下来的内容我不知道能不能发出去，也不知道发出去之后能留多久。如果刷到了，我建议你耐心认真把它看完，因为我将结合这些年给人看卦的经验以及道德经中的领悟，从头到尾解析一个人转运的6个步骤。如果你当下过得不太如意，可以对照一下你走到哪一步了。第一，人生清朝，当你原有的信念被瓦解，新的认知还没有被建立的时候，大脑会进入一个认知空窗的阶段。\n\n这就是为什么你会突然陷入焦虑、迷茫，甚至是自我攻击，因为你原来的逻辑不够用啊。\n\n人在运势低谷的时候，其实就是一个阴盛阳衰，内耗重启的过程。\n\n必须把过去那些。\n\n你坚信不疑的认为不可能替代的信念通通摧毁一遍，因为你只有彻底摧毁才能彻底的重建。\n\n道德经的第40章里讲，反者道之动，弱者道之用。意思就是道的运行规律永远是反方向运动的，事物发展到极致，就必然会走向反面。你以为你是在下坡，其实是在逼你拐弯儿。你以为的失控，其实很有可能是在清朝。\n\n因为你，你不打破，你就没办法重生，你不垮掉一遍，你就永远活在上一个版本。所以当你的信念开始崩塌的时候，其实就已经开始为转运做铺垫了。这个信念包括很多，比如说你原来深信不疑的人，你突然发现不可信了。\n\n你原来坚定永远不会失去的结果失去了，这都是信念的崩塌。第二，直念真相。当你的心念开始崩塌以后，一切事物的真相会摆在你面前。道德经的第55章理想壮则老，谓之不到。不到早已。任何事物一旦发展到强盛的顶点，就会走向衰老。如果你一直维持原样，一直不失控，一直风平浪静，那其实也就说明了你还在旧的版本里，还没有到翻篇儿的时候。\n\n但是你会发现，有一些人，哪怕是墙倒了，他还是会捂住自己的眼睛，装作看不到。\n\n选择安逸，其实我告诉你也没什么错，拒绝翻拍也是一种选择嘛，对吧？平庸就平庸，也没什么不好，但是如果想好起来，想要站起来，那就必须直面，必须重建。\n\n必须面对坍塌。所以你就会发现。\n\n真正要开始走大运的人，他们一定都经历过一次面对真相后的彻底崩溃。这不是他们懦弱，我告诉你，这其实是勇敢的表现，因为证明他们直面真相。很多人面对强倒的真相，他闭上眼睛，装聋作哑。\n\n就这么稀里糊涂过一过一辈子，所以只要这个人敢面对，崩溃太正常了。第三，痛到极致。当你选择面对真相以后，你的大脑是难以接受的，所以身体给出的反馈就是无限的痛苦。这并不是你的问题，这是人的本能。\n\n看似很脆弱，其实并不是。老子在道德经的第76章是这么说的，人之生也柔弱，其死也坚强，万物，万物草木之生也，也柔脆，其死也枯槁。人活着的时候身体是柔软的，死了之后就会变得僵硬。万物草木活着的时候是柔脆的，但是死了以后就会变得枯槁。\n\n所以，坚强的东西属于死亡的一类，柔弱的东西属于生长的一类。你现在的脆弱、崩溃撑不住，其实恰恰就说明你还在生长的状态。真正死掉的人，真正心死的人是不会痛，真正麻木的人是不会失控的。你之所以感到痛苦，因为你还在生长。\n\n你不用自暴自弃，我告诉你，你之所以失控，因为你旧的躯壳已经装不下新的你了。你的痛苦是成长的代价，你的失控是灵魂的蜕皮。你只有经历一次彻底的崩溃，你才知道自己有多强悍。\n\n所以，觉醒都是从瓦解开始的，你必须有一天痛到极致，看见谁都是虚伪，谁都是利用，或者说，看清了谁是虚伪，谁是利用，看清了什么是执念，什么是无用功。你必须在夜深人静的时候彻底撕开自己，才能从伤口里长出新的枝芽。\n\n你可以把自己想象成要破壳的小鸡，头顶很沉，但实际上已经到了突破的边缘。\n\n这个太正常了，我告诉你，置之死地而后生，第4步就是重新开始。当你经历了极致的痛苦以后，你会开始变化。你不想再讨好谁了，也不想再追着解释了，不渴望认可了，也不再思索过去，不再被垃圾关系和错误的认知束缚你。\n\n老子在道德经的第19章第19章里说，决胜志气弃智，民利百倍。绝人弃义，民富翘词，决巧弃利，盗贼无勇。这句话看似很遥远，实际上非常切合你现在的状态。你必须抛弃那些虚假的人设，抛弃那颗渴望被认可的心，你才能回到最真实的自己。这个就是绝学无忧。\n\n你把世俗的眼光，世俗的评判标准全部放下，你才能真正的无忧。放下之后，你就会发现，生活真的突然变安静了，原来困扰你的事情突然变得不重要了，真的不重要了，原来想要的也不再想要了。你不会再期望任何人来帮你一把，你也不会再期望任何人来认可你，这个时候，转运就开始了。\n\n第5步，好运袭来。这个时候，真正的好运，真正的贵人，真正的机会，才会以你意想不到的方式，接二连三的靠近你。\n\n不是你的运气来了我告诉你，而是你终于配得上他了。\n\n你能看清自己，看清真相了，我告诉你，该给你的，老天一定会在合适的时机给到你，这个是天道的运行规律，如果没给你，那很有可能是时机没到，或者你不配。就这么简单。老子在道德经的第23章里说，同于道者，道亦乐得之，同于德者，得亦乐得之。\n\n同于失者，失以乐得之。你和什么样的人同频，你就会吸引什么。你混，你混乱的时候，吸引的也是混乱，你清醒的时候，吸引的也是清醒，你强大了，吸引的必然是强大的人和事儿。所以，贵人、机遇、好运从来都不是凭空出现的，他们是你蜕变之后自然吸引来的同频共振。\n\n老子在道德经的第33章里说，知人者智，自知者明，胜人者有力，自胜者强。你能看清别人，就只是聪明，你能看清自己，才是真正的明朗。\n\n你能战胜别人只是有利，你能战胜自己才是真正的强大。\n\n而战胜自己这件事儿，只有在彻底失控之后才有可能，因为只有当你被逼到墙角，你才会发现自己身上那些根深蒂固的执念，那些习惯，那些恐惧到底有多顽固，也只有你自己才能亲手把这些东西一个一个的摘除掉，你才会明白什么叫真正的自胜者强，自知者明。\n\n你在没有改变的时候，你吸引来的全是和你同频的人，或者说都是不太清醒的人，家庭改变之后呢，你吸引来的自然就是贵人，自然就是好事儿，就这么简单，第6步转上去之后。\n\n转运之后你会什么样的？我告诉你，你会安静下来，不是没话说，是不想再说废话，不是没有情绪，是不想再被情绪裹挟，不是没社交，是懒得应付无效的关系。你会发现自己不再讨好谁，不再解释自己，不再追着别人问，哎，你，你觉得我怎么样？哎，你为什么这么对我？别人的看法这个时候对你来说就只是一个信息，不再是你的价值标尺，你会开始拒绝，拒绝烂人烂事儿，拒绝消耗你的人，拒绝你不想要的生活。\n\n你拒绝的越来越干脆，越来越不内好。\n\n老子在道德经的第81章里说，戒言不信，美言不信，善者不辩，辩者不善，知者不博，博者不知。真正的真理不需要华丽的包装，真正的强大也不需要向谁辩驳。你不再解释自己，因为你已经不需要通过别人的认可来建立自己的价值了。\n\n你不再四处炫耀，因为你已经不需要通过外界的评价来填补你内心的空虚了。你学会向内求。\n\n这个时候的你，不再被外界定义，不再被情绪裹挟，不再被执念束缚。\n\n这个时候恭喜你，你彻底好起来了。", "account_name": "洪洞师兄(目清)", "account_owner": "洪洞师兄(目清)", "account_type": "竞品", "comment_analysis": {"sentiment": "负面", "topics": ["心脉受损与成长", "人生低谷与失控", "感情破裂与离婚", "职场挫折与离职", "自我重建与蜕变"], "audience_keywords": ["焦虑", "抑郁", "创业者", "离异者", "职场人", "内耗", "成长者", "孤独"]}}, {"id": "7596590594027032165", "title": "#随拍#道家文化", "date": "2026-01-18", "likes": 31334.0, "comments": 2548.0, "shares": 80369.0, "collects": 8724.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "井字格的衣服不建议穿啊，井字格的床单被罩也不建议用，这个在道教玄学中被视为是画地为牢，天罗地网，代表了管制和约束。所以你会发现很多孩子上学，学校发的这个床单被罩都是井字格，其实也都是有讲究的，但其实呢，也并不好。老话说，住了井字房，人穷甲百王。", "account_name": "洪洞师兄(目清)", "account_owner": "洪洞师兄(目清)", "account_type": "竞品", "comment_analysis": {"sentiment": "混合", "topics": ["学校被罩井字格", "童年回忆", "田字格与学习", "个人喜好", "姓氏调侃"], "audience_keywords": ["学生", "家长", "怀旧者", "幽默网友", 的人应该真的懂我在说什么。\n\n第三败败于执念这里的执念包括但不限于执着某个人事物。\n\n因为现在的人们已经活得相对很清醒了，\n\n大家确实对于人事物都没那么执着了。但是很多人都有一个错误，\n\n就是过度的在乎沉没成本。\n\n比如一个行业已经明显不行了，但他觉得他在这个行业里干了这么多年，放弃太可惜了。\n\n再比如一个项目不行了，他就会想唉，\n\n我已经付出了这么多了，现在放弃太可惜了。\n\n但是真的，你记住啊，沉没成本不是成本。\n\n一件事情如果确定已经烂掉了，那就必须立刻切断。\n\n聪明人不会为了打翻的牛奶哭泣。\n\n过去的事情，思考到经验教训，就必须放下。\n\n你的时间精力必须用来盯住下一把牌。\n\n第四本败于不思考这点一定一定要认真听完，\n\n认真理解。这个是你，是决定你人生的一个习惯，就是你一定要把思考和内耗区分开。\n\n很多人都把内耗当成了思考。\n\n区分的很简单，思考是没有情绪的，内耗处理的全都是情绪。\n\n假设、面子、懊悔，思考是想怎么办，\n\n内耗是想凭什么，是想为什么。\n\n明白了思考和内耗的区别以后，你必须要养成每日三省五省的习惯。\n\n这个真的是非常非常非常重要的一个习惯，所有被淘汰的人，一定是丧失了思考能力的人。\n\n每日三省五省我今天做了什么？我明天要做什么？\n\n今天哪些该做，哪些不该做？明天要避免什么？我今天遇到了谁？\n\n他有什么是值得我学习的？我今天又遇到了谁？他有哪些坏毛病我不能染上？\n\n这个真的太重要了，不要放弃你对这个世界的观察和思考，真的！", "account_name": "博闻文化（目清师兄）", "account_owner": "博闻文化（目清师兄）", "account_type": "竞品", "comment_analysis": null}, {"id": "7612331710231200763", "title": "人生小满胜万全", "date": "2026-03-02", "likes": 24701.0, "comments": 952.0, "shares": 10042.0, "collects": 7273.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "", "account_name": "博闻文化（目清师兄）", "account_owner": "博闻文化（目清师兄）", "account_type": "竞品", "comment_analysis": null}, {"id": "7622994492119462906", "title": "#国学文化 #道系青年 #智慧人生 #干货分享", "date": "2026-03-30", "likes": 24693.0, "comments": 2543.0, "shares": 1907.0, "collects": 1035.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "当你的家开始走上坡路的时候，就会看到这条视频，既然看到了，就一定会阖家安康。家是用来氧气的，不是用来泄气的。家旺不旺，全看气顺不顺。一家人好好吃饭，遇事互相撑腰，这就是在氧气。为小事吵架，把坏脾气撒给家里人，这就是在泄气。心顺了，家就顺了。", "account_name": "逸恒师兄", "account_owner": "昭熹", "account_type": "本号", "comment_analysis": {"sentiment": "正面", "topics": ["接好运/吉言", "阖家安康", "万事如意/顺遂", "财运/福气", "家庭关系"], "audience_keywords": ["祈福者", "求好运", "家庭主妇/主夫", "中年人群", "传统观念", "乐观", "感恩"]}}, {"id": "7632933871458263208", "title": "工作#传统文化", "date": "2026-04-26", "likes": 24348.0, "comments": 11146.0, "shares": 664.0, "collects": 1505.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "如果你是在找工作期间刷到，说明你的本命工作正在向你敲门，因为好的工作从来不是找到或者学到的，而是推着你遇到的。时来天地皆同利，运到万事皆同行。很多朋 的。同理，你遇到一个世俗意义上混的相对失败的人，你也不能仅仅是觉得这个人很失败，很low，你要去想，他为什么失败，他是踩了什么坑导致他失败的，他是有哪些坏毛病导致他失败呢？包括你经历一次失败，也不能仅仅是经历，你要分析啊，你为什么会失败，是哪个环节错了，你成了也一。样你也要想，你是为什么成功了，下次同样的事情能不能做的更好。这个就是每日三省五善，意思就是你要在日常生活中不断的坚持不懈的去强化自己的认知。道理很简单，你分析的优秀的人多了，你的行为就会自然偏向优秀的人，因为人的本性去利弊害了你。分析失败的人多了，你遇到同样的坑的时候，你的潜意识就会提醒你不要这样去做，因为谁谁谁已经踩了这个坑了。第三，尽自己所能的，拼尽全力的保护自己的注意力。说白了就是保护自己的时间。我告诉你啊，人的一生最宝贵的财富绝对不是钱，是你的时间和你的注意力。你这一生有没有想过，满打满算就三万多天，每天都在倒计时，一切都是用气血在交换。你做任何事情之前，你都要想一下，我用我的气血去交换，到底值不值？我用我宝贵的时间去交换，到底值不值？比如无效社交，比如手机里的奶头乐，这些东西都在无形中消耗了你大量的时间。人的一生真的一晃就过去了，真的很快，转瞬即逝，白驹过隙。如果你能把视频看到这，我相信你一定是一个对美好生活有向往的人。那就听劝，把这三件事落实到你的生活中，你一定一定一定会越来越好。", "account_name": "洪洞师兄(目清)", "account_owner": "洪洞师兄(目清)", "account_type": "竞品", "comment_analysis": {"sentiment": "正面", "topics": ["第一性原理", "提升自我方法", "认知升级", "复盘总结", "保护能量"], "audience_keywords": ["求知欲", "创业者", "学生", "自我提升", "理性思考"]}}, {"id": "7619545367843065124", "title": "不要和任何人走的太近！ #目清师兄 #道家文化 #认知 #感悟", "date": "2026-03-21", "likes": 22226.0, "comments": 594.0, "shares": 8146.0, "collects": 8435.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "我再强调一遍啊，千万不要让任何人知道你太多，更不要和任何人走得太近。\n\n一旦别人过度了解你，就是你人生祸患的开始。\n\n这个世界，你除了赚钱以外，根本就不需要太多的人情往来。\n\n这个真不是教你变冷淡，是我作为一个干了十几年的挂师，\n\n亲眼看着无数客户，付出了无数巨大代价，\n\n才领悟出来的真相。以下这七个人生告诫，尤其是普通家庭出身的孩子，\n\n一定要认真把它看完。这些都是学校不教、父母不懂的生存规则，\n\n看懂了，一定会让你在以后的人生，\n\n少吃非常多的亏，少走非常多的弯路。\n\n第一，不要辩驳。这个世界上百分之九十九的人，\n\n和你的命运都没有任何关联。你不需要用你的时间、心力和情绪，\n\n去介入别人的人生。\n\n人一生最重要的能力不是交际，而是精简。\n\n剪掉无效社交，剪掉无意义的交流，剪掉不必要的情绪起伏。\n\n心力是用来关照自己的，不是用来滋养别人的。\n\n第二，永远不要让任何人在你这里无偿获得任何东西。\n\n这个是非常重要的一个生存法则。\n\n无偿，就是一切麻烦的开始。不要随意回应别人，\n\n不要随意援助，不要随意给予。这个世界上，大部分人靠近你，\n\n不是因为赏识你，而是想从你这里拿点什么走。比如情绪、资源、信息、好处、安慰、利用价值等等\n\n无数东西，一旦你开始免费付出，\n\n你就必然会吸引来一堆贪婪的吸血鬼，就像蚊子，就像苍蝇一样，\n\n直到把你吃干抹净。所以，永远记住啊，法不清，传道不贱，\n\n卖食不叩。门衣不顺路，不要让自己看起来廉价。\n\n第三，越熟的人越要少讲话。这点很多人都做反了，\n\n他们对陌生人都加倍小心，对熟人呢，都毫无戒备。\n\n但是你必须得明白，真正能伤害你的人，\n\n一定不是陌生人，陌生人不会也不敢伤害你，\n\n只有熟人才会对你下手。你过好了，他会嫉妒，你过不好，\n\n他会看不起你。所以，真的，任何时候闭嘴少说非常重要。\n\n第四，你越是对一个人好，\n\n他反而会越厌烦你。很多人想不通这一点，我告诉你是为什么。\n\n当你付出的太多，他还不起的时候，他就会想尽办法把这个心理压力转化掉。\n\n他拿你太多，他也有心理压力，\n\n因为他已经还 根本就没有对错，只有利弊。当然他遇到问题也会有情绪，这个是人的正常反应，但是他可以很快的从情绪中剥离出来，冷静的思考接下来该怎么做。也就是说，普通人遇到事儿想的是为什么，凭什么，但是能成大事儿的人，想的是想的是什么。\n\n怎么想的是怎么办，这个是非常重要的。这就好比是牛奶打翻了，你是站在原地懊悔，是可惜，是愤怒，都根本就没有意义。你不管是选择重新倒一杯，还是干脆不喝了，你都必须把地上的牛奶收拾干净。而这个过程中，你浪费了多少时间，你难过了多久，都是没有意义的，遇到问题解决问题就可以了。第二，一针见血的利益穿透力。司马迁在史记中有写，天下熙熙，皆为利来，天下攘攘，皆为利往。就是这部分人是可以把这句话贯彻到自己生活里的，一定要明白啊，懂得和落实是有非常大差距的。我给人看卦，这些年我就发现有非常多的人，他什么都懂，但是他什么都不做，他不落实。\n\n尤其是处理关系，他明知道这个世界上的任何关系都是基于价值交换的，他也明知道决定人行为的是处境，不是人品，但是他一到了事儿上，还是人情未先。\n\n但是具备这种能力的人呢？他不会听别人说了什么，他只会看别人做了什么，凡是以利益出发，这个不叫冷血，我告诉你，这个只是为自己好。\n\n第三，反人性的止损能力。周易里面讲过，己者动之危及之，先见者也。这个能力其实有点反人性，就很多人，他终其一生他都训练不出来这种能力，一段不健康的关系，一个不赚钱的项目，一个垃圾的圈子，他都知道是错的，但是他切割不了。\n\n但是真正的高手呢？只要意识到错了，手起刀落，立刻走人，因为他们知道及时止损，本质上也相当于是在盈利。他们从来不会在乎那些沉默成本，因为他知道已经捞不上来了，已经沉默了。\n\n第4，抛弃道德洁癖的绝对误事。增广贤文中有讲过，慈不掌兵，义不理财，善不为官，情不立事。很多人一辈子没出息是为什么？就是因为他们被所谓的好人面子或者是妇人之人给绑架了。做事之前先想别人怎么看，稍微得罪点人就开始内耗，说白了就是目的性不够强，真正的高手，他脑子里就一件事儿，就是把事儿做成，达到目的。\n\n就这4点，你只要能懂得必，或者说你只要是能落实到生活中，你必然会越来越好，真的。", "account_name": "洪洞师兄(目清)", "account_owner": "洪洞师兄(目清)", "account_type": "竞品", "comment_analysis": {"sentiment": "正面", "topics": ["成功者特质", "沉没成本决策", "利益关系", "能力与成功", "改名影响"], "audience_keywords": ["创业者", "职场人", "自我提升者", "理性思考者", "关注成功学"]}}, {"id": "7617007982056849393", "title": "#国学文化 #道系青年 #智慧人生 #干货分享", "date": "2026-03-14", "likes": 7534.0, "comments": 222.0, "shares": 1084.0, "collects": 1218.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "今天给大家分享一个关于财富的秘密，很多人会觉得有钱人是精于计算，\n\n其实呢，恰恰相反，你会发现他们赚到钱后第一件事，他往往不是奖励自己，\n\n因为他们知道东西是假的。现金这条视频呢，\n\n我不知道能够存多久，所以刷到了，建议大家耐心看完。其实很少有人能明白赚钱的目的，\n\n赚钱的目的是为了让你慢下来好好过日子，\n\n而不是让你做各种让你返贫的动作。道德经里有一句话天下万物生于有有生于无。\n\n看了这么多年，我就发现了一个规律，你想要财富，\n\n你就要理解财富，否则哪怕你短暂的拥有也留不住。\n\n你要明白财富它分为有形和无形，有形呢就是你的车房存，\n\n无形是你的学历，技术、经验以及机缘学。\n\n学一点来说，就是看你有没有气运，能够借助什么东西来扛住更多的财。\n\n我看过很多大老板，他们就说过一句很透的话，奢侈品其实是底层人的消费观。\n\n你们有没有发现，真正的有钱人往往穿的简洁低调，\n\n因为他们知道奢侈品不养人，现金养人。\n\n人有冲天之志，非运不能自通。很多低谷期来找我的人，\n\n我的第一反应就是让他们缓一缓，要先养精蓄锐，因为每个人的运都是有年限，\n\n躺平不会让你的状况变好，但起码不会更糟。\n\n如果你急着想要翻身，想要大富大贵，或者想要嫁入豪门，你想要更多的东西。\n\n我们常说人旺财不旺，财旺人不人财，\n\n两旺必损益谋。有时候我们要主动学会求缺，留一点遗憾，\n\n ": "7611166020011733925", "title": "#随拍#道家文化", "date": "2026-02-26", "likes": 6589.0, "comments": 280.0, "shares": 1271.0, "collects": 2030.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "合群的人命一定不好，因为物以类聚，如果你本身气场清贵，思维通透，那你就必然没办法强行的融入人群，那你如果强行融入呢，你就一定会被众人的低频磁场迅速同化你的正气，导致你的能量失衡，运势下滑。\n\n所以道家一直讲藏风聚气，热闹的合群就意味着气散，就意味着你的精气神儿没法内守，这个就像明堂逼仄，气场漏风，你的贵气，你的好运，你的财气自然就留不住。\n\n所以，君子慎独这句话一定是至理名言，而且如果我们抛开玄学聊概率也一样。\n\n不合群，很大程度上就是在降低你遇到傻逼的概率。", "account_name": "洪洞师兄(目清)", "account_owner": "洪洞师兄(目清)", "account_type": "竞品", "comment_analysis": {"sentiment": "混合", "topics": ["合群与孤独", "社交压力", "无意义社交", "人际关系", "自我成长"], "audience_keywords": ["内向者", "职场人", "创业者", "焦虑", "反思", "独立", "社交恐惧", "成熟"]}}, {"id": "7624381630982966528", "title": "人生忠告：不要让任何人过度了解你 #目清师兄 #道家文化 #人生 #认知提升", "date": "2026-04-03", "likes": 6541.0, "comments": 201.0, "shares": 3215.0, "collects": 2288.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "谁都不能去你家，同事朋友甚至是发小都不行，因为这个行为就是你祸端的开始。不要让任何人了解你太多，不要和任何人走的太近。\n\n这是所有混的好的人心照不宣的秘密，也是一个干了十几年的挂失给你最中肯的人生忠告。因为一旦别人开始过度了解你，往往就是你人生灾难的开始。真相就是，在这个世界上，你除了赚钱以外的利益关系，你根本就不需要任何人际关系，你不需要太多人际关系，这个真不是冷漠，这个是对你自己的人生负责。\n\n以下这7个人生忠告，尤其是普通家庭的孩子，一定要把它看完，因为这个都是学校不教，父母也不懂得保命法则。第一，跟你无关的人，一句话都不要说，不要回应，不要解释。\n\n99%的人都和你的命运没什么关系。你的精力是用来照顾自己的，不是用来喂养别人的。任何人向你提出要求，你只需要基于你的本心去判断你是答应还是拒绝，至于对方被你拒绝以后，是愤怒，是伤心，是难过，这个跟你没什么关系。\n\n那是他的人生课题，你的人生课题就是想一想，我是答应还是拒绝？\n\n第二，永远不要让任何人从你这里免费得到的东西。免费就是轻视的开始，大部分人接近你就是为了索取，乱接触人只会给自己带来无限的灾难。\n\n第三，越熟的人越要少说话，真正能伤害你的只有熟人。\n\n因为陌生人他不会，不会不懂，也不知道要怎么伤害你，也没心情伤害你，但熟人不一样了，你混的不好，他看不起你，他踩你一脚，你混好了，他嫉妒你，他给你使个坏。\n\n所以，过多的闲聊只会暴露秘密和把柄，千万不要讲真心话，也不要情绪输出。\n\n第4，你对一个人越好，他反而越烦你。\n\n主动付出只会降低你的价值。\n\n很多人不理解这一点，但是我告诉你为什么，因为你付出多了，到他还不起的时候，他是有心理压力的。\n\n这个时候他就还不起，怎么办？只能从他的认知里，从他的脑子里，强行把你塑造成一个坏人，一个恶人，这样他就不用还了，他就没压力了。\n\n所以。\n\n一定一定一定，不要主动付出，不要对一个人太好。\n\n第5，真正厉害的人，发现不对劲，立刻锻炼他们，只筛选，不改造他们，不试图改变任何人。\n\n但是你会发现，穷人、普通人总是在牺牲自己，拯救别人，最终的结果是什么？就是被榨干，被吃干、抹净。所以任何时候不要好为人师。第6，不要刻意维护关系。\n\n关系是靠价值维系的，靠的不是讨好。\n\n一段关系的好坏取决于价值，一段关系的长短取决于缘分，总之跟人力都没什么关系，你不需要把你的精力放在这个上面。对第7，第7点，不要乱接触人，也不要期待任何人 都是这样的。\n\n就命和运这个话题，好像到现在全网都没人能把它说清楚。\n\n有的人说你不信命，也是命里的一个环节，还有人说你不信命证明你智慧不够。\n\n总之，反正都是一些很有道理，但是永远具备争议的解释。\n\n作为一个挂失，我今天用我手里的这份大数据，因为我干了10几年了，给你把命运这件事儿完全解释清楚，首先我们要明确一下啊，什么是命运，这两点是要分开的。\n\n命就是你生下来是兰博基尼还是五菱宏光，运呢，就是你加了什么样的汽油。\n\n说白了就是。\n\n命和运加起来，等于你的人生。\n\n比如命是30分，运是50分，那你就过80分的人生。\n\n对吧，然后命是20分，运是30分，那你就过50分的人生，因为我们这个行业的缘故，我每天都会看到各种各样的出生时间，干的年头长了，就真的难免会有。\n\n重合的。\n\n同年同月同日同时的人出生的人。\n\n然后我就偶尔研究，我发现他们还真的是过着截然不同的人生。\n\n那是不是就意味着其中有人真的改命了？\n\n当然，在这门学术里，还有出生地、家族、业里等等一些条件需要作为参考，但是咱们不聊这些附加因素，因为这些影响明显只是在影响运，他根本不足以让两个人活出完全不同的两种生命状态。\n\n这就让我想起了很多年前，我师傅给我讲了一个故事，朱元璋在四海统一当了皇帝以后，他也曾派人寻找和自己八字相同的人，因为他担心危及他的位置嘛，然后后来就真的找到了一个，是一位蜂农。\n\n朱元璋就问他，他说。\n\n为什么咱俩同时出生，我当了皇帝，你却是个疯奴呢？\n\n风龙说，您有两京十三省，我有十五龙峰，您掌管天下，是无数生灵，我掌管十五龙峰，也是无数生灵。\n\n后来朱元璋还发现，他们两个还有个共同点，就是都出身贫贱，并且都是家里排行老四。\n\n我记得当时我问我师傅，我说这个是为什么。\n\n他说，三命通慧中有一句话是这么说的，人生天地之中，有五行八字相同，而富贵贫贱夭寿之不易。答曰，阴阳二气交感之时，受真精妙合之气，凝结为胎，成男成女得天地。\n\n父母一时气候，是以丙其清者为智为贤，丙其浊者为愚为不肖。智者贤者由是富或贵或寿，必有所得，所谓德足以或福也。愚者不肖者不能自愤，日益蒙蔽，则。\n\n贫贱与妖，有不能免，所谓下于下移是也。\n\n反正说白了就是他们面对困难时，应对的方式是不同的。\n\n包括我这些年遇到的这些同时出生的这些客户。我发现他们其实。\n\n确实是他们人生的起起伏伏基本是一致的。比如。\n\n一个是在10岁的时候，父亲输光了家底儿，另一个可能就是10岁的时候父亲投资赔了钱，就可能过程是有区别的，但是基本造成的结果，或者说基本对他们造成的影响是一样的。\n\n但他们的人生之所以活的不一样，就是他们面对问题时给出的反应不同。\n\n好像有点难懂啊，咱这么比例子就可以了，我们可以把每一个人比作一台车子。\n\n把人生比作一条长途赛道，这条赛道上有山路，有公路，有乡间小路。\n\n两个同时出生的人是一样的车子，这个是他们的命。\n\n比如他们生来都是一辆小轿车，但他们的区别是，一个上山路以后开的很慢，然后到公路上使劲加速使劲跑，另一个在山路上疯狂开，到了公路慢慢悠悠。\n\n这一定就造就了截然不同的人生啊。\n\n这个时候，我相信一定会有人说，我也知道我是小轿车，我肯定在公路上努力啊，傻子才会在山路上努力。\n\n但你真的知道吗？\n\n你回想一下你过往人生顺境的时候，是不是你也会得洋得意洋洋，你会放纵自己，你会膨胀，你觉得老子天下无敌了？\n\n顺境的时候，你是不是又着急上头，疯狂努力，就怕被落下？\n\n那你是真的知道吗？\n\n你也许是真的知道，但你对抗不了人性，所以你被落下了。\n\n人性该让你急的时候，你收敛不了。\n\n人性让你懒惰的时候，你也对抗不了。\n\n早些年我去终南山的时候，我听前辈说过一句话，我印象特别深刻，他说人生其实就是一场家族业力的对抗。\n\n打赢了，你的人生就赢了，败了你就付之你父亲的一生。\n\n当然，女性复制你母亲的一生。\n\n什么意思？意思就是你的家族业里会完整的把你父母的好与坏都继承给你。\n\n你如果能改掉你父母给你的这些坏毛病，然后继承他们的优点，你就一定非常成功。如果你改不掉，你打不赢，你对抗不了。\n\n你的父母老了是什么样子？你极大概率或者说？\n\n你100%老了，就是那个样子。\n\n所以其实。\n\n命运是注定好的，和人定胜天这两句话其实并不冲突。\n\n你生下来是一台小轿车，你跑不过兰博基尼，这确实没办法，但这并不意味着你跑不赢其他轿车，也不意味着你在山路上不能超过兰博基尼。\n\n知进退，长记性，就这6个字，真的一定算是人生顶级的人生外挂。\n\n知进退，该努力的时候努力，不该努力的时候休息休息。\n\n长 ，\n\n所以每个人的运都是有年限的，\n\n你的钱就是你生存的底气。", "account_name": "逸恒", "account_owner": "昭熹", "account_type": "本号", "comment_analysis": null}, {"id": "7622730283011362048", "title": "顶级破局心法！ #目清师兄 #道家文化 #认知提升 #感悟", "date": "2026-03-30", "likes": 5318.0, "comments": 267.0, "shares": 675.0, "collects": 1995.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "泄露个天然机给你啊，道教有一门失传的夺运心法，大欲吞天，无欲则亡。所谓的贪嗔痴，其实恰恰就是凡人逆天改命的通天体。就是你会发现很多人他已经穷的叮当响了，但是依旧没有任何赚钱的动力和欲望，明明手里已经没有钱了，甚至背着负债。\n\n但是依旧可以心安理得的捧着手机刷视频，看爽文，甚至给他个游戏，他都能玩一整天。\n\n对生活品质极度的敷衍，一听到赚钱的机会，他的第一反应竟然不是兴奋了，而是怀疑甚至恐惧，觉得肯定是骗人的，觉得自己肯定不行，自己肯定做不好，然后选择逃避，甚至是直接放弃。\n\n这个在玄学中，其实就是心气散了。\n\n怎么造成的？就是当一个人反复尝试改变命运，但是一次次失败，他的心气就会被不断的磨损殆尽。\n\n心理学上这个叫习得性无助，说白了就是他的大脑会形成一种错误但是自洽的言论。\n\n这错误，但是，但是自洽的结论就是，不论怎么努力，结果都不会变。\n\n这种结论，这种状态就会让他主动关闭对未来的期待，因为对于他们来说，希望本身就是风险，他们只能用逃避来避免再次失望。\n\n而且这种长期的匮乏，这种贫穷和压力，会不断的压缩一个人的认知资源。\n\n道理很简单，当一个人的生存都是困难了，他的心气，他的精气神都会被消耗在怎么还花，怎么凑下个月房租，怎么买到打折的商品上。\n\n但是，赚钱往上走，恰恰需要的是对未来的规划，对未来的延迟满足，甚至是复杂的思考。这其实无关这部分人有没有这种能力，就即便他们具备这个能力，也早就被痛苦煎熬给压在心里了。所以这个时候，廉价的多巴胺趁虚而入，短视频、游戏、爽文都成了他们维持生命体征的廉价饲料。\n\n玄学中有一个看透命运的终极指标，阳神不灭，全凭一念贪嗔。\n\n在命理学中，欲望就是一个人肉身最强悍的阳气，欲望一灭，这个人的本命风水直接就成死局了。\n\n那么就问题来了，怎么打破这一切？如果有这种情况，如果你或者你身边的朋友正在深陷这种状态，怎么破局？\n\n喊口号，打鸡血，毒鸡汤。\n\n明显都没用啊。\n\n因为对于一个已经认知匮乏甚至枯竭的人，你跟他说要努力，要振作，没有任何意义啊。\n\n一个干了十几年的挂失，我告诉你啊，不难做一件事。\n\n道德经讲，天下难事必做于意，天下大事必做于细。所以，你要做的不是什么宏伟的计划，也不是树立什么远大的目标，你只需要停止审判，找回掌控感。\n\n你不需要豪言壮语，你先去做那些闭着眼睛就能做好的事情，闭着眼睛就能成功的事情，哪怕是先把桌子擦了，先把脏衣服洗了，用微小的成功慢慢恢复你的心情，慢慢培养自己变好的欲望，慢慢培养自己对生活的掌控感。\n\n慢慢来，好起来就只是时间问题。\n\n包括我告诉你，就算是你没有达到这种状态，你也要小心，你要保存你的心情，你要不断的从生活中建立自己的掌控感，你才有可能在某一个机会一飞冲天，否则当你真的沦落到这种状态的时候。\n\n你就会很疲惫了。还是那句话，经历过的人都知道我在说什么，祝你越来越好。", "account_name": "博闻文化（目清师兄）", "account_owner": "博闻文化（目清师兄）", "account_type": "竞品", "comment_analysis": null}, {"id": "7636379950928600562", "title": "事缓则圆 人缓则安#国学文化 #道系青年 #智慧人生 #干货分享", "date": "2026-05-05", "likes": 5308.0, "comments": 394.0, "shares": 298.0, "collects": 437.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "只有马上要走大运的人才会刷到这条视频，也是你时来运转的一个征兆。第一，不要同情任何人，每个人都有自己的课题。第二， 布麻衣的乞丐一样，\n\n把它藏在怀里，这就叫被揭怀孕，\n\n这就叫藏封手镯。\n\n就我给人看卦？今天我是真的发现，就我们当下社会，你需要展现出来的状态，\n\n应该是又穷又富，又好又不好。\n\n什么意思呢？就是你不能过于哭穷，因为别人可能会因为这个看不起你，\n\n但你也不能露富，不然别人会惦记你。\n\n所以你就需要展现出来不缺钱，但是想要维持体面又非常吃力的状态。\n\n偶尔和身边人诉诉苦，\n\n说说自己的不容易，但也不能太不。容易这个尺度的拿捏，\n\n真的是非常非常重要的。当然，还有一个更省心，\n\n更简单的方式，就是放弃社交。\n\n因为这个世界上，真相就是，你除了赚钱以外的利益关系，\n\n你根本就不需要太多的人际关系，任何人开始了解你，\n\n真正开始了解你，都是你人生灾难的开始。\n\n所以你会发现，聪明人，混得好的人，他们真的，他们都不社交的，\n\n因为他们懒得应付那些无效无效关系。因为他们明白，\n\n人这一生，一切都是用气血交换的，很多事情，\n\n非常多的事情，根本就不值得自己去付出气血，根本就不值得付出自己的精气神去维护，\n\n因为很有可能帮不到你，\n\n还会反过来害了你。", "account_name": "博闻文化（目清师兄）", "account_owner": "博闻文化（目清师兄）", "account_type": "竞品", "comment_analysis": {"sentiment": "负面", "topics": ["沉默是金", "人性之恶", "炫耀招祸", "闭嘴智慧", "社交疲惫"], "audience_keywords": ["中年人", "职场人", "内向者", "焦虑", "反思者", "受害者", "低调者", "智者"]}}, {"id": "7615633334803574245", "title": "如果一个人朋友很多，那她非蠢即坏！#道家文化提升自己#认知", "date": "2026-03-12", "likes": 5070.0, "comments": 465.0, "shares": 2530.0, "collects": 1532.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "一条视频道破一个天机啊，你就随便去观察一个人一旦过了30岁，如果他身边的朋友还有很多的话，那么这个人非蠢即坏。没错，就是朋友多的这个人非蠢即坏。\n\n先别急着反驳我啊，咱来聊一聊为什么蠢，为什么坏。先说蠢，如果一个人到了30岁，他还是不明白普通人是不需要交朋友的，还不明白普通人的人际关系就像屎一样毫无价值，那他肯定就不聪明。因为人和人之间关系维系的本质是什么？是价值交换对不对？情绪价值、经济价值，这二者必居其一，不然关系是维持不了的。说白了就是拿你有的换你要的吗？你是什么段位，你的朋友就是什么段位。你一个月赚3000，你肯定没办法和赚3万的人一起玩，你大概率也只能认识一帮挣3000的人，那两个本身就不太行的人聚在一起喝酒吹牛逼，你以为这个叫应酬吗？其实啊，这个是弱者的抱团取暖，一点作用都没有，甚至双方都很难给彼此提供点情绪价值。\n\n在一起除了暗中较劲攀比，互相嫉妒，除了盼着看对方点笑话，别的什么都没有。\n\n就是我给人看事儿，这些年我就真的发现，咱普通人的灾难就来源于两个途径，家人和朋友。\n\n因为和你不熟的人，你切记啊，他是害不了你的，他也不敢害你，也不会害你。\n\n就是你可以想一下，你过往人生中遇到的所有灾难，所有挫折，是不是基本上都是来源于你认识了错的人，是不是都是错的人导致的？\n\n但很多人他认不清这个现实，所以他越混越差。\n\n生活中你就会发现，他们越是会坚信多个朋友多条路这种鬼话。但实际上现实是什么？是多个朋友你就多个坑，多个麻烦吗？什么忙都帮不上，你还得处处留着面子。最后结果是什么？是你稍微不顺他心意了，或者稍微没顾及到了，多年的友情一朝破灭。\n\n所以我说人一旦过了30岁，如果他还有很多朋友的话，他如果还是每天游走在这个人情世故中的话，他就是非顺即坏纯。我们说完了，还有一种情况就是坏了。在人们的固有认知里，都会觉得朋友多的这个人呢，多半是因为他热情，因为他性格好，但是大家好像都忽略了一个非常重要的点。\n\n就是只有小人是需要长期生活在人群中的，只有小人是没办法独处的。\n\n因为独处就意味着他那些邪恶的欲望没有办法通过别人来满足了。\n\n他没办法向他人索取和发泄了。所以小人他就会。\n\n想尽一切办法，把身边可以满足自己欲望的人聚集在自己身边。\n\n他需要干什么？他需要在人群中到处打听打探。\n\n如果运气好，能够 年我发现最好的婚姻都会有一个共同的克制，两个人不急着从对方身上揽东西，他不急着让你。\n\n理解他，你也不急着让他改变这种感觉，不是轰轰烈烈的爱，是一种有你在我就安心的顶弃。婚姻从来不是要找到完美的人，而是要找一个和你顾的人。养家跟养财是一个道理，急不得不，不得散，你们两个人的根在一起了，上面长成什么都是水到渠成。好的婚姻不是天赐的，是两个人一起养出来的。", "account_name": "逸恒", "account_owner": "昭熹", "account_type": "本号", "comment_analysis": null}, {"id": "7608494959587256177", "title": "心愿活动圆满结束啦，接下来就是正月初五在帮大家给上面通通气#道系青年 #道观日常 #祈福", "date": "2026-02-19", "likes": 4821.0, "comments": 653.0, "shares": 27.0, "collects": 120.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "看，这就是你们的新年愿望，叶恒呢，全部都已经给你们走完流程了，现在呢，就把它送到上面给你们通通气儿，只为你转身回眸心事，把自己忙碌淋湿在七财子禄寿，普通人得其一二已是小满，其实大家只需要积极的生活，把握好当下，20261定会越来越好的。", "account_name": "逸恒", "account_owner": "昭熹", "account_type": "本号", "comment_analysis": null}, {"id": "7615731457100746020", "title": "分享一条人性的真相！ #道家文化 #知识 #人文", "date": "2026-03-11", "likes": 4787.0, "comments": 123.0, "shares": 618.0, "collects": 1681.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "不要和任何人分享我今天说的这个内容啊，因为这个社会从来不鼓励大家去研究人性。\n\n有史以来，任何组织也都在千方百计的让你沦陷在奶头乐里，\n\n为的就是阻止你去看透人性的本质。\n\n今天这条视频，我站在一个挂失的角度，和你聊一些学校不教，\n\n父母不懂的人性境界。你只要能把我接下来讲的这四条规律研究清楚，\n\n我敢保证，未来的五年甚至十年，\n\n你都会不断的从中受益。第一，\n\n沉没成本，不参与重大决策。如果你犹豫要不要和一个人分开，\n\n不管是友情还是爱情，或者犹豫一件事情要不要做，不管是工作还是生活，\n\n你都不要以过去的付出作为评判标准，\n\n你需要想的是什么？是你继续维持下去对你有什么好处。\n\n至于你过去付出了多少，你投入了多少，根本就不参与评判，\n\n已经沉没到水里的成本，它就不再是成本了。\n\n第二，学会课题分离。简单来说，就是当对方向你提出要求以后，\n\n你只需要基于自己的本心去判断你是答应还是拒绝。\n\n至于对方被你拒绝以后，是愤怒还是崩溃，\n\n还是不开心，这些本质上都和你没什么关系，这个是对方的人生课题。\n\n第三，就是永远不要去考验人性，\n\n也别把你的希望寄托在别人身上。这个世界上的任何关系，\n\n本质上都是基于价值交换的基础的。\n\n没有光的时候，影子都会离开你，这句话大家应该也都听过，一切事物来到你的身边，\n\n停留在你身边，都是取决于你的价值。\n\n再说难听点，就是如果。你有兄弟姐妹，你就会发现，\n\n你的父母都难免会偏向过的比较好的那种，\n\n这个就是这个世界的规律，这是人道的规律。\n\n其次，这个世界上希望你过得好的人，很有可能都不超过五个。\n\n所以，停止炫耀，越是过得好，\n\n越是要把自己在人群中藏起来。因为人的嫉妒之心是无比可怕的，\n\n保不齐就会驱使着他做一些对你不好的事情。\n\n可能没经历过的不懂，但是等你真的经历了，\n\n很有可能就晚了。", "account_name": "博闻文化（目清师兄）", "account_owner": "博闻文化（目清师兄）", "account_type": "竞品", "comment_analysis": null}, {"id": "7634153657277222153", "title": "所有混得好的人，都有的一个共同点： #目清师兄 #随拍 #道家文化 #学习", "date": " 态变了，眼神不再飘浮，决策不再鲁莽，\n\n人和地利天使才会慢慢的向你靠拢。那怎么做到戒急戒躁呢？\n\n三件事第一，事发之时，先停三秒，\n\n别急着反应，让那股火气降下来，缓一缓，智慧啊自然就升出来了。\n\n第二，只问耕耘，不问收获，把饭吃好，觉睡好，把当下的事干好，\n\n不用总盯着山顶，盯住脚下，路才不会走偏。\n\n第三，就是相信时间，不用高估一天的变化，也不用低估三年的坚持。\n\n给自己一点时间，给种子一点时间。\n\n人生不是百米冲刺，是一场马拉松，跑得最快未必能赢，不掉队，稳稳当当走到最后便是赢家。\n\n日功一足，功不成娟，\n\n当你真正稳下来的时候，你会发现，你要的东西，其实一直在路上。", "account_name": "逸恒师兄", "account_owner": "昭熹", "account_type": "本号", "comment_analysis": null}, {"id": "7628276093916646707", "title": "记住这四破四立，快速拉开你和同龄人的差距！ #目清师兄 #道家文化 #学习 #人生感悟", "date": "2026-04-14", "likes": 4599.0, "comments": 135.0, "shares": 1263.0, "collects": 2373.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "一个看卦的告诉你啊，一个人，一个正常人，想要混得无错，或者说想要和其他人拉开差距，其实并不难。你只需要记住道家棋书画书中的这四破四立，你只需要记住这四破四立，你肯定比周围人优秀，肯定比周围人过得好，肯定能和周围人拉开差距。\n\n破于善，立无情，破尘怨，立掌控，破城父，立内守，破虚妄，立藏凤。\n\n就这4破4立，咱今天把它拆开来，一个一个讲，首先破鱼扇里无情。\n\n这其实也完美对应了道德经中的天地不仁，以万物为刍狗。\n\n我给人看卦，这些年，真的，我见过绝大多数过不好自己生活的人都有一个同病，就是太爱管闲事。\n\n看电视有点困难，都想管一管，都想帮帮忙，最后帮来帮去。\n\n自己人生的大部分气血都消耗在别人身上了。\n\n我还是那句话，人的气血是有限的，一切都是在用气血做交换。\n\n普通人原本就少的可怜的气血，不拿来关注自己，不拿来做自己的事儿，你怎么可能会过得顺利？为什么道德经的第5章开头就是一句天地不仁，以万物为刍国就是在告诉你，天下万事万物都有它既定的发展规律，你不该也不能去掺和。这个世界上只有三种事儿，你的事，别人的事，老天的事儿。\n\n别人的事儿你掺和的多了，老天就要找你事儿了，所以也不要觉得自己无情，我告诉你，允许一切发生才是最大的慈悲，让花成花，让书成数嘛。第二，破嗔，愿力掌控。这其实也对应了黄帝音符经中的宇宙在乎手，万化生乎身，这个世界上唯一不变的就是一直在变。\n\n人活一世，本质上是一个不断解决问题的过程，但是你会发现，这个社会上会出现两种人，有一种就是遇到问题就开始抱怨，开始抱怨大环境不好，感情破裂也开始抱怨，开始抱怨对方是个人渣，遇到问题的第一反应就是凭什么这么对我？为什么我这么倒霉？\n\n另一种呢，就是从来不抱怨出现问题，解决问题，遇到问题。\n\n解决问题。\n\n他的脑子里只有这件事儿让我损失了多少？我怎么才能让损失降到最低？我下一次怎么避免类似的事情？这一定就造就了两种完全不同的结果。\n\n牛奶打翻了，你是站在原地，惋惜、愤怒、伤心、难过，都没任何意义。\n\n我师傅说过一句话，我我记得特别清楚，他说人是在解决问题的过程中变强的，是在抱怨问题的过程中被弱化的。\n\n我觉得真的说的太对了。第三，破城府，立内守。\n\n这点其实对应了黄帝内经中的恬淡虚无，真气从之，精神内守，病安从来。\n\n就是说，一个人如果太关注外界发生了什么，太在乎外界的想法。\n\n他的先天气血是不可能聚拢到一起的。\n\n太关，太关注外界的看法，他的动作就会变形，他会潜移默化的为了迎合外界的看法去改变自己的行为，太关注外界发生了什么呢？他的注意力就永远没办法集中到自己身上。道教有个词儿叫成父，就是说本质上每个人都是一个能量载体，如果你承载的外界的事物太多，那么你就没办法承载自身的思维，自身的好运，你就活成了一个傀儡。因为每个人能承担的东西是有限的，所以很大程度上，人生的修行其实是一场内守的修行。第4，破虚妄，立藏锋，这点太重要了。道德经讲，国之利器，不可示人。\n\n我在这些年看卦的生涯中，我真的发现很多人，他不是没机会往上走，他是稍微有点进展，马上开始炫耀，他太在乎别人怎么看他了。\n\n刚赚了点钱，马上贷款买个豪车 讲，学校里学不到，你的父母也看不透的底层守钱规律。你有没有想过有钱人为什么有钱？你肯定会认为他们必定抓住了时代风口，或者是有极强的赚钱能力，能年入几百万甚至上千万。但是答案一定没那么简单，因为就算你的赚钱能力再强，要是大手大脚，你依然是没有抗风险的穷人。这时候肯定又有人说，那他们肯定是用钱去生钱去是不然，因为决定你阶层底色从来不是你在特定的时间段赚了多少钱。看着这么多年，我就发现很多人把赚钱的逻辑讲的头头是道，但是过了风口依然守不住。所以今天我将用一条视频。\n\n告诉你，如果从底层重构你的财富磁场，什么叫财富呢？从我们这行看，赚进来的叫流水，截流下来的叫财库，你花掉的是散出去的，业里留下来的才是你的真金白银。举个例子，你年入千万，但全挥霍光了，你依然是个穷人，但你月薪1万可以守住5000，那你也是个富人，因为你的财气在不断的聚拢。有钱人之所以有钱，就是因为他们骨子里印着守财的铁律，他们知道钱可以花，但绝对不能用来买内耗，任何为了向别人证明自己，为了填补情绪价值去花的钱，在他们的眼里全是能量黑洞。但是穷人他不一样，他们最喜欢干的事儿就是在9块9、19块9里的廉价消费，而且疯狂的露出去，花的毫不在意。要是等哪天真正遇到了好项目时，他却拿不出一分的本金，这就是典型的底层散财模式。所以，想要重构富人的思维，你就。\n\n必须把每一分钱都看成你的核心能量，这是对天道财富规律的尊重。因为懂行的人都知道，钱他一定是有灵性的，在你手里的每一分钱都是你的母钱，你浪费的每一个母钱，有可能就是你在斩断它背后的财富子孙。我复盘过无数个在财富的快车道里赚过钱但是守不住的案例，然后呢，我就总结出一个道理，人所有过往能赚到的钱，本质上就是恰巧他们走进了人生的大运里，是时代和风口成就了人。所以人必须极度尊重钱，你的钱就是你的生存底气。这就是我给很多人的忠告，只有把握了自己财富漏水的真结，才能从金钱内耗里彻底解脱出来，守住当下的财富。", "account_name": "逸恒", "account_owner": "泓泓", "account_type": "本号", "comment_analysis": null}, {"id": "7627789829954080046", "title": "阴符经里的千古名句：人发杀心，天地反覆 #目清师兄 #道家文化 #感悟人生 #学习", "date": "2026-04-12", "likes": 4128.0, "comments": 213.0, "shares": 1097.0, "collects": 1722.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "泄露个天然气给你啊，有没有想过，现实层面里混的好的和混的不太如意的这两部分人，他们最大的差距是什么？\n\n家庭、学历、长相、才华，或者是努力程度，人脉、本金、智商，这些好像都并不足以决定一个人究竟混的怎么样。\n\n作为一个干了十几年的挂师，我在这些年非常直观的分析了大量的所谓成功者和失败者，然后慢慢的我就发现，其实他们在日常行为中都有一个非常大但是普通人观察不到的差距。\n\n这个差距就就决定了他究竟在现实层面混的怎么样。\n\n反过来说呢，所有普通人，只要掌握了这个窍门儿，他的人生都不会活得难看。\n\n而这个差距，这个窍门，其实也完美对应了黄帝阴符经里的转运秘法，就8个字，人发杀机，天地反复。\n\n咱先不解释是什么意思啊，我们先引入一个观点，就是人的一生所有的东西都是在用气血做交换，一切都是用气血交换的，而一个人混的好不好，其实本质上就是看他用气血都交换了什么东西。\n\n比如有的人气血都奉献给游戏，奉献给奶头乐了，那么他就必然不会混的太理想。\n\n有的人呢，气血都用来提升自己，都用来做事了，那他就算是命再苦，他也不会活得太窘迫。\n\n那么带着这个真相，咱再继续聊，混的好的和混的不好的差距是什么？\n\n没错，差距就在于他们用气血交换了什么？落实到现实，你就会发现，这个社会其实只有两种人。\n\n第一种。\n\n大事糊涂，小事儿算计。第二种，大事清醒，小事糊涂。\n\n因为天道要维持平衡，人的气血是有限的，不存在说谁能在大事小事上都事无巨细。\n\n但是这两种行为其实就造就了两种完全不同的人生。看第一种，他会在生活中很多小事上精打细算，比如同事讽刺了他一句，他能在心里骂他好几天，甚至恨他一辈子，再比如开车上路，别人毙了他一下，他就必须得踩上油门去拼个你死我活。\n\n再比如，为了一两百块钱的利益摩擦，恨不得和人掰吃半宿，但是到了大事儿上呢？\n\n他又草草的做决定。比如。\n\n这件事儿要不要投资，要不要换工作，要不要和眼前这个人结婚，就是所有  "沉默即护身#传统文化", "date": "2026-03-21", "likes": 4007.0, "comments": 142.0, "shares": 1073.0, "collects": 676.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "一个看挂的提醒你啊，千万不要让任何人知道你的动态，沉默就是一个人最高级的护身，这个时代最强的护身符不是人脉，不是资源，不是财富，也不是才华，而是静默。因为真正有能量的人从不张扬，真正要显化的人从不剧透，真正在转运的人也从不多言。有些人呢，他就是话太多了，一旦有点好结果就不断的扩散在人群中看着。这些年呢，我就发现就是知道你好事的人越多，你的磁场往往越乱，有的人羡慕，有的人想飞一杯羹，而更多的人是嫉妒。举个例子，我有个客户是做工程的老板，前年呢，熬了很久，终于托关系跑通了这个数的基建项目，结果他那几天呢，就太激动了，合同还没签死就在酒桌上喝高了，就跟他的所谓的兄弟把底抖出来了，然后他们其中的一个转头就找了更硬的关系给他截了胡，还在背后给了他资金链的雷。结果不仅自己。\n\n大漠黄了还差点破产，我们这行呢，有句话，动念就是动气，动气就是动运，动运啊，就是破局。因为你的灵感，你的好运，本质上都是灵的感应。你认为说的是分享，但本质上是分散你的磁场，你认为说的是目标，其实你在提前泄露你的能量。宇宙的运行有它的规则，高维的能量只青睐一种人残光尘器手蹑。所以如果你现在正在经历人生的低谷或者转折点，我都真心建议你收敛光芒。真正能改变命运的时刻从来不是大张旗鼓，静静的努力在低谷中好好修炼自己，永远记住，不管你现在手里握着什么牌，绝对不要提前泄露，沉默才是一个人最高级的护身。", "account_name": "逸恒", "account_owner": "泓泓", "account_type": "本号", "comment_analysis": null}, {"id": "7618430151826722091", "title": "从底层爬上来的秘诀： #目清师兄 #人生 #道家文化 #感悟", "date": "2026-03-18", "likes": 3996.0, "comments": 88.0, "shares": 758.0, "collects": 2328.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "从底层社会爬上来的秘诀总共有九层，一层比一层难，但每上一层都会脱胎换骨，\n\n收获非常大。第一层剥离滤镜，\n\n直面本相忘掉课本上那些仁义礼智信文廉恭俭让这些东西，\n\n用利益这把尺子重新丈量世界。\n\n这个世界任何东西都是可以明码标价的，这不是人性的恶，是生存的客观规律，\n\n这个世界根本就不存在人品，决定人行为的是处境，\n\n不是人品。如果你看不透这一点，你就要一遍一遍的被身边人给你上课，\n\n直到你学会了为止。\n\n第二层只做筛选，不做教育易经讲同声相应，同气相求。\n\n成年人的世界最愚蠢的就是试图改变别人，\n\n永远不现实。永远明确一点，你的经历是用来破局和换钱的，\n\n不是用来搞义务教育的。遇到认知不在一个维度的人，\n\n立刻闭嘴，转身就走。第三层斩断牵绊，\n\n重塑系统阶级固化的本质是什么？是底层思维的代代相传。\n\n也就是说，你的平庸不是因为你的出身，而是你的原生家庭赋予你的穷人思维和那些不断消耗你的熟人。\n\n你只要不脱离这些，你就永远没办法再往上走。\n\n第四层敬畏价值，构筑堡垒法不轻传道不贱卖。任何时候都不要随意挥霍你的善良和你的专业。\n\n免费的东西在人性面前是一文不值的。\n\n每一次付出都必须要等价的交换，\n\n不要让自己太廉价，因为太容易得到的只会被践踏，\n\n有门槛的才会被敬畏。第五层破相立身，\n\n万象由心。金刚经讲凡所有相，皆是虚妄，喜怒不形于色，\n\n善恶不言于。表情绪是用来是用来影响他人的，绝对不是用来消耗自己的。\n\n公开的言论表达自己是用来维护你的立场和利益的，\n\n而不是用来抒发你的思想和认知的。再说简单点，\n\n就是说话表达，情绪舒展。这些是为了让你在利益被侵犯的时候，\n\n更好的维护自己的立场，确保自己的利益不受到伤害。\n\n绝对不是让你去和无聊的人说没有意义的话，\n\n产生无休止的争吵的。第六层金刚怒目，\n\n自带锋芒。别忘了，人早期是生活在丛林的力量，\n\n所以人的骨子里也一定是信奉丛林法则的。\n\n这条法则我告诉你，没有底线的退让就只会换来得寸进尺。\n\n你身上长满刺不是让你 算你真的大门不出二门不迈，你也大可以放心，你人生中该有的机会依旧是你的，一个都不会少。我师傅早些年给我讲过一个比喻，我觉得说的真的非常好。他说人生是一条长途赛道，这条赛道上有山路，有公路，有乡间小路，有的人生来是一台小轿车，有的人生来是越野车，当然也会有自行车，有电动车，但真的不重要。如果你能在合适的赛道上使使劲，通常你就不会比别人慢多少。但是最怕的是什么？你是一台小轿车，你非要在山路上努力。落实到现实是什么？是很多人一努力就栽跟头，一勤奋就负债。路没问题，车也没问题，问题出在哪了？出在了时机不对。就是，咱一定要搞清楚啊，努力有用，是建立在对的时间节点上，有用在错的时间节点上。过分的用力，更多时候只会让事态更糟糕。早些年，我在钟南山拜访一位老前辈的时候，他说过一句话，我至今都记得。他说其实红尘中，人生这场游戏，真的不难玩。其实你只需要做对那么两三个决定，你这一生就非常稳了。比如选对伴侣，选对行业，选对城市，选对圈子就行。你随便做对两个，你都能秒杀大部分人。其他的时候，你根本就没有焦虑的必要，因为人生它是一条长线，你的人生真的不会因为短暂的休息、短暂的躺平就被毁掉。但是难保不会因为在你着急焦虑的时候，做错两个决定，导致你十年都翻不了身。我相信很多人是有这个经历的。庄。子中有句话天地有大美而不言，四时有明法而不议。意思非常简单，就是把人生比作春夏秋冬，你该做的事，春种秋收，冬天休息，那你在冬天去播种，去收割，然后还一边努力，一边自我感动，你说有意义吗？包括道德经的第七十三章也讲过不争而善胜，不言而善应，不召而自来。意思非常简单，就是到了该给你的时候，自然就会给到你，你得到的会非常轻松。但是不该给你的时候，即便你昂首挺胸，即便你疯狂努力，即便你极度渴望，也真的意义不大。人有冲天之志，非运不可自通。真的，你不用过度焦虑。很多时候，在对的时间做对的事情，你才能拿到对的结果，在错的时间，就不存在对的事情。", "account_name": "博闻文化（目清师兄）", "account_owner": "博闻文化（目清师兄）", "account_type": "竞品", "comment_analysis": {"sentiment": "混合", "topics": ["人生选择", "命运与努力", "生活感悟", "期货悟道", "工作与躺平"], "audience_keywords": ["迷茫者", "中年人", "打工族", "投资者", "焦虑者", "感悟者", "求指点者"]}}, {"id": "7621582770178936083", "title": "多出门，真的能改命 #目清师兄 #道家文化 #认知提升 #人生", "date": "2026-03-27", "likes": 3531.0, "comments": 210.0, "shares": 966.0, "collects": 1144.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "泄露个天机给你啊，想过没有，如果一个人想让自己的命运变得顺利，\n\n或者说想要快速走出低谷，再或者拉高自己的命运层级，\n\n那他最应该做什么？绝对不是求神拜佛，\n\n也不是苦寻贵人，更不是付出些努力多看点书之类的。\n\n因为这些很明显，你做不到极致，而且异常枯燥，普通人根本就完成不了。\n\n我告诉你是什么？三个字多出门。\n\n作为一个给人看挂十几年的挂饰，我可以很负责任的告诉你，\n\n你现在所有的困境，百分之八十以上都是因为你的活动半径太小了。\n\n看似你在过日子，\n\n其实你在坐牢。只不过是这个监狱没有围墙，是用你自己的舒适区，\n\n是用你自己的惯性和自己的舒适区给围起来了。\n\n别急着反驳我，我们要引入一个非常科学的概念空间决定机会的密度。\n\n什么意思？就是你接触的空间越大，你你遇到的人事物信息也就会越多，\n\n你能抓住的机会也就越多，你能抓住机会的概率也就越大。\n\n听起来很悬，但这个就是一个概率问题。\n\n你想想，你每天三点一线，你能认识谁？同事？同学？\n\n家人？外卖小哥？你能接触到什么信息？公司的八卦？\n\n朋友圈的广告？短视频的算法推荐？\n\n但是一个经常出门的人呢？他的人生多了无数种可能。\n\n我给你讲两个我客户的例子。我一个客户，\n\n出去玩的路上，在飞机上认识了个同行，这同行给他介绍了十几次订单，\n\n他什么都没干，他就来回接接电话，对接一下资源，就赚了人生的第一桶金。\n\n另一个客户也，是出去玩，酒店前台认识了个老板，\n\n就是办入住的时候认识了个老板，莫名其妙的就很欣赏他，老板说他和他年轻的时候很像，\n\n然后给他投资开了三家电竞酒店。\n\n命运的齿轮绝对不是靠等的带转动的。我告诉你，\n\n机会从来不会真的去主动敲你的家门，他只会出现在你走出去的路上。\n\n这个时候一定会有人说，哎呀，出门有什么用啊，我性格内向，\n\n我出去我也认识不了人。我告诉你，真的错了，\n\n出去的核心其实真的不一定是社交出去的核心，\n\n走出去的核心是打破信息减防。你待在家里，你接触的世界是虚拟的，\n\n是平台的算法给你推送的，\n\n给你看的，都是你感兴趣的，本质上就是在不断的强化你过去的认知，\n\n让你越来越狭隘。\n\n你出去以后呢，你会看到有人在街上发传单，\n\n推广新业务，你会听到陌生人在讨论和你没关系的，\n\n或者说在讨论你没关注过的话题。\n\n这些信息才是真正能够刷新你认知，让你打开眼界的东西。\n\n我们再拉高一个维度环境塑造行为。\n\n你在家里，你的状态是什么？松散？\n\n懒散？松弛？低能量。因为家是休息的地方，\n\n你的大脑会自动打开省电模式。但是你一出门呢，你的状态马上就变了，\n\n你的感官会灵敏，你的大脑会活跃，这个是人类基因里的东西，\n\n你的基因就会告诉你，外面有风险，必须要打起精神。\n\n这种状态上的差异，就直接决定了你的行动力和执行力。\n\n所以很多人说自己拖延，没动力，做不成事，其根本原因其\n\n实就是你所处的环境太舒服了，\n\n你需要的不是更强的意志力，你需要的就是换个环境。\n\n我们可以再拉高一个维度，选取层面来说，\n\n走出去，你的能量是流转的，山川湖海都是可以滋养你的，\n\n风元素、水元素、土元素等等无数种元素，\n\n它都会对你进行滋养。\n\n走运走运，走出去才有运。", "account_name": "博闻文化（目清师兄）", "account_owner": "博闻文化（目清师兄）", "account_type": "竞品", "comment_analysis": null}, {"id": "7634910669137071387", "title": "人生八悟，悟一层，开一层，上一层！ #目清师兄 #随拍 #道家文化 #人生感悟", "date": "2026-05-01", "likes": 3506.0, "comments": 81.0, "shares": 624.0, "collects": 1526.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "人生有八物，物一层开一层，开一层放一层，第一物，强行止损，放弃沉默成本。你会发现，有非常多的人在明知道不对的事情上耗费了大量的时间精力，直到自己被彻底拖垮，实在撑不住了才放手。那底层逻辑是什么？是他舍不得沉默成本。\n\n明知道不对的人，明知道没结果的事儿，明知道影响自己的圈子，他都舍不得撒手，因为他觉得他付出了，他没拿到结果，他充满了侥幸心理，总想着再坚持坚持，再努力努力，再碰碰运气。但是聪明人呢？是怎么做的？他们一一旦意识到风向不对了，马上割肉离场。至于过往付出了多少，真的不重要了，因为已经付出了，已经沉没到水底了，已经拿不回来了。\n\n重新开始。\n\n才是最高效、收益最高的选择。\n\n第二五、物理屏蔽，强行剥离低维圈子。\n\n有一个大家都必须承认的真相就是，其实咱终其一生90%以以上的烦恼都是来源于人群，比如为了公平，为了面子。\n\n为了别人的一句话疯狂内化，再比如身边的朋友亲戚给你制造的各种焦虑、麻烦。\n\n再比如，过度干涉别人的因果。\n\n这其实归根结底都是人群给你制造的麻烦，所以破局的方法就非常简单，脱离人群就行了，庄子讲，至人无己，神人无功，圣人无名。人生真的只有两种，一种是离不开人群的烂好人，一种是脱离人群的高位者。第三，5。\n\n向死而生，人生是减法，来日不方长。\n\n真的，大家一定要搞清楚一件事儿，大家谁都不是，谁都不一定是老了才会走的，我们是随时都有可能离开的。\n\n很多人败就败在了这个等字上，等有钱，等有时间，等有机会。\n\n等来等去，什么都没做，什么都没体验，什么都没享受，什么都没创造。第4，保护自己的气血。\n\n我我觉得人一定要尽早明白的一个真相就是人的一生，先天气血是有限的，一切都是用气血交换的。\n\n在做任何事情之前，你都要想一下，用你宝贵的气血去做交换，是不是值得N？\n\n如果不值，那还要不要换？\n\n第5，千万不要耍小，耍小聪明，占小便宜，远离一切免费的东西。有句话我觉得说的非常非常对，命运若有馈赠，暗中就必有抽离。\n\n包括道德经也有提到过，大丈夫出其后，不拘其胞，很多时候免费、廉价都只是因为你还没有看懂其中的代价。\n\n我相信经历过的人应该都知道我在说什么。\n\n第65，冷血过滤，世间万物，皆为过客。\n\n就我给人看卦这些年，我真的发现，本质上你不能对任何人产生不切实际的情绪依赖，所有的相遇都是有实效的，没有人可以陪你走完整个人生。\n\n你们其中任何一方，你的维度一拉升，或者对方的维度一拉升，你们马上就是彼此的过客。缘来缘去，缘如水，花开花落花无悔，尊重所有相遇，也接受接纳所有离开。\n\n第7，五福无门，为人自找，这点确实有点残忍，可能思想高度达不到一定境界的人，这可能真的就理解不了。就是这个世界上发生的一切事情其实都是合理的。比如说简单点，你喝太多酒，你就会有一个糟糕的清晨，再比如你熬夜，你就会晚起。每一个行为都会产生一个相等或者相反的作用，你今天的感受是你昨天行为的结果，而明天的结果将由你今天的行为决定。时间线拉长也是一样的。任何事情都合理，任何事情发生了，你都要问问自己，这是为什么？比如你被欺负了，欺负你的人确实可恨，但你也确确实实需要问问自己，为什么他敢欺负你？第八五，人只能拥有和他认知相匹配的东西，你想拥有的更多。\n\n或者说，你想拥有更精品的人、事、物，你就需要不断的去提升你的认知。\n\n而提升认知的方法其实也不难，不断学习，不断思考。当然你可能看书看不进去，那你就需要不断的拆解你遇到的每一个人，优点是什么，缺点是什么，为什么能成功，为什么失败。\n\n每天总结今天学习到了什么，哪些事情做的还不错，哪些事情不该做，包括花出去的每一分钱，你都要想想对方怎么赚的你的钱，这个钱你能不能赚。命运的改变很有可能就发生在这些思考的细枝末节上。不积跬步，无以至千里。", "account_name": "博闻文化（目清师兄）", "account_owner": "博闻文化（目清师兄）", "account_type": "竞品", "comment_analysis": {"sentiment": "正面", "topics": ["人生八悟", "止损与屏蔽", "向死而生", "保护气血", "认知匹配"], "audience_keywords": ["求知者", "成长型", "自省者", "情绪管理", "认知提升"]}}, {"id": "7615550285003902153", "title": "#随拍", "date": "2026-03-10", "likes": 3501.0, "comments": 141.0, "shares": 931.0, "collects": 1463.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "人与人之间最残忍的真相就在于，一旦你们完成了彼此身上的课题，\n\n天道便会确保你们再无重逢之日。\n\n换句话说，就是所有的相遇，本质上都是一场阶段性的互补，\n\n碰巧你们在相遇的那一刻，你们从彼此身上各取到了所需，\n\n完成了某种因果的交互。所以，真的不用遗憾谁谁谁离开你，\n\n或者说因为谁的离开而难过。任何缘分都是从相遇的那一刻开始倒计时的，\n\n相遇就意味着你们会分开，\n\n分开就意味着你们要遇见下一位了。兰因絮果，一期一会。", "account_name": "你的好朋友目清", "account_owner": "你的好朋友目清", "account_type": "竞品", "comment_analysis": null}, {"id": "7602602293322042105", "title": "#随拍#道家文化", "date": "2026-02-03", "likes": 3494.0, "comments": 69.0, "shares": 2631.0, "collects": 1045.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "有钱人为什么不让你去他家？除了保护自己以外，还有一个很重要的原因就是他不想让倒霉蛋儿解了他的运。家这个地方是休养生息的地方，它讲究的是藏风聚气，乱七八糟的人去多了，必然影响家运。", "account_name": "洪洞师兄(目清)", "account_owner": "洪洞师兄(目清)", "account_type": "竞品", "comment_analysis": {"sentiment": "混合", "topics": ["贫富与运气", "串门与社交", "借运迷信", "唯物与利益", "家庭健康"], "audience_keywords": ["普通人", "迷信者", "唯物主义者", "家庭主妇", "社交焦虑者"] -13", "likes": 3424.0, "comments": 133.0, "shares": 5456.0, "collects": 492.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "", "account_name": "逸恒师兄", "account_owner": "昭熹", "account_type": "本号", "comment_analysis": {"sentiment": "混合", "topics": ["推给伴侣", "夫妻关系", "旺夫话题", "吵架后情绪", "视频推荐精准"], "audience_keywords": ["已婚女性", "恋爱中", "情感焦虑", "幽默调侃", "求知欲"]}}, {"id": "7622266252035165476", "title": "凡为辛苦，皆为强求！ #目清师兄 #道家文化 #认知提升 #感悟", "date": "2026-03-28", "likes": 3417.0, "comments": 190.0, "shares": 482.0, "collects": 1157.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "记住这八个字，你的运势将会不可逆转的变好！\n\n凡为辛苦，皆为强求。翻译成白话就是对的事情不复杂，\n\n复杂的事情不对，\n\n就给人看卦。这些年，我就真的发现，但凡是过不好的人，都是因为他们不理解这八个字。\n\n这八个字看似简单，但是很少有人能理解。\n\n他和大家过往认知中的努力才能成功，坚持就是胜利是非常背道而驰的。\n\n为什么？因为这些话从古至今都是上位者用来给底层人们洗脑的，\n\n为的就是让大家在复杂的事情上努力，把心气都消耗在这上面，这样就不会对他们的地位造成任何威胁。\n\n所以你从小都会学努力才能成功，\n\n坚持才是胜利。这条视频有点危险，我不知道能不能发出去，\n\n就算发出去，我也不知道能存在多久。所以如果刷到了，\n\n我建议你耐着性子把它看完。你未来的十年、二十年，\n\n甚至终身，都会因为这八个字，都会因为这八个字受益。\n\n在天道的运转规则里，真正赚大钱、收益巨大的事情，\n\n往往都是顺水推舟，借力打利的。道家讲顺势而为，\n\n也就是说，如果你走的路是正确的，资源、人脉、金钱都会自动向你靠拢。\n\n但如果你做一件事情，每天都消耗非常大的气血，\n\n处处是阻力，不是这儿不对，就是那儿不对，不是这种意外，\n\n就是那种小意外，那我告诉你，就是事儿不对。\n\n赚钱和感情都一样，如果一个项目，你投了钱，\n\n熬了夜，天天陪笑脸，处处不顺，已经入不敷出了，\n\n但其实你真的就没必要硬扛，你过度在乎沉没成本，\n\n就只会把你拖死，懂得就经历过的人应该都懂我在说什么。\n\n除了鸡汤故事，电影电视剧里，我真没见过哪个成功的人是靠打碎了牙坚持然后拿到结果的。\n\n因为赚钱这件事，他不像是健身训练，你只要努力，你只要坚持，\n\n你就能看到变化。这种事情我告诉你，错了就是错了，\n\n及及时止损才是聪明人，否则最后你坚持不住了，把你拖垮了。你也一样要面对现实，\n\n同样感情也是一样的，\n\n如果你和一个人在一块，天天要猜忌，要内耗，要难受，不是这不顺就是那不顺，\n\n那就不用犹豫了，这个人就是错的，就算你现在舍不得分开，\n\n等把你折磨够了，你还是一样要被迫分开。\n\n这就是凡为辛苦，皆为强求。\n\n我告诉你啊，普通人跨越阶级最难的一关，就是那种自我感动，心理觉得我越惨，我越累，\n\n我付出的代价越大，我最后得到的就越多。\n\n这个太扯淡了，社会和天道从来不会在乎你有多辛苦，\n\n人生这场游戏的顶级玩家，他们只做高胜率低阻力的角色。\n\n遇到推不动的墙，正确的做法不是拿头去撞它，\n\n你绕开它不是更省劲吗？你撞个头破血流，\n\n谁会感动？除了你会自我感动，\n\n你没那么多观众呢。", "account_name": "博闻文化（目清师兄）", "account_owner": "博闻文化（目清师兄）", "account_type": "竞品", "comment_analysis": null}, {"id": "7639346132816885497", "title": "福🧧报特别大的女人是什么样的#传统文化", "date": "2026-05-13", "likes": 3404.0, "comments": 264.0, "shares": 520.0, "collects": 369.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "", "account_name": "逸恒自在", "account_owner": "泓泓", "account_type": "本号", "comment_analysis": {"sentiment": "混合", "topics": ["六亲缘浅", "福报", "释怀", "不欠任何人", "来世"], "audience_keywords": ["焦虑", "寻求慰藉", "灵性", "内省", "孤独", "感恩", "释然", "悲观"]}}, {"id": "7616712786470892425", "title": "你们有梦见过吗#国学文化 #道系青年 #智慧人生 #干货分享", "date": "2026-03-13", "likes": 3393.0, "comments": 530.0, "shares": 116.0, "collects": 213.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "做梦其实也是有规矩的，元神为了防止你在梦里迷失，他规定了有些事情是永远做不到的。\n\n比如说你试没试过在梦里用手机打手机，\n\n摸出来的时候屏幕肯定是糊成一片，\n\n但最狠的往往是生理上的。你有没有在梦里着急找过厕所？\n\n最吓人的是你真找到了。", "account_name": "逸恒", "account_owner": "昭熹", "account_type": "本号", "comment_analysis": null}, {"id": "7629742362247400730", "title": "所有影响睡觉的人和事，都是人生的负资产 #目清师兄 #道家文化 #感悟人生 #学习", "date": "2026-04-17", "likes": 3373.0, "comments": 140.0, "shares": 967.0, "collects": 1091.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "一个看卦的告诉你啊，一切不利于睡觉的事情都不要做，一切不利于你睡觉的人，都不要见，都不要相处。很多人把睡觉当成了一天的结局，但是我告诉你错了。\n\n子时一阳生，睡觉其实是第二天的开始。\n\n你以为你白天稳定的情绪，灵敏的思维，沙伐果断的耐心，处理亲密关系的松弛感，是你的意志力，是你的智商吗？真不是，这是你在深度睡眠里一点点养出来的先天元气。\n\n你可以仔细盘点一下你人生中吃过的大亏，就是那些你本来该一眼就能看穿的烂人，你打死都不应该接受的烂摊子，是不是都是在你连续熬夜、极其疲惫的状态下答应的？\n\n那些天天消耗你，让你内耗的人，那让你内耗的事儿，是不是也都是在你精神最虚弱的时候缠上你的？\n\n反过来呢，你身体状态在线的时候，你的心态是平和的，你做事儿有底气，你状态松弛。\n\n事情也会进展的非常顺利。\n\n黄帝内经讲，血气者，人之神。人在疲惫的状态下，不仅仅是科学层面的那个叫前额叶报废，也是磁场涣散，能量混乱的一个阶段。你一困，你就会心软，你气血一亏，你就会把一些根本就不重要的事儿看作是天塌了。\n\n你亏损的不是少睡的那几个小时，而是把自己的内核给乱成了一锅粥。\n\n抱夫子里面讲神散则命绝，你的元神一旦受损，后面所有的连带关系，所有角色，所有因果，都会跟着断崖式下跌。\n\n道德经的第16章里讲，夫物芸芸，各归各复归其根。\n\n归根曰静，静曰复命。\n\n说白了就是万事万物都要回归它的根本，睡觉就是让你的精气回到根本。\n\n所以，真的睡觉这件事儿，就是评判一件事该不该做，一个人该不该相处的最佳标准。其他都是扯淡，只要让你睡不好的人和事儿，不管伪装的多好，他只要是出现在你生活里，出现在你生命里了，那就是吸你血的伥鬼。\n\n真的永远记住，肉身即道场，能量即天命。\n\n守不住睡眠，就守不住好运，养不好身体，所有的宏图大志都是纸上谈兵。\n\n任何影响你睡觉的人和事儿，都赶紧让他躲远点，因为让你睡不好觉，就是让你的心态不平和，让你心态不平衡，那就是在影响你。你的人生不需要向任何人交代，你只需要向自己交代。\n\n你只需要对自己负责，你不用对任何人负责。\n\n任何影响你情绪的人和事儿，都根本就不该也不能出现在你的生活里。", "account_name": "博闻文化（目清师兄）", "account_owner": "博闻文化（目清师兄）", "account_type": "竞品", "comment_analysis": null}, {"id": "7605563297974739122", "title": "#国学文化 #道系青年 #智慧人生 #干货分享", "date": "2026-02-13", "likes": 3353.0, "comments": 161.0, "shares": 573.0, "collects": 422.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "你有没有遇见过这样一个人，虽然是第一次见面，但是却好像已经认识了很久很久，这个其实就是命运的重逢。你要知道，缘分这个东西也是很神奇的，那些能够让你第一眼就沦陷的人，大概率不是因为它好看，而是因为他唤醒了你灵魂深处的某种记忆，你是躲不掉的。也就是说，你对这个人不是喜欢，而是一种重逢的喜悦，是刻在你生命里的某种记忆被重新唤醒。所以能一瞬间俘获你芳心的人，你们的本子里一定是有牵连的，但是因为各种原因错过，所以这次在茫茫人海中相遇的那种幸福感是不言而喻的。所以我们说最幸福的相遇就是离魂面相的不生人。", "account_name": "逸恒师兄", "account_owner": "昭熹", "account_type": "本号", "comment_analysis": null}, {"id": "7602691809722906853", "title": "如何快速走出低谷#道家文化#认知#提升自己", "date": "2026-02-04", "likes": 3351.0, "comments": 232.0, "shares": 254.0, "collects": 681.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "", "account_name": "博闻文化（目清师兄）", "account_owner": "博闻文化（目清师兄）", "account_type": "竞品", "comment_analysis": null}, {"id": "7627383882246380210", "title": "#国学文化 #道系青年 #智慧人生 #干货分享", "date": "2026-04-12", "likes": 3342.0, "comments": 224.0, "shares": 823.0, "collects": 455.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "不会开车，说明你未来不缺司机，不会做饭，要么你未来会请保姆，要么你会碰到一个爱做饭的对象，找不到好工作，也许你天生适合当老板，感情上碰不到对的人，也许你拿的是自强自立暴富的剧本。把问题反过来看，还是你的隐藏剧本，快来看一看你是哪一种？", "account_name": "逸恒", "account_owner": "昭熹", "account_type": "本号", "comment_analysis": null}, {"id": "7592469194848580453", "title": "#随拍#道家文化", "date": "2026-01-07", "likes": 3334.0, "comments": 163.0, "shares": 3612.0, "collects": 1154.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "", "account_name": "洪洞师兄(目清)", "account_owner": "洪洞师兄(目清)", "account_type": "竞品", "comment_analysis": {"sentiment": "混合", "topics": ["出主意与因果", "律师的困境", "算命与建议", "家庭关系", "焦虑抑郁"], "audience_keywords": ["玄学爱好者", "焦虑者", "家庭主妇", "律师", "修行者"]}}, {"id": "7630854185660392817", "title": "规律#国学文化 #道系青年 #智慧人生 #干货分享", "date": "2026-04-20", "likes": 3319.0, "comments": 125.0, "shares": 743.0, "collects": 459.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "你有没有一种感觉，攒了一点钱，不是因为这个事，就是因为那个事，怎么都留不住。\n\n不是你大手大脚，也不是你乱花，是那种你控制不了的走法？刚攒了一点，\n\n车坏了，修完没两个月，家里人又出了问题，好不容易缓过来，你又遇到一笔根本无法预料的开支。\n\n一年到头，你不是在花钱，是在还，还给谁，\n\n你都不知道。看了这么多年，很多人就问我，我是不是本子里没有这个东西？\n\n其实很多人的剧本里是有的，只是当下这个阶段，写的是亲。亲什么亲？\n\n你过去下来的账，易经里讲损易之道，有损才有益，\n\n有粗才有进。你现在经历的这些堵不住的窟窿，它不全是坏事。\n\n有些账你该还，还完了，那个位置才能腾出来新的东西才能够进来。\n\n但问题它出在哪？大部分人分不清哪些是你该还，哪些是你该清，\n\n哪些是不该你背的。该清的，你扛了，没问题，扛完就清了。\n\n不该你背的，你也扛了，那就是白白消耗你的财气。\n\n清不完，永远在还。但是这些年我就发现，财富都有一个规律，\n\n凡是你还完之后，内心有释然感，觉得这笔钱花出去了，反而松了一口气，\n\n这种通常就是该清的。相反，花完了，你心里反而堵得慌，\n\n越想越气，越想越不对劲。这就不是在清你的账，而是为别人的因果买单。\n\n所以，你不是要把所有的窟窿都堵上，你是要学会分辨，\n\n该走的，痛快放手，不该走的，一分不漏。但这里面最关键的一步是什么？\n\n你手里啊，要有一笔钱是不在还的范围内，不管外面怎么折腾。\n\n这笔钱啊，不要动。道德经讲根深固定，长生久视。\n\n根扎的越深，才看的越远。老一辈管这笔钱叫财种，种子不动，\n\n根就还在。帐必清，债必还，但种子不能丢，\n\n种子在，你还完了，还可以生出来，种子丢了，就是还完了，\n\n也是一场空。你现在觉得钱一直在流，不要怕，该还的让他走，\n\n这是你的说明书，在为你倾城。但我见过真正扛过这轮的人，\n\n都有一个共同的特点，手里死死留着一颗种子，怎么都不动。\n\n等这一轮清完，你会觉得身上松了，到那个时候，你就明白，你的路比以前宽的多了。", "account_name": "逸恒", "account_owner": "昭熹", "account_type": "本号", "comment_analysis": null}, {"id": "7638141820509641866", "title": "日行一善 财路自断#目清师兄 #随拍", "date": "2026-05-10", "likes": 3313.0, "comments": 94.0, "shares": 1952.0, "collects": 1312.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "记住啊，日行一善，你是财路自断，善人永远都发不了财。劝人戒赌，教人赚钱，帮人避坑，替人还债，这不是行善，这是拿自己的气运给蠢货虚名。天宇大，不认无根之草，无名者根本就渡不动，只配天收。他穷你就认他穷，他蠢你就认他蠢，自古以来都是财阀狠心人。记住啊，宁做闭嘴虎，不做碎嘴奴，闭嘴能开运，心狠财自来。祝你开心，福生无量。", "account_name": "你的好朋友目清", "account_owner": "你的好朋友目清", "account_type": "竞品", "comment_analysis": {"sentiment": "混合", "topics": ["不参与他人命运", "劝赌无奈", "闷声发大财", "行善不问前程", "修行与度人"], "audience_keywords": ["修行者", "赌徒家属", "传统文化爱好者", "求指点者", "感慨人生者"]}}, {"id": "7622995701794262457", "title": "#国学文化 #道系青年 #智慧人生 #干货分享", "date": "2026-03-30", "likes": 3300.0, "comments": 77.0, "shares": 496.0, "collects": 705.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "有没有发现，十善里没有任何一扇让我们去做好人好事，而是让我们不去做什么就可以了。不杀，不道，不移，这三扇是守住自身的规矩，不两舌，不恶口，不妄言，不起语，这四扇是管住嘴的分寸，不念，不嗔，不邪，这三扇是稳住心的平衡。所以你只要不去做这些，就会回到你善的存在，你会活的自在又有力量，而且生活会越来越舒适。", "account_name": "逸恒", "account_owner": "昭熹", "account_type": "本号", "comment_analysis": null}, {"id": "7605923236367000954", "title": "关于运势的天机！#道家文化#旺自己#认知#提升自己", "date": "2026-02-13", "likes": 3298.0, "comments": 103.0, "shares": 567.0, "collects": 1317.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "", "account_name": "博闻文化（目清师兄）", "account_owner": "博闻文化（目清师兄）", "account_type": "竞品", "comment_analysis": null}, {"id": "7561103847402720547", "title": "今天和大家简单唠唠： 不管你信不信，你身上发生的一切都是命中注定。谁来爱你、谁来伤你、谁陪你走一程、又转身离开。不是你没把握好，是你本来就不应该拥有。 你有没有发现，人生中似乎很难什么都拥有？有人家财万贯，却膝下无人；有人婚姻不顺，但子女争气；有人家庭美满，日子却清贫；也有人看似什么都有，身体却亮了红灯。 这正应了那句老话：人旺财不旺，财旺人不旺，人财两旺寿不长。其实我们普通人，妻财子禄寿能占一两样，已是不易。你若什么都想要，往往什么都留不住。 老祖宗讲得透彻：天道忌全，人道忌满。你太想赢，反而会输得很快。人生最好的状态，是求缺而不求全。如果这世间真有福寿双全之人，那前面一定写着“委屈”二字——因为委屈，才能求全。 所以我们常说：福不可尽享，要留三分给儿孙；利不可尽占，要舍三分给别人；功不可尽贪，要让三分给他人。自古人生最忌满，半贫半富半自安。 说到底，看人生剧本的意义，从来不是被定义，而是被引导。它像一张地图，告诉你哪里有山哪里有水，但路怎么走、景怎么看，决定权始终在你手中。 人生短暂，别被欲望拖垮。珍惜当下，珍惜眼前。祝你越来越好，福生无量。 #答疑解惑 #日常唠嗑 #提升自己", "date": "2025-10-14", "likes": 3276.0, "comments": 181.0, "shares": 248.0, "collects": 376.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "", "account_name": "逸恒师兄", "account_owner": "昭熹", "account_type": "本号", "comment_analysis": null}, {"id": "7604477917183184180", "title": "#道家文化 #随拍", "date": "2026-02-08", "likes": 3222.0, "comments": 124.0, "shares": 682.0, "collects": 559.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "", "account_name": "博闻文化（目清师兄）", "account_owner": "博闻文化（目清师兄）", "account_type": "竞品", "comment_analysis": null}, {"id": "7612353229313848485", "title": "这是一条足以改变你人生的视频", "date": "2026-03-04", "likes": 3216.0, "comments": 116.0, "shares": 409.0, "collects": 1383.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "有没有想过，那些命好的人，干啥啥都成的人，究竟是为什么？\n\n他们究竟具备了什么特质？还是掌握了什么技能？\n\n很多人会说他们情商高，会说话，懂人情世故，\n\n或者说他们特别能吃苦，\n\n特别努力，执行力特别强。当然还会有人说，脑子聪明，\n\n智商高，学什么都快。事实上， 绪价值，你就要思考一下，你的情绪价值到底能不能长期稳定的给对方提供。\n\n对方会不会对你提供的情绪价值产生厌倦？比如时间久了，他觉得你并没有那么漂亮，或者没有那么帅了。\n\n经济价值也一样。\n\n你也要考虑一下，你能否为对方长期稳定的提供经济价值，你是否有对抗风险的能力？如果返贫了，你是否有翻身的把握？\n\n可能听起来很残忍，但是我告诉你，贫贱夫妻百事哀，这是没有争议的事情。\n\n就我在这些年给人看卦的生涯中，我发现很多年轻的小情侣就靠着一腔热血就领证结婚了，虽然有可能会有一个不错的结果，有可能因为运气好，双方都能稳定的提供价值，但是绝大部分以冲动开始的婚姻都是以冷静下来为界限结束的。\n\n第二点，认知匹配，这点其实是最致命的，因为情绪价值、经济价值这些通常靠努努力还是可以得到的，但是认知这个东西不行，影响认知的因素有什么？先天八字，原生家庭、生长环境，这几点好像没有一点儿是人为可以干预的，也就是说你们认识的时候，他是个什么认知，大概率他往后，往后余生他都没办法跳出这个认知。\n\n如果结婚前就不合适，你抱着结婚后可以改变他的心态往下走，那么结果必然就是万丈深渊，万劫不复。\n\n这没办法，因为谁都改变不了谁。就像是我经常劝我的客户，如果你讨厌抽烟的，那你就应该从一开始直接找个不抽烟的，而不是你找个抽烟的人，让他为了你把烟给戒掉。短期你也许可以通过某些方面去压制它，可以通过沉默成本去控制它，但是你压制不了一辈子，真正爆发的时候就是收不了场的时候。\n\n认知这个东西就是这样，他从心里认为，今天吃完了饭要放到冰箱里，明天再吃。\n\n你从心里认为剩饭明天就不能吃了？\n\n你扔一次，两次、三次，对方也许没什么，但是长年累月下来，最后矛盾一定会有爆发的时候。别觉得这是很小的一件事情，经历过婚姻的人应该都明白我在说什么，很多人离婚、崩盘都是这种相似的经历。\n\n所以，结婚前必须要考虑的就是你们的认知是否匹配。\n\n永远记住，长久的感情，靠的一定不是廉价的行动和牺牲来维持的，靠的是不敢轻易翻脸的相互制衡和相互成就的利益捆绑来维系的。\n\n如果你不了解这些，你千万不要进入婚姻。否则你真的。\n\n你会后悔，你会把肠子都悔青了。", "account_name": "洪洞师兄(目清)", "account_owner": "洪洞师兄(目清)", "account_type": "竞品", "comment_analysis": {"sentiment": "负面", "topics": ["婚姻痛苦", "离婚经历", "命运与选择", "认知重要性", "结婚后悔"], "audience_keywords": ["已婚者", "离婚者", "中年", "焦虑", "宿命论", "反思者", "男性", "女性"]}}, {"id": "7636755667449040154", "title": "如何快速的走出低谷期！！ #目清师兄 #随拍 #道家文化 #学习", "date": "2026-05-06", "likes": 3122.0, "comments": 163.0, "shares": 548.0, "collects": 1178.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "一个看卦的告诉你啊，如果你现在负债累累，众叛亲离，或者是事业感情双双跌入谷底，先别急着伤心难过，也别急着到处找人帮忙，耐着性子把这条视频看完，我会用一条视频教你快速的走出低谷期。\n\n就是我在这些年给人看卦的生涯中，我发现了一个无比笃定也跨越了古今的真相，不管你研究心理学、物理学、哲学、道家还是佛家，他们其实都最终在反复的提醒你相同的3件事儿，这3件事儿，我把它称之为是人转运的核心秘法。\n\n第一件事儿，没有永远的低谷，低谷其实更像是一个重启键。\n\n你会发现，那些深陷低谷走不出来的人，他们都有一个共同的错误认知。\n\n就是他们过度的抵触低谷，他们总觉得这是惩罚。\n\n但其实真不是，我告诉你，道家讲物极必反，佛家讲否极泰来，心理学叫情绪周期规律，量子物理就要上增会谈，其实意思基本都差不多，就是说当一个人彻底清零，什么都没有了之后，他就必然会重新拥有新的东西。\n\n落实到现实层面的。\n\n低谷期，表面看起来你是失去了感情，失去了财富，失去了朋友，但是我们换一个角度来说，这是不是也是在意味着你要拥有新的感情，新的财富，新的朋友了？\n\n而且道德经讲天欲福人必先以为祸敬之。其实意思非常简单，就是。\n\n上面想给你什么东西，但是又怕你接不住的时候。\n\n他就会把你推进低谷，去打磨你的心性。\n\n所以，想要走出低谷，且永远不再，再不再回到低谷，第一步就是认清低谷真正的意义，绝对不是在折磨你，这是一次重新开始的机会。第二件事，从内心彻底接纳低谷期，越抗拒，现在就越深。就是你会发现很多人他为什么走不出来，本质上就是因为他太抗拒了。\n\n你千万别小瞧这个抗拒，这个抗拒就会驱使着他着急翻本，四处乱窜。但越是这么瞎折腾，他的处境通常就越会糟糕。\n\n老话说，人有冲天之志，非运不可自通。\n\n我师傅早年给我讲过一个比喻，我觉得非诚适。他说人生其实是一条长途赛道，这条赛道上有公路，有山路，有乡间小路，如果你生来是一台小轿车，那你就是会在山路上走的费劲，但是如果你这个时候着急了，你使劲给油，那结果就是你抛锚在山路上。正确的做法是什么？是你应该在山路上慢下来，然后在公路上去努力跑。\n\n很多人搞反了，他是一台小轿车，他到了公路上，他飘了，他觉得老子天下无敌，开始躺平懈怠，到了山路上呢，不好走了，他又急了。\n\n他开始使劲开，那你说是路不对吗？是车不对吗？好像都不是，是方式不对，是时间不对。道教奇书素书中讲遣居报道以待，其实就是你必须要接受人的一生三起三落的事实。\n\n真的不好的时候，你就是要休息，你就是要听，你就是要接纳不好的自己。\n\n任何事情，任何时间，任何状态发生在你的身上，都有它的合理性，因为人生是一条长线，因为世界是不断变化的。\n\n你必须要接纳，不接纳你就会急，急就会导致你反复出错。第三件事儿，这件事儿是我认为不管在顺境还是在逆境都需要养成的一个习惯。我说过很多次，每日三省吾身，这一点太重要了。\n\n什么意思？就是你每天都不能白活，你每天都要不断的去观察，不断的去思考，你遇到的每一个人，你都要去分析他有什么优点是值得学习的，有什么缺点是需要避免的，有钱的为什么有钱，穷的为什么穷，包括你花出去的每一分钱，你都要想一下对方赚了你多少钱，这个生意你能不能做，你都要不断的去思考，不断的拉高自己的认知。我有一个客户网购了一个产品，买回来觉得这个东西利润高。\n\n然后自己开始做。\n\n这么四五年的时间，现在自己是行业龙头。\n\n这就是细枝末节的思考发生的巨变，那如果他不想呢？是不是就没这个机会了？\n\n不及跬步，无以至千里。人生的巨变，其实往往就是发生在这些思考的细枝末节上，你的每一次思考，都是在给大脑充电。\n\n人和人之间的差距是认知拉开的，为什么很多人即便进入低谷，他可以很快走出来？\n\n他思考啊，他在过往人生中给自己积累了大量的经验，大量的认知，大量的思考，那你说人家凭什么不好？\n\n人生这场游戏没有多难玩的，真的。", "account_name": "洪洞师兄(目清)", "account_owner": "洪洞师兄(目清)", "account_type": "竞品", "comment_analysis": {"sentiment": "混合", "topics": ["低谷与觉醒", "自我激励", "寻找师兄", "心态调整", "好运期待"], "audience_keywords": ["低谷者", "觉醒者", "创业者", "焦虑者", "求知者", "感恩者", "自省者", "励志者"]}}, {"id": "7606631066129108850", "title": "你又学会了什么，有哪些改变呢#国学文化 #道系青年 #智慧人生 #干货分享", "date": "2026-02-18", "likes": 3112.0, "comments": 94.0, "shares": 207.0, "collects": 404.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "很多人都会问，既然终究要走散，最初的相逢究竟算什么？或许相遇从来不是为了陪伴一生，而是为了让彼此成为不一样的自己。我们原本各自前行，直到某一次相遇，像一道光照进了生命的缝隙，让那些被忽略的部分终于有了回应。看着这些年，我发现其实你不必记得相遇的每一个细节，真正留下来的从来不是并肩走了多久，而是那段关系悄悄的改变了你什么。所以分别并不是相遇的失败，而是你的说明书里根本就没有这个人。相遇的意义不一定是同行到终点，而是你学会了什么，又有哪些改变，最后才会跟那个对的人重逢。", "account_name": "逸恒", "account_owner": "昭熹", "account_type": "本号", "comment_analysis": null}, {"id": "7626171874757578024", "title": "记住有钱的感觉，你就会变得有钱 #目清师兄 #道家文化 #感悟 #学习", "date": "2026-04-08", 富，\n\n就很有可能只是因为你没有玩好这场能量交换的游戏。\n\n鬼谷子阴符七术的绝例篇里有一句非常霸道的话，\n\n他原文是这么说的无我者，万物皆为我用\n\n不争者，天下莫能与之争。说白了就是钱有八条腿，\n\n你去追钱，你是追不到的。想要获得钱，\n\n你就只能把事情做好，然后站在原地泄钱，才能从四面八方走向你。\n\n再说直白点就是，其实本质上，\n\n你能赚多少钱，直接取决于你有多少能量。我师父早些年给过我一本秘籍，\n\n叫天赋真形图，里面有句话是这么说的以万物之欲为欲者，\n\n则扩通天地。\n\n什么意思呢？就是你想获得财富，\n\n获得钱，你就要精准找到每个人的痛点。比如男人怕穷、女人爱美、老人怕病、孩子怕笨，\n\n这些都是他的痛点，\n\n对吧？都是众生的苦和执念。所以，透过现象看本质\n\n赚钱，是在做生意吗？其实不是，\n\n你是在渡人。你帮男人找回尊严，帮女人留住青春，\n\n你帮老人守住健康，帮孩子看到希望，一桩桩，一件件都是因果，\n\n你解决的苦越多，你积累的无形财富也就越多，那么你就可以理所当然的换取更多的有形财富，\n\n对吧？这个其实和西方的吸引力法则是有点像的，\n\n在道教也有类似的说法，就是同声相应，同。\n\n气相求，你的能量辐射范围就精准的决定了你的阶层。\n\n所以你想要有钱，你不用想你怎么赚钱，\n\n你需要想的是你怎么创造价值，你怎么让自己值钱。\n\n你有什么东西是别人替代不了的，\n\n对吧？或者说，你能做什么别人做不了事情？\n\n还是那句话，你去追钱，你是追不到的。天下万物生于生于有，\n\n而有生于无。这句话真的太有用了，\n\n就是天下万物生于有，\n\n而有生于无。什么意思？就是一切的有都是建立在无的上面的。\n\n财富也是一样，一切的有形财富都是建立在无形财富上的。\n\n你认知不够，你能量不够，你的价值不够，你就不可能去兑换到这些有形财富。\n\n就这么简单。\n\n如果理解不了，反复理解。", "account_name": "博闻文化（目清师兄）", "account_owner": "博闻文化（目清师兄）", "account_type": "竞品", "comment_analysis": {"sentiment": "正面", "topics": ["感恩宇宙", "走好运", "吸引力法则", "爱情感悟", "学习收获"], "audience_keywords": ["感恩者", "求好运者", "求知欲", "情感困惑者", "正能量追随者"]}}, {"id": "7625119208006798611", "title": "十方空无异 众生起分别 #目清师兄 #道家文化 #感悟人生 #学习", "date": "2026-04-05", "likes": 3002.0, "comments": 127.0, "shares": 507.0, "collects": 1130.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "一个看卦的告诉你啊，一个人，一个正常人，想要混的不错，或者说想要和其他人拉开差距，只需要做一件事情，只需要搞清楚道德经第四十章的一句话。把这句话理解了，你肯定比周围人优秀，肯定比周围人过得好，肯定能和周围人拉开不小的差距。天下万物生于有，有生于无。先不解释是什么意思，咱来设想一下，是不是在你没钱的时候，你骑电动车出门会怕遇到熟人，怕丢面子，后来有钱了，买了车，再骑电动车出门就不怕了？记住前后这两种感觉，然后思考一件事情，为什么电动车没有变，但是你的感受变了？这个就是这个世界的另一个真相，十方空无一众生，其分辨同样的两个轮子，同样的你，风还是那天的风，但是心态不是那天的心态。然后这个时候我们引入一个概念，天下财富分为分为有形财富和无形财富。有形财富就是你的车、房、存款。无形财富呢，就是能够驱使你获取财富的途径，机缘，以及你的念头、自信程度和磁场。然后我们再来设想一下，社会层面来说，过得好的和过得不好的，他们的差距是什么？有形财富和无形财富的差距，对吧？有形财富就是金钱、地位、豪车这些都能看得见摸得着的实体。无形财富呢，就是念头、自信，磁场的振动频率，这些看不见摸不着，所以属于无形财富。这个时候我们再来理解道德经所讲的天下万物生于有，有生于无。金钱、地位、豪车是怎么来的，是从那些你看不见摸不着的。无里面转化来的。这个时候我们再来聊穷人富人最大的差距是什么？是不是归根结底是无的差距？因为你只要具备了这些无形财富，你就必然会拥有有形财富。当然也可以反过来说，只要具备了有形财富，也会拥有无形的财富。就像开头说的，你有了车，再骑电动车出门就不会不自信，这个相互影响。那怎么用无去生有呢？很简单就四个字借假修真，夺天地造化。说白了就是装作女友，这个时候你的自信就出来了，当然不是说让你去买假表或者是租豪车向外炫耀，就是让你戒掉骨子里的匮乏感。因为按照吸引力法则来说，当一个人每天散发的磁场全部都是极度的焦虑、自卑和匮乏的时候，他就会不断的吸引烂人烂事，因为他的磁场只能匹配这些。按照道教理论来说，一个人如果每天脑子里都是我不行，我是个穷人，那么他就会不断的感召贫穷的人事物。所以归根结底，打破这一切是干嘛？先建立无，无怎么建立？先坚定地认为自己有，坚定地认为自己能行，把自己带入到那个有钱人的视角去做选择，你的人生就会发生巨变。很简单的一个道理，同样是饭店服务员，坚定地相信自己是老板的服务员，坚定地相信自己未来是老板的服务员，他的行为一定是不断学习的，他一定不断地去看老板怎么经营，遇到问题积极处理。那坚定地相信自己这辈子就这样的服务员呢？那必然就浑浑噩噩，我不知道有多少人能理。解这种差距，这就是无形财富的差距，久而久之，就自然会拉开有形财富的差距。这个世界的玩法真的就简单到这个程度，没有的时候装作你有，你就会有，有的时候再装作你没有，你就会安全，你就不会被惦记，就这么简单。开头讲的电动车和车的区别，你明明都是在骑电动车出门啊，只是底气的不一样。所以这个就是天下万物生于有而有生于无，就这么简单。如果看不懂，真的，我强烈建议你再看一遍，直到看懂。", "account_name": "博闻文化（目清师兄）", "account_owner": "博闻文化（目清师兄）", "account_type": "竞品", "comment_analysis": null}, {"id": "7596999987500178368", "title": "现在做的这些拼的还是这份真诚。感谢大家一路的陪伴和信任，愿大家新的一年里，前方皆坦途，所愿皆成真#道系青年 #传统文化 #道观日常", "date": "2026-01-19", "likes": 2993.0, "comments": 659.0, "shares": 180.0, "collects": 109.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "已经买了手链的原主们啊，不要担心啊，也不要着急，现在呢正在加工，\n\n后续会给大家走第二步的流程，慢慢的你们就期待作品吧！人生尚有来处\n\n却只剩归途\n\n我纵笔争取从容", "account_name": "逸恒", "account_owner": "昭熹", "account_type": "本号", "comment_analysis": null}, {"id": "7639325163460432099", "title": "清算#传统文化", "date": "2026-05-13", "likes": 2992.0, "comments": 115.0, "shares": 725.0, "collects": 331.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "", "account_name": "逸恒", "account_owner": "泓泓", "account_type": "本号", "comment_analysis": {"sentiment": "负面", "topics": ["父母霸凌", "原生家庭伤害", "偏心对待", "打压式教育", "亲子关系修复"], "audience_keywords": ["受害者", "原生家庭", "焦虑", "反思", "成长", "亲子关系", "情感创伤", "自我疗愈"]}}, {"id": "7638078969463442742", "title": "不要和任何人走的太近！！ #目清师兄 #道家文化 #随拍 #人生", "date": "2026-05-10", "likes": 2984.0, "comments": 104.0, "shares": 1476.0, "collects": 903.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "谁都不能去你家，朋友，同事，甚至是发小都不行，\n\n因为这个行为就是祸端的开始。不要让任何人了解你太多，\n\n也不要和任何人走得太近。这是所有混的好的人，\n\n地位高的人，有钱的人心照不宣的秘密，\n\n也是一个干了十几年的挂饰给你最终肯的人生忠告。\n\n就今年过年的时候，我一个客户去年行情好，赚了点钱，\n\n请所有发小吃饭，酒过三巡，难免有点得意洋洋对吧，\n\n也正常，结果当天晚上家里工厂着火了，\n\n十多年的积累一晚上烧没了，最后查出来是他发小放的，\n\n但即便查出来了又能怎么样呢？失去的拿不回来了。\n\n所以你会发现，所有混的好的人，有点鸡肋的，\n\n他们最担心的就是别人了解自己，所以他们不社交，他们不混圈子，\n\n他们除了赚钱以外的利益关系，他们不维护任何关系。不是他们孤僻，\n\n是因为他们太了解人性了，他们太明白一个道理了，\n\n就是和自己不熟的人是坑不了自己的，能坑自己的都是熟人。\n\n你的成功在别人眼里是刺眼的，你的失败在别人眼里是搞笑的，\n\n这就是人性。嫌你穷，怕你富，\n\n恨你有，笑你无，你每次出问题的时候，一大堆人来关心你，\n\n你以为真是关心你吗？真不是，他们只是想看看你是不是真的翻不了身了。\n\n当然，一定会有人说，\n\n不社交怎么获取机会，不社交怎么拓宽自己的路，但是你想过没有，\n\n酒肉朋友再多，你真的需要帮忙的时候，会有人帮你吗？人脉再广，\n\n你自身没价值的时候，你上的了桌吗？有意义吗？\n\n黄帝内经讲机在目，天机暗藏。所谓机会，绝对不是在酒局上喝出来的，\n\n普通人的酒局，无非就是添油，添油加醋的贬低别人，\n\n拐弯抹角的不抬高自己，互相窥探的搬弄是非，真的没什么意义。\n\n关于人性，我总结了几个人生忠告，我建议所有普通家庭的孩子，\n\n都要耐着性子把它看完，因为这都是学校不教，\n\n父母可能也不懂的保命法则。第一、跟你无关的人，\n\n一句话都不要说，不要回应，不要解释。这个世界百分之九十九的人，\n\n和你的人生，和你的命运都没什么关系。你的精力是用来照顾自己的，\n\n不是用来喂养别人的。第二、永远不要让任何人从你这里免费得到东西，\n\n免费就是轻视的开始。大部分人接近你，\n\n就只是为了索取，乱接触人，只会给你带来灾难。\n\n第三、越熟的人越要少说话，因为这个世界能真正伤害你的就只有熟人，\n\n和你不熟的人，不懂，不会，也不明白怎么伤害你。\n\n第四、你越对一个人好，他反而越烦你，\n\n为什么？因为当你对他太好了，他还不起的时候，\n\n他怎么排解他的心里压力啊，他只能把你想尽办法的把你塑造成一个坏人，\n\n这样他心里没压力了，他就不用还了。第五、真正厉害的人，\n\n发现不对劲，立刻锻炼他们，只筛选，不改造，\n\n他们不试图改变任何人，因为他们明白，谁都改变不了谁的。\n\n但是普通人总想着牺牲自己，拯救别人，\n\n最后结果就是被榨干。第六、不要刻意维护关系，\n\n关系的好坏，靠的是价值，关系的长久，靠的是缘分。\n\n没有。任何一段长久且健康的关系，是靠其中一方跪着维持的。\n\n一定要明白这句话你不需要刻意维护关系，物来则应，无需不留。\n\n第七，不要期待任何人会对你好，\n\n期待别人就是自我消耗。你唯一能要求的就只有你自己。\n\n这个社会，你付出一百，别人能还你八十就已经很良心了，\n\n你还指望你付出一百，别人给你一百二吗？\n\n呵，没任何意义的。", "account_name": "博闻文化（目清师兄）", "account_owner": "博闻文化（目清师兄）", "account_type": "竞品", "comment_analysis": {"sentiment": "负面", "topics": ["人际关系边界", "朋友背叛", "独处与修行", "社交谨慎", "嫉妒与攀比"], "audience_keywords": ["社交焦虑者", "独处爱好者", "职场人士", "反思者", "信任受伤者"]}}, {"id": "7637497384486097081", "title": "你们是这样的吗#国学文化 #道系青年 #智慧人生 #干货分享", "date": "2026-05-08", "likes": 2969.0, "comments": 2214.0, "shares": 224.0, "collects": 206.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "你知道，如果你的生日接近哪个节气或者节日，那你的性格，喜好，天赋都会跟这个节日有点相似，\n\n比如说立春这一天，一般行动力啊就会很秋分之后的人呢，\n\n大部分你看他就爱躺着儿童节的附近，\n\n可能儿童心性会更强一些。你可以对照一下自己，看看自己是不是也这样。", "account_name": "逸恒师兄", "account_owner": "昭熹", "ac 十几年的挂尸，我真的见了太多人，就是非常多的人，\n\n明明能力很强，但是一辈子就是没什么大波浪，\n\n一直深陷底层。后来我就总结，\n\n然后我就发现，其实大部分人过得差，过得穷，活得累，\n\n和他是否努力，是否聪明，真的关系不大，\n\n也绝对不存在说谁的运势会一直好或不好。\n\n因为天地万物分阴阳，万物负阴而抱阳，阴阳各半，\n\n极其平衡，大家都会平等的享有低估和好运。\n\n所以真正能把人和人之间拉开差距的是什么？\n\n我告诉你是什么，\n\n是认知，生活习惯，还有做事方式。所以老祖宗在几千年前就总结出来了。\n\n展三世，\n\n认真看，认真理解，真的咱都越来越好，理解不了的，反复理解。\n\n首先展上石鹏驹主虚荣好明，体现在生活中就是过度在意别人认可，\n\n过度在意他人评价，\n\n习惯了在别人的认可里建立自己的价值，做任何行为的动力都是获得他人的认可。\n\n他们活成了别人世界里的耗材，活成了别人世界里的工具人。就是过分一点的，\n\n买东西之前都要想一下，买这个，别人能不能看得起自己，\n\n买那个，别人能不能看得起自己。但凡别人否定一句，马上天塌了。\n\n但是真的，咱扪心自问一下，\n\n别人的看法，别人的想法\n\n真的重要吗？庄子说举是欲之而不。\n\n加劝举是非之而不加举。你的价值是不需要建立在别人的认可里的。\n\n你说我傻，那我就傻，你说我小气，\n\n那我就小气，你说我丑，那我就丑。反正，只要你没有从现实层面拿走我的钱，\n\n我就不和你辩解，只要你不能对我的生活有实质性的帮助，\n\n我就永远不会讨好你。我甚至都不会奉承你\n\n一\n\n句聚人心窍主贪欲。\n\n我在这些年的从业生涯中，我真的见过太多人，明明能力很强，\n\n但是一辈子一事无成。究其根本是为什么？\n\n是因为他们太贪了，他们总以为人生是加法，\n\n是拥有的越多越好。所以他们一边费心费力的维护各种人际关系，\n\n一边又十分贪心的关注各种项目，什么都懂，\n\n什么都不精，什么都没做到极致，然后最后是什么都没有。\n\n道德经讲为学日益，为道日损。\n\n意思非常简单，就是一个人想要实现真正的命好，就必须得明白人这一生，\n\n气血是有限的，一切都是用气血交换的。\n\n给了人际关系，就给不了个人成长，给了闲事，就给不了正事。\n\n少则多，少则得，多则惑嘛，就是我早些年在钟南山和一位前辈聊天，\n\n他说了一句话，我真的非常认可。\n\n他说人的一生，其实只需要把精力放在真正有价值的那么两三件事上，\n\n就赢了，就躺赢了。\n\n比如维护至亲，比如专注一个事业，比如比如专注个人感受。\n\n其余的时间，我告诉你，你拿来休息，拿来享受，拿来感受世界，你就会发现\n\n这个世界又轻松又好玩。\n\n第三，斩下石棚角，助情欲，干涉烂慈悲。\n\n就是我在这些年，的从业生涯中，我还发现有一部分人，\n\n他们生活不是好不起来，而是刚刚有点起色，\n\n马上就圣母心烦了，总想着指点别人，干涉别人，\n\n共情别人。但是你别忘了，人各有命啊，谁都改变不了谁。\n\n你以为你在行善积德，实际上呢，你是在越界干涉，\n\n背负因果。道德经讲天地不仁，\n\n以万物为刍狗。任何人陷入窘境，\n\n都是他的认知缺陷和过往贪婪的集中情算，你根本就拯救不了。\n\n而且我还是那句话，人都是在苦难中成长起来的，\n\n你剥夺别人受苦的机会，\n\n本质上是不是也在剥夺别人成长的机会？\n\n那你为什么要做这件事情呢？对你、对他都没好处。\n\n聊到这，聪明人应该就已经发现了，斩三石的核心是什么？其实就两个字\n\n无情。\n\n不需要别人认可，不需要太多欲望，更不需要替别人活着，就这么简单。\n\n但是你做到这三点，我告诉你，你不存在不好。", "account_name": "洪洞师兄(目清)", "account_owner": "洪洞师兄(目清)", "account_type": "竞品", "comment_analysis": {"sentiment": "混合", "topics": ["无情与专注", "不在意他人评价", "情感与分手", "气血与精力", "修行与斩三尸"], "audience_keywords": ["修行者", "情感受伤者", "自我提升者", "焦虑者", "求知欲", "年轻人", "男性", "女性"]}}, {"id": "7626970811442329192", "title": "#传统文化", "date": "2026-04-10", "likes": 2756.0, "comments": 85.0, "shares": 454.0, "collects": 365.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "为什么一直赚钱，但永远过着很紧拔的生活？你有没有想过，这个社会的设计就是这么的精强，如果不去刻意抵制某种生活方式的诱惑，作为打工人来说，你收入再多也不会剩下这别人。看着这么多年，我就发现了一个秘密，就是这个局会不断的告诉你如何生活，如何消费，因为他就是希望你做一个左手进右手出，存不下任何东西的人。道德经里有一句看破财富天机的话叫金玉满堂，物之能守。网约车司机一天经手大几版小饭店，一个月的流水也有十几20万，但是这不是属于他们的钱，因为你一切一切的东西，代价和需求都会被算的清清楚楚。司机的份子钱，外卖小哥的客单价，餐饮老板的平台冲顶，大厂程序员，高额的房贷，各种天衣无缝的设计会利用你现阶段的需求，把你的生活水平永远卡在刚刚好。\n\n大一点就崩溃的边缘，你的月薪从1万涨到了3万，你的住房标准从合租变成了整租，外卖从15块变成了30块，包从帆布变成了LV，你觉得你在升级生活，其实你的价格被重新标记了一遍，只要一个行业、一个领域有一部分的人赚钱效率得到了提升，有了突破，这个局就会勒紧每一分。所以你是赚2万还是赚20万根本不重要，重要的是每个人都在燃烧自己的生命，在供养这套东西。所以有些客户问我如何改财，我很无奈，不是财富好是流经过你手里的钱，从来不是你的钱，你只是一个通道，左手接来，右手递出去，你就是这个局里的搬运。除非你有勇气跳出来重新审视自己，找到新的出路，否则你只能在这个局里不断的被消耗磨损。", "account_name": "逸恒", "account_owner": "泓泓", "account_type": "本号", "comment_analysis": null}, {"id": "7625559915910837427", "title": "#国学文化 #道系青年 #智慧人生 #干货分享", "date": "2026-04-06", "likes": 2753.0, "comments": 115.0, "shares": 174.0, "collects": 288.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "一个人如果真的要走大运，最先改变的是内心，然后才是财富。看事。这些年我就发现，真正有大富贵的人是要经历三重难关的。第一关，封印你所有的好运，让你环境艰苦，事业学业坎坷，这是让你看清虚妄，第二关，人情如纸，被朋友背叛，被爱人抛弃，这是让你看清动向，第三关，自信，你开始怀疑自己跟自己过不去，反复内耗，这就是在模拟的心理。当所有的人和事都离开你的时候，其实是在给你磨空间。你现在的低谷和沉默不是认命，是在为以后的一鸣惊人。", "account_name": "逸恒", "account_owner": "昭熹", "account_type": "本号", "comment_analysis": null}, {"id": "7624515334262920090", "title": "#国学文化 #道系青年 #智慧人生 #干货分享", "date": "2026-04-03", "likes": 2748.0, "comments": 119.0, "shares": 470.0, "collects": 760.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "清明节给先人送金银，除了钱财之外，有一样东西不能少，口袋里装上一把大米或者小米，\n\n烧金银的时候记得边撒边说这几句斯米落地，\n\n阴阳两立祖先得时，佑我顺利。简简单单几个字，但是能量非常强，\n\n刷到看到等于做到无声无量。", "account_name": "逸恒师兄", "account_owner": "昭熹", "account_type": "本号", "comment_analysis": null}, {"id": "7619644329027587347", "title": "普通人如何实现阶级跃迁！ #目清师兄 #道家文化 #认知 #提升自己", "date": "2026-03-21", "likes": 2737.0, "comments": 99.0, "shares": 441.0, "collects": 1209.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "泄露个天机给你啊，有没有想过普通人到底怎么打破困境，实现阶级跃迁？或者是有没有想过普通人怎么快速走出低谷？\n\n绝对不是靠意志力，也不是靠什么撞大运，什么天降横财。我告诉你靠的是什么？靠的是结构性重置。说白了就是人在低谷的时候，最致命的不是没钱没资源，是他还在用原来的做事方式过新的生活，说白了就是穿新鞋，走老路。\n\n不知道大家有没有听过猎狗的故事，猎狗掉进了当地猎人挖的3米深四面垂直的深坑，不是捕兽夹。他第一天拼命往上跳，爪子都扒烂了，第二天开始用头撞墙撞晕了，醒来之后还在坑里，第三天不动了，趴在角落等着饿死。\n\n第4天，有人往坑里扔了一只活鸡，他看着鸡借看着它，食肉动物和猎物捆在一起，他突然不死了，他开始追击疾跑。他追坑底虽然小，但是他跑起来了。\n\n追了3天，突然跳出了坑，不是因为他跳的高了，是在追击时踩到了坑壁上一块儿之前没看到的凸起的石头。同样，我告诉你，人掉入低谷的时候，第一反应也是拼命的往上跳，跳不出去就用头撞墙，撞不动了就放弃挣扎。大家都会认为是自己不够努力，但真的是不够努力吗？我相信没有人会不渴望更好的生活，那问题出在哪儿？\n\n出掉了，没找对方法。\n\n就我给人看卦的这些年，我看过无数人从低谷翻身的经历，后来我就总结，我发现有3个可以真正改变生活，且非常容易执行落地的方法。\n\n互联网上很多人讲如何快速走出低谷期，但是他们讲的这些方法要么就根本执行不了，要么就全全是扯淡的话，我今天讲的这3个，你百分百可以快速落地，快速执行。\n\n第一，先把活着的空间收拾到能喘气儿。\n\n庄子中有句话，虚实生白，吉祥直指你住在那儿，每天看到什么，醒来面对什么样的生活，直接决定了你大脑的决策质量。\n\n这个很科学，现在科学也有论证，长期处在混乱、压迫、不可控的环境里，人的判断能力会明显下降，你以为是你不行，其实是环境在持续消耗你的认知。\n\n就是你会发现那些过得不太如意的人，他们的生活环境大多都是窗帘永远拉着，桌子上堆着3年前的外卖烟盒、酒盒、水瓶子，墙上贴着5年前的明星海报。\n\n就是你的大脑，每天在这种环境下，你的第一反应就是我的处境不好，我得先活着。\n\n那你能混多好？\n\n所以，真正的转折，绝对不是突然振作起来给自己打点鸡血，而是先把点滴的生活的磁场给调整好。\n\n当你的环境变得可控的时候，你才能有足够的认知去做正确的角色。第二，把一到晚上就烂掉的自己修好。\n\n戒掉内耗，强迫自己养成早睡早起的习惯，别觉得这个很简单，我告诉你，如果你做不到，你绝对不会有长期可以持续的好运。\n\n黄帝内经讲起居有常，不忘劳作，故能行与神聚。晚上焦虑、内耗、失眠，在道家看来叫做阴阳逆乱，精气外泄，这会直接锁死你天亮以后的判断力，让你的睡眠恢复正常。身体动起来，你才能把控好自己的意志力和自控力。很多时候，不是你想不通，是你没能力想不通，尤其是身处低谷的时候，你需要很强大的判断力、执行力、行动力。\n\n而这些的来源，其实真的可能就是睡个好觉。\n\n第三，把脑子里的就观点扔掉。道德经讲，为学者日益，为道者日损，损之又损，以至于无为。很多人为什么走不出低谷？为什么越努力越惨？\n\n因为方向错了。\n\n很多人认为天道运转的核心是日益，其实我告诉你，是日损。\n\n说白了就是你先不用急着去学习，你先把过去的自己完全给抛弃掉，旧的取材方式，旧的面子，旧的经验全部给他粉碎，因为这些如果是对的，你不会陷入困境的。\n\n你陷入困境，就证明你过往的生活方式是错的，你过往的认知是错的。\n\n把手里的旧地图换掉，重新理解一下这个世界。所以现在我们再问一次，普通人怎么快速打破困境，怎么快速走出低谷？答案很冷静，也很残酷，不是觉醒，也不是天降横财，就这3个习惯，只要这3件事情同时发生，命运一定会出现偏移。猎狗跳出坑，不是因为会飞了，而是因为它会踩石头了，方法比努力更重要。", "account_name": "洪洞师兄(目清)", "account_owner": "洪洞师兄(目清)", "account_type": "竞品", "comment_analysis": {"sentiment": "正面", "topics": ["低谷期自我修复", "生活调整方法", "人生决策困惑", "减肥与业力", "普通人安稳生活"], "audience_keywords": ["自我提升者", "迷茫者", "减肥人群", "普通人", "求知欲"]}}, {"id": "7632566675540635046", "title": "想要变好，记住这四个字：锁 绝 隐 聚#道家文化 #目清师兄", "date": "2026-04-25", "likes": 2722.0, "comments": 42.0, "shares": 1108.0, "collects" 人，所以他有惰性，这个惰性会驱使着他，只有当他的生活水平受到受到刺激，受到威胁的时候，他才会爬起来赚钱。但是有没有想过，其实这个时候是他能量最低的时候。想象一下，当你生活一团糟的时候，各种事情牵扯着你，你能保证自身的精神状态不受影响，保证你的精神状态正常就已经非常不错了。那你怎么可能有明面是。\n\n别的能力去做事。生活中很多人失败是因为什么？就是因为他越挫越勇，他从来不懂得养精蓄锐，他从来不给自己的运一个爬升喘息的机会。所以任何低谷期的人来找我，不论他跟我说出多么惊天炸裂的项目和想法，我都会劝劝他，我说你缓一缓，让自己缓一缓，也让你的运缓一缓。\n\n常说的一句话就是，人有冲天之志，非运不可自通。\n\n虽然躺平不会让你的状况变好，但起码不会让你局面更糟。这里我们又要引入一个概念，总结来说就一句话，我不多解释啊，听不懂的反复想，反复理解，直到理解为止。就是你不要因为想创业而去创业，你要因为遇到了一个合适的项目再去创业。\n\n我可以负责任的告诉你，很多人一生的失败都是因为不懂这句话。\n\n说白了就是像我刚才说的，你绝对不能在你状态不好的时候，你你才去想赚钱，你应该在你状态好的时候多做点儿事儿。\n\n很多人真的他理解不了这个东西，然后我们继续往下讲，我们还要引入一个概念，就是你不理财，财不理你，世间万物都讲究一个平衡，而一旦失衡，关系就会破裂，然后就会相互失去，说白了就是你必须要学会维持你和财的平衡，否则你们就会相互失去。那什么是平衡呢？我们举个例子，张324年攒了10万块钱，他在年底的时候为了奖励自己首付了一台30万的车子，李四呢，24年攒了8万块钱，他全部存到了卡里，那么你觉得他们两个人谁赚到大钱的概率更大？因为很多人一定有这个误区，我告诉你一定是李四，因为他25年开年可以拿着8万块继续滚雪球，他的雪球是从8万开始。\n\n结滚的。但张三呢？25年开年赚不到钱，他就慌了，因为他背上车贷了。慌可能就会导致他做错无数个决定，一步错，步步错，一步错，步步错。我记得某一位富豪榜上的人说过，我之所以可以，我之所以可以持续赚钱，是因为我有底气，我有被动收入，我不会因为急去乱做决定。所以足以见得财富的分配是有多么重要的。就说白了，很多人，非常大一部分人，他败，败在哪儿了？败就败在他稍微看到点儿曙光的时候，虚荣马上上头，马上开始消费，他从来不给自己留后路。但是你必须要知道，任何人的好运都是有年限的，也许5年，也许八年，总之就是花无百日红，人无千日好。\n\n你的雪球在这几年里，滚起来就滚起来了，滚不起来你就继续举步维艰。\n\n我在给人看卦的这些年里，我真的见了非常多的人，他败就败在了他需要创业，他遇到好项目的时候，他没有本金。\n\n就是说肯定会有人说，哎，我去借钱怎么怎么样，但是你想没想过状态一样吗？\n\n你还有那个松弛的状态吗？\n\n对不对？说到这儿，我相信还会有一部分人跟我说，以上这些我全部都懂，师兄，但是我还是赚不到钱，那么你检查一下自身，你一定还有一个问题，过分节俭。\n\n我曾经在全真观里的时候，我遇到过一对夫妇，他们每年都来烧香，他们从来不去财神殿，因为他们相信勤劳能致富，他们只求平安。\n\n但是后来的故事是什么？\n\n这夫妇两个人每天打两份工，甚至打三份工，两个人每天家庭的开销不超过10块钱，他们家是没有床的。\n\n用木板搭了一个床，下面是堆的砖，不是农村的炕，你们一定要搞清楚啊，没有炕是拿砖搭起来的。钱攒到40万的时候，孩子摔断胳膊治病花了30万，后来攒到100万的时候，这家的男主人骑摩托车撞了一个老大人，一个老大爷赔了80万。日子过来过去还是没有钱。但如果你问我这个是为什么，我告诉你，其实道理非常简单，他们把财富分配成了死水。大家都知道，钱这东西五行属水，那么水需要什么？水需要流动，它需要不断流动，它才有可能聚集，才有可能凝聚成江河苦海，否则它就是一滩发臭的死水。他们还犯了一个错误是什么？就是他们确实渴望钱，他们也确实穷怕了，否则不会常年打两分。\n\n打三份工对吧？但是他们忽略了富在数数，不在劳身。如果你只是想平稳的度过余生，那么非常简单，就是你，你够努力，你够勤劳就行。但是我相信你能把一条讲财富的视频看到这儿，你就绝对不是渴望底层平庸平稳的生活，对吧？所以你就一定要懂得，财富是对认知的奖赏，不是对勤奋的补偿。就这条视频，我给你完整的分析了财富的本质，大部分人踩的坑，以及怎么避开这些坑，认真看完并且理解你怎么会不好。", "account_name": "洪洞师兄(目清)", "account_owner": "洪洞师兄(目清)", "account_type": "竞品", "comment_analysis": {"sentiment": "混合", "topics": ["财富与气运", "创业 omments": 110.0, "shares": 371.0, "collects": 718.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "一个看卦的告诉你啊，一个人，一个正常人，想发财，想彻底好起来，其实并不难，只需要记住并且理解黄帝阴符经历的八个字，就这八个字理解了，执行了，你的运气必然会不可逆转的变好。绝例一元，用师十倍。咱先不解释什么意思啊，咱先来设想一下，人往上走，人混的越来越好，本质是什么？首先肯定不是走狗屎运，或者也不是出门遇贵人，因为这些都是短期的影响，好像并不足以影响一个人长期的运势。我告诉你是什么？是不断地否定自己，不断地淘汰自己现有的圈子和人脉。再说直白点，其实本质上就是一场大型的背叛，因为你需要不断地打破自己原有的认知，造成的后果就是你需要不断的抛弃过去的过去的圈子，因为你不可能带着家人和朋友上路，他们的认知只能维持在当下的维度，只能支撑他们现在的生活，所以你想往上走，他们就注定没办法同行。所以你会发现这个社会，当下社会出现了两种人，第一种是有认知，有天赋，学习能力强，但是心不够狠，每天被人际关系产生的琐事产生，今天这个朋友有事了，需要帮个忙，明天那个朋友有烦恼了，需要倾诉一下，就不知不觉的，他人生的大半气血就浪费掉了。为什么说是浪费呢？因为这些都是无效付出，底层的圈子中有一个铁律，就是帮忙是你应该，不帮就是你没良心，所以帮来帮去，其实他自身什么都得不到，他的生活只能不断的走下坡路，因为人，的气血有限，一切都是在用气血做交换。他都用来做这些没意义的琐事了，他就注定没有多余的气血支撑他往上走。还有一个更残酷的真相，就是这部分人所有的好，都会在他最后帮不上忙的那一刻，在他帮不动的那一刻，烟消云散。那第二种呢？他也许没有那么高的天赋，没有那么强的学习能力，但是他极度渴望成功，所以他活的相对冷漠，他一心只想达到自己的目的，他不需要别人的理解，他也不在乎别人的情绪，因为他知道，那都是别人的人生课题，本质上和他没什么关系。任何人只要成为他往上走的负担，他会立刻止损。他所有的气血都用来做自己的事情，都用来提升自己，直到最后拿到自己想要的结果。这个行为就是绝利议员用失十倍。当一个人强行切断对别人认可的渴望，斩断所有浪费自己气血的无效社交，把所有的气血，所有的精气神都放在一件事情的时候，他的破坏力就会放大无数倍。那你说他凭什么不成功？凭什么混不好？但是很多人是不明白这个道理的。他这一生都被身边的琐事消耗，他这一生都在服务身边的人。当然，他的人生也一定会遇到往上走的机会，但因为天道要维持平衡，每个人都会平等的享有机会和好运。但是呢，机会来临的时候，朋友会劝他别折腾了，亲戚会劝他安稳点，或者刚有点进展了，身边人就开始以各种理由借钱，各种理由消耗他。然后他还不够绝情，他还顾及。他们的感受，最后结果就是留下来和他们一起腐烂。我之前有个新疆的客户朋友，我们俩聊天，他说了句话，我觉得特别经典。他说人呐，千万别又当又立。你要么就干脆冷血点，努力赚钱，别矫情，别那么多愁善感。要么你就什么都别想，好好服务你身边人，当个烂好人。最怕的就是你当着烂好人，你还想改变自己的生活，这太内耗了，这太不现实了。听起来很绝情，但实际上就是这个道理。我给人看卦这些年，我是真的发现，道德经讲的为学日益，为道日损，真的一点错都没有。普通人总认为成长是不断的做加法，但是聪明人呢，他的人生是不断的做减法的，他会毫不留情的直接剔除掉所有不产生利润的废动作。而且我们换一个角度来说，如果你真的重感情，那你应该努力多赚钱，然后拿出一大笔钱，分给你的发小，分给你的亲戚，而不是和他们一起烂在那里，一烂就是一辈子。", "account_name": "博闻文化（目清师兄）", "account_owner": "博闻文化（目清师兄）", "account_type": "竞品", "comment_analysis": {"sentiment": "正面", "topics": ["绝利一源用师十倍", "黄帝阴符经", "自我鼓励", "感恩", "天机算不尽"], "audience_keywords": ["求知者", "感恩者", "自我提升者", "传统文化爱好者", "励志者"]}}, {"id": "7597843765956541286", "title": "家里有小孩的千万要注意", "date": "2026-01-21", "likes": 2251.0, "comments": 78.0, "shares": 4523.0, "collects": 543.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "憋了好几天了，我觉得这个事儿还是得说一说，可能有点儿扫兴啊。就是从玄学的角度来说，我不建议任何家长在任何的社交场景中发布自己孩子的照片儿或者视频，包括也不要用孩子当头像、当壁纸之类的。尤其马上年底了，大家肯定会有各种各样的活动，免不了就得晒孩子几个点啊。首先道教认为孩子的元气如嫩芽，小儿无秀福，过度的曝光就像是气成风泽散打破巨蜥藏风的这个生长环境，说白了就像是让幼苗暴晒烈日，那后果就可想而知了。还有一点呢，就是孩子的照片或者是日常细节等信息暴露在这个公共空间当中，就很容易和外界的这个能量产生纠缠，比如嫉妒啊，恶意等等一些负面能量。总之就是小儿属假，过度晒照属于是露假。\n\n违背了这个赤子之真，守性以全其身的理论，所以希望大家都能注意一下吧。", "account_name": "你的好朋友目清", "account_owner": "你的好朋友目清", "account_type": "竞品", "comment_analysis": null}, {"id": "7630086725558517219", "title": "#传统文化", "date": "2026-04-18", "likes": 2243.0, "comments": 64.0, "shares": 385.0, "collects": 237.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "当前的时代，真正的红利只有一个，就是保持身体健康。拼命的时代过去了，保命的时代来了，因为现在大家觉得不是工作、车子、房子，而是良好的心态和深度的睡眠。当大家在焦虑失眠的时候，你能闭目养神，神不外驰，你就是在聚餐。这个世界啊，只会留给两种人，身体好的人和心情好的人，身心健康才是你这辈子最稳的闭环。", "account_name": "逸恒", "account_owner": "泓泓", "account_type": "本号", "comment_analysis": null}, {"id": "7627810188532606321", "title": "回归#国学文化 #道系青年 #智慧人生 #干货分享", "date": "2026-04-13", "likes": 2241.0, "comments": 128.0, "shares": 110.0, "collects": 263.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "你知道吗？一个人能量回归的时候，他的身上会发生一些变化，有时候自己可能都没有察觉，但是已经在走上坡路了。第一，心境比起一时的得失，短暂的利益，你更愿意去做长期且有复利的事情，面对外界的所有干扰和诱惑，你学会了屏蔽。第二，你的主体性变强了，你的目标感、边界感会逐渐的清晰，你不会选择再当老好人，而是学会了沉默和拒绝。第三，你开始学会给自己提供情绪价值，语言上也不会说那些负面的话，而是学会了肯定自己。当你的情绪不再焦虑，心力不再耗散，自然你就能把前方的路看得更清晰。当你的频率高了，万事万物都会来帮你。\n\n无声无量。", "account_name": "逸恒", "account_owner": "昭熹", "account_type": "本号", "comment_analysis": null}, {"id": "7625707982499712308", "title": "人生是一条长线，不要硬刚命运！ #目清师兄 #道家文化 #感悟人生 #学习", "date": "2026-04-07", "likes": 2230.0, "comments": 119.0, "shares": 353.0, "collects": 652.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "泄露个天机给你啊，有没有想过，现实层面里混的好的这部分人和混的不太如意的这部分人，他们的区别到底在哪？\n\n是命好不好吗？明显不是，天道是平衡的，不存在说谁能一直不好。\n\n那是努力程度的区别吗？很明显也不是，因为没有人会不想让自己的生活越来越好，那些躺平不再努力的，大概率也是连续受挫之后才没心气。\n\n但是，你绝对不能否认，他们也曾付出过努力。\n\n在这些年给人看卦的生涯中，我就真的慢慢的发现，其实这些过得好的人都是在有意无意中触摸到一条天道，他们在掌握了这条天道以后，很大程度上都达到了人生顺遂的目的。\n\n在周易的能量守恒系统里，叫天地盈虚与时消息，黄帝阴符经里写的是日月有数，大小有定，他们讲的大概意思都是。\n\n运势从来都不是一条直线往上的，天下所有的财富、机缘甚至是大运，都是有绝对的额度限制和保质期的。\n\n那为什么说这一部分人彻底明白并且接纳掌握了这条天道以后，人生会不可逆转的变好呢？\n\n咱先讲一个故事，我有一个客户，他是做主播的，我们是在他最火的时候认识的，那会儿我刷到过几次他直播，直播间一直就是5万人，6万人，多的时候七八万人。\n\n但是呢，他一个月就播个三四次，有一次我们俩吃饭，我就问他，我说你现在这么赚钱，你为什么不努努力啊？他说反正他火了，钱还不是什么时候赚都可以，我说真不是，我说你必须得明白，人的运势是存在周期性的，你可能过两年没有这么好，他说没事儿的，就算以后直播间人气下滑了，我有这么大粉丝量，我也能赚钱。结果就是第二年，第二年的后半年，将近第三年的时候，他在开播的时候，直播间就几千人。\n\n他心态崩了，播不下去了，开始视频带货，紧接着货出问题，账号被限流了。\n\n现在重新做账号也做不起来，生活肉眼可见的窘迫。\n\n我相信这个错误应该大多数人都犯了，所有过不好的人都犯了，这是一个认知的错误。\n\n什么错误的认知？就是人不是要一辈子一直赚钱，而是要在某一个周期里赚够一辈子的钱。\n\n我不知道有多少人能理解这句话，但是你必须得明白，你赚到钱真的不是因为你比别人聪明，而是因为天道的财富正好流经了你这里，就像大海涨潮一样，是有周期性的。\n\n但是，大部分人在顺境的做法是什么？发呆、庆祝、享受，以为自己好起来就不会落下去了，以为赚钱的机会是自来水拧开就有，但真不是啊。\n\n我上海的一个客户，那真的财富自由了，他太自由了。\n\n他那套四五百平的那个江景平层，据说就值一两个小目标，我不知道值多少钱，反正我就知道绝对是很贵。他卡里常年存着十位数，现在依旧是每天朝九晚五的上班。\n\n有一次我们俩聊天，我说你能不能给我的这个粉丝以及现在的年轻人们给点建议，我说我回去当素材，他想了半天，他就说了一个观点。\n\n就是想发财，就要对财富有一种极度的饥饿感和恐慌感，一旦发现自己正踩在运势的浪尖上，就要不断的告诉自己，这个风口马上就会过去，这个客户马上就会跑，这笔钱是我这辈子赚的最后一笔钱，带着这种末日感把执行力拉满，不要想着度假，不要想着怎么犒劳自己，不要想着赚够了，因为你不知道明天会怎么样，也不知道以后会怎么样。\n\n这个绝对不是贪婪。\n\n这是在天道的周期面前，对命运保持绝对的敬畏，真的，我当时我听完这个话，我说你真的活该有钱，你把道家的中心思想顺势而为算是理解透了，算是玩明白了。\n\n道德经讲物壮则老，是为不道，不道早已。其实意思就是当你觉得一切大好的时候，就是衰败的开始。\n\n我师傅早些年给我讲过一个比喻，我觉得非常恰当，就是他说人生是一条长途赛道，这条赛道上有山路，有乡间小路，有公路，有的人生来是越野车，有的人生来是小轿车，当然还会有自行车、电动车。\n\n正确的跑法是什么？是你如果是小轿车，那你就应该在山路上开慢点，然后到了公路上努努力。但很多人是怎么做的？他是一台小轿车，到了公路上飘了啊，觉得太轻松了，老子从此以后天下无敌，慢悠悠的开到了山路上呢，开不动了，开不动，他又急了，疯狂踩油门，然后抛锚，那你说是路不行吗？是车不行吗？好像都不是，是认知不对。\n\n希望你看到这条视频的时候，一切还来得及。", "account_name": "博闻文化（目清师兄）", "account_owner": "博闻文化（目清师兄）", "account_type": "竞品", "comment_analysis": null}, {"id": "7630463940891348270", "title": "社会上混得好的人，都做对了哪些事 #目清师兄 #道家文化 #感悟人生 #学习", "date": "2026-04-19", "likes": 2227.0, "comments": 100.0, "shares": 284.0, "collects": 797.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "泄露个天机给你啊，有没有想过，现实层面里混的好的和混的不太如意的这部分人，他们的区别是什么？是命好不好吗？很明显不绝对，那你说是努力程度的区别吗？其实明显也不是，就是你会发现。\n\n原生家庭、学历、长相、才华，这些其实都不是决定性因素。\n\n在这些年我给人看卦的生涯中，我慢慢的发现，其实这些所谓混的好的人，能够完成人生逆袭的人，他们都是具备了一个点以后才彻底好起来的。\n\n当然，我指的就是从底层翻身完成阶级跃迁的这个例子啊 恒#碎碎念 #缘分 #道系青年", "date": "2025-12-09", "likes": 2019.0, "comments": 124.0, "shares": 43.0, "collects": 51.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "", "account_name": "逸恒自在", "account_owner": "泓泓", "account_type": "本号", "comment_analysis": null}, {"id": "7625483566532611363", "title": "低谷期，其实就是在救你的命 #目清师兄 #道家文化 #感悟 #学习", "date": "2026-04-06", "likes": 2008.0, "comments": 103.0, "shares": 308.0, "collects": 616.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "低谷期就是在救你的命。有一个非常反常识的真相，就是你真正的成长，真正的蜕变，其实都发生在逆境，都是在你人生的低谷，最困难、最煎熬的状态下完成的。发生的就是我们必须承认一个残忍的真相，在这个世界上，我们做对的大部分事情都是源自运气，而那些我们做错的事情才是我们真实的实力。你所看到的任何一个人的强大、通透、杀伐、果断，全部都是来自于一次又一次的失败和苦难，无一例外。\n\n因为人在顺境是不可能成长的，顺境只会让你变得松懈、骄傲、自满。\n\n所以，你人生中遇到的任何一个战无不胜、非常厉害的人，都一定经历过一段人生的至暗时刻，都一定有过一段暗无天日，你无法想象的大起大落。\n\n然后才能换来他在高处的坦坦荡荡，坦然自得。\n\n那什么叫地步？什么叫治安？时刻就是赚不到钱，得不到爱。你曾经相信的，你曾经坚信不移的坚定永远都不会失去的，都会崩塌，你所有的付出都会付诸东流，你所有的努力都会被全盘否定。\n\n但是你必须搞清楚，这不是在折磨你，而是在救赎你。\n\n这是在打破你原有的认知，以让你更好的踏上新的人生道路，因为不破不立啊，对不对？不彻底摧毁是不可能彻底重建了，你只有经历了彻底的崩塌，你才能在废墟上建立新的认知，建立新的秩序，实现真正的脱胎换骨，凤凰涅槃。\n\n老话说，天欲福，人必先以为祸敬之。那什么是真正的脱胎换骨？\n\n你欠债满世界躲债，债主突然不催了，那是脱胎换骨吗？\n\n是涅盘重生吗？明显不是，你感情受挫，痛不欲生，每天醉生梦死，对方突然回心转意，是涅磐重生吗？\n\n明显也不是，这些都只是你暂时的绕开了困境，但是只要你的底层逻辑没有重建，你的认知没有提升，这些靠你侥幸躲开的困难在未来一定会十倍百倍的再次砸向你，因为问题没有被解决。所以真正走出低谷是什么？是你在逆境中彻底打破自己原有的认知，完全改变自己的行为模式，在下一次面对同样的事情时，你给出了不同的选择。\n\n这个阶段，你是只感受到了煎熬，还是认真的做出了改变，真的就决定了你以后会面对什么样的人生。有的人在低谷只感受到了痛苦，他毫无长进，那低谷期对他的意义就仅仅是折磨他。但有的人呢，开始自省，开始敬畏，开始承认自己的无知，那低谷期给他的意义就是一次全新的蜕变，就是一次涅盘。\n\n道德经讲知不知上不知之病，其底层逻辑就是，一个人如果没有经历过置之死地而后生，那他所拥有的所有东西都是没有根的，都是虚无的，都是可以瞬间失去的。\n\n逆境长毛病，逆顺境长毛病，逆境长本事，等你把所有的都失去了。\n\n把所有的失去都看作是天道为你挡下的灾难，把所有的意外看作是老天对你强行纠错，不再问为什么是我，而是开始思考这件事情能够给我带来什么经验，能够帮我改掉什么样的毛病。这个时候，你所拥有的所有东西都是扎实的，都是有根的。\n\n当下你觉得走投无路，10年之后你再回头看，你就会发现，正是当年那场把你逼上绝路的变故，逼你长出了翅膀。所以，不要抱怨低谷，享受低谷，在低谷期尽可能的学习，尽可能的长本事。", "account_name": "博闻文化（目清师兄）", "account_owner": "博闻文化（目清师兄）", "account_type": "竞品", "comment_analysis": null}, {"id": "7634390482889608475", "title": "道士下山当老板是一种什么体验！！ #目清师兄 #随拍 #vlog日常 #人生感悟", "date": "2026-04-30", "likes": 2007.0, "comments" 就是空间决定机会密度，这也是一个很科学的理论，什么意思？就是你接触的空间越大，你遇到的人、事、物，遇到的信息就会越多，你能抓住的机会就越多。\n\n听起来很悬，但是仔细想想，你会发现其实就是个概率问题。\n\n你想一下，你每天三点一线，两点一线，你能认识谁？同事、同学、家人、外卖小哥，对吧？你能接触到什么信息？公司的八卦，朋友圈的广告，短视频的算法推荐，但是一个经常出门的人呢？他的人生就多了无数种可能。\n\n玄学角度呢，就是人会被环境带来的能量场所影响，当能量流动起来，财富自然也就会跟着流动起来。\n\n因为我们自身的能量一定是不够平衡的，我们必须要多接触大自然里的水元素、风元素、火元素、土元素这些。\n\n这些才能让我们身体的能量流转起来，流通起来。人人都说走运，走运嘛，就是走起来运才回来，一方水土养一方人。\n\n不同的环境，滋养的人一定是不同的，这就好比是一个池塘，它的水特别容易臭，但是活水呢，你看江河，江河湖海。\n\n它很难不清澈，很难有异味儿。\n\n我们可以再换个角度。\n\n你不多尝试，你是不会知道你到底适合哪种人生的。\n\n人生真的不是到了年纪就必须要结婚，必须要生子，必须要稳定下来的，包括就算你不到年纪，人生也真的不一定要求安逸的，每个人适合的人生是不一样的。\n\n所以，人在彻底好起来之前，要做的绝对不是早早的安稳，早早的求稳。\n\n早早的把自己的人生给固化起来，充分的把握流动的意义，加以运用到生活中，你的人生才会有无数种新的可能。\n\n否则你不用想了，你大概率会复制你父亲或者你母亲的一生，就这么简单。", "account_name": "博闻文化（目清师兄）", "account_owner": "博闻文化（目清师兄）", "account_type": "竞品", "comment_analysis": null}, {"id": "7638491146519432489", "title": "忙碌导致贫穷，闲暇带来财富 #目清师兄 #随拍 #道家文化 #人生感悟", "date": "2026-05-11", "likes": 1996.0, "comments": 73.0, "shares": 231.0, "collects": 637.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "泄露个天机给你啊，站在挂失的角度来说，一个人，一个正常人，想要混的不错，想要甩开身边人。\n\n或者说，想要在社会层面有不低的位置，其实真不难，就只需要理解并且记住玉清玉清金寺清华秘闻里的8个字就行。记住并且理解这8个字，你的人生，你的运势。\n\n将会不可逆转的变好，静极生动，动极生静，咱先不解释什么意思啊，咱先来设想一下，普通人想要变好，最大的。\n\n阻碍是什么？\n\n阶级固化，机会减少，还是智商、运气？这些好像都是表面的像，好像都并不足以把一个人困在底层，是不是？\n\n那我告诉你是什么是不思考，为什么不思考？因为静不下来啊。\n\n什么意思？有没有想过，社会为什么要给你制造那么多焦虑？为什么要让你不断的奔波忙碌？为什么短视频无限滚滚动？为什么游戏要给你设置那么多的奖励机制？\n\n很简单，为的就是让你永远停留在动的层面。\n\n让你的欲望把你牵着走。\n\n让你成为一个永远停不下来的。\n\n脱落，今天沉迷这个游戏，明天追那个热点，后天赶那个风口，看似你很努力很争抢，但实际上呢，是不是也挺无头苍蝇的？我不知道有多少人理解这条视频啊，但是我建议所有当下生活不太如意的，或者说所有想让自己生活越来越好的。\n\n耐着性子把这条视频看完，什么是动极生静？静极生动，这个绝对不是简单的静止和运动，它是宇宙万物运行的根本规律。道德经讲万物负阴而保阳，冲气为和。你学不会静，你就不会动嘛，对吧？举一个非常简单的例子，两个同样起点的年轻人，一个每天忙忙碌碌，到处找机会参加各种培训，应酬各种人际关系，今天学编程，明天学设计，后天又想做自媒体，看似什么都懂，实际上什么都不精，另一个呢？\n\n用大量的时间思考，用大量的时间去想自己到底想要什么，然后静下来专注一个领域深耕，那你说时间线无限拉长，谁过得好？\n\n是不是后者无形中就达到了音符精讲的绝力一员，勇士十位，就包括我在这些年给人看卦的生涯中，我也见了大量的这种例子，也许是二十几岁没啥成就，也许是三十几岁，也许是四十几岁，总之就是这些人都有一个共同点，他们每天都很忙，但是你问他到底在忙什么，他也不知道，好像什么事都要做，都要操心，但就是。\n\n不知道在操心什么，但就是没时间操心一下自己到底想要什么，该做什么，那他凭什么过得好？咱可以再说的直白一点，就是一个人如果开始走上坡 144428814701745", "title": "#随拍", "date": "2025-11-21", "likes": 1222.0, "comments": 27.0, "shares": 167.0, "collects": 161.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "", "account_name": "博闻文化（目清师兄）", "account_owner": "博闻文化（目清师兄）", "account_type": "竞品", "comment_analysis": null}, {"id": "7631502146345273585", "title": "低谷#国学文化 #道系青年 #智慧人生 #干货分享", "date": "2026-04-22", "likes": 1215.0, "comments": 53.0, "shares": 150.0, "collects": 151.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "今天站在一个挂身的角度跟大家讲一个规律，一个人能不能从低谷翻上来，最重要的还是你在那个低谷里做的决定。低谷最怕的不是没钱，不是霉运，是你急着要翻身。你想啊，人在最缺钱的时候，脑子里想的全是怎么搞钱。朋友圈如果有人发项目，你就心动了，有人说有个小生意让你稳赚，你犹豫没两天还是投了，抓到一个看着能赚快钱的东西，你明知道有风险，但你觉着你自己已经这样了，赌一把说不定就翻身了，你是在拿最后的底子再赌，赌赢了不一定翻身，赌输了连底都没了。问题是，低谷期的人往往判断力都是偏的，很难分得清什么是机会，什么是坑，因为你太急了，急到什么看起来都像救命稻草。易经里有一句话叫做潜龙勿用，龙在潜伏的时候不动，不是因为它不行，只是时机未到，没到的时候，你硬往上冲，不是勇气，是莽，你拿最弱的状态去接。\n\n最大的风险，10次里面9次会栽。说白了，人在低谷的时候不动一定不会错，但动了就可能会错。因为这个阶段你的判断是混乱的，你的选择是失准的，你自己觉得在往上爬，其实是在往坑里跳。看似这些年我见过太多这种人，本来低谷归低谷，手里有点底子，咬咬牙能扛过去，结果一着急，这个头一点，那个试一下，椅子全折腾没了。最后不是低谷把他压垮，是他自己在低谷里把自己给埋了。而那些低谷能翻身的人，无一例外都做对了一件事儿，要等等，不是躺着不动，是带着意识收住自己。他们收住了自己的钱，有多少受多少，一分都不乱动，收住了情绪，不让焦虑为自己做决定，收住了精力，不到处找出路，先把脚下的路站稳了。道德经讲，凡者道之洞，事物到了极点，自然会往回走，每个人的运啊，都是有周期的，有高。\n\n就低，低的时候你硬冲就是逆的，中期走耗的就是你的元气，等元气耗光了，真正给你取的那个时间点到了，你反而见不能熬过这一段的人，后面接触的东西比你现在着急去抓的那些大多。", "account_name": "逸恒师兄", "account_owner": "昭熹", "account_type": "本号", "comment_analysis": null}, {"id": "7592870149896718075", "title": "#随拍#法物流通处", "date": "2026-01-08", "likes": 1201.0, "comments": 108.0, "shares": 78.0, "collects": 152.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "跟大家说一下啊，咱家这个浅母的编号它不存在吉不吉利，也不是你看着销量下单，\n\n你就能拿到这个对应的编号了。前几天有个朋友私信我，他说他下单的时候销量是八千八百八十七，\n\n为啥他拿到的这个编号不是八八八八\n\n这个钱我跟大家说一下，只是这个链接出了九千多单了，其他的地方也在不断的出单，\n\n因为确实是好东西，大家也都喜欢，所以编号确实是挑不了。\n\n每一张其实都挺好的，都是用前朝的标准印钱模板做的印退都有独立的编号，\n\n也有我们师兄弟的签名和我师傅手写的祝福语。流程呢也都给大家走好了，\n\n道经是否也盖上了？收到以后呢，放在钱包，存钱罐，保险柜，\n\n收银台都是可以的。至于还有朋友不知道它是干嘛的，我只能告诉你，\n\n母鸡是下蛋的，咱家这个叫钱母。", "account_name": "洪洞师兄(目清)", "account_owner": "洪洞师兄(目清)", "a 啊，听不懂的反复反思，直到你理解为止。就是你不要因为想创业而去创业，\n\n你要因为遇到了一个合适的项目再去创业。\n\n我可以很负责任的告诉你，很多人一生的失败都是因为他不懂这句话。\n\n那么这个时候肯定会有人说，\n\n这些我都理解，师兄，我也没有在状态很糟的时候才去努力，我也没有在很顺的时候躺平休息，\n\n但是我还是赚不到钱。\n\n那么我们继续往下讲，我们又要继续引入一个概念，\n\n就是你不理财，财不理你，世间万物都要讲究一个平衡对吧？\n\n而一旦失衡，关系就会破裂，然后就会相互失去\n\n对吧？说白了就是如果前面的错误你没犯，\n\n那么你很有可能就是没有学会维持你和才的平衡。\n\n那么什么是平衡呢？举个例子啊，张三二四年攒了十万块钱，\n\n他年底的时候为了奖励自己，首付了一台三十万的车子。\n\n李四呢，二四年攒了八万块钱，他全部存到了卡里。\n\n那你觉得他们两个谁赚到大钱的概率更大呢？\n\n一定是李四，因为他二五年二六年对吧？\n\n现在是二六年，二六年开年就可以拿着八万块钱继续滚雪球，\n\n他的雪球是从八万开始往上滚的。而张三呢，\n\n他背上了车贷，开年如果赚不到钱，他就开始慌了，\n\n慌就会可能导致着他做出无数个错误的决定，\n\n一步错，步步错，然后踏入一个恶性循环。\n\n我记得有一位富豪榜上的人说过，就是我之所以可以持续赚钱，\n\n是因为我有底气，我有被动收入，我不会因为急而乱做去二，\n\n我不会因为急而去乱做决定。\n\n所以其实足以见得财富的分配是非常重要的一件事。说白了就是很多人，\n\n他败就败在了稍微看到点曙光的时候，他的虚荣马上上头，然后马上开始消费，\n\n他从来不给自己留后路，只要一顺，他就觉得哎，老子天下无敌。\n\n但是你一定要知道，任何人的好运都是有年限的，\n\n也许五年，也许八年，也许十年，\n\n总之就是花无百日红，人无千日好，你的雪球在这几年里滚起来也就滚起来了，\n\n如果滚不起来，你就继续过举步维艰的生活。\n\n就是我在近些年看卦的生涯中，我发现有很多人，\n\n他败就败在了他需要创业，他遇到好项目的时候，他没有本金，\n\n他一点积累都没有。说到这，我相信还有。\n\n一部分人以上说的这些，他自己全部都懂，但他还是赚不到钱。\n\n那你就可以检查一下你自身，你一定会有一个问题，\n\n过分节俭。我曾经在全真贯里的时候，\n\n我遇到过一对夫妇，他们每年都来烧香，但是他们从来不拜财神，\n\n因为他们相信勤能致富，他们只求平安。\n\n但是后来的故事是什么？是夫妻两个人每天打两份工，\n\n每天家庭的开销不超过十块钱，家里没有床，\n\n他是用木板搭了一个床，\n\n不是炕，不是农村的炕啊，是用木板搭了一个床，连床都舍不得买。\n\n等他的钱攒到四十万的时候，他们家孩子把胳膊摔断了，\n\n然后治病花了三十万。后来又攒，攒到一百万的时候，\n\n这家的男主人公骑摩托车撞了一个老大爷，然后赔了八十万。\n\n就日子过来过去，还是没有钱。如果你问我为什么？\n\n其实道理非常简单，就是他们把财富分配成了死水。\n\n大家都知道，财五行属水，那么水需要什么？水是需要流动的，\n\n它需要不断的流动，它才有可能会聚集成江河湖海，\n\n否则它就是一滩发臭的死水。\n\n他们还犯了一个错误是什么？他们确实渴望金钱，他们也确实穷怕了对吧，\n\n否则不会常年打两份工。但是他们忽略了一个点，\n\n富在树，树不在劳深。如果你只是想平稳的度过余生\n\n对吧？那么很简单，你够努力够勤劳就行了。\n\n但是我相信你能把这么长的一条视频看到现在，\n\n你绝对不是在渴望底层平稳的生活。\n\n所以你就一定要懂得一个道理，财富是对认知的奖赏。\n\n不是对勤奋的补偿。", "account_name": "你的好朋友目清", "account_owner": "你的好朋友目清", "account_type": "竞品", "comment_analysis": null}, {"id": "7641950180060843327", "title": "想重构人生，这三个要素缺一不可 #目清师兄 #道家文化 #随拍 #人生感悟", "date": "2026-05-20", "likes": 416.0, "comments": 30.0, "shares": 35.0, "collects": 136.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "今天一条视频给你讲清楚三个重构运势的底层要素，\n\n改变这三个要素，你的运势将会不可逆转的变好。\n\n别觉得我在胡扯，作为 会导致他对眼前的舒适舍不得，离不开，甚至会导致他慢慢开始接纳自己当下乱糟糟的生活，接纳这个平庸没什么长进的自己，那他凭什么变化？那这个时候聪明人应该就知道要怎么做了。这三步，记住并且执行这3条铁律，用人发杀机去执行这3条铁律，你未来的10年、20年，甚至终身，你都会不断受益。第一，单点爆破，说白了就是对所有分散自己经历的事情都拒绝只聚焦一个核心目标，把所有的能量都投入到一件事情。我给人看卦，这些年真的我见过太多人，他今天想做这个，明天想干这个，东打一枪西晃一枪，结果就是一事无成嘛，因为他自己都不知道自己到底想要什么，但是反观那些拿到结果的人，他们必然是在一个领域做到了极致，是不是？所以搞清楚自己想。\n\n要什么，并且坚持自己想要的，这个一定是非常重要的。第二，顺势而为。道德经讲君子得其实则讲，不得其实则鹏类而行。严格来说就是你想要好起来，你并不需要太太简单，你只需要在对的时间做对的时候。这句话听起来很简单，但很多人，绝大多数人都搞反了。顺利的时候，膨胀，休息、躺平，觉得自己天下无敌，不顺的时候，急了，四处乱窜，一分钟都安静不下来。人这一生，三起三落，这是必然的。起的时候多做点事儿，落的时候多学习，多思考，多深耕，把控好节奏，用人发杀机，认真把控节奏。三、反求诸己，不断的向内球，用万事万物帮自己取长补短。孟子讲行有不得，反求诸己。其实意思非常简单，任何东西如果你得不到，都是因为你不配，都必然会有你不配的点。那怎么配很简单，看别人怎么配。拆解分析你身边任何一个优秀的人是为什么优秀的，拆解分析你身边任何一个失败的人是为什么失败的。每天拆解自己做了什么，哪些该做，哪些不该做，每天不断的自我。\n\n反思自我提升，用人发杀机，不断的自我反思，自我提升，你不存在不好，你凭什么不好？", "account_name": "你的好朋友目清", "account_owner": "你的好朋友目清", "account_type": "竞品", "comment_analysis": {"sentiment": "正面", "topics": ["知识学习", "感谢支持", "点赞互动"], "audience_keywords": ["求知欲", "学习者", "粉丝"]}}, {"id": "7627360215210126154", "title": "人生一定要躲过这四大陷阱！#道家文化 #目清师兄", "date": "2026-04-11", "likes": 273.0, "comments": 7.0, "shares": 125.0, "collects": 119.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "一个看卦的告诉你啊，一个人，一个正常人，他只要能躲过人生这4大陷阱，他就不存在混不好，而如果躲不开这4个陷阱，每一个都足以让普通人万劫无复。希望你刷到这条视频的时候，一切都还来得及。一大陷阱就是自证陷阱，别人随便污蔑你一句，误解你一次，你就像疯了一样，翻箱倒柜的去找证据向他解释，你以为你这个是在捍卫尊严，其实呢，你这是跪着用双手把评价你的资格递到了对方手上。光子棋，无论你讲是不是，然不然是，若果是也，则是之异乎，不是也，亦无变。对的就是对的，错的就是错的，事实根本就不需要你张牙舞爪的去辩解。误会你的人比你自己都清楚，他误会你了，而你一旦开始辩解，你就已经输了，你就已经入局了，因为裁判权不在你手上了。永远切记，你怎么做事儿是你的人生课题，别人怎么看你，怎么评价你，是别人的人生课题，本质上和你没什么关系。\n\n这个就叫课题分离。第二大陷阱，渡人陷阱。看到身边的朋友混的不太行，看到亲戚朋友认知低，看到谁谁谁有困难，都想去帮个忙，但是别忘了天道是公平的，每一个人的苦难都是和他自己的认知以及因果完美匹配的，本质上每一次苦难也都是他成长的机会，你过度干涉，不仅会凭空消耗你自身，也是在剥夺他人成长的权利，下一次保不齐就会有更大的坑去等着他，这个对你对他其实都是陷阱。永远记住啊，咱普通人活一辈子，你只要能管好自己，你就已经非常非常非常成功了。第三，第三大陷阱，也是我见过大家踩过最多的陷阱，就是沉默陷阱，谈了四五年的恋爱，干了七八年的工作，或者投资了一大笔钱的项目，你自己都明知道没希望了，但是你舍不得放手，因为你太在乎沉默成本了，这就是沉默陷阱，这个时候舍不得就只会把你拖垮，因为一件事情如果不行，他崩盘就只是时间问题，聪明人呢，会在意识到不行的时候迅速离场。\n\n但是普通人呢？不见棺材不要脸，不到黄河不死心，有用吗？除了徒增成本，没有任何意义，当断不断，反受其烂，买单认栽临一场，真的是人生中非常非常非常重要的一个技能。第4大陷阱，虚荣陷阱。说
