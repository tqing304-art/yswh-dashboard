s": 32604.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "不要和任何人分享我今天说的这个内容啊，因为这个社会从来都不鼓励大家去研究上升通道。有史以来，各种组织都在想尽办法的让你沉溺在奶头乐里，为的就是封死你的上升通道，他们好更简单的占有更多的资源给人看卦。这些年，我非常直观的看过无数个翻身走好运的案例，我也对比过无数个从底层挣扎，怎么努力都好不起来的案例，然后慢慢的我就总结出来了一个反人性的真相，就是这些真正能够好起来的人，他们在走好运的第一阶段，都无一例外的做了一件事情，就是变得自私。先不用急着反驳，咱一条视频把它讲清楚这是为什么，一条视频讲清楚为什么自私才是你的上升通道。首先我们要明确一个点啊，就是这里的自私，他不是世俗理解的为了自己的好处去损害别人的利益，他像是一种状态，这种状态在心理学上叫主体性，在我们道教叫精神内守，叫借假修真。就是我们可以先观察一下身边那些怎么都过不好自己生活的人，他们的行为是什么样的？在公司当老好人，在家里被破烂亲戚吸血，谈个恋爱处处迎合对方，生怕得罪任何人，处处谨慎，处处小心。但是他过好了吗？明显没有。为什么？因为他用了错误的逻辑去玩人生这场游戏。庄子在无用论里讲山木自寇也高，火自坚也贵可食，故可伐，岂可用，故搁之。本质上是因为他们太不自私了，他们太无私了，他们完全丧失了自己的主体性，他们成为了别人世界里的耗材，成为了别人世界里的工具，那他凭什么过得好？这就好像是你会在乎你们家大门的感受吗？还不是想摔就摔。咱要说直白点，这些丧失了主体性的人，他们和大门有什么区别？就是别人世界里的一个工具。但是反过来呢？那些过的好的人呢？首先他们就没有那么多烂好心，他们绝对不会主动讨好或者迎合谁，因为他们知道，别人怎么看他，和他没有半毛钱关系，他的时间精力是用来服务自己的，不是用来迎合别人的。这就是清静经讲的人能常清静，天地悉皆规。其次就是他们不会绝对不会主动去帮谁，管谁，他们拒绝谁，他都没有负罪感，他有一个明确的边界，任何人都不能打着亲情友情的幌子去道德绑架他。还有更重要的一点，就是这部分人，他们因为自己活得自私，自己不帮助任何人，所以他们也从来不会指望别人来帮助他，他的希望不会寄托于外界，然后他自己所有的需求，他都会想尽办法的自己满足自己，经济需求，精神需求他都会自己满足自己，久而久之，他越来越强，这就像是一个良性循环。你会发现，那些过的不好的，归根结底是为什么？是因为他对别人好，然后会带来一个什么后果？他就会希望别人也对他好，他的时间用来服务别人，然后他希望别人也来服务他。但是想过没有，那为什么不能直接自己服务自己呢？这就是典型的交换思维和弱者逻辑，他们永远搞不清。楚别人对他的态度，永远是取决于他的绝对实力和他的利用价值，这和是否尊重别人，是否对别人好没有一点关系。甚至很有可能，你对他越好，他越看不起你。恩生于害，害生于恩，就是这个道理吗？所以开头我说一个人是否足够自私，真的就决定了他这一生是否顺遂。他是连锁反应，首先丧失主体性，他没时间打理自己，其次呢，他希望寄托于外界，然后迎来一丝一丝的失望。所以真的，你这一生总共就三万多点，为自己活真的是理所应当。", "account_name": "洪洞师兄(目清)", "account_owner": "洪洞师兄(目清)", "account_type": "竞品"}, {"id": "7605899839512457594", "title": "旺自己的玄学技巧！#道家文化#提升自己#认知", "date": "2026-02-13", "likes": 51436.0, "comments": 864.0, "shares": 25606.0, "collects": 25147.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "大量的证据证明望自己一定是有玄学的，所以今天我用一条视频给你讲清楚10条能让你快速变好的玄学秘法。咱不聊底层逻辑，咱只讲操作手册，不需要你花钱请物件，也不需要你搬家看风水，只要照做，短则3天，快则一个月，你就会特别明显的感觉到磁场轻快，钱也没那么难赚。第一，扔掉所有带穷气的东西，什么叫穷气？\n\n缺角的碗，三年没动过的杂物，破洞的袜子，总之这些破破烂烂的，陈旧破损的东西都不能留着，玄学讲万物有灵，这些在衰败之期的东西，不清理掉，新的运根本就进不来。第二，修好你的第一风水脸，不是让你去整容啊，是让你把额头露出来，尤其是这个男人，额头是官禄宫，是用来接天光的。第三，这道口音，尤其是哭穷，永远永远别说自己没钱，别说自己不行，或者说什么烦死了，累死了这些管住嘴就是锁住气。第四，去借天火，如果最近感觉小人多，身体乏力，可以找一个大晴天把你的背给晒一晒，背是督脉，是阳气之海，晒背就是免费的天灸，借天力，补人力。第5，切断任何的赋能连接，定期去清理。\n\n你的通讯录，找出那些一看到名字你就烦，或者只知道在你鬼混，找你借钱，找你吐槽的人，直接删除拉黑，别不好意思，这个叫物理排毒。第6，停止反刍。\n\n发生过的烂事，被人坑过的钱，打过的架，骂过的，接过去就让他过去，别反复揣测过去，心不可得，及时止损也是一种盈利。第7，培养钝感力，别太关注外面发生了什么，因为这些本质上是和你没什么关系的。太敏感的人，神是散的，气是虚浮的，他很难稳住自身的磁场。第8。\n\n睡觉。\n\n没错，就是字面意思，因为睡觉就是最高级的补元神，玄学讲一阳生子时不睡就是在耗你的真元，当你睡饱了，眼睛亮了，你就会发现那些所谓的死局都是你熬出来的幻觉。第9，敢于谈钱，别假客气，敢于报价，敢于拒绝白嫖，任何时候学会维护自己的利益和底线，让财神爷觉得。\n\n你是个懂行的人，他才不敢怠慢你。第10，允许别人做别人，也允许自己做自己。这个是最高级的一招，就是放下你的助人情节，尊重他人命运。别去劝那些想跳火坑的人，别去管那些扶不上墙的烂泥，点一句是积德，说三句就是造业。\n\n说白了就是望自己，其实本质上就是一场清扫和封锁，扫掉晦气，锁住元气，必然管用。", "account_name": "洪洞师兄(目清)", "account_owner": "洪洞师兄(目清)", "account_type": "竞品"}, {"id": "7344662023763954954", "title": "当我们身处低谷时，要做的只是让自己活下来就够了！", "date": "2024-03-10", "likes": 50119.0, "comments": 2668.0, "shares": 31104.0, "collects": 11009.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "", "account_name": "洪洞师兄(目清)", "account_owner": "洪洞师兄(目清)", "account_type": "竞品"}, {"id": "7630071726424247562", "title": "所有能够好起来的人，都一定是明白了这个道理： #目清师兄 #道家文化 #感悟 #人生感悟", "date": "2026-04-18", "likes": 49783.0, "comments": 1954.0, "shares": 12868.0, "collects": 20645.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "", "account_name": "博闻文化（目清师兄）", "account_owner": "博闻文化（目清师兄）", "account_type": "竞品"}, {"id": "7438583901985017148", "title": "避奶，避谶，避整，避邪", "date": "2024-11-18", "likes": 49267.0, "comments": 9486.0, "shares": 35230.0, "collects": 12662.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "", "account_name": "洪洞师兄(目清)", "account_owner": "洪洞师兄(目清)", "account_type": "竞品"}, {"id": "7617805926917044837", "title": "这是一条关于运势的天机#道家文化#目清师兄#认知#提升自己", "date": "2026-03-16", "likes": 48486.0, "comments": 5209.0, "shares": 5476.0, "collects": 11184.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "把这条视频看完，你的运气将会不可逆转的变好，别觉得我在胡扯啊，作为一个干了十几年的挂师，我这些年也算是看过无数客户从高处落下，也看过无数在泥潭里来回打滚站不起来的客户。后来慢慢的我就总结，然后我就发现，其实人生有4大败局，躲过去，诸事皆是，躲不过去，处处是坑。第一败，败于多言，也就是话多。很多人稍微有点成绩，或者是稍微受点委屈，他就管不住自己的嘴，到处高谈阔论，或者是诉苦抱怨，他们以为是在寻找共鸣，但其实呢，你炫耀是在拉仇恨，你诉苦是在给别人找乐子。这个世界沟通的底层逻辑不是为了交心，是博弈。\n\n你不需要寻找认可，因为别人是否认可你真的没什么意义。永远记住，言多必失啊，不要让任何人了解你，因为这个世界和你不熟的人是坑不了你的。\n\n第二败，败于傲慢。曾国藩有句话是这么说的，天下古今之才人，皆以一傲字之败。\n\n庸人死于懒，聪明人死于傲。\n\n我就有很多客户，非常多的客户在稍微有点小成绩以后，就开始眼高于顶，觉得老子天下无顶，但实际上呢，你的成就是时代的红利加上大运的推波助澜，再加上一点点你的认知努力相互作用产生的结果。\n\n很多人会说，我赚钱以后，我没有，我没有表现的很骄傲，很傲慢，但是我告诉你，心里的骄傲更致命，一旦你心里骄傲了，一旦你觉得你自己非常行了，你就不会有那么强的执行力了，你就开始懈怠了。社会发展到现在，竞争力已经无限大了，你稍微懈怠一点儿，迎接你的就很有可能是一地鸡毛。\n\n经历过的人应该都懂我在说什么。\n\n第三代在于执念，这里的执念我告诉你，包括咱们不限于执着某个人事物，因为现在的人们都已经活得相对清醒很多了，大家对于人、事物都没有那么执着了。但是大家还有一个错误，就是过度的在乎沉默成本。\n\n比如一个行业已经非常明显的不行了，但他觉得，哎，我在这个行业干了这么多年了，放弃太可惜了。再比如一个项目不行了，他就会想，我已经付出了这么多了，我现在放弃太可惜了。\n\n但是真的，我告诉你啊，甭管你愿不愿意接受，你也得明白，沉默成本不是成本，一件事情如果已经确定它烂掉了，那就必须立刻切断。聪明人不会因为打翻了牛奶哭泣。过去的事情，你只要思考到经验教训，就必须立刻放下，你的时间精力必须用来盯死下一把牌。\n\n第4拜在于不思考，这一点我告诉你，你一定要认真的，认真听完并且理解我，真的非常重要，你一定要把思考和内耗区分开。\n\n很多人把思考和内耗混为一谈了，他把内耗当做思考。\n\n想要区分它非常简单，思考是没有情绪的。\n\n内耗处理起来全都是情绪、假设、面子、懊悔。思考是想我要怎么办，内耗是想凭什么、为什么，这个有本质区别。我告诉你，千万不要把内耗当成思考，每日三省吾身一定是一个非常非常非常重要的习惯。所有被淘汰的人，都一定是丧失了思考能力的人，要么在顺境中丧失了思考能力，因为膨胀了，要么在逆境中丧失了思考能力，因为受打击了。但总之，丧失了思考能力，就意味着你这辈子都好不起来了。\n\n每日三省吾身，真的太重要了。", "account_name": "洪洞师兄(目清)", "account_owner": "洪洞师兄(目清)", "account_type": "竞品"}, {"id": "7591977615633276379", "title": "#随拍", "date": "2026-01-06", "likes": 48292.0, "comments": 1005.0, "shares": 46983.0, "collects": 29758.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "你嘴有多松，你命就有多苦。你话多，说明你蠢，说明你不值钱。你话很多，说明你很蠢，说明你很不值钱。人成欲言败于嘴。永远记住啊，说话只有三个目的让人高兴，让人办事，让自己赚钱。所以，控制一下你那些没价值的分享欲，这个叫手气开口神，气散舌动是非生。别人不问，你就别说，别人问了，你就说一半。别人问到近况，统一回复，一般还行，差不多还凑合。", "account_name": "你的好朋友目清", "account_owner": "你的好朋友目清", "account_type": "竞品"}, {"id": "7496360364834344251", "title": "#易学智慧 #道家文化", "date": "2025-04-23", "likes": 48213.0, "comments": 4909.0, "shares": 39613.0, "collects": 9281.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "", "account_name": "洪洞师兄(目清)", "account_owner": "洪洞师兄(目清)", "account_type": "竞品"}, {"id": "7545019883450355003", "title": "别放过身边的这几种人#随 早已。任何事物一旦发展到强盛的顶点，就会走向衰老。如果你一直维持原样，一直不失控，一直风平浪静，那其实也就说明了你还在旧的版本里，还没有到翻篇儿的时候。\n\n但是你会发现，有一些人，哪怕是墙倒了，他还是会捂住自己的眼睛，装作看不到。\n\n选择安逸，其实我告诉你也没什么错，拒绝翻拍也是一种选择嘛，对吧？平庸就平庸，也没什么不好，但是如果想好起来，想要站起来，那就必须直面，必须重建。\n\n必须面对坍塌。所以你就会发现。\n\n真正要开始走大运的人，他们一定都经历过一次面对真相后的彻底崩溃。这不是他们懦弱，我告诉你，这其实是勇敢的表现，因为证明他们直面真相。很多人面对强倒的真相，他闭上眼睛，装聋作哑。\n\n就这么稀里糊涂过一过一辈子，所以只要这个人敢面对，崩溃太正常了。第三，痛到极致。当你选择面对真相以后，你的大脑是难以接受的，所以身体给出的反馈就是无限的痛苦。这并不是你的问题，这是人的本能。\n\n看似很脆弱，其实并不是。老子在道德经的第76章是这么说的，人之生也柔弱，其死也坚强，万物，万物草木之生也，也柔脆，其死也枯槁。人活着的时候身体是柔软的，死了之后就会变得僵硬。万物草木活着的时候是柔脆的，但是死了以后就会变得枯槁。\n\n所以，坚强的东西属于死亡的一类，柔弱的东西属于生长的一类。你现在的脆弱、崩溃撑不住，其实恰恰就说明你还在生长的状态。真正死掉的人，真正心死的人是不会痛，真正麻木的人是不会失控的。你之所以感到痛苦，因为你还在生长。\n\n你不用自暴自弃，我告诉你，你之所以失控，因为你旧的躯壳已经装不下新的你了。你的痛苦是成长的代价，你的失控是灵魂的蜕皮。你只有经历一次彻底的崩溃，你才知道自己有多强悍。\n\n所以，觉醒都是从瓦解开始的，你必须有一天痛到极致，看见谁都是虚伪，谁都是利用，或者说，看清了谁是虚伪，谁是利用，看清了什么是执念，什么是无用功。你必须在夜深人静的时候彻底撕开自己，才能从伤口里长出新的枝芽。\n\n你可以把自己想象成要破壳的小鸡，头顶很沉，但实际上已经到了突破的边缘。\n\n这个太正常了，我告诉你，置之死地而后生，第4步就是重新开始。当你经历了极致的痛苦以后，你会开始变化。你不想再讨好谁了，也不想再追着解释了，不渴望认可了，也不再思索过去，不再被垃圾关系和错误的认知束缚你。\n\n老子在道德经的第19章第19章里说，决胜志气弃智，民利百倍。绝人弃义，民富翘词，决巧弃利，盗贼无勇。这句话看似很遥远，实际上非常切合你现在的状态。你必须抛弃那些虚假的人设，抛弃那颗渴望被认可的心，你才能回到最真实的自己。这个就是绝学无忧。\n\n你把世俗的眼光，世俗的评判标准全部放下，你才能真正的无忧。放下之后，你就会发现，生活真的突然变安静了，原来困扰你的事情突然变得不重要了，真的不重要了，原来想要的也不再想要了。你不会再期望任何人来帮你一把，你也不会再期望任何人来认可你，这个时候，转运就开始了。\n\n第5步，好运袭来。这个时候，真正的好运，真正的贵人，真正的机会，才会以你意想不到的方式，接二连三的靠近你。\n\n不是你的运气来了我告诉你，而是你终于配得上他了。\n\n你能看清自己，看清真相了，我告诉你，该给你的，老天一定会在合适的时机给到你，这个是天道的运行规律，如果没给你，那很有可能是时机没到，或者你不配。就这么简单。老子在道德经的第23章里说，同于道者，道亦乐得之，同于德者，得亦乐得之。\n\n同于失者，失以乐得之。你和什么样的人同频，你就会吸引什么。你混，你混乱的时候，吸引的也是混乱，你清醒的时候，吸引的也是清醒，你强大了，吸引的必然是强大的人和事儿。所以，贵人、机遇、好运从来都不是凭空出现的，他们是你蜕变之后自然吸引来的同频共振。\n\n老子在道德经的第33章里说，知人者智，自知者明，胜人者有力，自胜者强。你能看清别人，就只是聪明，你能看清自己，才是真正的明朗。\n\n你能战胜别人只是有利，你能战胜自己才是真正的强大。\n\n而战胜自己这件事儿，只有在彻底失控之后才有可能，因为只有当你被逼到墙角，你才会发现自己身上那些根深蒂固的执念，那些习惯，那些恐惧到底有多顽固，也只有你自己才能亲手把这些东西一个一个的摘除掉，你才会明白什么叫真正的自胜者强，自知者明。\n\n你在没有改变的时候，你吸引来的全是和你同频的人，或者说都是不太清醒的人，家庭改变之后呢，你吸引来的自然就是贵人，自然就是好事儿，就这么简单，第6步转上去之后。\n\n转运之后你会什么样的？我告诉你，你会安静下来，不是没话说，是不想再说废话，不是没有情绪，是不想再被情绪裹挟，不是没社交，是懒得应付无效的关系。你会发现自己不再讨好谁，不再解释自己，不再追着别人问，哎，你，你觉得我怎么样？哎，你为什么这么对我？别人的看法这个时候对你来说就只是一个信息，不 解到底什么是转运，该怎么转运。\n\n那他怎么可能会变变好，怎么可能会转运？在人们的固有认知里，认为转运就像是中彩票，或者一夜暴富，或者迎娶白富美，或者霸道总裁爱上我，这个其实不叫转运，这个叫做梦。\n\n真正的转运，在玄学中叫换骨，它是一种过程极其痛苦，极其孤独，把你拖入深渊，让你死一次的过程。\n\n这条视频我建议所有正处人生谷底，四处碰壁想要变好的朋友，耐着性子把它给看完。真的，虽然有点长，但是我会告诉你什么是霉运，我会告诉你为什么你脱离不了霉运，我会告诉你该怎么转运。首先要转运，我们就得先了解什么是霉运。\n\n很多人会觉得倒霉就是老天在惩罚自己，其实不对，霉运其实可以比喻成是老天给你的一张黄牌警告，他是在告诉你，你现在的圈子，你的认知，你的生活习惯，甚至是你的朋友、伴侣都已经过期了。\n\n他们在消耗你，他们在把你往深渊里拖，这个不是鸡汤，我告诉你，老天让你破财，让你失恋，让你生病，真的不一定是在害你。我们这行有一句话叫。\n\n天欲祸，人必先以为福教之，天欲福，人必先以微祸敬之。这个就更像是给你一次重新开始的机会。如果你只在这个过程中感到了痛苦，当然你可能会依托没事儿幻想一下发财来缓解痛苦，但是你从来不想着改变，那你的低谷就只能是低谷，你的低谷就永远是低谷。但是如果你借此打破这一切，那低谷就是重新开局。\n\n因为人只有在低谷的时候，只有在走霉运的时候，才可以真正的洒脱的重新开始，所以想好你就不要抵触霉运，感谢崩盘。\n\n只有这个场子清干净了，新的贵人，新的大运才能走进来。\n\n那么这个时候问题就来了，很多人会说，哎，师兄，我已经啥都没了，我已经清场了，但是为什么我还没好起来？很简单，因为你犯了一个致命的错误，你在用旧的自己过新的日子。\n\n这里我们还要引入一个概念，叫业力惯性。\n\n就是你虽然换了新的工作，换了城市，但是你的脑子没换，你还是以前的你，你还是像以前抱怨，像以前一样遇事就慌，像以前一样没计划的混日子。我告诉你，只要你的反应模式不变，你的命运走向就不可能发生变化。\n\n所以，转运的本质就是在深渊中彻底脱离曾经那个自己。\n\n具体操作方法呢，分为三步，第一步叫闭关所能，当你感觉状态运势极差的时候，千万别瞎折腾，别盲目投资，别到处诉苦。\n\n立刻停止一切对外的能量输出，像冬天的蛇一样去冬眠，去回家躺着休息，去打扫卫生，去锻炼身体，去早睡早起。\n\n别觉得我说的很扯啊，这一步我告诉你非常重要，这个是在修补你那个已经漏成筛子的元神。切记一句话啊，就是人有冲天之志，非运不可私通，运没来之前，苟住就是赢。第二个阶段叫真空耐受气，这个是最难熬的一幕，就我在这些年的从业生涯中，我发现有非常多的客户都败在了这一步。\n\n因为你在变好之前，你会发现有很长一段时间，你收不到任何的正向反馈，你的钱没变多，你的事儿没变顺。\n\n很多人这个时候他就选择放弃了，他会回到老的生活模式。但其实我告诉你，黎明前的黑暗也是乾坤交替的节点，如果你坚持不住，你就又会回到你曾经那个倒霉的循环里。\n\n但是你可能稍微坚持一下就熬过去了。\n\n第三步，也是最后一步，叫磁场重组，熬过真空期。\n\n这个时候你就会发现，你开始脱胎换骨了，你开始对曾经那些让你愤怒的人和事儿感觉无所谓了，曾经的焦虑也感觉风轻云淡了。换了生活习惯，换了圈子，换了磁场，这个时候我告诉你，你不用去求，你也不用去找钱，人事儿都会自动的涌向你。\n\n自助者，天助之。你不放弃自己，熬过这些，天道就自然会奖励你。\n\n所以其实转运这件事儿，它就像是一场排异反应，它是一场无声的硝烟，霉运就是给你扒层皮，走出来就是光明，走不出来就是浑浑噩噩的度过余生。\n\n就这么一个阶段，就能把人和人的差距拉得很长。熬过来的人，他的一生一马平川，熬不过来的人，我告诉你，永远是浑浑噩噩。", "account_name": "博闻文化（目清师兄）", "account_owner": "博闻文化（目清师兄）", "account_type": "竞品"}, {"id": "7520643621592763706", "title": "#随拍", "date": "2025-06-27", "likes": 26950.0, "comments": 1501.0, "shares": 13690.0, "collects": 9922.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "个人如果心脉受损，一看就知道心脉受损一般有三个特征，第一个特征就是眼少，本来是一个话特别多的人，但是他心脉受损，心里失去之后，他的言语就会变得越来越少，话到嘴边都说不出来。第三就是行少，一件事情当他马上要做的时候， ": "逸恒师兄", "account_owner": "昭熹", "account_type": "本号"}, {"id": "7622994492119462906", "title": "#国学文化 #道系青年 #智慧人生 #干货分享", "date": "2026-03-30", "likes": 24610.0, "comments": 2528.0, "shares": 1896.0, "collects": 1027.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "当你的家开始走上坡路的时候，就会看到这条视频，既然看到了，就一定会阖家安康。家是用来氧气的，不是用来泄气的。家旺不旺，全看气顺不顺。一家人好好吃饭，遇事互相撑腰，这就是在氧气。为小事吵架，把坏脾气撒给家里人，这就是在泄气。心顺了，家就顺了。", "account_name": "逸恒师兄", "account_owner": "昭熹", "account_type": "本号"}, {"id": "7630080394487057083", "title": "#传统文化", "date": "2026-04-18", "likes": 24334.0, "comments": 456.0, "shares": 15315.0, "collects": 17302.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "考试当天的禁忌，家长一定要记住，第一，考试当天不要拍孩子的肩膀和后背，第二呢，就是饭不要让孩子吃的太饱，七八成就可以了。第三，不管陪不陪孩子，考试家里有没有人，不要把东南方的卧室把灯亮着，第4，不管遇到什么烂人烂事，当天不要吵架，不要动，考试那几天不要往外借东西，周之前都不要写。最后，有条件的最好买一个文昌塔，放在孩子的书桌左上角。祝考生们旗开得胜，考试顺利。", "account_name": "逸恒自在", "account_owner": "泓泓", "account_type": "本号"}, {"id": "7619646458676907318", "title": "人生四大败局！ #目清师兄 #道家文化 #认知 #提升自己", "date": "2026-03-21", "likes": 24248.0, "comments": 1766.0, "shares": 2279.0, "collects": 5651.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "把这条视频看完，你的运气将会不可逆转的变好，\n\n别觉得我在胡扯，作为一个干了十几年的挂师，我这些年看过无数客户从高处落下来，\n\n也见过无数在泥潭里来回打滚站不起来的客户。\n\n后来我就总结，然后我就发现人生有四大败局，\n\n躲过去诸事皆顺，躲不过去处处是坑。\n\n第一败败于多言，也就是话多。很多人稍微有点成绩，\n\n或者稍微有点委屈，他就管不住自己的嘴，到处高谈阔论，\n\n或者是诉苦抱怨，他们以为是在寻找共鸣，但其实呢，\n\n你有点成绩的时候，炫耀是在拉仇恨，你诉苦是在给别人找乐子。\n\n这个世界沟通的底层逻辑不是为了交心，\n\n而是博弈。你不需要寻找认可，\n\n因为别人是否认可你，真的没什么意义。永远记住，言多必失，\n\n不要让任何人了解你，因为这个世界上和你不熟的人是坑不了你的。\n\n第二拜败于傲慢。曾国藩有句话是这么说的古今天下之才人，\n\n皆以一傲字之败。\n\n庸人死于懒，聪明人死于傲。就真的我非常多的客户在稍微有了点小成绩以后，\n\n就开始眼高于顶，就开始觉得老子天下无敌。\n\n但实际上呢，你的成就是时代的红利加上大运的推波助澜，\n\n再加上一点点你的认知努力，相互作用下产生的结果。\n\n很多人都会说，我赚到钱以后，我没有表现的很骄傲，\n\n但是我告诉你，心里的骄傲会更加害了你，\n\n一旦你骄傲了，你就不会有那么强的执行力了，你开始懈怠了，\n\n但是你别忘了，这个社会发展到现在，竞争力已经。无限大了，\n\n你稍微懈怠一点点，迎接你的就很有可能是一地鸡毛。\n\n经历过的人应该真的懂我在说什么。\n\n第三败败于执念这里的执念包括但不限于执着某个人事物。\n\n因为现在的人们已经活得相对很清醒了，\n\n大家确实对于人事物都没那么执着了。但是很多人都有一个错误，\n\n就是过度的在乎沉没成本。\n\n比如一个行业已经明显不行了，但他觉得他在这个行业里干了这么多年，放弃太可惜了。\n\n再比如一个项目不行了，他就会想唉，\n\n我已经付出了这么多了，现在放弃太可惜了。\n\n但是真的，你记住啊，沉没成本不是成本。\n\n一件事情如果确定已经烂掉了，那就必须立刻切断。\n\n聪明人不会为了打翻的牛奶哭泣。\n\n过去的事情，思考到经验教训，就必须放下。\n\n你的时间精力必须用来盯住下一把牌。\n\n第四本败于不思考这点一定一定要认真听完，\n\n认真理解。这个是你，是决定你人生的一个习惯，就是你一定要把思考和内耗区分开。\n\n很多人都把内耗当成了思考。\n\n区分的很简单，思考是没有情绪的，内耗处理的全都是情绪。\n\n假设、面子、懊悔，思考是想怎么办，\n\n内耗是想凭什么，是想为什么。\n\n明白了思考和内耗的区别以后，你必须要养成每日三省五省的习惯。\n\n这个真的是非常非常非常重要的一个习惯，所有被淘汰的人，一定是丧失了思考能力的人。\n\n每日三省五省我今天做了什么？我明天要做什么？\n\n今天哪些该做，哪些不该做？明天要避免什么？我今天遇到了谁？\n\n他有什么是值得我学习的？我今天又遇到了谁？他有哪些坏毛病我不能染上？\n\n这个真的太重要了，不要放弃你对这个世界的观察和思考，真的！", "account_name": "博闻文化（目清师兄）", "account_owner": "博闻文化（目清师兄）", "account_type": "竞品"}, {"id": "7614065493096100325", "title": "人生小满胜万全#道家文化", "date": "2026-03-09", "likes": 23591.0, "comments": 719.0, "shares": 7265.0, "collects": 8289.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "姻缘错配者，反得佳儿贤女，夫妻和顺者，偏体弱多样，身体强健如松，常叹囊中羞涩，金玉满堂享富贵，却常忧子嗣庸常。少年得志，名扬四方，或至半百便富黄泉，半生蹉跎，默默无闻，老来竟终能成大。谢慧极，必伤情深不受。事不可使尽，福不可享尽，便宜不可占尽，聪明不可用尽。因为天道既满，人道既全。别贪心，你不可能什么都有，也别灰心，你不可能什么都没有。", "account_name": "洪洞师兄(目清)", "account_owner": "洪洞师兄(目清)", "account_type": "竞品"}, {"id": "7612331710231200763", "title": "人生小满胜万全", "date": "2026-03-02", "likes": 23540.0, "comments": 927.0, "shares": 9734.0, "collects": 6978.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "", "account_name": "博闻文化（目清师兄）", "account_owner": "博闻文化（目清师兄）", "account_type": "竞品"}, {"id": "7619318548615138602", "title": "人生其实是可以作弊的！！ #目清师兄 #道家文化 #认知 #提升自己", "date": "2026-03-20", "likes": 23066.0, "comments": 841.0, "shares": 5405.0, "collects": 12197.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "有一件事，是百分之九十九的人临死前才能想明白的，就是人生其实是可以作弊的，虽然不存在逆天改命，但想要更顺利一些，一定是不难的。而两千多年前，荀子中早就把这个底层的作弊代码给大家写清楚了，就十个字君子生非义也，假善于物也。意思就是，牛人并不是天生比你强，他们只是极其擅长借助外力。所以，今天我就把这套高手都在用的作弊机制，给你完整的拆解清楚，耐心看完这三个作弊技巧，往后余生想不顺都难！第一，情绪外包，借无情避开内耗我曾经也是一个情绪化很严重的人，冲动易怒，急躁焦虑。后来我就发现，我只要不跳出这些情绪，我就没办法做事，因为这些情绪就把我的精力全部给消耗了。别人说句话，我能，我能纠结一两天，事没做好，我能内耗一个星期。后来我师傅就教我说，你要把自己的人生当做一家公司、一个生意来运营，把所有消耗精力的贪嗔痴怨全部都当做是负面资产，遇到烂人绝不纠缠，遇到破事绝不懊悔，立刻停止，立刻复盘。这个做法的核心其实就是情绪玻璃，明确的告诉自己，这些负面情绪对自己的人生没有任何正向的好处，把精力都用来解决事或者享受生活，每当有情绪的时候，都要告诉自己，停止你的情绪。第二，利益置换借人性的弱点去做杠杆。很多人以为的努力就是自己一个人干翻全世界，这个太蠢了。这个世界运行的底层逻辑是价值交换，你想要干成，一件事，不不应该去想我该怎么学，你该想的是谁会我怎么让他来帮我？别人贪财，你就把钱分给他，别人贪名声，你就奉承他。总之就是，你要学会借力，要学会借人，因为你只靠自己，明显你是有限的。就好像是你爱吃包子，你就直接去买最好吃的包子就行了，你不能因为你爱吃包子，你就去学怎么做包子，让专业的人做专业的事，而你只需要思考怎么让专业的人为你做事就行。第三，顺势而为，借天道周期坐电梯。很多人天天喊着逆天改命，哼，这太傻了，天道的规律是你我能改变的吗？你为什么非要和他逆着干？你顺着他，你踩着周期做事，效率不是更高吗？运势低谷的时候，让自己静下来，捂紧钱包，沉淀沉淀，发现风口了，运势好了，立刻执行力拉满，疯狂做事。这个明显是性价比最高的做法，但是很多人他不，他非要在不顺的时候越挫越勇，把所有的精力都用在逆境，等好运来了，风口来了，他折腾不动了，因为他的心气用完了。所以，我告诉你，顺势而为，真的挺重要的，借势，借智，借力，就这三界，如果你能耐心看到现在，起码你的心境已经超过百分之九十九的人了。因为这种干货视频，真的很少有人能把它看完。最后，祝你越来越好，平步青云！", "account_name": "洪洞师兄(目清)", "account_owner": "洪洞师兄(目清)", "account_type": "竞品"}, {"id": "7631162818716776379", "title": "#传统文化", "date": "2026-04-21", "likes": 23051.0, "comments": 5770.0, "shares": 2256.0, "collects": 7821.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "", "account_name": "逸恒自在", "account_owner": "泓泓", "account_type": "本号"}, {"id": "7625485268732309369", "title": "#传统文化", "date": "2026-04-06", "likes": 22896.0, "comments": 632.0, "shares": 8103.0, "collects": 18904.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "喜欢在手机壳背后放钱的，听好了，找尾号为一三三、一八六六八四九九四二七七二的编号。\n\n你把它叠成一个小三角，放到手机壳后面，\n\n别问为什么，照做吧！", "account_name": "逸恒自在", "account_owner": "泓泓", "account_type": "本号"}, {"id": "7611046259957553830", "title": "#国学文化 #道系青年 #智慧人生 #干货分享", "date": "2026-02-26", "likes": 22617.0, "comments": 1245.0, "shares": 2763.0, "collects": 2407.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "不管你信不信，你身上发生的一切都是命中注定的。谁来爱你，\n\n谁来伤你，谁来陪你走了一程又转身离开，不是你没有把握好，\n\n而是你本来就不应该拥有这段关系。你不用自责自己哪一句话说错了，\n\n哪一句话搞砸了，你以为是你没有处理好，其实是命运在收场。\n\n本子里属于你的，兜兜转转也跑不掉，不属于你的，\n\n再用力也守。所以别急，等时机一到，自然就会登场。\n\n现在你只管顺势而为，你会发现每一步都安排的刚刚好。", "account_name": "逸恒师兄", "account_owner": "昭熹", "account_type": "本号"}, {"id": "7606630734837640010", "title": "劲往一处使#国学文化 #道系青年 #智慧人生 #干货分享", "date": "2026-02-17", "likes": 22600.0, "comments": 1069.0, "shares": 47708.0, "collects": 4071.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "两口子之间，只要是媳妇不喜欢的人，最好啊，就不要来往了，因为这个人要么会让你破财，\n\n要么会搅和你的家庭。其实有时候女人的第六感真的比男人准很，\n\n但是男人的方向感会更强，就是他们可以轻易的判断出哪条路可以让家过得更好。\n\n要是一个家里面有男人的方向感，\n\n再配上女人的第六感，一个掌握方向，一个辨人心，两个人劲往一处使，\n\n这个家想不发都难。", "account_name": "逸恒", "account_owner": "昭熹", "account_type": "本号"}, {"id": "7621573344537693446", "title": "去做这三件事，拉开你和其他人的差距 #目清师兄 #道家文化 #认知提升 #人生", "date": "2026-03-27", "likes": 22019.0, "comments": 365.0, "shares": 4344.0, "collects": 11855.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "一个看卦的告诉你一个人，一个正常人，他想要混的不错，或者说想要和其他人拉开差距，他只需要做三件事，你只需要把这三件事搞明白了，你肯定比周围人优秀，你肯定比周围人过得好，你肯定能和周围的人拉开差距。绝对不是什么读万卷书，行万里路之类的啊，这普通人都太难实现了，说了等于没说一样，没什么营养。三点第一，学会看透事物本质。就是你会发现，但凡是在社会上混的好的人，都不是因为他们有多努力，也不是有多自律，更不是朋友多。大多数人认为混的好，靠的是拼时间、拼人脉、拼自律，其实我告诉你，真不是，拼的其实是看透事物本质的能力。真正能在社会上如鱼得水的人，往往不是最忙的那个，而是想的最明白的那个。电影教父里有句话花一秒钟就能看透事物本质的人，和花一辈子都看不透的人，注定是两种人生。那什么是事物本质？其实很简单，底层人想的是道德和情绪，中层人想的是逻辑和原则。逻辑和规则，最高级的呢？想的是利益流向和收割。比如社交的本质是价值交换，婚姻的本质是搭伙过日子，打工的本质是谋生，做生意的本质是赚钱。听起来很简单对不对？但是大部分人怎么做的？他们觉得社交就是要交心，就是要为兄弟两肋插刀他们觉得婚姻就是爱情，你就必须爱我，你就必须忠于我他们觉得打工就是要榨干精力献给老板他们觉得做生意就是要讲人情等等无数种。很荒谬的行为，他怎么锻炼自己这种能力也不难，很简单，就是每当你有情绪了，立刻停止，不要想什么他怎么这么坏，你你怎么这么委屈这些，直接在脑子里倒推三个问题，这件事如果成了，谁是最大的受益者？这件事的运转成本，比如时间，精力，情绪这些是谁在买单，谁掌握着随时叫停的权利。凡事从利益角度出发，抛开情绪道德去分析事物的发展，不断的锻炼自己这种能力，慢慢的会形成你的本能。第二，长记性，会总结。这个真的是我建议所有人都必须养成的一个习惯，你不能活一天算一天呢。哥们，不积跬步无以至千里，没有人是突然成长起来的，我告诉你，就我这些年见过的大佬太多了，因为行业的缘故嘛，对吧，每一个人他都一定是在点点滴滴去积累，去提升的。所以我告诉你，一定要养成一个非常简单的习惯，每天一总结，每周一复盘，你每天看到的，听到的，学习到的都要总结一遍。你每遇到一个优秀的人，你不能只是觉得他优秀就完了，你要去分析他为什么优秀，他的优点是什么，他有什么好习惯是值得我学习的。同理，你遇到一个世俗意义上混的相对失败的人，你也不能仅仅是觉得这个人很失败，很low，你要去想，他为什么失败，他是踩了什么坑导致他失败的，他是有哪些坏毛病导致他失败呢？包括你经历一次失败，也不能仅仅是经历，你要分析啊，你为什么会失败，是哪个环节错了，你成了也一。样你也要想，你是为什么成功了，下次同样的事情能不能做的更好。这个就是每日三省五善，意思就是你要在日常生活中不断的坚持不懈的去强化自己的认知。道理很简单，你分析的优秀的人多了，你的行为就会自然偏向优秀的人，因为人的本性去利弊害了你。分析失败的人多了，你遇到同样的坑的时候，你的潜意识就会提醒你不要这样去做，因为谁谁谁已经踩了这个坑了。第三，尽自己所能的，拼尽全力的保护自己的注意力。说白了就是保护自己的时间。我告诉你啊，人的一生最宝贵的财富绝对不是钱，是你的时间和你的注意力。你这一生有没有想过，满打满算就三万多天，每天都在倒计时，一切都是用气血在交换。你做任何事情之前，你都要想一下，我用我的气血去交换，到底值不值？我用我宝贵的时间去交换，到底值不值？比如无效社交，比如手机里的奶头乐，这些东西都在无形中消耗了你大量的时间。人的一生真的一晃就过去了，真的很快，转瞬即逝，白驹过隙。如果你能把视频看到这，我相信你一定是一个对美好生活有向往的人。那就听劝，把这三件事落实到你的生活中，你一定一定一定会越来越好。", "account_name": "洪洞师兄(目清)", "account_owner": "洪洞师兄(目清)", "account_type": "竞品"}, {"id": "7616290694383191547", "title": "#国学文化 #道系青年 #智慧人生 #干货分享", "date": "2026-03-12", "likes": 22000.0, "comments": 3638.0, "shares": 367.0, "collects": 1023.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "你能刷到，说明时机到了。你的孩子在二六年会遇到两位贵人，\n\n一位是顺行贵人，与福禄吉祥中伴他同行一位是逆行贵人，\n\n在灾难苦厄之间护他周全，福生无量。", "account_name": "逸恒", "account_owner": "昭熹", "account_type": "本号"}, {"id": "7619540183477783844", "title": "凡为辛苦，皆为强求！ #目清师兄 #道家文化 #人生 #认知", "date": "2026-03-21", "likes": 21859.0, "comments": 1049.0, "shares": 3835.0, "collects": 7845.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "记住这八个字，你的运势将会不可逆转的变好！就八个字凡为辛苦，皆为强求。翻译成白话就是对的事情不复杂，复杂的事情不对。就我给人看卦这些年，我就发现，但凡是过不好的人，全部都是因为他们根本就不理解这八个字，甚至很多人到死终其一生都理解不了。确实他和大家以往认知中的努力才能成功，坚持就是胜利有点背道而驰。但是有没有想过为什么？我告诉你是为什么，因为这些话从古至今都是上位者们拿来给底层人民洗脑的，为的就是让大家在复杂的事情上努力，然后快速的把心气消耗在这上面，这样就不会对他们的地位造成威胁，这和古代帝王的三十三两白银基本上是一个意思。所以这条视频真的挺危险的，我不知道能不能发出去，我也不知道发出去能不能过审，既然刷到了，就耐着性子把它给看完，我保证你未来的十年、二十年，甚至终身都会受益。在天道的运转规则里，真正赚大钱、受益巨大的事情，往往都是顺水推舟，借力打力的，不然道家就不会讲究顺势而为。就是说，你走的路如果是正确的，资源、人脉、金钱都会自动向你靠拢。但如果你做一件事情，每天都消耗巨大的气血，处处是阻力，不是这不对，就是那不对，不是这种意外就是那种意外，那我告诉你，就是事不对。赚钱和感情都是这样，如一个项目，你投了钱，熬了夜，天天陪笑脸，已经是入不敷出了，那其实你就没有必要继续硬扛。了，你过度的在乎，沉没成本就只会把你给拖死。除了鸡汤故事，电影电视剧里面，我真没见过哪个成功的人是靠打碎了牙坚持然后拿到结果的。因为赚钱这件事情，他不像是健身训练，你只要努力，你只要坚持，你就能看到变化。这种事情，错了就是错了，及时止损才算是聪明人。否则最后到你坚持不住了，把你拖垮了，你也一样得面对现实。经历过的人一定明白我这条视频到底在讲什么。同样感情也是一样的，如果你和一个人一直在一起，天天要猜忌，要内耗，要难受，那就不用犹豫了，这个人就是错的。就算是你现在舍不得分开，等把你折磨够了，你也一样要被迫离开。这个就是凡为辛苦，皆为强求。就咱普通人，我告诉你，最难过的一关就是那颗自我感动的心理觉得哎，我越残，我越累，我付出的代价越大，我最后得到的就越多。这太扯淡了，社会和天道都不会在乎你有多辛苦。人生这场游戏的顶级玩家，他们只会做高胜率低阻力的决策。遇到推不动的墙，正确的做法不是拿你的头去撞你，绕开它呀，是不是更省劲？", "account_name": "洪洞师兄(目清)", "account_owner": "洪洞师兄(目清)", "account_type": "竞品"}, {"id": "7345812079237975305", "title": "“人生其实不需要努力！”#情感共鸣", "date": "2024-03-13", "likes": 21370.0, "comments": 857.0, "shares": 20657.0, "collects": 5221.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "", "account_name": "洪洞师兄(目清)", "account_owner": "洪洞师兄(目清)", "account_type": "竞品"}, {"id": "7584646089007107365", "title": "#随拍#道家文化", "date": "2025-12-17", "likes": 21352.0, "comments": 658.0, "shares": 7815.0, "collects": 5511.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "说个秘密啊，现在这个时候，你想要过得好，其实你只需要干一件事儿，就是躲起来，躲亲戚，躲熟人，躲小人，躲之前的圈子，躲你那些个狐朋狗友们，躲远一点儿。就我给人看事儿，这些年，我是真的发现，人的一生，所有的痛苦，所有的损失，所有的坎坷不顺，十有八九其实都是来源于那么几头烂蒜。", "account_name": "洪洞师兄(目清)", "account_owner": "洪洞师兄(目清)", "account_type": "竞品"}, {"id": "7597695076332656613", "title": "与其反复拉扯，不如轻轻放手#国学文化 #道系青年 #智慧人生 #干货分享", "date": "2026-01-21", "likes": 21201.0, "comments": 902.0, "shares": 3715.0, "collects": 3747.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "情债一旦还清，此生不再相见。人这辈子你最爱的这个人，也是上辈子最疼你了。道家讲前世不欠，今生不欠，所有的相遇，不是讨债，便是还愿。若有一天悄然走散，不过是债已还清，缘已圆满。在还债的过程中，心态其实很重要，能心安便是福分，放不下反而容易把自己困住。缘分其实就像云一样，聚散无常，谁也说不准下一秒会发生什么。能陪你走这一程，已经是难得的恩赐。分开也只是各自要走不同的路罢了。本子里要是没有这个人，怎么留都留不住。缘分一旦消耗殆尽，关系自然就走到了尽头。与其反复拉扯，不如轻轻放手，往后山高路远，各自安好。", "account_name": "逸恒", "account_owner": "昭熹", "account_type": "本号"}, {"id": "7602152524200829414", "title": "断舍离！", "date": "2026-02-02", "likes": 21094.0, "comments": 387.0, "shares": 6938.0, "collects": 9671.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "记住我说的这句话，无能为力之事当断，粪浅缘博之人，当舍，乱心扰义之念当离。这就是所谓的断舍离。初看是失去，再看那就是获得。断的是负累，得的是轻松，断的是执念，得的是自由，断的是内耗，得的是重生。断舍离是自负之人的自己，也是自困之人的自救。看事儿这些年我真的发现，从玄学的角度来说，真的不是拥有的越多越好，因为你拥有的一切东西都会在精神上消耗你，束缚你，让你变得愈发的不自由。所以真正的财富，真正的幸福，从来都不是拥有多少，而是能够放下多少。懂我意思吗？祝你开心，浮生无量。", "account_name": "你的好朋友目清", "account_owner": "你的好朋友目清", "account_type": "竞品"}, {"id": "7602551766953105006", "title": "今年比较特殊#国学文化 #道系青年 #智慧人生 #干货分享", "date": "2026-02-03", "likes": 21004.0, "comments": 1287.0, "shares": 2342.0, "collects": 1724.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "今年啊，非常特殊，立春比春节要早过了，立春之后呢，就正式进入丙午年。大家都知道今年是一个很重要的关键节点，很多走散的人会和好，很多不该继续的缘分会断掉，如果是正缘，会有很大的概率出现一个契机，重新联系上不能陪你走到最后的人，往往啊，都会分开，更好的人和事也在前方等着你。", "account_name": "逸恒师兄", "account_owner": "昭熹", "account_type": "本号"}, {"id": "7493025130654747963", "title": "想要命好，学会变冷漠！", "date": "2025-04-14", "likes": 20771.0, "comments": 359.0, "shares": 8678.0, "collects": 7388.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "", "account_name": "洪洞师兄(目清)", "account_owner": "洪洞师兄(目清)", "account_type": "竞品"}, {"id": "7619545367843065124", "title": "不要和任何人走的太近！ #目清师兄 #道家文化 #认知 #感悟", "date": "2026-03-21", "likes": 20421.0, "comments": 547.0, "shares": 7383.0, "collects": 7842.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "我再强调一遍啊，千万不要让任何人知道你太多，更不要和任何人走得太近。\n\n一旦别人过度了解你，就是你人生祸患的开始。\n\n这个世界，你除了赚钱以外，根本就不需要太多的人情往来。\n\n这个真不是教你变冷淡，是我作为一个干了十几年的挂师，\n\n亲眼看着无数客户，付出了无数巨大代价，\n\n才领悟出来的真相。以下这七个人生告诫，尤其是普通家庭出身的孩子，\n\n一定要认真把它看完。这些都是学校不教、父母不懂的生存规则，\n\n看懂了，一定会让你在以后的人生，\n\n少吃非常多的亏，少走非常多的弯路。\n\n第一，不要辩驳。这个世界上百分之九十九的人，\n\n和你的命运都没有任何关联。你不需要用你的时间、心力和情绪，\n\n去介入别人的人生。\n\n人一生最重要的能力不是交际，而是精简。\n\n剪掉无效社交，剪掉无意义的交流，剪掉不必要的情绪起伏。\n\n心力是用来关照自己的，不是用来滋养别人的。\n\n第二，永远不要让任何人在你这里无偿获得任何东西。\n\n这个是非常重要的一个生存法则。\n\n无偿，就是一切麻烦的开始。不要随意回应别人，\n\n不要随意援助，不要随意给予。这个世界上，大部分人靠近你，\n\n不是因为赏识你，而是想从你这里拿点什么走。比如情绪、资源、信息、好处、安慰、利用价值等等\n\n无数东西，一旦你开始免费付出，\n\n你就必然会吸引来一堆贪婪的吸血鬼，就像蚊子，就像苍蝇一样，\n\n直到把你吃干抹净。所以，永远记住啊，法不清，传道不贱，\n\n卖食不叩。门衣不顺路，不要让自己看起来廉价。\n\n第三，越熟的人越要少讲话。这点很多人都做反了，\n\n他们对陌生人都加倍小心，对熟人呢，都毫无戒备。\n\n但是你必须得明白，真正能伤害你的人，\n\n一定不是陌生人，陌生人不会也不敢伤害你，\n\n只有熟人才会对你下手。你过好了，他会嫉妒，你过不好，\n\n他会看不起你。所以，真的，任何时候闭嘴少说非常重要。\n\n第四，你越是对一个人好，\n\n他反而会越厌烦你。很多人想不通这一点，我告诉你是为什么。\n\n当你付出的太多，他还不起的时候，他就会想尽办法把这个心理压力转化掉。\n\n他拿你太多，他也有心理压力，\n\n因为他已经还不起了，他只能想尽办法把你塑造成一个坏人，\n\n一个垃圾，借此来缓解他的心理压力，\n\n这样就不用还了，这是人性，我告诉你。第五，只筛选，\n\n不改变。你可以观察一下那些真正的有钱人，有能力，有地位的人，\n\n他们和人相处，都有一个极其冷静的模式，就是一旦发现这个人不行，\n\n立刻疏远，不说明，不焦虑，不纠缠。\n\n他们从来不会主动去帮扶谁，去教导谁，去挽救谁，去改变谁。\n\n因为他们都非常清楚，改变任何人，都是在浪费自己的生命，\n\n只筛选，不改变。但是那些过不好的那些底层人民，\n\n他们就恰恰相反，\n\n不断交流，不断说明，不断付出，不断牺牲自己，妄图拯救别人。\n\n结果就是精神被吸干，物质被榨干，生活越来越糟糕，\n\n永远挑不出这个死循环。第六，你是不需要刻意的去维持关系的。\n\n缘分这个东西本身。它就是不断流转的，你身边一定会不断的有人来人往，\n\n有好处的时候，\n\n自然就能玩到一起，没好处自然就各奔东西了。关系的长久，靠的不是维持，\n\n是缘分。关系的好坏，靠的也不是经营，而是价值。\n\n有价值，自然有好关系。第七，不要把希望寄托在任何人身上。\n\n别指望别人理解你、善待你、为你考虑、和你同频。\n\n你过好了，只能是因为你自己。因为本质上，这个世界上不会有任何人，\n\n可以长期、持续且免费的给你什么。你把希望寄托在别人身上，\n\n就一定会失望。寄托的越多，失望也就越大。", "account_name": "博闻文化（目清师兄）", "account_owner": "博闻文化（目清师兄）", "account_type": "竞品"}, {"id": "7590250796353146152", "title": "#道家文化 #随拍", "date": "2026-01-01", "likes": 20408.0, "comments": 1083.0, "shares": 36218.0, "collects": 10016.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "", "account_name": "博闻文化（目清师兄）", "account_owner": "博闻文化（目清师兄）", "account_type": "竞品"}, {"id": "7581431649646054693", "title": "#随拍#道家智慧", "date": "2025-12-08", "likes": 20247.0, "comments": 1243.0, "shares": 52246.0, "collects": 4164.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "玄学提醒啊，马上年底了，谨防被占运。首先，头和肩膀不要乱给别人拍，第二，自己的床不要借给别人睡，第三，自己的衣服首饰，尤其是贴身的这种不要给别人穿，第4，不要让别人在你的家里哭，第5，出去逛街或者帮人买东西，不要垫钱，第6，找你帮忙，找你借钱的，能让他想想其他办法就让他想想其他办法。", "account_name": "洪洞师兄(目清)", "account_owner": "洪洞师兄(目清)", "account_type": "竞品"}, {"id": "7603621652606629541", "title": "关于姻缘的天道#提升自己#姻缘#道家文化", "date": "2026-02-06", "likes": 19936.0, "comments": 1803.0, "shares": 3860.0, "collects": 8021.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "", "account_name": "博闻文化（目清师兄）", "account_owner": "博闻文化（目清师兄）", "account_type": "竞品"}, {"id": "7614257507121060857", "title": "人生小满胜万全！#道家文化#认知#提升自己", "date": "2026-03-07", "likes": 19868.0, "comments": 1553.0, "shares": 10049.0, "collects": 6697.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "一个看卦的告诉你啊，一个人，一个正常人绝对不可能同时拥有父运、婚运和子运，也就是说好事儿绝对不可能让一个人全部给占走。\n\n体现在生活中，你就会发现，如果一个人他有个好父亲，那么他大概率不会有一个好伴侣或者好儿子，同样，有好伴侣的大概率没有好父亲，有好孩子的大概率没有好伴侣，这些东西都不是偶然，这个是天道的运行铁律，老子在道德经里就说过，天之道，损有余而补不足。前半生顺利的人，后半生大概率不顺，婚姻错配者反得见而贤女夫妻和顺者偏体弱多样，身体强健如松，常叹囊中羞涩，金玉满堂享富贵，却常忧子嗣庸常少年得志，名扬四方，或至半百变赴黄泉，半生蹉跎，默默无闻，老来竟终能成大器就。总之你会发现上面他不会什么都给你，也不会什么都不给你，所以其实你真的不用贪心，你不可能什么都有，你也不。\n\n不用灰心，你不可能哪一样都不占，这个真的不是鸡汤，我告诉你，站在我们这个行业来说，我们是可以很直观的知道无数人的真实现状的。再说直白点就是我们手里是有一套大数据的，所以就真的会发现家家都有本难念的经。\n\n你不用羡慕任何人，甚至你都不用羡慕有钱人。\n\n我有一个客户。\n\n他父亲当官的，然后老公是经商的，家里生意做的特别大，就是那种跨国生意，一年可能几个亿，十几个亿的利润。\n\n家里的钱真的就花不完，在外人看来，她应该是没烦恼的，包括在她闺蜜看来，她都是没烦恼的。但她的真实现状是什么？他4个孩子，老大夭折了，老二出国以后再也没回来过，老三抑郁症，就是看到父母就直接动手的那种抑郁症。\n\n老四沉迷游戏，每天男扮女装，就真的个个都很无奈，我告诉你没有一点儿办法，这种例子我告诉你真的是数不胜数。\n\n早些年，我师傅给我讲过一个故事，我印象特别深刻。他说，我们每一个人的人生就像是春天柳树上的柳絮，一阵风吹过，命运的盲盒就被彻底打开了。有的人被吹到了小河边肥沃的土地上，有的人呢，被吹到了缺水少土的戈壁滩。肥沃的土地或者戈壁滩就是你的基本盘。\n\n几年之后。\n\n小河边的它因为水分充足，土壤肥沃，长得枝繁叶茂，风光无限。而戈壁滩的你呢？缺水少土，常伴风沙，拼命挣扎，日夜煎熬，结果只长了两三米啊，可能树叶都没几天。\n\n你仰望着他，满眼羡慕，你低头看自己，全都是不甘和自卑，你心里痛恨老天不公平。\n\n但是突然有一天，暴风雨来了，小河边的它因为枝繁叶茂，树大招风，狂风一到，连根拔起戈壁滩的地方，树叶都没长几天，加上你的生，你生活在缺水少土的环境中，你的根已经向下扎了十几米，几十米。\n\n风雨过后，你虽然有点狼狈，但是你的根基未上分毫，你羡慕别人的枝繁叶茂，其实给到你也是害了你，你讨厌自己的不足之处，却让你在风雨当中活了下来，这就是人生。\n\n人生小满胜万全。", "account_name": "洪洞师兄(目清)", "account_owner": "洪洞师兄(目清)", "account_type": "竞品"}, {"id": "7619912830171667107", "title": "#传统文化", "date": "2026-03-22", "likes": 19746.0, "comments": 421.0, "shares": 6545.0, "collects": 6089.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "不要和任何人分享我今天说的内容，今天这个视频就跟大家聊一聊学校不教你，父母也看不透的人性真相。你一定要在年轻的时候知道这些真相，越早越好，因为此刻的你越无知，未来的你就越倒霉。第一，要尽快摆脱学生思维和老实人的思维。我跟你讲，人其实不能太老实，因为普通人怎么做怎么选都是错的，怎么选都会踩坑。所以做人做事儿不要太老实，不然会吃大亏，大胆的选择即可。第二，这个世界没有人会真正爱你，别人爱你都是有条件来爱你，也许是你的美貌，你的价值，所以不用在意别人怎么看，也不要听那些狐朋狗友的建议，谁有结果你就听谁。第三，人这辈子你也就认识几千人，对一个城市来说，完全可以忽略不计，就是你花一辈子认识的所有人，可以在30分钟之内全部拔掉，所以你不用害怕得罪人。想得罪你就得。\n\n对，你的人生是由你自己做主，别人不是你的主。第4，你所有的认知都是偏见，只要说出来的都不完美，即使你开悟，也只是高于人类的偏见的偏见。这个世界唯一的真理，它就是没有真理，对你个人来说，它能够解决问题，那它就是真理。第5，想毁掉一个人的人生，很容易就是随便结婚。很多人在年轻的时候会犯一个错误，就是选择对象的时候没有在乎原生家庭、家教、上进心、经济情况，这个人是否跟你能量匹配，只在乎情绪当下的开心与快乐。然后谈完恋爱结婚。离婚后，你发现你根本不知道他是一个什么样的人。你要明白，选伴侣一定是综合考虑的，除了你跟他在一起是不是舒服，是不是开心，还有，经济上能不能给你带来成长托举你，在事业上能不能给你赋能？婚姻就是柴米油盐，看经济没有错，看原生家庭也没有错，看对方家里有没有人脉，有没有资源，也没。\n\n斗志，把感情当做全部的女人，有一个算一个，都会输的很惨。婚姻是强者玩的游戏，你看周围那些总想着用婚姻拯救自己的人生，结果一定是一地鸡毛。你一定要记住，只有你一个人也可以过得很好的时候，你才配进入婚姻。一个人不好，两个人只会更糟糕，真正好的婚姻是两个人随时有离开对方的能力。", "account_name": "逸恒", "account_owner": "泓泓", "account_type": "本号"}, {"id": "7614477999119982190", "title": "为什么好人没好报", "date": "2026-03-07", "likes": 19592.0, "comments": 1258.0, "shares": 13551.0, "collects": 7210.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "为什么好人没好报？因为宇宙不奖励道德，天道也不奖励道德，道德是人道的东西，是人制定出来的东西，和天道是没什么关系的。道德经讲天地不仁，以万物为刍狗，也就是说上面根本就不关心道德是什么。归根结底，道德它是社会规则，它和宇宙规则没什么关系，他是在法律之外用来约束人呢，说白了就是它和婚姻一样，是维持社会稳定的产物。纵观历史，你也会发现它也和婚姻一样，不同的地区，不同的朝代，规则标准也是不同的，因为规则的建立者不同，所以道德标准也就不同，所以这个东西它是浮动的，就像是你小时候听话会获得奖励，但是你长大了进入社会，如果听话的话，反而会让你。\n\n受到惩罚。", "account_name": "你的好朋友目清", "account_owner": "你的好朋友目清", "account_type": "竞品"}, {"id": "7632933871458263208", "title": "工作#传统文化", "date": "2026-04-26", "likes": 19559.0, "comments": 8782.0, "shares": 554.0, "collects": 1210.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "", "account_name": "逸恒", "account_owner": "泓泓", "account_type": "本号"}, {"id": "7618864163176286794", "title": "#国学文化 #道系青年 #智慧人生 #干货分享", "date": "2026-03-19", "likes": 19489.0, "comments": 594.0, "shares": 7858.0, "collects": 8816.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "二月二，龙抬头，记住这个小讲究，这边起床呢，先别着急洗脸，就对这两件事今年一顺到底。\n\n第一件，打开窗户，心里默念二月二，\n\n龙抬头，开启一年的好兆头，美好生活在心头，前途光明有份。\n\n第二件事就是准备一颗水煮蛋在身上滚一滚，\n\n把不顺心，不开心全部都带走，留下一整年的平安和好运气，\n\n此生无量！", "account_name": "逸恒师兄", "account_owner": "昭熹", "account_type": "本号"}, {"id": "7595098537872961509", "title": "人不一定要往高处走，也可以往四处走一走#国学文化 #道系青年 #智慧人生 #干货分享", "date": "2026-01-14", "likes": 19388.0, "comments": 736.0, "shares": 5728.0, "collects": 2218.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "如果你想买一个东西，但是觉得有点小贵，怎么办呢？那就买。如果你想去的地方有点远，但是就是想去，那就去。你知道跟这个人没有结果，但是啊，就是扛不住，那就谈。只有拥有才会去魅。有些事情做了才知道结果。就像爬山一样，一心想登顶的人心里是最爽的，爬到一半觉得够了，想立马下山的人也是爽的。最累的就是卡在半山腰，想上去怕爬不动，想下来又觉得爬了那么久上不去下不来，这种是最糟心的。所以人不一定要往高处走，也可以往四处走一走。", "account_name": "逸恒", "account_owner": "昭熹", "account_type": "本号"}, {"id": "7494381914109201724", "title": "剑利时藏锋，剑锈时以嘴为剑#道家文化 #易学智慧", "date": "2025-04-18", "likes": 19385.0, "comments": 759.0, "shares": 45309.0, "collects": 3394.0, "duration": 0 n\n今年，当下你觉得走投无路，10年之后再回头看，你就会发现，正是当年那场把你逼上绝路的变故。\n\n逼你长出了新的翅膀。", "account_name": "洪洞师兄(目清)", "account_owner": "洪洞师兄(目清)", "account_type": "竞品"}, {"id": "7624787648909036815", "title": "群经之首中的八字箴言： #目清师兄 #道家文化 #人生感悟 #学习", "date": "2026-04-04", "likes": 19052.0, "comments": 775.0, "shares": 3705.0, "collects": 9045.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "一个看卦的告诉你啊，一个人，一个正常人，如果持续的好不起来，发不了财，那么大概率是他不懂群经之首易经中的八字真言，君子暴贬，小人革面。\n\n反过来说，记住并且理解这8个字，你的运气将会不可逆转的变化。\n\n咱先不解释是什么意思啊，咱先设想一下变好的本质是什么。\n\n天道中有一个规律，就是老天会让每一件事情合理的发生。比如一定是因为你买了彩票你才能中彩票，你没买你就中了，这个是不合理的。再比如你会发现胖子一定都是嘴馋等原因导致的胖。\n\n一个人要是什么都不吃，他胖了就不合理了。\n\n也就是说，任何事情的发生都一定要有一个合理的原因，环环相扣。\n\n那么，贫穷混不好的原因归期根本是什么？\n\n懒惰、自尊心、玻璃心、穷人思维等等一些负面因素相互影响下展现出来的结果没错吧？\n\n我知道这个时候肯定要有人聊运气了。\n\n但是作为一个干了十几年的挂师，没人比我更懂运气。\n\n我看的人太多了，我可以负责任的告诉你，不存在谁能一直倒霉，运气它是周期性的。\n\n起起落落，这也是天道规律。所以一个人如果短期不好，那我们确实不排除运气问题，但如果一个人长期不好，那真的就别聊运气了，他一定是具备了很多个导致了他不好的坏习惯。\n\n那什么是小人革面？\n\n普通人之所以改变不了，就是因为他所谓的改变永远只停留在表面，今天受点刺激，发誓要努力洗个脸，化个妆，睡一觉，明天起来以后继续心安理得的混日子。\n\n这是大部分人的现状。那什么是君子豹变豹子，在褪去旧毛，长出绝美花纹的时候，是要经历撕心裂肺的肉体蜕变呢？\n\n而你是小人革面还是君子暴变，其实就直接决定了你能不能好的起来，能不能在世俗层面混的不错。\n\n那该怎么君子褒贬？\n\n三步，第一步就是脱离受害者思维。普通人遇到挫折，他的第一反应就是。\n\n哎，这个太难了。\n\n怎么老天对我这么残忍，他反应不来，这是他反应不过来，这是天大的机遇，反应不过来，这是成长的机会。\n\n他只有痛苦、内耗，但是聪明人呢？他遇到背叛，遇到破产，遇到意外，他的第一反应是，这件事我能从中吸取到什么教训，我应该长什么记性？这就直接决定了烂事儿的发生，你是痛苦还是成长？\n\n循环几次呢，就可以把就可以直接把人和人的差距拉得非常大。\n\n在我们这个行业，有一个心照不宣的潜规则，就是如果一个人没有足够的福报，他是没有遭受挫折的资格的，他没资格遭受挫折。天与夫人必先以为祸敬之，就是这个道理。\n\n第二，脱离低维的寄生虫。\n\n你想要往上走，或者说你想要换运，你就必须脱离旧的人、事、物。如果你脱离不了，你就永远换不了。因为每一个维度都有每一个维度的人，都有每一个维度的人、事、物，你留恋，你就走不了，你想拥有更高的维度，你就必须把身边那些天天和你喝酒吹牛逼的兄弟，那些只知道像你疯狂索取的伴侣，那些见不得你好的亲戚，全部从你的生活中剥离掉，因为他们对你的影响是潜移默化的。\n\n维系这些关系会占用你大量的心气儿和气血，你，你就没有多余的精力往上走了。\n\n甚至你在往上走的时候，他们还要往下拉你一把。\n\n给你使个坏。\n\n或者是劝你踏实点儿。\n\n经历过的人应该都知道我在说什么，第三步，承受绝对的孤独。就像豹子脆皮。\n\n都是在深山老林中静静地完成的。\n\n本质上，变好就是一个绝对孤独的闭关过程，这个过程中，你必须把你所有的经历全部收拢回来。\n\n全部砸在你赖以生存的核心技能上，全部用来思考，全部用来提升自己。你必须戒掉一切向外求的心，必须闭上你的嘴，咽下你所谓的委屈，孤独销声匿迹，在暗中疯狂发育。\n\n很多人，他即便到了这一步，他是撑不下去的，他受不了孤独，他一旦感到难受，迅速回归人群，继续平庸。\n\n这就直接把人和人的差距拉开了，因为想要转运变好，是必须要承受一个周期的，绝对孤独的。\n\n这是代价。\n\n就这三步，军姿褒贬 者烂人。第4，倒霉的时候一定不要做任何决定。人生是一条长线，你不用急着一直往前跑，倒霉的时候停下来休息休息，是为了让你好起来的时候跑得更快更远。很多人之所以一辈子都抬不起头，就是因为他在不好的时候越挫越勇，频繁创业，频繁的折腾，最后闯下的货要用一生去填平。第5，你家里的厨房、卫生间一定要不惜一切代价的把它弄干净，上班没时间请假也得收拾干净，这关系到你赚了钱以后能不能存得下，也关系到你在需要帮助的时候能否及时的遇到贵人。第6，别放弃独立思考每天必须要给自己留时间思考，这是你向上攀登，自我升为最快的方式。记住啊，外界的一切都是你内在的显化，你的生活最终一定会和你的精神维度画上等号，第7，如果你在一个地方一直混不好，那你就试试换个环境，换个工作，换个城市，换个圈子，相信我，照做，你一定会越来越好，人人都说走运，走运，走起来，运才会来。一方水土养一。\n\n帮人，不同的环境滋养的人一定是不同的。你在这个地方过得不太好已经是事实了，那就没有必要继续和他死磕了。", "account_name": "洪洞师兄(目清)", "account_owner": "洪洞师兄(目清)", "account_type": "竞品"}, {"id": "7612353352487485093", "title": "#随拍#道家文化", "date": "2026-03-03", "likes": 17397.0, "comments": 271.0, "shares": 4504.0, "collects": 6392.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "男戴观音女戴福，错了，是男戴观音女戴福。\n\n穷养儿子富养女。错了，是穷养儿志，\n\n富养女德。先成家后立业，错了，是遇良人先成家后立业\n\n遇贵人先立业后成家。\n\n嫁鸡随鸡，嫁狗随狗也错了，是嫁乞随乞，嫁嫂随嫂。\n\n舍不得孩子套不着狼也错了，是舍不得鞋子套不住狼。\n\n人不为己，天诛地灭。错！是人不为己，\n\n天诛地灭！", "account_name": "洪洞师兄(目清)", "account_owner": "洪洞师兄(目清)", "account_type": "竞品"}, {"id": "7346135357496331530", "title": "人生无意义，但也要为自己而活！", "date": "2024-03-14", "likes": 17220.0, "comments": 575.0, "shares": 12383.0, "collects": 4487.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "", "account_name": "洪洞师兄(目清)", "account_owner": "洪洞师兄(目清)", "account_type": "竞品"}, {"id": "7334923714229816586", "title": "低调也是一种自我保护！#情感共鸣", "date": "2024-02-13", "likes": 17103.0, "comments": 962.0, "shares": 9435.0, "collects": 4341.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "", "account_name": "洪洞师兄(目清)", "account_owner": "洪洞师兄(目清)", "account_type": "竞品"}, {"id": "7627362772934713051", "title": "#随拍 #道家文化 #目清师兄", "date": "2026-04-11", "likes": 16985.0, "comments": 346.0, "shares": 8137.0, "collects": 9845.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "一个看卦的告诉你啊，一个人，一个正常人，他只要能躲过人生这四大陷阱，\n\n他就不存在混不好。而如果躲不开这四个陷阱，每一个都足以让普通人万劫不复。\n\n希望你刷到这条视频的时候，\n\n一切都还来得及。一大陷阱就是自证陷阱。别人随便污蔑你一句，误解你一次，你就像疯了一样，\n\n翻箱倒柜的去找证据向他解释。你以为你这个是在捍卫尊严，\n\n其实呢，你这是跪着用双手把评价你的资格递到了对方手上。\n\n光子棋，无论你讲是不是，然不然是，若果是也，\n\n则是之亦乎，不是也，亦无辩。对的就是对的，错的就是错的，\n\n事实根本就不需要你张牙舞爪的去辩解。误会你的人，\n\n比你自己都清楚，他误会你了，而你一旦开始辩解，你就已经输了，你就已经入局了，\n\n因为裁判权不在你手上了。永远切记，你怎么做事，是你的人生课题，\n\n别人怎么看你，怎么评价你，是别人的人生课题，本质上和你没什么关系，\n\n这个就叫课题分离。第二大陷阱渡人陷阱。看到身边的朋友混的不太行，\n\n看到亲戚朋友认知低，看到谁谁谁有困难，都想去帮个忙。\n\n但是别忘了，天道是公平的，每一个人的苦难，都是和他自己的认知以及因果完美匹配的。\n\n本质上，每一次苦难，也都是他成长的机会，\n\n你过度干涉，不仅会凭空消耗你自身，也是在剥夺他人成长的权利，\n\n下一次，保不齐就会有更大的坑去等着他。这个对你对他，\n\n其实都是陷阱。永远记住啊，咱普通人活一辈子，你只要能管，好自己，你就已经非常非常非常成功。\n\n第三，第三大陷阱，也是我见过大家踩过最多的陷阱，就是沉默陷阱。\n\n谈了四五年的恋爱，干了七八年的工作，或者投资了一大笔钱的项目，你自己都明知道没希望了，\n\n但是你舍不得放手，因为你太在乎沉没成本了，\n\n这就是沉默陷阱。这个时候舍不得，就只会把你拖垮，因为一件事情如果不行，\n\n它崩盘就只是时间问题。聪明人呢，会在意识到不行的时候迅速离场。\n\n但是普通人呢？不见棺材不要脸，不到黄河不死心。\n\n有用吗？除了徒增成本，没有任何意义。当断不断，反受其乱，\n\n买单、认栽、离赏，真的是人生中非常非常非常重要的一个景。\n\n第四大陷阱虚荣陷阱。说白了，就是过分的在意别人的看法。\n\n道德经的第十三章有句话是这么说的宠辱若惊患贵大患若身。\n\n意思就是，当你过分在意别人怎么看你的时候，你就已经不具备思考能力了，你也入局了。\n\n你为了向那些并不在乎你的人证明你过得好，强行透支自己的气运去装门面，\n\n实际上有用吗？真相是，当下社会，真的不会有人因为你穿了件名牌，\n\n就把你判定成有钱人了。你所谓的面子，其实就是这个世界上最廉价最没用的东西。\n\n知其白，守其黑，越有钱的人，越担心别人知道他有钱，\n\n越懂得收敛锋芒，隐匿财富，自生泄气。渡人。招曳、\n\n沉默、破产，虚荣、耀命，就这四个人，必得安生。", "account_name": "你的好朋友目清", "account_owner": "你的好朋友目清", "account_type": "竞品"}, {"id": "7623799363277599322", "title": "七条人性忠告，一定要看完！#目清师兄 #道家文化", "date": "2026-04-01", "likes": 16980.0, "comments": 337.0, "shares": 26471.0, "collects": 10654.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "谁都不能去你家，同事、朋友、亲戚甚至是发小都不行，这个行为就是祸端的开始。不要让任何人了解你太多，也不要和任何人走得太近，这是一个挂失干了十几年给你的最中肯的忠告。一旦别人开始过度了解你，往往就是你人生灾难的开始。在这个世界上，你记住啊，就是你除了赚钱，根本就不需要太多人际关系，这个真的不是冷漠，这个是对自己负责。以下这7条人性忠告，普通家庭出身的孩子一定要认真看完，真的可能你感觉没什么用，但真的就是决定你人生高度的非常重要的一个点。第一，跟你无关的人，一句话都不要说，不要回应，不要解释，99%的人和你的命运都没什么关系。任何时候别人向你提出要求，你只需要基于你的本心判断你是答应还是接受，你是答应还是拒绝就可以了。至于对方被你拒绝以后，是愤怒，是暴躁，是伤心是难过，都跟你没什么关系。你的经历是用来照顾自己的，不是用来喂养别人的。第二，永远不要让任何人从你这里免费得到任何东西，因为免费就是轻视的。\n\n开始大部分人接近你是为了索取，而你一旦免费，你就会招惹来一大堆的吸血鬼，直到把你吃干抹净。所以乱接触人就只会带来灾难。第三，越熟的人越要少说话。真正能伤你最深的永远是熟人，闲聊的时候会暴露秘密和把柄。永远不要讲真话，永远不要情绪输出。记住啊，陌生人伤害不了你，只有熟人才知道刀子往哪儿捅，陌生人也没心情伤害你，只有人会因为嫉妒，因为轻视而伤害你。第4，你对一个人越好，他反而越烦，你越主动付出，越会降低你的价值。永远记住，真的，这是一个真理，就是当你对一个人太好，他意识到还不起的时候，他的心理压力就只能通过把你捏造成一个罪人、一个恶人来缓解，这样他就不用还了。第5，真正厉害的人，如果发现不对劲儿，他会立刻锻炼他们，只筛选，不改变他们，不试图改变任何人。但是你会发现，普通人，底层人，他总是在试图牺牲自己，拯救别人，他总是试图去教育别人，去改变别人，去插手别人的人生。这太扯了，我告诉你，谁都改变不了谁，永远不要试图改变任何人。第9。\n\n不要刻意维护任何关系。关系是靠价值维系的，不是靠讨好，关系的长久靠的是缘分，关系的好坏靠的是价值。把这句话刻在脑子里。第7，千万不要乱接触任何人，也不要期待任何人对你好，期待别人就是自我消耗，你唯一能要求的就只有你自己。任何时候，你把希望寄托在别人身上，你就一定会失望。没有人可以长期、免费且稳定的给予你什么，永远记住，向内求。", "account_name": "你的好朋友目清", "account_owner": "你的好朋友目清", "account_type": "竞品"}, {"id": "7624518179112439074", "title": "警惕人生四大陷阱！！ #目清师兄 #道家文化 #认知提升 #人生", "date": "2026-04-03", "likes": 16838.0, "comments": 357.0, "shares": 4390.0, "collects": 9588.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "一个人的任何年纪都要提防的4大陷阱，四成陷阱，白嫖陷阱、救赎陷阱、求满陷阱，这4个陷阱，不管再进哪一个，都非死即伤，咱今天把它拆开来，一个一个揉碎了脚。\n\n首先，第一，自证陷阱。别人质疑你，质疑你一句，打压你一下，你恨不得把心掏出来，把五脏六腑抛开给他看，证明你有多好，你有多努力，这个太蠢了。\n\n道德经讲，自发者无功，自矜者不长。你在向谁证明？你需要向谁证明？证明了能给你带来什么？\n\n想过没有？本质上，当你开始张嘴解释的那一秒，你就在潜意识里向对方下跪了。\n\n你把判定你价值的最高解释权极其卑微的递到了别人手里。\n\n你误会我，那太好了，带着你的误会滚远点，把用来生气打嘴仗的时间，用来思考，用来做事。\n\n实在没事儿做，再也不济用来休息，用来睡一觉，咱是不是也能有个好气色？\n\n所以永远记住，狮子永远不会因为狗吠而回头。\n\n第二，白嫖陷阱。别人给你介绍不要钱的项目，送你个人情，给你个礼物，带你见个大人物，你以为你占了便宜，但实际上呢？能量是守恒的。\n\n皇帝阴符经讲，恩生于亥，亥生于恩。意思非常简单，命运若有馈赠，暗中就必有仇离。\n\n你免费拿走的任何一样东西，都一定在你看不见的地方，让你付出了高额的利息，高额的代价。任何东西只要有价格就不贵，怕的是没有价格。永远记住啊，能用钱买到的绝不用人情，需要用人情交换的就宁可不要了，永远不要贪恋免费的馈赠。\n\n第三，救赎陷阱，给人看卦。这些年，我是真的发现，这绝对是无数善良人的坟墓。看到伴侣堕落，你想拯救，看到朋友陷入泥潭，你想拉一把，看见谁有困难，你想指点一下。\n\n你以为是大爱，其实呢？你是在沾染因果。道德经讲天地不仁，以万物为刍果，万事万物都是平等的，每个人的苦难都是他的必经之路，也许是救赎他，也许是惩罚他，但总归都是在让他成长。\n\n你去掺和，对于对方来说，其实是在剥夺他成长的权利，对于你自己来说呢，你在用自己的气运去拯救别人。\n\n他的低认知，他的穷酸气，他的负债，他的业障，都会倒灌给你。\n\n法不轻传，道不贱卖，师不叩门，亦不顺路。放下主人情节，尊重他人命运，这个真的不是冷漠，这个是在顺应天道。第4，求满陷阱，这是人生最致命最隐秘的陷阱。想要事业顺遂，想要婚姻完美，想要儿女双全，还要身体健康，妄图把所有好事儿都占尽了，但是大家都忘了，天道既满啊。\n\n任何事物一旦走向圆满，就意味着要走向负面。周易中的风挂角，日中则昃。\n\n月盈则食。\n\n曾国藩给自己的斋号取名求缺，这个真的是大智慧，七才子禄寿，普通人得一二已是圆满。\n\n包括生活中偶尔有点小意外，其实都是在平衡你的好。\n\n我有非常多的大客户，一旦在一个周期里特别顺利，他就慌了，因为他知道一直没有小意外，就是在憋大的。所以一定要学会钱赚的多了，就主动散掉一一部分，事业太顺，就主动在不重要的事情上装傻吃点亏，这叫大成。若缺，用其不必。\n\n人生所求，真的不必太圆满，就这4大陷阱。", "account_name": "洪洞师兄(目清)", "account_owner": "洪洞师兄(目清)", "account_type": "竞品"}, {"id": "7593587942686916826", "title": "#随拍", "date": "2026-01-10", "likes": 16756.0, "comments": 848.0, "shares": 8965.0, "collects": 6189.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "有一个识人铁律就是如果你看到这个人特别有棱角，甚至他还很愿意独来独往，那这个人一般坏不到哪去，而且大概率人品还不错。但是在群体中，你看到的那种人缘特别好，特别热情，特别会聊天的，你防一手准没错。因为小人他是没有办法脱离群体独自存在的，他一定要合群，就像是寄生虫一样，必须依附于群体，这样他才能在群体中去攀比、造谣、挑拨离间，不然他没办法找到自己的价值和存在感。", "account_name": "你的好朋友目清", "account_owner": "你的好朋友目清", "account_type": "竞品"}, {"id": "7606630040202116937", "title": "回头看你会发现，那都是来时路#国学文化 #道系青年 #智慧人生 #干货分享", "date": "2026-02-17", "likes": 16749.0, "comments": 2659.0, "shares": 413.0, "collects": 875.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "别着急划走，这条视频不是给其他人准备的，刷到了，说明你现在正处在转变的节点。现在默念一句，无心即世界，世界即无心。记住，你相信什么，世界就是什么样的。当你真的相信世界会变得好的时候，事情就真的往好的方向去发展。但如果你只盯着负面，那负面同样也会凝视你。所以，不管你正在经历什么，别焦虑，别害怕，更不用否定自己。就算失败100次，哪怕有一次成功，前面的99次，都叫来时路，到那时回头看，会发现不过如此。", "account_name": "逸恒师兄", "account_owner": "昭熹", "account_type": "本号"}, {"id": "7622729058564017460", "title": "为什么有的家庭越来越好，而有的家庭却越过越差！ #目清师兄 #道家文化 #认知提升 #感悟", "date": "2026-03-30", "likes": 16349.0, "comments": 423.0, "shares": 12987.0, "collects": 7836.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "一个家庭想往上走，一定要懂得避，趁避就避。人屈、立、屈强、屈据，\n\n这六点听起来都很玄，\n\n但是如果你仔细观察身边那些真正跨越阶级，日子越过越红火的家庭，\n\n你就会发现，真的并不玄玄。很多家庭之所以一直原地踏步，\n\n甚至走下坡路，并不是因为家庭成员不够努力，\n\n而是因为他们在看不见的地方，被一些隐形的负能量给榨干了，\n\n给拖住了。作为一个干了十几年的挂师，\n\n我今天用一条视频给你讲清楚这三个币和这三个区域背后隐藏的真相和能量逻辑。\n\n认真看完并且分享给你的家人，\n\n你整个家庭都会持续受益。\n\n首先，什么是秤？简单来说就是寓言。就是你会发现，\n\n在很多家庭里，最可怕的不是没钱，而是有一种弥漫在空气里的丧。\n\n就比如咱这种，人家就这样了，\n\n别瞎折腾了，我就知道这个事成不了。你看是不是这孩子打小就笨，\n\n长大了多半也没什么出息了？这种类似的话，\n\n其实都是在造成。道教有句话叫口吐虽气，必遭天堕。\n\n道教认为，人的语言一定是存在能量的，包括这个世界上的任何信仰、流派也有这个共识，\n\n就是常说什么样的话，\n\n就会形成什么样的磁场，最终就会落实到你的生活里。\n\n所以，一个家庭想往上走，首先要做的就是学会闭嘴。\n\n把不行换成我试试，把完了换成总有办法。\n\n永远不要在家里说那种丧气、恶毒、诅咒的话。\n\n第二，必旧。这里的旧，其实指的并不是旧家具、旧衣服，\n\n而是指那些已经发霉变质，却仍然被家人\n\n奉为真理的习惯。比如极度的匮乏感，\n\n水果烂了才吃，新衣服放起来舍不得穿，剩菜变味了也得拿出来吃了。\n\n这些看似省钱的思维，其实都犯了一个妲己，\n\n叫死气凝结，阳神不生。带来的后果就是把所有的精力都消耗在了这些廉价的琐事上。\n\n再比如经验主义的救枷锁，\n\n比较有代表性的就是我吃过的盐比你走过的路还多，\n\n这太害人了。\n\n社会在不断变化，很多旧的认知，旧的观念已经不属于这个新时代了，\n\n这种旧枷锁如果不打破，那么这个家庭就必然会和社会脱轨。\n\n再就是避开情感勒索的旧模式，\n\n比较有代表性的就是我这辈子都是为了你，\n\n要不是你，我早离婚了。这种模式的家庭沟通，\n\n只会让家里的磁场，家里的磁场不断变得压抑，只会让家庭成员变得小心翼翼，\n\n变得满心愧疚。一个向上走的家庭，他一定是向心而生的。\n\n社会在进步，大家也都在进步。\n\n如果一个家庭不会抛弃旧的观念，不会抛弃旧的认知，那这个家庭就很难过得好。\n\n第三，避人。\n\n一个家庭的精力一定是有限的，如果消耗在这些没啥意义的人身上，\n\n那就必然没力气往高处走。所以你会发现，那些社交特别多的家庭，\n\n往往都是在走下坡路。清静经的核心就八个字外断因果，\n\n内聚真气。这对于家庭来说，也是像真理一样的存在。\n\n当然，不是说你必须断掉所有社交，\n\n而是要选，而是要有选择的避开三类人，一就是消耗你的穷亲戚和酸邻居，\n\n第二就是传递负能量。的垃圾桶。第三就是价值观不合的无效社交。\n\n这些都没什么好解释的，百害而无一利。\n\n那么驱呢？第一驱力，说白了就是一家人坐在桌子上，\n\n不要讨论什么谁洗碗谁拖地这种廉价的对错，\n\n包括什么婆媳，婆媳关系，夫妻争吵也都不要讨论。\n\n一个家组合到一起，为的是一起往上走，为的是越过越好。\n\n你们是一个对抗残酷社会的共同利益体。\n\n至于鸡毛蒜皮的对错得失，完全没有讨论的必要，\n\n因为这些鸡毛蒜皮的事并不是决定你们能不能过得好的关键因素。\n\n第二区强道德经讲人之道，损不足，奉有余。\n\n家里本来就只有那些可怜的资源，就那么一丁点，完全没有必要为了表面的和气去平均分配。\n\n这个是大部分家庭都很容易犯的错误，\n\n总想着一碗水端平，结果就是大家整整齐齐的平庸，\n\n谁也好不起来。在一个家庭资源少得可怜的时候，\n\n不需要谈公平，谁行给谁，\n\n谁行就支持谁。有句话我觉得说的特别好，如果只有一扇门，\n\n一家人手牵手谁都过不去。正确的做法应该是先让一个人过去，\n\n然后再回头拉大家一把。\n\n第三区距很多家庭在遭遇挫折，比如某个家庭成员投资失败或者考试失利的时候，\n\n最喜欢干的事就是开批斗会，\n\n相互指责。这个太傻了，我告诉一个家庭应该是一致对外的，\n\n就算是天大的错误也已经发生了，\n\n家庭成员坐在一起想解决问题的办法就可以了。\n\n你把犯错的人指责的无地自容，错误就消失了吗？\n\n并不能问。题还在那，早晚是要解决的。聚气固本，\n\n固本聚气一致对外，有问题解决问题。因为人心不能测，\n\n一个家庭是一个完整的磁场，人心一旦散了，\n\n这个磁场就不再完整了，这个一定是大忌。", "account_name": "洪洞师兄(目清)", "account_owner": "洪洞师兄(目清)", "account_type": "竞品"}, {"id": "7605937005587198387", "title": "记住这些人", "date": "2026-02-14", "likes": 16326.0, "comments": 2151.0, "shares": 18821.0, "collects": 1683.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "第一种，长得好看，但是拍照不上相，第二种，特别招小孩子或者小猫小狗小动物喜欢，第三种，长相比实际年龄年轻5岁以上，第4种，大钱没有，小钱不断。第5种，去哪吃个饭，逛个街，本来挺冷清的小店儿，他一进去马上就来人。就以上这几种人，现实中你遇到了，你就跟他处吧，这都是锦鲤福兴，越处你越顺。", "account_name": "你的好朋友目清", "account_owner": "你的好朋友目清", "account_type": "竞品"}, {"id": "7614068499329363109", "title": "万物有灵#随拍#道家文化", "date": "2026-03-10", "likes": 16129.0, "comments": 467.0, "shares": 9180.0, "collects": 4675.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "分享一个非常招财的玄学习惯啊，这是早些年我在全真贯里的时候，\n\n我师傅教我 段都会暴露在阳光下，所以你一定要明确一个点，就是低谷期，他并不是一个坏事儿。\n\n你一分钱都不用花，你就可以在这个时候把所有虚假的东西全部清除。你的命运。\n\n这个在商业中叫啥叫强制平仓，叫剥离不良资产。\n\n道教中也有一个顶级心法，叫虚室生白。\n\n古人把人体比作一个容器，你之前的那个破容器里面装满了烂人和破事儿，还有无效的社交以及错误的执念观点就行。\n\n老天看你接下来要走大运了，但是发现你的容器是满的，甚至还有点儿漏，所以他就只能一把把你推下悬崖，把你原来的那个容器给摔碎，这个时候痛苦是必然的。\n\n因为你产生了诸多变动，对吧？但只有摔碎了，你才能把垃圾倒干净，你才能腾出一个真空区，这个就是天欲福，人必先以为祸敬之。\n\n天道厌恶真空，当你真的变得一无所有的时候，且不再恐惧的时候，新的财富和能量必然会像洪水一样倒灌进你的生命里。\n\n所以明确完这一点之后，我们接下来说跌入谷底到底该怎么熬？\n\n其实一点都不难。\n\n你只要做到这几点，你就必然会好起来。\n\n但是大多数人都会在低谷期犯这几个错误，然后就会导致他们越陷越深。\n\n第一就是把你的嘴闭上。\n\n别诉苦，你越诉苦，别人就越觉得晦气。\n\n学会享受孤独，脱脱离人群，少打交道，让自己静下来，静才能生慧。\n\n因为人只要还在人群中，那就必然会不断的做出各种愚蠢的决定。\n\n人这种动物一旦进入人群，它是会降至的，我告诉你，所以这个阶段一定要让自己静下来，不要向外求。\n\n第二就是绝对不要借钱翻本。沉默，成本不是成本，不要试图在错误的坑里把自己挖出来。\n\n这个阶段我告诉你就是做的越多，错的也就越多。\n\n牢记一句话，就是人有冲天之志，非运不可自通。运没来的时候，让自己蛰伏一下，让你的运势缓一缓，给他一个爬升的机会，也让自己缓一缓，休息休息。\n\n让事态流转一下。\n\n第三，不要去试探或者抱怨任何人，保证自身的正心正念。\n\n因为人性本来就是趋利避害的，你没有价值的时候，你的血亲都会背叛你，都会嫌弃你。\n\n这个是人类骨子里的东西，当你解决不了问题的时候，你就成为了问题本身，别人就会想着解决你。\n\n明白吗？第4就是反思自身的问题到底在哪儿。刚才前面讲了，不要把低谷期都归结于运势，也不要觉得低谷期是在惩罚你，天道一定会让任何事情都合理的发生，所以你的谷底一定会伴随着一堆你自身的问题，你需要做的是改掉问题，反思问题，然后你就可以走出来。\n\n但是如果你不找问题，不反思问题，你即便是真的，你的运缓缓上来了，你走了狗屎运，你走出来了，我告诉你，你再跌回去就是时间问题。\n\n真的，这就是一个闯关游戏。\n\n你只有真的理解了这关怎么过，你只有真的找到了自身的问题，你才不会再掉回来。", "account_name": "洪洞师兄(目清)", "account_owner": "洪洞师兄(目清)", "account_type": "竞品"}, {"id": "7601986534305326459", "title": "关于财富的天机#道家文化 #认知 #提升自己", "date": "2026-02-02", "likes": 12971.0, "comments": 409.0, "shares": 3098.0, "collects": 6399.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "说一个天大的秘密啊，就是站在挂尸的角度来说，\n\n为什么有钱人有钱，为什么顺遂的人，他总是能心想事成？\n\n其实真不一定是有他们有多么的精于算计，\n\n而是他们在有意无意当中，触摸到了一条天道。\n\n这条视频我不知道能存在多久啊，但是我建议你如果刷到了，\n\n你就把它看完。因为这是一个挂失，干了十几年，看了无数人以后，\n\n对于财富的一个总结。这里面包含了很多人在获取财富的过程中犯过的错误，\n\n咱有则改之，\n\n无则加勉。你想要获取财富，你就得理解财富，否则你即便是获得了少量的财富，\n\n你也驾驭不了。所以咱们首先要引入一个概念，\n\n就是财富，它分为有形财富和无形财富。\n\n有形财富呢，就是你的车房存款。无形财富呢，就是能够驱使你获取财富的途径和机缘。\n\n科学角度讲，\n\n就是你有没有学历，有没有专业技术，有没有社会经验。\n\n玄学角度呢，就是你有没有智慧，有多少气韵，你的取材手段是什么？\n\n你的这个盘能够扛得住多少财？\n\n那么毋庸置疑，智慧肯定是比学历更重要的。取材手段呢，\n\n肯定是比专业技能更重要的。因为有高学历或者专业技术的人，\n\n他属于是市农工商的工部，\n\n他这一生成为企业骨干或者单位管理层的概率会更大一些。\n\n那为什么我说智慧比取材手段更重要呢？\n\n这个里面蕴含了一个道，就是世间万物的生发顺序，\n\n一定是从无到有的，对吧？刚才我们也讲了，无形财富决定有形财富，\n\n就是你赚了多少。钱并不是因为你打工这个事件本身，\n\n而是你自身蕴含了多少能量，你能够输出多少的内容和价值。\n\n这个就是无有呢，就是指你有了初始能量以后，\n\n再把能量转化为物质的本事，\n\n那么这个时候你才能获得现实层面的财富。这就是为什么很多企业十几年或者几年的光景，\n\n他就能够成为龙头，\n\n因为他在最初一定是选择了一个辐射极广、服务大众的行业去做。\n\n所以财富的获取一定是和你所创造的价值化等号的。\n\n说白了就是你创造一分价值，你就获取一分财富。你服务的人越多，\n\n你获取的财富就越多。你服务你老板一个人，所以你只能获得你老板一个人的工资。\n\n而你如果每天服务一百个人呢，\n\n那你可能就是一个小吃店老板，服务一千个人呢，也许就是一家超市的老板\n\n服务一万个人呢，你也许就是一家大超市的老板，或者一个短视频博主之类的，\n\n总之就是你的初始能量越多，你输出的价值和兑换的货币自然也就会越多。\n\n当然这个只是财富的一个基本概念。\n\n讲到这，我相信很多人都会说，哎，\n\n我是有这个觉悟的，没问题，咱继续往下讲。\n\n那为什么有这个觉悟的人还是赚不到钱呢？我在给人看事的这些年里，\n\n我发现，其实有这部分觉悟的人通常是比较聪明的，\n\n但是这部分人他只是有点小聪明，他没有太聪明，但他自认为自己很聪明，\n\n自认为自己的认知高于身边的人，所以他一定会有惰性，\n\n这个是必然的，它的惰性就会驱使着它，\n\n当生活水平起码的基本生活受到威胁的时候，\n\n它才会爬起来去赚钱。那么这个时候，恰恰其实就是他能量最低的时候。\n\n但你仔细想一下，当你的生活一团糟的时候，\n\n各种事情牵扯着你，你能够保证自身的精神状态正常就已经很不错了，\n\n那你怎么可能有明辨是非的能力再去做事呢？\n\n就是这个时候，就会踏入一个恶性循环。\n\n生活中很多人负债失败，究竟是因为什么？我告诉你，\n\n不是因为他有多倒霉，也不是因为他做了一个错误的决定。人生是一条长线，\n\n没有人会因为一个错误的决定把一生毁掉。\n\n他失败是为什么？就是因为他越挫越勇，他从来不懂得韬光养晦，\n\n从来不懂得养精蓄锐，他从来不给自己的运一个爬升喘息的机会。\n\n就任何低谷期的人来找我，\n\n不管他跟我说出多么惊天炸裂的项目和想法，我都会劝他缓一缓，\n\n让你自己缓一缓，也让你的运缓一缓。就我常说的一句话就是人有冲天之志，\n\n非运不可自通。虽然躺平他不会让你的状况变好，\n\n但起码他不会让你的局面变得更糟。\n\n但很多人，他犯了一个什么错误，就是一开始可能是生活水平只受到了点威胁，\n\n然后呢，他急于翻身，\n\n然后就开始创业。失败一次之后呢，他不韬光养晦，\n\n他继续想办法四处搞钱，然后继续他的创业。\n\n一次，两次，三次，基本上没有人能扛得住三次失败，\n\n他这一生余生吧，\n\n全部都用来填坑了。\n\n这里咱还可以再引入一个概念啊，就是一定。要给我记住这句话，\n\n就我不多解释啊，听不懂的给我反复反思这句话，直到你理解为止。就是\n\n你不要因为想创业而去创业，\n\n你要因为遇到了一个合适的项目再去创业。\n\n同理就是放到感情中也是一样的，就是你不要因为想结婚而去结婚，\n\n你要因为遇到了一个合适的人，所以你去结婚。\n\n我可以很负责任的告诉你，很多人，甚至百分之八十的人，\n\n他这一生的失败都是因为他不懂这一句话。\n\n那么这个时候就还会有人说，哎，我这些我全部都理解，但是我还是赚不到钱。\n\n那我们继续往下讲，我们又要引入一个概念，就是你不理财，\n\n财不理你，世间万物都讲究一个平衡，\n\n而一旦失衡，关系就会破裂，然后就会相互失去。说白了就是你得学会维持你和才的平衡，\n\n否则你们就会相互失去。\n\n就如果你能听到这，前面的这些错误你都没有犯，\n\n那我相信基本上你的问题就是出在这个节点了。我们可以举个例子啊，\n\n就是张三，二五年攒了十万块钱，他觉得哎，今年非常不错对吧，\n\n年底的时候为了奖励自己，分期买了一台三十万的车子。\n\n李四呢，二五年就攒了八万块钱，但是他全存到了卡里。\n\n那你觉得他们两个谁赚的大钱的概率更大呢？一定是李斯，\n\n因为他二六年开年就可以拿着他这八万继续滚雪球，\n\n他的雪球是从八万开始滚的。这里又要引入一个概念啊，就是强者恒强，\n\n弱者恒弱。天之道，损有余而奉不足。\n\n人之道呢，损不足而奉有余。\n\n所以，说他们两个相比，肯定是李四会更顺，因为张三二六年如果开年赚不到钱，\n\n他就慌了，因为他背上了车贷。慌就会导致他做错无数个决定，\n\n一步错，步步错，就像是我刚才说的那个错误一样，\n\n创业一次，然后可能亏了，然后紧接着就越着急，\n\n越着急，然后开始连续犯错。就是我记得某位富豪榜上的人说过，\n\n我之所以可以持续的赚钱，是因为我有底气，\n\n我有被动收入，我不会因为急去乱做决定。就足以见得财富的分配是非常重要的一件事情。\n\n说白了就是很多人他败就败在他稍微看到点曙光的时候，\n\n他的虚荣马上就上头，\n\n马上开始消费，他从来不给自己留后路，\n\n但是你要知道，任何人的好运，他都是有年限的，也许五年，\n\n也许八年，总之就是花无百日红，人无千日好，\n\n你的雪球在这几年里滚起来了，也就滚起来了，滚不起来，\n\n你就得继续过举步维艰的生活。就是我相信很多人他败可能就败在他需要创业，\n\n需要好项目的时候，\n\n或者说他需要创业，他遇到了好项目的时候，他没有本金。\n\n说到这，我相信还会有一部分人，\n\n就是以上说的这些，自己全部都懂，但还是赚不到钱，\n\n那么你可以检查一下，你自身一定有一个问题，就是过分节俭。\n\n我曾经在全真贯里的时候遇到过一对夫妇，\n\n他们每年都来烧香，但是呢，他们也从来都不去财神殿，\n\n因为他们相信勤能致富，他们只求平安。\n\n但后来的故事是夫妇两个人每天打两份工，\n\n然后每天家庭的。开销不超十块钱，\n\n就是现代社会啊，没有几年，距离现在没有几年，\n\n当时他们就每天花不到十块钱。他们家里是没有床的，\n\n是用木板和砖搭了一个床，切记是搭了一个床，不是农村的那种炕。\n\n他们攒钱攒到四十万的时候，孩子摔断了胳膊，\n\n治病花了三十万。后来又攒到一百万的时候，\n\n这个男主人骑摩托车撞了一个老大爷，赔了八十万。\n\n就日子过来过去，还是没有钱。那如果你问我为什么？\n\n其实很简单，它们把财富分配成了死水，\n\n它们和财富的关系同样失衡了。大家都知道财五行属水，\n\n那么水需要什么？水需要流动，它需要不断的流动，\n\n它才有可能会聚集成江河湖海，否则呢，它就是一滩发臭的死水。\n\n他们还犯了一个错误是什么？他们确实渴望金钱，\n\n他们也确实是穷怕了，否则没有人可以坚持常年打两份工，\n\n甚至三份工，但是他们忽略了负债数数不在劳身。\n\n如果你只是想平稳的度过余生，\n\n那么很简单，就是你够努力，你够勤劳就行。但是我相信你，\n\n如果把视频看到这，你绝对不是渴望底层那种平稳的生活，\n\n那么你就得懂得一句话，财富是对认知的奖赏，\n\n不是对勤奋的补偿。", "account_name": "洪洞师兄(目清)", "account_owner": "洪洞师兄(目清)", "account_type": "竞品"}, {"id": "7605937293468386267", "title": "#随拍", "date": "2026-02-14", "likes": 12683.0, "comments": 4342.0, "shares": 14602.0, "collects": 2151.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "第一种长得好看，但是拍照不上相。第二种特别招小孩子或者小猫小狗小动物喜欢。\n\n第三种长相比实际年龄年轻五岁以上。\n\n第四种大钱没有，小钱不断。第五种去哪吃个饭，\n\n逛个街，本来挺冷清的小店，他一进去马上就来人。就以上这几种人，\n\n现实中你遇到了，你就跟他处吧，这都是锦鲤福星，越处你越顺。", "account_name": "你的好朋友目清", "account_owner": "你的好朋友目清", "account_type": "竞品"}, {"id": "7606594896480623459", "title": "六亲橼浅#传统文化 #道系青年", "date": "2026-02-14", "likes": 12663.0, "comments": 837.0, "shares": 800.0, "collects": 1316.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "20266亲缘浅的人会迎来爆发六缘浅的人生来就是一个人，谁也靠不上。这样的人应该以天为父，以地为母，神明就是靠山，他们在30岁之前根本没有贵人相助，全靠自己咬牙打拼，原生家庭帮不上忙，就算早婚也容易被 n因为天道有维持平衡最明显的例子文章大家应该都看过那个访谈。\n\n我记得有一次采访，他跟郭德纲说，我太顺了，我顺极了，结果呢，没多久出问题，被封杀了。\n\n这种例子真的是数不胜数，我一个客户17岁辍学去工地打工，去工地打工，结果天大的机缘，19岁还是20岁，又赚了两个亿。他亲口跟我说，我这几年间没有出过任何意外，没有一点儿不顺心的事儿。\n\n要什么来什么。\n\n结果呢？被陷害沦为阶下囚，去年刚出来。\n\n我父亲经常是我师父，不是我父亲，我师父经常跟我说，人生真的不必太圆满，求而不得未必是遗憾。\n\n人生就是一场大型的塞翁失马，焉知非福。经常有客户跑过来问我，师兄，我怎么这么爱出点小意外？我最近怎么这么倒霉啊？我基本上每次回答都是这是为了平衡你的好。能量守恒，阴阳交替，这个是宇宙的规律，天地不振，一方物为土狗，它不会让人一直顺，也不会让人一直倒霉，每一次倒点小霉，说不定真的就是给你躲过了更大的灾祸。就这种回答看似非常敷衍，但是真的，我告诉你，这个是真理。曾国藩给自己的斋号取名求缺。\n\n为什么？因为人生真的是求缺不求满。\n\n偶尔倒点小霉平衡一下，真的挺好的。\n\n我非常多的大客户，就是混的相对好一些的那些人，他们要是一段时间特别顺，他自己都害怕，你知道吗？真的他巴不得赶紧来点意外，因为他知道如果不来小意外，后面搞不好就会有大意外等着他。\n\n这个就是规律。\n\n所以真的出点小意外别闹心挺好的。", "account_name": "博闻文化（目清师兄）", "account_owner": "博闻文化（目清师兄）", "account_type": "竞品"}, {"id": "7613056899412748954", "title": "#随拍", "date": "2026-03-03", "likes": 8826.0, "comments": 221.0, "shares": 2924.0, "collects": 4906.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "不要和任何人分享我今天说的这个内容啊，因为这个社会从来不鼓励大家去研究人性，有史以来，任何组织都在千方百计的让你沦陷在奶头乐里，为的就是阻止你去看透人性的本质。所以今天这条视频，我站在一个挂失的角度跟你聊一些学校不教，父母不懂的人性境界。你只要能把我接下来讲的这4条规则研究清楚，我敢保证未来的5年甚至10年你都会不断的从中受益。第一，沉默成本，不参与重大决策。如果你犹豫要不要和一个人分开，不管是友情还是爱情，或者犹豫一件事情要不要做，不管是生活还是工作，你都不要以过去的付出作为评判标准。你需要想的是你继续维持下去对你有什么好处。至于你过去付出了多少，投入了多少，根本就不参与评判，已经沉没到水里的成本，他就不再。\n\n是成本了，因为你捞不起来了。第二就是学会课题分离。简单来说就是当对方向你提出要求以后，你只需要基于你的本心去判断你是答应还是拒绝，至于对方被你拒绝以后，是愤怒，是崩溃还是不太开心，这些本质上和你都没什么关系，这个是对方的人生课题，你的人生课题就是我是同意还是不同意。第三就是永远别去考验人性，也别把希望寄托在别人身上。这个世界上任何关系本质上都是基于价值交换的，没有光的时候，影子都会离开你，一切事物来到你身边，停留在你身边，都是取决于你的价值。再说难听点就是，如果你有兄弟姐妹，你就会发现你的父母都会偏向那个过得好的。所以这个世界上不要谈什么真心感情之类的不存在，我告诉你，第4就是这个世上希望你过得好的人，很有可能都不超过。\n\n过5个可以停止炫耀，越是过得好，越是要把自己在人群中藏起来。因为人的嫉妒之心是无比可怕的，保不齐就会驱使着他对你做一些对你不利的事情。可能你没经历过，不会懂第4点，但是你真的经历了，可能就完了。\n\n抖音。", "account_name": "你的好朋友目清", "account_owner": "你的好朋友目清", "account_type": "竞品"}, {"id": "7626700486498509297", "title": "#国学文化 #道系青年 #智慧人生 #干货分享", "date": "2026-04-09", "likes": 8779.0, "comments": 486.0, "shares": 268.0, "collects": 541.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "你知道吗？守护你的啊，不一定是人。最近听到一个非常有意思的说法，也许在另外一个世界上，有一些身影 着反驳我，我知道这个是违背社会核心主义价值观的，毕竟咱身处的是人情社会。但我还是想说，人的一生，一切都是用气血做交换的。\n\n而人的气血是有限的。\n\n我们可以把自身的运势想象成你的电量，你的好运就是满电状态下多余的部分。\n\n也就是说，只有你的电量满了，溢出来的部分才会变成好运，变成财气，变成桃花。\n\n但是很多人呢，他的生活就是一个不断漏电的状态，但是他不自知。\n\n看见是有点儿困难了，都想去帮个忙，都想去出钱出力出谋划策。\n\n但是想过没有？黄帝阴符经为什么讲恩生于害，害生于恩，为什么道家讲义不叩门，事不顺路，法不轻，传道不见满？因为一切都是有代价的。\n\n你的洞察力，你的思维，你的灵感，你的时间，你的气血，都是你的好运。\n\n都会转化成你的好运，都是你的资产，你看到别人陷入困局，你去帮忙，你以为你在救赎他，其实呢，你这是在用你的好运帮他挡灾。\n\n你这是在强行干预别人的因果。\n\n所以你会发现，那些过得好的人，他们真的都在尽可能的保持冷漠，他们从来不管闲事，不是他们真的有多傲慢，有多自私。\n\n是因为他们知道因果互换的代价是什么。\n\n庄子讲，井蛙不可以与于海者，居于虚也。一个人承受什么，本质上是他的认知、他的行为构成的结果，是他的人生客体，是他必须要经历的。\n\n你改变不了，你去帮助他一次，你能帮助他10次，帮助他百次吗？他自身的问题，自身的认知改不掉，等你不帮他的时候，他还是会继续承受他该承受的。\n\n而且，如果你帮了一次，那么下一次你不帮的时候，他不仅不会感激你，他还会恨你，他会把所有对自己无能的愤怒拿来恨你。\n\n当然了，你也别觉得你有多慈悲。给人看卦，这些年，我真的发现，那些所谓喜欢帮助人的人其实是一种病态，他们对被需要感过度上瘾。\n\n他们也只是为了在帮助别人的时候，享受一下我比你聪明，我高高在上这种虚荣感。\n\n但是这部分人他意识不到是病态，甚至还会自我感动，他会在心里给自己塑造好人人设，然后生活中为了维持自己的好人人设，不断的去操心别人的事情，最后自己的生活一地鸡毛。\n\n真的，这个太悲哀了。\n\n清净经讲，人能常清净，天地悉皆归。任何时候，任何人、任何境遇下，插手别人的事儿，关注别人的事儿，共情别人的事儿，真的都是灾难的开始。", "account_name": "博闻文化（目清师兄）", "account_owner": "博闻文化（目清师兄）", "account_type": "竞品"}, {"id": "7628266960005958954", "title": "我笃信一句话：坏事真的未必是坏事 #目清师兄 #道家文化 #感悟人生 #学习", "date": "2026-04-14", "likes": 7900.0, "comments": 387.0, "shares": 2684.0, "collects": 2383.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "说个玄学啊，如果觉得自己某一阵运气特别好，状态特别好，赚钱顺利，\n\n感情顺利，这个时候千万别得意忘形，你要立刻马上做一件事情，\n\n就是提前四灾，也就是厄运对冲。\n\n黄帝宅经中有句话这么说的欲求大吉，必先小凶。\n\n咱先不解释这些是什么意思啊，咱先设想一下，为什么普通人，\n\n他的好运维持不久，比如赚钱达到某一个位置，三十万，五十万或者一百万就\n\n然后就不管再怎么努力，都没办法再往上递增了。\n\n只要钱一到这个数字，就会有各种各样的事找上门，\n\n不是家人生病，就是东西坏了，再或者就是莫名其妙的被坑一笔，\n\n硬生生的让他把这笔钱给花掉。我告诉你这是为什么？\n\n因为这个世界的运行规律就是物极必反，乐极生悲，\n\n祸兮福之。所以所以四灾厄运对冲的意义就是牺牲一些可控的小损失，\n\n来换取命运的豁免权。\n\n本质上，四灾是一种平衡之道。\n\n包括我很多大客户，就是现实层面混的比较好，比较有钱的那些，\n\n他们如果在一个阶段没发生点小意外之类的，他真的会非常慌，\n\n因为他知道，这很有可能是在憋个大的。\n\n因为他们知道，这个世界上所有的好运都是有代价的，如果你不主动去付这个代价，\n\n那么上面就会连本带利的拿走这个代价，\n\n注意，是连本带利。至于怎么四灾，其实也并不难，\n\n比如你突然赚到一笔钱，或者项目极其顺利的时候，你可以主动破点财，\n\n比如拿点钱捐掉，或者分给员工，或者请客吃个饭，\n\n买个单之。类的。当然了，如果你实在舍不得，你可以去干点脏活累活，\n\n或者爬个山对吧，用汗水和疲惫去抵消一下也是可行的嘛。\n\n但总之就是千万不要追求长期的顺利。很多时候，生活中突然出现一些小意外，\n\n比如车有点剐蹭，或者遇到个烂人恶心你一下，\n\n或者是被人占个便宜之类的，你真的不用当成坏事，\n\n这都是用来平衡你的好的，这个叫小胸化大结。\n\n易经讲一阴一阳之谓道。\n\n你不可能只占福，也不可能只占祸。当然，你也不可能只占福不占祸，\n\n你也不可能只占祸不占福。\n\n最真的，任何时候，别太贪心，你不会什么都有，也别灰心，你不会什么都没有。\n\n得到的多了，就想办法散出去一些，为的是平衡。\n\n哎，如果一个周期什么都得不到了，也别灰心，\n\n这很有可能是在平衡你接下来的好。人生就是这样，起起落落，\n\n但是一定要切记，你不会把好事占尽，你也不会把坏事占尽，\n\n因为上面要维持平衡。", "account_name": "博闻文化（目清师兄）", "account_owner": "博闻文化（目清师兄）", "account_type": "竞品"}, {"id": "7624149016175053898", "title": "#国学文化 #道系青年 #智慧人生 #干货分享", "date": "2026-04-02", "likes": 7887.0, "comments": 463.0, "shares": 698.0, "collects": 799.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "你相信吗？灵性高的人，前半生注定是苦的。那不是命苦，那是上面在给你磨刀。有人三十岁风光，四十岁归零，有人三十岁落魄，四十岁翻身。你看着别人跑得快慌了，慌什么？时来天地皆同利，运去英雄不自由。运这东西比火车还准点，没到点你是追不到的，到了你挡都挡不住。为什么有些人会觉得自己苦？那是因为它太干净了。进一个圈子，别人第一反应是如何利用这里，你的第一反应是我跟这哎，怎么这么别扭？别人觉得你怪，你觉得别人干净，被排挤，被孤立，被当异类，你觉得命苦，原生家庭苦，前半生全是坑。那我问你，唐僧取经少一难取不取得了，少一难经都拿不到。你前半生那些坑，那些让你怀疑人生的破事少一件，你今天的零都长不缺。这不是命苦，这是在磨刀。刀磨得越狠，后半生砍的越顺。宁可直中取，不向曲中求。前半生没赚到的，都是给上面的押金，押金交够了，本金自然就来了。那什么时候来？四十多岁。很多人就在问，为什么是四十多岁？你自己想一想，是不是从某一个节点开始，突然想干某一件事，是不是突然想见某一个人，心里就有个声音一直在说往这走。那个突然的转念，就是食之而发，感而后应。我们这行呀，也叫机缘。你这种前半生叫藏风，后半生叫开天。前半生躲在人群里，觉着自己是异类，那些当年跟你一样苦，一样不合群的人，四十多岁之后全都出来了。所以当下别急，大器晚成，大因牺牲真正大的东西。都来得慢，你的福报在路上，只是现在堵车了而已，等他到了你接住就行了。", "account_name": "逸恒师兄", "account_owner": "昭熹", "account_type": "本号"}, {"id": "7616300022426762342", "title": "#随拍", "date": "2026-03-12", "likes": 7885.0, "comments": 263.0, "shares": 13672.0, "collects": 4422.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "高兴的事儿不要和别人说，因为别人会不高兴，不高兴的事儿也别说，因为别人会高兴。人性的阴暗面就是见不得别人比自己过得好，你觉得你在分享，他觉得你在炫耀。所以你会发现，当你失败的时候，就会有一群人来关心你，他们刨根问底的打听你，以为是在关心你吗？其实不是，他们是想确认一下你是不是真的翻不了身了。所以真正聪明的人都懂得收身藏喜人悲，不炫耀成功，不评论是非，不分享喜悦，不假装聪明。", "account_name": "你的好朋友目清", "account_owner": "你的好朋友目清", "account_type": "竞品"}, {"id": "7334652359693438235", "title": "“所以你说，到底什么才是幸福呢”#情感共鸣", "date": "2024-02-12", "likes": 7816.0, "comments": 208.0, "shares": 4382.0, "collects": 1891.0, "duration": 0, "hook": "", "ref": [], "tags": 单，对不对？但是我刚才说了，婚姻的本质是长久啊。\n\n那么问题就来了，你有情绪价值，你就得思考一下，你的情绪价值是否可以长期稳定的提供，对方会不会对你提供的情绪价值感到厌倦。比如时间久了，他觉得。\n\n你也没有那么好看那么帅了。\n\n经济价值也一样，你也需要考虑你能否给对方长期稳定的提供经提供经济价值，你是否有对抗风险的能力？如果返贫了，你是否有翻身的把握？\n\n可能听起来很残忍，但是贫贱夫妻百事哀，这是没有争议的事情。\n\n真相就是这样的，很多年轻的小情侣就靠着一腔热血就结婚领证，虽然可能会有一个不错的结果，但是以冲动为开始的婚姻，大概率极大概率会以冷静下来为界限而而为界限而结束。\n\n所以婚姻绝对不是一件冲动的事情。第二，认知匹配这点其实是最致命的。\n\n因为情绪价值和经济价值通常是可以通过努力就得到的，但是认知不行。\n\n影响认知的因素有什么？先天八字、原生家庭、生长环境。\n\n这几点好像都不是人为可以干预的。也就是说。\n\n你们认识的时候，他是个什么认知？大概率往后余生他都没办法跳出这个认知了。\n\n如果婚前就不合适，你抱着婚后可以努努力改变他的这个心态去往下走，那我告诉你，结果就是万丈深渊，过来人应该都懂我在说什么。\n\n这没办法，因为谁都改变不了谁。这就像是我经常劝我的客户，如果你讨厌抽烟的人，那你就应该。\n\n从一开始就直接找个不抽烟的。\n\n而不是找个抽烟的人，让他为了你把烟给戒掉。改变谁都不现实，尤其是改变一个人的认知，真的不现实。\n\n短期你可能可以通过沉默成本去压制他，去控制他，但是你压制不了一个人一辈子真正爆发的时候，就是收不了场的时候。\n\n认知也是同理，我告诉你，他从心里打心底里就认为今天吃完今天的饭吃不完，需要放到冰箱，明天再吃，但是你打心里心里就认为今天剩下的饭明天就不能时候你扔，一次、两次、三次也许没什么，但是长年累月下来，最后的矛盾一定会有爆发的时候。\n\n我告诉你，我见过最过分的一个客户，他因为没有关灯，两个人离婚了。\n\n就真的仅仅是因为没有关灯，两个人离婚了？当然不是，一次是很多次，但真的至于离婚吗？\n\n但是真的爆发了，没有人拦得住。\n\n所以，婚前必须要考虑的就是你们的认知是否匹配。永远记住啊，长久的感情，长久的婚姻，靠的一定不是廉价的行动和牺牲来维持的，而是靠不敢轻易翻脸的相互制衡和互相成就的利益捆绑来维系的。把这句话刻在脑子里。", "account_name": "博闻文化（目清师兄）", "account_owner": "博闻文化（目清师兄）", "account_type": "竞品"}, {"id": "7620375755965443200", "title": "#传统文化", "date": "2026-03-23", "likes": 7607.0, "comments": 316.0, "shares": 790.0, "collects": 594.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "做一个挂失，我很负责任的告诉你，人是不会错过属于自己的东西，命运会把属于你的东西推到你的面前，你没有任何拒绝他的权利，该是你的终究是你的。所以不要为短暂的无事可做焦虑迷茫，把身体养好，沉下心来，剧本想要推着你往前跑的时候，你往往想停都停一下。", "account_name": "逸恒", "account_owner": "泓泓", "account_type": "本号"}, {"id": "7637457418158378255", "title": "十条能让你越来越好的小技巧： #目清师兄 #随拍 #道家文化 #人生感悟", "date": "2026-05-08", "likes": 7589.0, "comments": 197.0, "shares": 3402.0, "collects": 3434.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "", "account_name": "博闻文化（目清师兄）", "account_owner": "博闻文化（目清师兄）", "account_type": "竞品"}, {"id": "7620709968727117098", "title": "能成大事的人都有的四个能力： #目清师兄 #认知提升 #道家文化 #感悟", "date": "2026-03-24", "likes": 7588.0, "comments": 130.0, "shares": 1633.0, "collects": 3526.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "一个看卦的告诉你啊，怎么判断一个人会不会有大成就？其实你不用看他有没有学历，也不用看他是不是能说会道，你就看他有没有以下这4种能力。反过来说，如果一个人身上具备这4种能力，这个人想没有成就是非常困难的。第一，极其可怕的情绪剥离能力。孙子变话讲，主不可怒而兴师，将不可以温而之战。人的一辈子是不存在不会遇到烂人乱事儿的，而普通人遇到烂人烂事儿，第一反应就是委屈、愤怒，想要个公平。但真正的高手脑子里根本就没有对错，只有利弊。当然他遇到问题也会有情绪，这个是人的正常反应，但是他可以很快的从情绪中剥离出来，冷静的思考接下来该怎么做。也就是说，普通人遇到事儿想的是为什么，凭什么，但是能成大事儿的人，想的是想的是什么。\n\n怎么想的是怎么办，这个是非常重要的。这就好比是牛奶打翻了，你是站在原地懊悔，是可惜，是愤怒，都根本就没有意义。你不管是选择重新倒一杯，还是干脆不喝了，你都必须把地上的牛奶收拾干净。而这个过程中，你浪费了多少时间，你难过了多久，都是没有意义的，遇到问题解决问题就可以了。第二，一针见血的利益穿透力。司马迁在史记中有写，天下熙熙，皆为利来，天下攘攘，皆为利往。就是这部分人是可以把这句话贯彻到自己生活里的，一定要明白啊，懂得和落实是有非常大差距的。我给人看卦，这些年我就发现有非常多的人，他什么都懂，但是他什么都不做，他不落实。\n\n尤其是处理关系，他明知道这个世界上的任何关系都是基于价值交换的，他也明知道决定人行为的是处境，不是人品，但是他一到了事儿上，还是人情未先。\n\n但是具备这种能力的人呢？他不会听别人说了什么，他只会看别人做了什么，凡是以利益出发，这个不叫冷血，我告诉你，这个只是为自己好。\n\n第三，反人性的止损能力。周易里面讲过，己者动之危及之，先见者也。这个能力其实有点反人性，就很多人，他终其一生他都训练不出来这种能力，一段不健康的关系，一个不赚钱的项目，一个垃圾的圈子，他都知道是错的，但是他切割不了。\n\n但是真正的高手呢？只要意识到错了，手起刀落，立刻走人，因为他们知道及时止损，本质上也相当于是在盈利。他们从来不会在乎那些沉默成本，因为他知道已经捞不上来了，已经沉默了。\n\n第4，抛弃道德洁癖的绝对误事。增广贤文中有讲过，慈不掌兵，义不理财，善不为官，情不立事。很多人一辈子没出息是为什么？就是因为他们被所谓的好人面子或者是妇人之人给绑架了。做事之前先想别人怎么看，稍微得罪点人就开始内耗，说白了就是目的性不够强，真正的高手，他脑子里就一件事儿，就是把事儿做成，达到目的。\n\n就这4点，你只要能懂得必，或者说你只要是能落实到生活中，你必然会越来越好，真的。", "account_name": "洪洞师兄(目清)", "account_owner": "洪洞师兄(目清)", "account_type": "竞品"}, {"id": "7617007982056849393", "title": "#国学文化 #道系青年 #智慧人生 #干货分享", "date": "2026-03-14", "likes": 7537.0, "comments": 222.0, "shares": 1083.0, "collects": 1220.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "今天给大家分享一个关于财富的秘密，很多人会觉得有钱人是精于计算，\n\n其实呢，恰恰相反，你会发现他们赚到钱后第一件事，他往往不是奖励自己，\n\n因为他们知道东西是假的。现金这条视频呢，\n\n我不知道能够存多久，所以刷到了，建议大家耐心看完。其实很少有人能明白赚钱的目的，\n\n赚钱的目的是为了让你慢下来好好过日子，\n\n而不是让你做各种让你返贫的动作。道德经里有一句话天下万物生于有有生于无。\n\n看了这么多年，我就发现了一个规律，你想要财富，\n\n你就要理解财富，否则哪怕你短暂的拥有也留不住。\n\n你要明白财富它分为有形和无形，有形呢就是你的车房存，\n\n无形是你的学历，技术、经验以及机缘学。\n\n学一点来说，就是看你有没有气运，能够借助什么东西来扛住更多的财。\n\n我看过很多大老板，他们就说过一句很透的话，奢侈品其实是底层人的消费观。\n\n你们有没有发现，真正的有钱人往往穿的简洁低调，\n\n因为他们知道奢侈品不养人，现金养人。\n\n人有冲天之志，非运不能自通。很多低谷期来找我的人，\n\n我的第一反应就是让他们缓一缓，要先养精蓄锐，因为每个人的运都是有年限，\n \n很多人认为旺自己就是拼命的做加法，其实错了。\n\n我告诉你，真正的旺自己是做减法。减掉不必要的情绪起伏，\n\n剪掉无意义的交流，剪掉无效社交。\n\n你的心里是用来关照自己的，不是用来滋养别人的。\n\n第二，永远不要让任何人在你这里无偿获得任何东西。记住，是任何人，\n\n任何东西。这是一个非常重要的生存法则，因为无常就是一切麻烦的开始。\n\n不要随意回应任何人，不要随意援助任何人，\n\n不要随意给予别人什么东西。这个世界上大部分人靠近你，\n\n不是因为赏识你，而是想从你这里拿点什么走。比如情绪、资源、信息、好处、安慰、利用价值。\n\n而你一旦开始免费付出这些，就必然会吸引来一堆贪婪的吸血鬼，\n\n就像苍蝇一样，直到把你吃干抹净。永远记住啊，\n\n法不轻传道不贱卖师不叩门，一不顺路！\n\n第二，越熟的人越要少讲话。这点很多人都做反了，\n\n他对陌生人特别小心，对熟人毫无戒备。但是你必须得明白啊，\n\n真正能害你的，一定不是陌生人，陌生人不会也不敢害你，\n\n只有熟人才会对你下手。你过好了，他嫉妒你过不好呢，他看不起你。\n\n所以，少说闭嘴真的是太重要了！\n\n第四，你越是对一个人好，他反而越是会烦你。很多人是想不通这一点了，\n\n我告诉你是因为什么？因为当你付出了太多了，\n\n他还不起的时候，他就会想尽办法的把心理压力转化掉，\n\n因为他已经还不起了，他是只能想尽办法把你塑造成一个坏人，\n\n一个垃圾，借此来缓解他的心理压力，这样他就不用还了。哎！\n\n第五，只筛选，不改变。你可以观察一下那些真正有钱有能力，有有能力有地位的人，\n\n他们和人相处都有一个非常冷静的模式，\n\n就是一旦发现这个人不太行，\n\n立刻疏远，不说明，不焦虑，不纠缠。他们从来不会去主动帮助谁，\n\n不会去教导谁，不会去挽救谁，改变谁。\n\n因为他们非常清楚，改变任何人，都是在浪费自己的生命，\n\n都是在浪费自己的气血。\n\n只筛选，不改变，是非常聪明，非常高效的一种生活模式。\n\n而弱者其实就恰恰相反，他们不断交流，不断说明，不断付出，\n\n不断牺牲，妄图拯救别人，觉得自己是个救世主结。\n\n果是什么？结果就是精气神被吸干，物质被榨干，生活越来越糟糕。\n\n第六，不要去刻意的维持关系。\n\n缘分这个东西，它本身就是不断流转的，你的身边一定会不断的人来人往，\n\n有好处自然能玩到一起，没好处自然就各奔东西了。\n\n关系的长久，靠的不是维持，你记住靠的是缘分\n\n关系的好坏，靠的也不是经营，靠的是价值。\n\n第七，不要把希望寄托在任何人身上。\n\n别指望别人理解你，也别指望别人善待你，为你考虑，和你同频。\n\n你过好了，只能是因为你自己。因为本质上，这个世界不会有任何人可以长期持续且免费的给你什么。\n\n而你把希望寄托在别人身上，就一定会失望。", "account_name": "洪洞师兄(目清)", "account_owner": "洪洞师兄(目清)", "account_type": "竞品"}, {"id": "7539007910203641146", "title": "亲爱的朋友们： 见字如面，和大家说一些碎碎念吧。最近为大家解答剧本疑惑时，我发现多数人寻求的并非所谓的逆天改命。 不少朋友在找到我之前，也曾咨询过其他师兄。无论是线上还是线下，最终却依然选择来到我这里。起初我疑惑：是因为我的解读更准确吗？ 经过深思，我明白了：大家反复咨询，是因为内心的真实需求未被满足。其实我们都明白，人生剧本无法更改。在接触过众多案例后，我逐渐看清了真相——大家真正渴望的，不是对未来财富或姻缘的承诺，而是当下那颗焦虑不安的心需要被安抚。 她们最需要的，是一个能理解那份委屈、懂得那些难处的人。令人心疼的是，除了向我倾诉，她们竟找不到可以敞开心扉的对象。 后来，当朋友们再次来访时，除了必要的专业解析，我更愿意做一位倾听者。像心理医生那样，耐心地为每个人梳理现状，分析问题的根源。 最后，请记住：若感到疲惫，不妨停下脚步，给自己一个喘息的机会。无论多么艰难，请永远善待自己。愿诸位前路皆坦途，福泽永相伴。 你的朋友 逸恒#答疑解惑 #碎碎念 #提升自己", "date": "2025-08-16", "likes": 7059.0, "comments": 113.0, "shares": 215.0, "collects": 225.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "", "account_name": "逸恒师兄", "account_owner": "昭熹", "account_type": "本号"}, {"id": "7587420396824988968", "title": "今年也接近尾声了，感谢一路的陪伴与支持。愿岁末的安宁伴随你，预祝新的一年，万事皆可期！#道系青年 #道观日常", "date": "2025-12-24", "likes": 7034.0, "comments": 587.0, "shares": 277.0, "collects": 222.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "绝不忘，今生相见，\n\n凭有归千。\n\n见君不见君身不见", "account_name": "逸恒", "account_owner": "昭熹", "account_type": "本号"}, {"id": "7333232383929437490", "title": "过了，就爽了！#情感共鸣", "date": "2024-02-08", "likes": 7016.0, "comments": 372.0, "shares": 1729.0, "collects": 2251.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "", "account_name": "洪洞师兄(目清)", "account_owner": "洪洞师兄(目清)", "account_type": "竞品"}, {"id": "7628150014905214833", "title": "#传统文化", "date": "2026-04-13", "likes": 7011.0, "comments": 268.0, "shares": 1806.0, "collects": 3132.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "每个月发工资后，挑个满日，把你薪水的30%存到另一个账户里，也可以存一个有寓意的好数字，比如说1880666里备注，你就打上财源滚滚来，搜完之后对自己说，财神到，贵人来，这就叫满日存钱吧。", "account_name": "逸恒自在", "account_owner": "泓泓", "account_type": "本号"}, {"id": "7620694173955772849", "title": "#国学文化 #道系青年 #智慧人生 #干货分享", "date": "2026-03-24", "likes": 7003.0, "comments": 308.0, "shares": 1309.0, "collects": 701.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "看了这条视频，能化解你90%的人生烦恼，看着这些年呢，我遇到过一位园主，自己做生意，经营的呢，也还算顺利，儿女双全，老婆把家里打扫的井井有条，日子也算顺风顺水，亲戚朋友见了都说这家庭没得挑。但就是这几年，女儿因为高考压力大得了抑郁症，老婆因为长期的情绪积累查出了乳腺癌，为了给他们治病呢，家里的积蓄也耗光了，慢慢的背上了负债，好好的一个家就这么松动了。很多人可能不理解为什么会这样，这也应了道家的内句，天道既满，人道俱全。其实很多时候往往不是你没做好，而是那些年过得太好。还有一句话是怎么讲，就是水满则溢，月满则亏。但反过来你看，如果你现在的生活还是鸡飞狗跳，这不好那不好，这反倒是不是可以放宽心，因为这些小打小闹不会导致你翻大船。曾国藩给自己的斋号取名为求缺斋，有智慧的人。\n\n偶尔会主动求缺。人生的整个过程就是一个麻烦叠加上另外的麻烦，你不可能完全的安宁，因为不是这个的问题，就是健康上可能会出些小毛病，不是儿女出了点问题，就是感情给你找点事儿。从长久来看，七财子路寿，普通人得一二就一切圆满，其他方面哪怕糟心一点也算很好。生活里最难的往往不是大起大落，而是那些戏谑的漏。比如钱总是存不住，每次好不容易攒了一些，总会莫名其妙因为这个事儿那个事儿漏了出去，怎么存都存不住。其实这根本不是你不努力，因为懂行的人他都知道钱是有灵性的，你的每一分钱其实都是你的母亲，你随意挥霍就是在斩断他背后的财富子孙，所以这跟你赚多赚少关系不大。你追求的不应该是每一块都完美，而是整体的顺。生活的鸡飞狗跳是常态，存钱走漏也是常态，家里总有一两件糟心事儿。\n\n还是常态，这些小麻烦恰恰是在替你挡着更大的菜，你把小缺口堵死了，上面就会给你开一个大口。所以我们不要总求万事如意，太如意往往预示着接下来福太如意。人生的路很长，守住你手中每一份物，才能接触你人生后面的大运如生亮。", "account_name": "逸恒师兄", "account_owner": "昭熹", "account_type": "本号"}, {"id": "7619615782141956530", "title": "#国学文化 #道系青年 #智慧人生 #干货分享", "date": "2026-03-22", "likes": 7001.0, "comments": 107.0, "shares": 798.0, "collects": 1496.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "如果你的身体突然间没有理由打了个横叉，那咱就在原地跺三下脚带走。\n\n如果连续三天做了相似的梦，那咱们在枕头底下放一张红纸，\n\n或者放一张像这样有寓意的东西。在约会前，如果发现自己的眼皮跳，\n\n你就用凉水拍拍自己的后颈。话说到一半莫名岔气了，\n\n那么这件事就不要再说了。重要的物品突然找不到了，不要急，静坐一分钟往往有奇效。\n\n长期佩戴的首饰突然间断裂了，\n\n那当天不要做重要的承诺。", "account_name": "逸恒", "account_owner": "昭熹", "account_type": "本号"}, {"id": "7605493841353778121", "title": "时间自会翻页#国学文化 #道系青年 #智慧人生 #干货分享", "date": "2026-02-11", "likes": 6970.0, "comments": 324.0, "shares": 575.0, "collects": 1113.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "无缝衔接就无缝衔接，你让他去便是了。这两人是善缘吗？\n\n一个前缘未断就转身，一个明知有因果偏要接，\n\n你说这是什么局？一个负旧债，一个添新债。\n\n磁场相近的人，总是会撞到一起，往后也别管他们能耗多久，\n\n是纠缠到老，还是中途散场。世间有轮回，\n\n缘分有障，时间自会翻页。别把你的心力耗在浑水里，\n\n更不要沾上一身泥。从今往后，这辈子都不要搭他的戏台，\n\n哪怕他将来跪着哭着求着你也别侧目。风一往吹，\n\n莫再向北看。管不了别人的业，咱修好自己的路，\n\n二六年天地换新气，你也应该换个场吧！", "account_name": "逸恒", "account_owner": "昭熹", "account_type": "本号"}, {"id": "7606636167182668646", "title": "隐藏自己#国学文化 #道系青年 #智慧人生 #干货分享", "date": "2026-02-19", "likes": 6924.0, "comments": 219.0, "shares": 858.0, "collects": 917.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "人生啊，一定要学会隐藏自己，藏的越深，命就越好。守住底线，不会遭人憎恨，守住财运，闷生发大财，守住福气，默默享清福，守住心事，不让别人看穿你，守住家事，不让别人看笑话，守住幸福，不让别人眼红，永远不要在别人面前刷存在感。", "account_name": "逸恒师兄", "account_owner": "昭熹", "account_type": "本号"}, {"id": "7634538337294581824", "title": "五一#传统文化", "date": "2026-04-30", "likes": 6857.0, "comments": 434.0, "shares": 2278.0, "collects": 463.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "", "account_name": "逸恒", "account_owner": "泓泓", "account_type": "本号"}, {"id": "7619615543750142874", "title": "#国学文化 #道系青年 #智慧人生 #干货分享", "date": "2026-03-22", "likes": 6781.0, "comments": 470.0, "shares": 1780.0, "collects": 664.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "你们身边有没有那种年龄三四十岁，看起来像大学生一样，这种人呢\n\n要多跟他相处，所谓相由心生，往往他们内心越纯粹，\n\n做事越是慢悠悠，他们永远不争不抢，我也很佩服这种人，\n\n他们越是这样，好事越是往他们头上钻。如果你跟这种人长期待在一块，\n\n那你的运气啊就变得越来越好。", "account_name": "逸恒师兄", "account_owner": "昭熹", "account_type": "本号"}, {"id": "7609882338995377777", "title": "#随拍#道家文化", "date": "2026-02-23", "likes": 6645.0, "comments": 287.0, "shares": 3318.0, "collects": 1465.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "尽量去和那些日子过得比较好的人交朋友，多和他们一起玩。\n\n并不是说你要势利，你要势利眼两个层面，现实层面就是这部分人他过得比较舒服，他没有那么多坏心思，穷生奸济富长良心，他们的包容性会比较强，也会比较正能量。全球层面呢，同气相求，磁场共振，成而不富，转祸为福，也就是说这个能量它是会传染的。\n\n每一个优秀的人都等同于是一处上等风水。\n\n哦，对，还有科学层面，这个叫量子纠缠，你想好你就得多和好的量子纠缠。", "account_name": "洪洞师兄(目清)", "account_owner": "洪洞师兄(目清)", "account_type": "竞品"}, {"id": "7346524430450822450", "title": "水到绝处是风景，人到绝处是重生！", "date": "2024-03-15", "likes": 6595.0, "comments": 194.0, "shares": 2117.0, "collects": 1926.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "", "account_name": "洪洞师兄(目清)", "account_owner": "洪洞师兄(目清)", "account_type": "竞品"}, {"id": "7625904861784582641", "title": "#传统文化", "date": "2026-04-07", "likes": 6534.0, "comments": 303.0, "shares": 517.0, "collects": 580.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "借了个天机给你，无论是谁，如果他做了对不起你的事儿，或者让你承受了本不该承受的委屈，千万啊，不要意气用事，更不要伤害自己。你记住，根本无需动手，在未来的某一天，一定会有一个人替你十倍百倍的还给他，善恶到头终有报，你只管安心的往前走。", "account_name": "逸恒自在", "account_owner": "泓泓", "account_type": "本号"}, {"id": "7513736225304513849", "title": "面相就可以暴露一个人的修为！#道家文化", "date": "2025-06-09", "likes": 6507.0, "comments": 1462.0, "shares": 6444.0, "collects": 1063.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "记住啊，面相就是修为，容颜就是灵魂的镜子。一个人如果看上去比同龄人年轻很多，那你的第一正确反应就应该是这个人有点儿东西。相由心生，本来就不是迷信，长期修心的人，一定会比同龄人看起来年轻个5~8岁。所以，不管是找对象还是交朋友，都应该去找那种看起来比实际年龄要小的人。眼神清澈，代表他的能量，磁场干净，嘴角上扬，代表他心态好，面色红润，说明他气血足，心气足。你跟这样的人相处，他的能量自然会带着你一起日同生长，带你越来越好。", "account_name": "洪洞师兄(目清)", "account_owner": "洪洞师兄(目清)", "account_type": "竞品"}, {"id": "7611166020011733925", "title": "#随拍#道家文化", "date": "2026-02-26", "likes": 6506.0, "comments": 277.0, "shares": 1259.0, "collects": 2010.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "合群的人命一定不好，因为物以类聚，如果你本身气场清贵，思维通透，那你就必然没办法强行的融入人群，那你如果强行融入呢，你就一定会被众人的低频磁场迅速同化你的正气，导致你的能量失衡，运势下滑。\n\n所以道家一直讲藏风聚气，热闹的合群就意味着气散，就意味着你的精气神儿没法内守，这个就像明堂逼仄，气场漏风，你的贵气，你的好运，你的财气自然就留不住。\n\n所以，君子慎独这句话一定是至理名言，而且如果我们抛开玄学聊概率也一样。\n\n不合群，很大程度上就是在降低你遇到傻逼的概率。", "account_name": "洪洞师兄(目清)", "account_owner": "洪洞师兄(目清)", "account_type": "竞品"}, {"id": "7628567141918457960", "title": "低谷期#传统文化", "date": "2026-04-14", "likes": 6499.0, "comments": 387.0, "shares": 359.0, "collects": 741.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "说一个非常残酷的真相，只有走好运，或者即将脱离低谷的人，才有幸能够刷到这条视频给人看热。\n\n这么多年，我见过无数个从谷底往上走的案例，\n\n然后我就发现一个极其反认知的规律，就是那些真正能从绝境翻身走好运的人，\n\n在触底反弹的第一阶段，无一例外都做对了这么一件事，\n\n就是给自己的人生来一场极其残酷的断舍离。\n\n先不要着急反驳我，我知道人在落魄的时候，都极度渴望抓住点什么，\n\n疯狂社交，到处寻求别人的帮助，或者随便找个流水线，打个螺丝来填补内心的空。\n\n但是你有没有想过，\n\n正是这种过急的向外抓取，导致很多人彻底的死在了坑里。\n\n因为真正能够逆天改命的人，他们都非常懂得在低谷期舍弃无效的纠缠。\n\n什么意思呢？我们可以把人际关系想象成一张资产负债表，\n\n你落魄的时候，说白了就是随时可能爆雷的负资产。\n\n这时候你要天天跑出去找亲戚朋友诉苦。刚开始人家可能碍于面子同情你，\n\n给你熬几句鸡汤。但是如果你一直走不出来，天天指望他们给你指条明路，\n\n或者借钱给你，时间久了，他们一定会像躲瘟神一样躲着你。\n\n除此之外，在低谷期的无效交流，也会疯狂的泄露你的磁场。\n\n这个世界没有任何的感同身受，你的落魄，在别人的眼里，\n\n可能只是一场笑话。所以，如果你想翻盘，想一步一步台阶向上走，\n\n让自己的运重新进入一个正向的循环，在这个阶段，你必须要狠下心，\n\n把这三步做到。极致第一，就是断掉你的无效社交，\n\n找高龄当师。你要知道，如果你现在拿不到结果，\n\n一定是对于这个世界的认知出现了问题。这时候你的良师益友一定不是身边那些消耗你的人，\n\n而是顶级的人物传记或者高维的人。看看那些伟人是如何面对绝境的，\n\n国人会嘲笑你，但跨越时空的高维智慧永远不会。\n\n第二，舍弃所有的物质欲望，\n\n把生存耗能降到低点。不用为了掩饰焦虑而随便进个厂打个工，\n\n你只需要把对物质的所有欲望降到冰点。当你有充足的时间，\n\n当你的恐慌感消失，你才能腾出绝对的精力去思考破局之路。\n\n第三，就是舍弃外界的干扰，去完成一场小成本但是可能会收益很大的事。\n\n比如打开手机拍拍自媒体，\n\n去电梯里贴个二维码，做社区团购，什么成本低你就搞什么。\n\n千万不要听别人说，做这些都太迟了，一遍不行呢，是两遍是三遍。\n\n以结果为导向，用结果捍卫你失去的尊严。", "account_name": "逸恒", "account_owner": "泓泓", "account_type": "本号"}, {"id": "7624381630982966528", "title": "人生忠告：不要让任何人过度了解你 #目清师兄 #道家文化 #人生 #认知提升", "date": "2026-04-03", "likes": 6492.0, "comme 220", "title": "永远不要去改变你的伴侣#传统文化", "date": "2026-05-04", "likes": 6376.0, "comments": 275.0, "shares": 2178.0, "collects": 1630.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "", "account_name": "逸恒", "account_owner": "泓泓", "account_type": "本号"}, {"id": "7616464253419972538", "title": "命和运#道家文化#提升自己#认知", "date": "2026-03-13", "likes": 6342.0, "comments": 591.0, "shares": 1292.0, "collects": 2094.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "刚才收到了一条很有意思的私信，他说师兄，你信命吗？我说我能不信吗？他说，师兄，我有个疑问，如果一切都是注定的，那我读书、走路、学习、努力、受苦、成长，这些意义是什么？\n\n他说其实他也信，所以他陷入了一种虚无的状态，他觉得努不努力，他的人生都是这样的。\n\n就命和运这个话题，好像到现在全网都没人能把它说清楚。\n\n有的人说你不信命，也是命里的一个环节，还有人说你不信命证明你智慧不够。\n\n总之，反正都是一些很有道理，但是永远具备争议的解释。\n\n作为一个挂失，我今天用我手里的这份大数据，因为我干了10几年了，给你把命运这件事儿完全解释清楚，首先我们要明确一下啊，什么是命运，这两点是要分开的。\n\n命就是你生下来是兰博基尼还是五菱宏光，运呢，就是你加了什么样的汽油。\n\n说白了就是。\n\n命和运加起来，等于你的人生。\n\n比如命是30分，运是50分，那你就过80分的人生。\n\n对吧，然后命是20分，运是30分，那你就过50分的人生，因为我们这个行业的缘故，我每天都会看到各种各样的出生时间，干的年头长了，就真的难免会有。\n\n重合的。\n\n同年同月同日同时的人出生的人。\n\n然后我就偶尔研究，我发现他们还真的是过着截然不同的人生。\n\n那是不是就意味着其中有人真的改命了？\n\n当然，在这门学术里，还有出生地、家族、业里等等一些条件需要作为参考，但是咱们不聊这些附加因素，因为这些影响明显只是在影响运，他根本不足以让两个人活出完全不同的两种生命状态。\n\n这就让我想起了很多年前，我师傅给我讲了一个故事，朱元璋在四海统一当了皇帝以后，他也曾派人寻找和自己八字相同的人，因为他担心危及他的位置嘛，然后后来就真的找到了一个，是一位蜂农。\n\n朱元璋就问他，他说。\n\n为什么咱俩同时出生，我当了皇帝，你却是个疯奴呢？\n\n风龙说，您有两京十三省，我有十五龙峰，您掌管天下，是无数生灵，我掌管十五龙峰，也是无数生灵。\n\n后来朱元璋还发现，他们两个还有个共同点，就是都出身贫贱，并且都是家里排行老四。\n\n我记得当时我问我师傅，我说这个是为什么。\n\n他说，三命通慧中有一句话是这么说的，人生天地之中，有五行八字相同，而富贵贫贱夭寿之不易。答曰，阴阳二气交感之时，受真精妙合之气，凝结为胎，成男成女得天地。\n\n父母一时气候，是以丙其清者为智为贤，丙其浊者为愚为不肖。智者贤者由是富或贵或寿，必有所得，所谓德足以或福也。愚者不肖者不能自愤，日益蒙蔽，则。\n\n贫贱与妖，有不能免，所谓下于下移是也。\n\n反正说白了就是他们面对困难时，应对的方式是不同的。\n\n包括我这些年遇到的这些同时出生的这些客户。我发现他们其实。\n\n确实是他们人生的起起伏伏基本是一致的。比如。\n\n一个是在10岁的时候，父亲输光了家底儿，另一个可能就是10岁的时候父亲投资赔了钱，就可能过程是有区别的，但是基本造成的结果，或者说基本对他们造成的影响是一样的。\n\n但他们的人生之所以活的不一样，就是他们面对问题时给出的反应不同。\n\n好像有点难懂啊，咱这么比例子就可以了，我们可以把每一个人比作一台车子。\n\n把人生比作一条长途赛道，这条赛道上有山路，有公路，有乡间小路。\n\n两个同时出生的人是一样的车子，这个是他们的命。\n\n比如他们生来都是一辆小轿车，但他们的区别是，一个上山路以后开的很慢，然后到公路上使劲加速使劲跑，另一个在山路上疯狂开，到了公路慢慢悠悠。\n\n这一定就造就了截然不同的人生啊。\n\n这个时候，我相信一定会有人说，我也知道我是小轿车，我肯定在公路上努力啊，傻子才会在山路上努力。\n\n但你真的知道吗？\n\n你回想一下你过往人生顺境的时候，是不是你也会得洋得意洋洋，你会放纵自己，你会膨胀，你觉得老子天下无敌了？\n\n顺境的时候，你是不是又着急上头，疯狂努力，就怕被落下？\n\n那你是真的知道吗？\n\n你也许是真的知道，但你对抗不了人性，所以你被落下了。\n\n人性该让你急的时候，你收敛不了。\n\n人性让你懒惰的时候，你也对抗不了。\n\n早些年我去终南山的时候，我听前辈说过一句话，我印象特别深刻，他说人生其实就是一场家族业力的对抗。\n\n打赢了，你的人生就赢了，败了你就付之你父亲的一生。\n\n当然，女性复制你母亲的一生。\n\n什么意思？意思就是你的家族业里会完整的把你父母的好与坏都继承给你。\n\n你如果能改掉你父母给你的这些坏毛病，然后继承他们的优点，你就一定非常成功。如果你改不掉，你打不赢，你对抗不了。\n\n你的父母老了是什么样子？你极大概率或者说？\n\n你100%老了，就是那个样子。\n\n所以其实。\n\n命运是注定好的，和人定胜天这两句话其实并不冲突。\n\n你生下来是一台小轿车，你跑不过兰博基尼，这确实没办法，但这并不意味着你跑不赢其他轿车，也不意味着你在山路上不能超过兰博基尼。\n\n知进退，长记性，就这6个字，真的一定算是人生顶级的人生外挂。\n\n知进退，该努力的时候努力，不该努力的时候休息休息。\n\n长记性，吃一堑，长一智。\n\n知道自己哪里有问题，竭尽所能的改掉自己的毛病，而不是逃避。\n\n这就可以让你本来一般或者比较差的命。\n\n增添一些运的价值。\n\n在增添很多运的价值。\n\n知命和性命。\n\n并不影响你让自己的人生过得很好，你不需要逃命。\n\n致命是知道自己是谁，知道自己的问题在哪。\n\n信命是不在不顺的时候疯狂努力，在顺境的时候让自己加把劲。\n\n而不是让你在不顺的时候安慰自己，这就是我的命。\n\n我休息休息吧。\n\n这太扯了，真的。", "account_name": "洪洞师兄(目清)", "account_owner": "洪洞师兄(目清)", "account_type": "竞品"}, {"id": "7623381535898553643", "title": "母鸡是下蛋的，那钱母呢？ #随拍 #道家文化 #法物流通处 #目清师兄", "date": "2026-03-31", "likes": 6329.0, "comments": 217.0, "shares": 529.0, "collects": 1412.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "到现在为止，已经有130多万人看过我这条视频了，咱这个钱亩自打上架以来，销售3万多单，好评率无限接近百分百，紧接着全网就都开始抄袭，不过并不影响咱家这个受欢迎，因为咱这个是用前朝的标准印钱木板一张一张做的印退淮南完皮书中有记载，以子血图81前与母血图80以前用途之后会飞回，形成子母前循环。它是干什么的我就不多解释了，反正母鸡是下蛋的，而它叫钱母，每一张都有独立的编号，包括每一张的背面都有我们师兄弟的签名和我师傅手写的祝福语，收到以后放在钱包、存钱罐、保险柜、收银台，包括放在手机壳的背面都是非诚合适的。流程走完了池本瑞玉万金耗天下台，只要能下单就是还能做，放心拍就完了。", "account_name": "博闻文化（目清师兄）", "account_owner": "博闻文化（目清师兄）", "account_type": "竞品"}, {"id": "7617749421606369994", "title": "#国学文化 #道系青年 #智慧人生 #干货分享", "date": "2026-03-16", "likes": 6328.0, "comments": 319.0, "shares": 2196.0, "collects": 1820.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "分享一个学习真相，说你二婚，那你就去拍两次婚纱照，说你要破财，那就买一些平时舍不得买的东西，说你今年变动多，那你就改一下家里的布局，或者出去旅旅游，说你有事故，那就去玩一下碰碰车，说你今年有小人，那咱就买一些小手办。老话说，一小损你全大意，攒一只而保全灵，有时候卡尔bug，事情自然就解决了。", "account_name": "逸恒师兄", "account_owner": "昭熹", "account_type": "本号"}, {"id": "7342802 什么，\n\n是他一定在某一个契机斩断了家族业力。\n\n听起来很玄啊，但是其实并不玄，\n\n百分之九十九的人中期一生都好不起来的，本质就是被家族业力捆绑的太深。\n\n我曾经在钟南山拜访一位老前辈的时候，\n\n他说过一句话，说人这一生，\n\n本质上就是和家族业力在做斗争。\n\n能把家族业力彻底斩断的人，一生顺遂，斩断不了的，\n\n极大概率就会复制，完全复制父母的一生。\n\n那什么是家族业力？根深蒂固的贫穷思维，\n\n亲戚之间为了蝇头小利互相的算计，\n\n以及各种打着为了你好的旗号进行的情感绑架，\n\n这都叫家族业力，也叫破败之妻。如果你不斩断节线，\n\n这股气就会死死地咬住你的精气神，把你永远锁死在底层。\n\n那怎么斩？\n\n两步？第一，彻底戒掉廉价的内疚感，做绝对的物理隔离。\n\n和你的家族做绝对的物理隔离，\n\n就是你会发现，当你开始赚钱，你的认知开始觉醒的时候，家族里那些烂人烂事一定会不断的来缠着你，\n\n今天有人来找你借钱，\n\n天天窟窿，明天就有人用道德来绑架你，只要你心一软，\n\n马上就被拉回去。所以你一定要切记，慈不掌兵，\n\n任何一个能从底层爬起来的人，他必须剥离这些东西，\n\n只要你还有救世主情怀，你永远都。打破不了这一切，\n\n你是要和他们一起在泥潭里继续打滚，\n\n还是咬咬牙爬出来？你真的是可以选择的。\n\n第二，强行改变你对这个世界的认知。\n\n家族业里最恶毒的一点就是他会在潜意识里影响你做事的习惯和思维。\n\n如你的父母觉得只有靠流汗、熬夜、出卖体力赚到的钱才是干净的，\n\n他们觉得赚钱必须痛苦，\n\n靠认知赚来的钱不干净，不踏实。再比如，家里永远堆满了几十年舍不得扔的破烂，\n\n永远在吃隔夜的剩菜，永远在为了两块钱去和菜贩子吵半天。\n\n这些潜移默化的就会让你有匮乏感。\n\n再比如，因为你有钱，你就必须给家族付出，\n\n强行的均衡贫富等等无数种恶习，\n\n如果你不从你身上摘干净，你永远没有出头之日。\n\n打破这一切，也许会背负骂名，但是没办法，如果只有一扇门，\n\n你不可能拉着你的家人一起过去，你只能先过去，\n\n再回头拉他们一把。", "account_name": "洪洞师兄(目清)", "account_owner": "洪洞师兄(目清)", "account_type": "竞品"}, {"id": "7623640687036075327", "title": "记住这八个字，你的人生会突然变好！！ #目清师兄 #道家文化 #感悟 #认知提升", "date": "2026-04-01", "likes": 5981.0, "comments": 297.0, "shares": 790.0, "collects": 2576.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "一个看卦子告诉你啊，一个人，一个正常人，想发财，想彻底好起来，\n\n只需要记住并且理解皇帝阴符经理的八个字，\n\n记住这八个字，你的运气将会不可逆转的变好。\n\n绝例一元，用师十倍。\n\n咱先不解释是什么意思啊，咱先设想一下，\n\n人往上走本质是什么？是不断地否定自己，\n\n不断地淘汰自己现有的圈子和人脉，没毛病吧？\n\n再说直白点，就是一场大型的背叛。因为你需要不断地打破自己原有的认知，\n\n也因为你需要不断地抛弃过去的圈子，\n\n因为你不可能带着朋友，带着家人上路，\n\n他们的认知只能停留在当下，只能停留在他们的生活中，注定没办法和你同行。\n\n所以你就会发现，这个社会上出现了两种人。\n\n第一种，有认知，\n\n但是心不够狠，每天沉浸在各种人际关系中，\n\n沉浸在情绪价值里。今天这个朋友有事了，需要帮个忙，\n\n明天那个朋友有困难了，要去帮一把，他人生的大半气血都浪费掉了。\n\n为什么说是浪费？因为这都是无效付出。\n\n底层的圈子中有一个铁律，就是你帮忙是你应该，你不帮忙是你没良心。\n\n所以你就会发现，帮来帮去，什么都得不到，你所有的好，\n\n在你最后不帮，帮不上忙的那一刻，烟消云散。\n\n所以第一种人就可能浑浑噩噩的过一生。第二种，\n\n极度渴望成功，把自己变成一个冰冷的机器，\n\n他就是一台机器，任何人只要成为他的负担，立刻止损。\n\n他不需要别人的理解，他也没有情绪，他只在乎自己的目标有没有达成，\n\n他只在乎自己有。没有拿到结果，\n\n直到他拿到自己想要的结果，直到自己满意了为止。\n\n这个行为就是绝利意愿。当一个人强行切断对别人认可的渴望，\n\n他不再渴望别人认可的时候，\n\n斩断所有浪费自己气血的无无效社交，把自己所有的气血，\n\n所有的精气神都放在一件事的时候，他的破坏力就会放大无数倍。\n\n但是很多人你会发现，他是不懂这个道理的，\n\n他永远不知道，人的气血是有限的，\n\n给了事业就给不了社交，给了理性就给不了感性。所以你会发现，\n\n当他刚要爬到高处的时候，他的朋友就会劝他别折腾了，安稳点，他的心情就会酸，\n\n他有点小钱，不知道自己姓什么了。\n\n最后呢，他还不够绝情，他还要顾及他们的感受，结果就是留下来和他们一起腐烂。\n\n挺可笑的。\n\n我之前有个新疆的朋友，我们俩聊天，他说了句话，我觉得特别经典。他说人千万别又当又立，\n\n你要么就干脆冷血点，努力赚钱，\n\n别那么矫情，别那么多愁善感。要么你就直接啥都别想，\n\n好好服务身边人，好好当个烂好人。最怕你当个烂好人，\n\n你还想改变自己的生活，这太内耗了，\n\n这真的太难受了，而且这个是不现实的。\n\n听起来他这番说辞很绝情，但实际上就是这个道理。我给人看卦这十几年，\n\n我真的发现，道德经讲的为学日益，为道日损，真的是一点错都没有。\n\n普通人与普通人以为成长，以为变好，是不断的做加法。\n\n但真正的聪明人呢？他的人生是不断做减法的，\n\n他会毫不留情的直接剔除。掉所有不产生利润的废动作\n\n告诉你啊，反过来说，如果你真的重感情，那你应该努力多赚点钱，\n\n然后拿出一大笔钱分给你的发小亲戚，而不是和他们一起烂在那里。", "account_name": "博闻文化（目清师兄）", "account_owner": "博闻文化（目清师兄）", "account_type": "竞品"}, {"id": "7344583973948902694", "title": "真正的强大是：允许一切发生！#情感共鸣", "date": "2024-03-10", "likes": 5980.0, "comments": 251.0, "shares": 2246.0, "collects": 1657.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "", "account_name": "洪洞师兄(目清)", "account_owner": "洪洞师兄(目清)", "account_type": "竞品"}, {"id": "7621927748127442929", "title": "#国学文化 #道系青年 #智慧人生 #干货分享", "date": "2026-03-27", "likes": 5970.0, "comments": 1168.0, "shares": 206.0, "collects": 266.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "给妈妈求一支上上签，祝妈妈越来越顺，往后的日子能被时光温柔着裹着，有慢下来的惬意，有数不清的暖意，更有拆不散的健康，算不了的平安，快乐幸福的每一天。", "account_name": "逸恒", "account_owner": "昭熹", "account_type": "本号"}, {"id": "7517129800682278203", "title": "玄学四不借！#道家文化", "date": "2025-06-18", "likes": 5939.0, "comments": 137.0, "shares": 9036.0, "collects": 1995.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "凡学四不借，别让别人借走你的运。第一届，借你的能量磁场，找你抱怨，向你吐槽，跟你诉苦，和你嚼舌，一旦回应，必受损耗，一旦纠缠，必失福报。第二件，借你的因果信用，替人担保，替人说没，替人背书，替人搭桥，千万不要轻易去做信用外界轻则食财，重则伤命。第三届，借你的时间食数，朋友亲戚间的顺手帮忙，很容易搞得你三五天都没时间读书、健身、休息。一把属于自己的时间轻易的奉献给别人，就相当于把自己的实数拱手送人，一寸光阴一寸金，无端消耗。四慧根，可以为人，但不能舍己。第4届，借你的家用根基，朋友在你家同房，亲戚在你家养病，闺蜜在你家哭诉，都只会让你的家运在无形之中全部散尽，总开心，省无量。", "account_name": "洪洞师兄(目清)", "account_owner": "洪洞师兄(目清)", "account_type": "竞品"}, {"id": "7629228595513632883", "title": "牢记#国学文化 #道系青年 #智慧人生 #干货分享", "date": "2026-04-16", "likes": 5939.0, "comments": 406.0, "shares": 1312.0, "collects": 865.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "二六年是个大爆发的年份，包括接下来的二七、二八年。想要自己越来越旺，一定要记住以下几点，第一，宁可说自己千句好，不说自己一句坏，千万不要说过头话，学会避称。第二，言慢者贵，信柔者富，吉就是克。无论做任何事儿，你要记住，无心才能生大运。第三，有些事做不成，其实是个保。万物来去均有定数，得到未必是福，失去未必是祸。最后大富贵可能意味着大灾难。人要学会求缺，能够吃饱睡好已经是一种份。万般皆实命，半侣不由人。", "account_name": "逸恒师兄", "account_owner": "昭熹", "account_type": "本号"}, {"id": "7614461365952094629", "title": "你要起势了#传统文化", "date": "2026-03-07", "likes": 5899.0, "comments": 623.0, "shares": 104.0, "collects": 304.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "刷到我，说明你要起势了。十年潜龙困深渊，一朝乘风上九天。黄河尚有澄清日，岂可人无得运时。雪崖寒梅头不低，卧薪尝胆待佳期，终有一日同风起，扶摇直上9万。", "account_name": "逸恒自在", "account_owner": "泓泓", "account_type": "本号"}, {"id": "7632587452763511289", "title": "前世不欠 今生不见#国学文化 #道系青年 #智慧人生 #干货分享", "date": "2026-04-26", "likes": 5877.0, "comments": 282.0, "shares": 2114.0, "collects": 805.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "", "account_name": "逸恒师兄", "account_owner": "昭熹", "account_type": "本号"}, {"id": "7627382718268300018", "title": "#国学文化 #道系青年 #智慧人生 #干货分享", "date": "2026-04-12", "likes": 5854.0, "comments": 213.0, "shares": 2380.0, "collects": 931.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "在哪里就说哪里好，住哪个房子就说哪个房子好，干什么就说哪个工作好，\n\n跟谁在一起就说谁好，穿什么就说这个衣服好看，吃什么就说这个东西真好吃。\n\n遇到晴天就说天气很好，遇到雨天就说空气清新。\n\n人本身就是一个能量场，嘴里说什么就会吸引，坚持这么做，你会发现身边的磁场全变了，\n\n你会变得越来越好。", "account_name": "逸恒师兄", "account_owner": "昭熹", "account_type": "本号"}, {"id": "7613065034131229285", "title": "一个人要有足够大的福报才能经历低谷#道家文化#认知#提升自己", "date": "2026-03-04", "likes": 5814.0, "comments": 551.0, "shares": 719.0, "collects": 1539.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "你相不相信一个人要有足够大的福报，他才能在有生之年经历一次低谷，\n\n不管是事业上还是婚姻上，再或者就是其他方面。\n\n这个绝对不是在安慰你啊，虽然低谷期确实难受，\n\n甚至会有点撕心裂肺。这个阶段，你可能怕什么就会来什么，\n\n你珍惜什么就会失去什么。爱情、亲情、友情、名利、金钱、自尊等等，\n\n这些东西会一个一个粉碎在你原有的认知里。\n\n你过去深信不疑的，爱的，死去活来的，坚信永远不会失去的，\n\n都会随着你的三观崩塌，砸在你最自以为是的信念上。\n\n曾经那些你无比仰仗、无比信赖、无比依赖的东西，\n\n那些构成了你前半生最重要的东西，现在就这么一地稀碎的摆在你面前。\n\n但是呢，你也一定会渐渐的从恐惧、绝望、冰冷，\n\n再到平静、接受，再到审视，\n\n你会感觉整个世界前所未有的清晰和真实，\n\n你彻底自由了，你可以毫无顾忌地重新选一条路去走，\n\n你不会再依赖任何人了，因为你需要他的时候，他也没有出现。\n\n所以你彻底没有羁绊了，你彻底成长了，从此以后，这个世界上再也没有人可以欺骗你，\n\n可以阻拦你了。所以我才会说，\n\n只有有福报的人，他才能经历一次低谷，因为低谷才是人生蜕变最好的奇迹。\n\n这就是一切恶因的终结。\n\n包括我们这个行业，有一个心照不宣的秘密，就是没有真正被废过的人，\n\n是不可能真正成功的。\n\n这里的废并不是简单的失败，而是一种彻底停滞的、深度迷茫的，\n\n甚至对自己产生了极致怀疑的状。态，\n\n而这种状态，只有低谷期才能体验到。\n\n而且给人看挂这些年，我就真的发现，基本上所有的有钱人，\n\n他都一定会经历这个过程。\n\n因为废这个过程，或者说低谷期这个阶段，往往就是一个人完成精神重塑的必经之路。\n\n这就像是人生的一次彻底归零，\n\n当一个人觉得自己一无所有，\n\n被世界抛弃的时候，曾经的骄傲、虚荣，面子都会被全部击碎。\n\n而从碎片里面站起来的人，\n\n他的自信一定不再来自外界的肯定，\n\n而是源自于自身真实能力的深刻认知。\n\n其次就是肺往往是深度扎根的阶段，\n\n就像是竹子定律，一棵竹子，\n\n你栽在那前几年悄悄扎根对吧？但是你看起来好像毫无进展，\n\n实则呢，它是在储蓄实力。\n\n废不是停止，低谷期也不是停止，也不是磨难，\n\n而是向内生长，在那些看似躺平、颓废，无人理解的日子里，\n\n悄悄的经历一次内心最激烈的拉扯和重构。\n\n如果能熬过这种内耗，换来的就是对人性和对世界更深层次的洞察。\n\n第三就是只有触对，才能有最大的反弹力，这个是物理学，我不太懂，\n\n这里我就我就不过多解释了，反正就是球只有狠狠的砸向地面，\n\n他才能弹得最高。这个应该大家都懂，\n\n真正被废过的人，真正有幸经历过低谷的人，\n\n他见过最坏的结果，所以他面对失败的时候，\n\n他不再恐惧，也是因为他势无可失了，反而他更敢孤注一掷，\n\n更敢做出常人不敢做的选择。\n\n当然了，这个世界上有两种废，一种是永远的废，\n\n接受无能，放弃挣。扎另一种呢，\n\n就是暂时的废，在绝望中产生向上突破的渴望和愤怒，\n\n这个其实就是觉醒的前兆。\n\n真正成功的人，都一定是在废墟中找到了一条向上的裂缝，\n\n然后拼命钻出来的人。\n\n所以我开头还是那句话，只有福报够大的人，\n\n他才有可能在有生之年经历一次低谷，\n\n这个就是他觉醒的必经之路。没有福报的人，享受不了这种东西呢。", "account_name": "博闻文化（目清师兄）", "account_owner": "博闻文化（目清师兄）", "account_type": "竞品"}, {"id": "7605909822845054649", "title": "三条法则让你改变命运！#道家文化#提升自己#认知", "date": "2026-02-16", "likes": 5812.0, "comments": 224.0, "shares": 1085.0, "collects": 2891.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "如果一个人从底层社会爬起来了，爬上来了，那你认为他在认知上最大的转变是什么？答案显然不是他比常人更加努力啊。道德经全文也没有提到努力两个字。我在这些年的从业生涯中，也见过了太多努力但是也没有改变命运的例子。那有人会说是找到贵人吗？明显也不是，因为人脉的本质是价值交换，对吧？如果你没有价值，你也很难和有钱人建立真正的链接。那这里会有人提到外貌价值，但事实上，这个是最廉价的。因为你长得帅，永远有人比你长得帅，你长得好看，永远有人比你好看，你性感，永远有人比你更性感。这种东西可代替性太高了，他会因为你的外貌爱上你，那他就很难拒绝下一个比你更帅更漂亮更性感的人。所以这个是不成立的。给人看卦这些年，那些真正实现了底层跃迁的人，他们其实都在有意或者无意中摸到了一条天道，就是他们都懂得如何用最低的成本获得最高的回报。你会发现，身处底层的人，他不是不努力，相反，其
