hook": "", "ref": [], "tags": [], "transcript": "", "account_name": "洪洞师兄(目清)", "account_owner": "洪洞师兄(目清)", "account_type": "竞品"}, {"id": "7635340481865583912", "title": "该是你的，迟早是你的；不该是你的，强求也不是你的 #目清师兄 #随拍 #道家文化 #学习", "date": "2026-05-03", "likes": 2822.0, "comments": 165.0, "shares": 398.0, "collects": 620.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "", "account_name": "博闻文化（目清师兄）", "account_owner": "博闻文化（目清师兄）", "account_type": "竞品"}, {"id": "7578118432723097957", "title": "#随拍#道家智慧", "date": "2025-11-29", "likes": 2802.0, "comments": 69.0, "shares": 628.0, "collects": 932.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "", "account_name": "博闻文化（目清师兄）", "account_owner": "博闻文化（目清师兄）", "account_type": "竞品"}, {"id": "7637848125784214838", "title": "人生六要，大喜要稳，大怒要忍，大祸要等，大悲要静，大富要俭 #目清师兄 #道家文化 #随拍 #人生感悟", "date": "2026-05-09", "likes": 2799.0, "comments": 88.0, "shares": 563.0, "collects": 1107.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "", "account_name": "洪洞师兄(目清)", "account_owner": "洪洞师兄(目清)", "account_type": "竞品"}, {"id": "7602213178080900282", "title": "不要让任何人了解你", "date": "2026-02-02", "likes": 2792.0, "comments": 91.0, "shares": 1012.0, "collects": 735.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "谁都不能去你家，不要让任何人彻底的了解你，同事、朋友甚至发小都不行，这就是保护自己最好最直接的方式。不管是从玄学层面还是从现实层面来说，这个行为就是你祸端的开始，就每多一个人了解你，你都会多一分的麻烦。咱不聊虚的，咱先从现实层面来说，这个世界上真正希望你过得好的人，他一定是一个手都能数得过来的，就是我敢肯定的说，你身边的绝大多数人都只是在等着看你的笑话，你的倾诉，你的伤口，在别人眼里他是无关痛痒的，但是你的炫耀在别人眼里一定是眼中钉，肉中刺。所以你会发现，真正聪明的人，他一定会在人群中把自己给藏起来，甚至他可能家庭住址他都会。\n\n忙着掖着，就是因为他们都明白，你过得不好，没人能帮你，你过好了，就会有一大堆人来给你添乱。就我干这行这些年，我真的我见到过无数来找我的客户，他们垮掉不是因为他们自己，他们普遍是被人际关系给拖垮的，就是道德绑架嘛。你过不好，你就该免费服务那些过得好的人，因为你低人一等，你过得好呢？你就该无偿去付出给那些过不好的人，否则你就是丧心病狂，道德败坏，为富无人，对吧？这就是现实。那么最好的方法是什么？就是我过得好不好，我不要让别人知道。\n\n旋律层面呢，就是不暴露你的隐私，就是在守住你的能量结界，避免这个气场的耗散。你的个人隐私就是你的命局，你的根基，随意的透露就等于是主动卸掉了你的护命之气。所以不随便交朋友就是能量的开源节流，不交乱七八糟的朋友，就是保护自己的磁场能量场。\n\n那总结来说，我说的这些总结一句话是什么？其实就一句话，就是人是不需要太多社交的。因为。\n\n没有人能帮你。", "account_name": "洪洞师兄(目清)", "account_owner": "洪洞师兄(目清)", "account_type": "竞品"}, {"id": "7629918325283261747", "title": "人能常清静 天地悉皆归 #目清师兄 #道家文化 #感悟人生 #学习", "date": "2026-04-18", "likes": 2784.0, "comments": 111.0, "shares": 244.0, "collects": 723.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "", "account_name": "洪洞师兄(目清)", "account_owner": "洪洞师兄(目清)", "account_type": "竞品"}, {"id": "7612495407378368128", "title": "元宵节#传统文化", "date": "2026-03-02", "likes": 2781.0, "comments": 134.0, "shares": 569.0, "collects": 132.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "正月十五元宵节这一天，别吵架，别骂人，也别往外借钱，一家人吃顿团圆饭，月圆人圆，事事圆满，花好灯好，好事连连。", "account_name": "逸恒", "account_owner": "泓泓", "account_type": "本号"}, {"id": "7613352625622583665", "title": "#传统文化", "date": "2026-03-04", "likes": 2777.0, "comments": 80.0, "shares": 1616.0, "collects": 224.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "如果经济条件允许，一定要经常出去玩一下。人的气运就像水一样，长时间不流动，活水会变死水。经常出去玩，无论是看项目还是放松自己，你会发现有新的想法和灵感迸发出来，你的运也会变得非常好，至少你回来一趟，看谁都顺眼。", "account_name": "逸恒自在", "account_owner": "泓泓", "account_type": "本号"}, {"id": "7626970811442329192", "title": "#传统文化", "date": "2026-04-10", "likes": 2758.0, "comments": 84.0, "shares": 453.0, "collects": 365.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "为什么一直赚钱，但永远过着很紧拔的生活？你有没有想过，这个社会的设计就是这么的精强，如果不去刻意抵制某种生活方式的诱惑，作为打工人来说，你收入再多也不会剩下这别人。看着这么多年，我就发现了一个秘密，就是这个局会不断的告诉你如何生活，如何消费，因为他就是希望你做一个左手进右手出，存不下任何东西的人。道德经里有一句看破财富天机的话叫金玉满堂，物之能守。网约车司机一天经手大几版小饭店，一个月的流水也有十几20万，但是这不是属于他们的钱，因为你一切一切的东西，代价和需求都会被算的清清楚楚。司机的份子钱，外卖小哥的客单价，餐饮老板的平台冲顶，大厂程序员，高额的房贷，各种天衣无缝的设计会利用你现阶段的需求，把你的生活水平永远卡在刚刚好。\n\n大一点就崩溃的边缘，你的月薪从1万涨到了3万，你的住房标准从合租变成了整租，外卖从15块变成了30块，包从帆布变成了LV，你觉得你在升级生活，其实你的价格被重新标记了一遍，只要一个行业、一个领域有一部分的人赚钱效率得到了提升，有了突破，这个局就会勒紧每一分。所以你是赚2万还是赚20万根本不重要，重要的是每个人都在燃烧自己的生命，在供养这套东西。所以有些客户问我如何改财，我很无奈，不是财富好是流经过你手里的钱，从来不是你的钱，你只是一个通道，左手接来，右手递出去，你就是这个局里的搬运。除非你有勇气跳出来重新审视自己，找到新的出路，否则你只能在这个局里不断的被消耗磨损。", "account_name": "逸恒", "account_owner": "泓泓", "account_type": "本号"}, {"id": "7625559915910837427", "title": "#国学文化 #道系青年 #智慧人生 #干货分享", "date": "2026-04-06", "likes": 2753.0, "comments": 115.0, "shares": 173.0, "collects": 289.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "一个人如果真的要走大运，最先改变的是内心，然后才是财富。看事。这些年我就发现，真正有大富贵的人是要经历三重难关的。第一关，封印你所有的好运，让你环境艰苦，事业学业坎坷，这是让你看清虚妄，第二关，人情如纸，被朋友背叛，被爱人抛弃，这是让你看清动向，第三关，自信，你开始怀疑自己跟自己过不去，反复内耗，这就是在模拟的心理。当所有的人和事都离开你的时候，其实是在给你磨空间。你现在的低谷和沉默不是认命，是在为以后的一鸣惊人。", "account_name": "逸恒", "account_owner": "昭熹", "account_type": "本号"}, {"id": "7624515334262920090", "title": "#国学文化 #道系青年 #智慧人生 #干货分享", "date": "2026-04-03", "likes": 2750.0, "comments": 119.0, "shares": 470.0, "collects": 764.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "清明节给先人送金银，除了钱财之外，有一样东西不能少，口袋里装上一把大米或者小米，\n\n烧金银的时候记得边撒边说这几句斯米落地，\n\n阴阳两立祖先得时，佑我顺利。简简单单几个字，但是能量非常强，\n\n刷到看到等于做到无声无量。", "account_name": "逸恒师兄", "account_owner": "昭熹", "account_type": "本号"}, {"id": "7619644329027587347", "title": "普通人如何实现阶级跃迁！ #目清师兄 #道家文化 #认知 #提升自己", "date": "2026-03-21", "likes": 2724.0, "comments": 99.0, "shares": 436.0, "collects": 1199.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "泄露个天机给你啊，有没有想过普通人到底怎么打破困境，实现阶级跃迁？或者是有没有想过普通人怎么快速走出低谷？\n\n绝对不是靠意志力，也不是靠什么撞大运，什么天降横财。我告诉你靠的是什么？靠的是结构性重置。说白了就是人在低谷的时候，最致命的不是没钱没资源，是他还在用原来的做事方式过新的生活，说白了就是穿新鞋，走老路。\n\n不知道大家有没有听过猎狗的故事，猎狗掉进了当地猎人挖的3米深四面垂直的深坑，不是捕兽夹。他第一天拼命往上跳，爪子都扒烂了，第二天开始用头撞墙撞晕了，醒来之后还在坑里，第三天不动了，趴在角落等着饿死。\n\n第4天，有人往坑里扔了一只活鸡，他看着鸡借看着它，食肉动物和猎物捆在一起，他突然不死了，他开始追击疾跑。他追坑底虽然小，但是他跑起来了。\n\n追了3天，突然跳出了坑，不是因为他跳的高了，是在追击时踩到了坑壁上一块儿之前没看到的凸起的石头。同样，我告诉你，人掉入低谷的时候，第一反应也是拼命的往上跳，跳不出去就用头撞墙，撞不动了就放弃挣扎。大家都会认为是自己不够努力，但真的是不够努力吗？我相信没有人会不渴望更好的生活，那问题出在哪儿？\n\n出掉了，没找对方法。\n\n就我给人看卦的这些年，我看过无数人从低谷翻身的经历，后来我就总结，我发现有3个可以真正改变生活，且非常容易执行落地的方法。\n\n互联网上很多人讲如何快速走出低谷期，但是他们讲的这些方法要么就根本执行不了，要么就全全是扯淡的话，我今天讲的这3个，你百分百可以快速落地，快速执行。\n\n第一，先把活着的空间收拾到能喘气儿。\n\n庄子中有句话，虚实生白，吉祥直指你住在那儿，每天看到什么，醒来面对什么样的生活，直接决定了你大脑的决策质量。\n\n这个很科学，现在科学也有论证，长期处在混乱、压迫、不可控的环境里，人的判断能力会明显下降，你以为是你不行，其实是环境在持续消耗你的认知。\n\n就是你会发现那些过得不太如意的人，他们的生活环境大多都是窗帘永远拉着，桌子上堆着3年前的外卖烟盒、酒盒、水瓶子，墙上贴着5年前的明星海报。\n\n就是你的大脑，每天在这种环境下，你的第一反应就是我的处境不好，我得先活着。\n\n那你能混多好？\n\n所以，真正的转折，绝对不是突然振作起来给自己打点鸡血，而是先把点滴的生活的磁场给调整好。\n\n当你的环境变得可控的时候，你才能有足够的认知去做正确的角色。第二，把一到晚上就烂掉的自己修好。\n\n戒掉内耗，强迫自己养成早睡早起的习惯，别觉得这个很简单，我告诉你，如果你做不到，你绝对不会有长期可以持续的好运。\n\n黄帝内经讲起居有常，不忘劳作，故能行与神聚。晚上焦虑、内耗、失眠，在道家看来叫做阴阳逆乱，精气外泄，这会直接锁死你天亮以后的判断力，让你的睡眠恢复正常。身体动起来，你才能把控好自己的意志力和自控力。很多时候，不是你想不通，是你没能力想不通，尤其是身处低谷的时候，你需要很强大的判断力、执行力、行动力。\n\n而这些的来源，其实真的可能就是睡个好觉。\n\n第三，把脑子里的就观点扔掉。道德经讲，为学者日益，为道者日损，损之又损，以至于无为。很多人为什么走不出低谷？为什么越努力越惨？\n\n因为方向错了。\n\n很多人认为天道运转的核心是日益，其实我告诉你，是日损。\n\n说白了就是你先不用急着去学习，你先把过去的自己完全给抛弃掉，旧的取材方式，旧的面子，旧的经验全部给他粉碎，因为这些如果是对的，你不会陷入困境的。\n\n你陷入困境，就证明你过往的生活方式是错的，你过往的认知是错的。\n\n把手里的旧地图换掉，重新理解一下这个世界。所以现在我们再问一次，普通人怎么快速打破困境，怎么快速走出低谷？答案很冷静，也很残酷，不是觉醒，也不是天降横财，就这3个习惯，只要这3件事情同时发生，命运一定会出现偏移。猎狗跳出坑，不是因为会飞了，而是因为它会踩石头了，方法比努力更重要。", "account_name": "洪洞师兄(目清)", "account_owner": "洪洞师兄(目清)", "account_type": "竞品"}, {"id": "7568068210881472185", "title": "#随拍#道家智慧", "date": "2025-11-02", "likes": 2716.0, "comments": 188.0, "shares": 691.0, "collects": 393.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "晚上做梦，能记住梦的和记不住梦的其实是两种人，老祖宗管这个梦叫小死。\n\n如果你夜梦频繁，且能够清楚的记得里面的细节，\n\n那你这就是属于对周围的感知能力非常强大，适合当老板或者是当决策者，\n\n包括这类人的第六感也会相对非常准，多和这类人交朋友，\n\n遇到事了你就多听听他的意见，准没错。", "account_name": "洪洞师兄(目清)", "account_owner": "洪洞师兄(目清)", "account_type": "竞品"}, {"id": "7596274081692488421", "title": "#随拍#到系文化", "date": "2026-01-17", "likes": 2705.0, "comments": 84.0, "shares": 333.0, "collects": 469.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "一个人一旦大运将至，性格一定是会变的，与其说是被命运推着走，倒不如直接说是换了个人。大运来临的那种自我重建，也许不会改变你的外表，你可能还是看起来依旧的温和沉静，但内心深处呢，很多东西都是天翻地覆的，比如你可能不再热衷于表面的热闹，也不再轻易的对外界的声音动摇代表如可能不再对人性抱有期望，也不再期望外界谁能帮到你。这种变化虽然往往都伴随着一段极其痛苦的挣扎，可能也会经历迷茫，承受压力，所以痛苦一定是必然的，但好起来也是一定的。", "account_name": "洪洞师兄(目清)", "account_owner": "洪洞师兄(目清)", "account_type": "竞品"}, {"id": "7614068296950424741", "title": "#随拍#道家文化", "date": "2026-03-09", "likes": 2702.0, "comments": 92.0, "shares": 520.0, "collects": 759.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "无情才能有钱，没有 duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "上个视频，没想到大家对手链这么的喜欢啊，我就天天加班给大家穿手链。1儿歌徐怀斩北斗，河山万里愿与君同寿。", "account_name": "逸恒师兄", "account_owner": "昭熹", "account_type": "本号"}, {"id": "7612338720049853285", "title": "关于财富的天道！", "date": "2026-03-04", "likes": 2467.0, "comments": 138.0, "shares": 446.0, "collects": 1176.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "这是一条关于财富的天机啊！有没有想过，一个人如果可以赚大钱，\n\n跨越阶级，你觉得他具备了什么特质？\n\n绝大多数人的第一反应应该是特别能吃苦，\n\n特别勤奋，或者觉得他们特别节俭，精于算计，\n\n又或者觉得他们一定是遇到了什么特殊的机会机缘？\n\n如果你脑子里的第一反应浮现的也是这几个答案，那我只能告诉你，\n\n按照这个脑回路走下去，你这辈子都很难摸到财富的门槛，\n\n你连门槛都摸不到，\n\n因为这些特质其实就是贫穷的原罪。\n\n想成功，想发财，第一步就是需要戒掉这些特质。\n\n我这条视频会由浅到深的讲一些学校不教，\n\n父母不懂的东西，如果你刷到了，我特别真诚的建议你把它耐心看完，\n\n因为这是一个挂失，干了十几年对于财富的一个总结，\n\n看完并且记住，我保证你会受益终身。\n\n首先我们明确一个点，就是如果靠勤奋和吃苦就能发财，\n\n那工地上的工人师傅，凌晨三点扫大街的大爷，都应该实现财富自由。\n\n如果靠节俭就能发财，跨越阶级，\n\n那我们的上一代人，也就是我们的父母，早就该个个家财万贯了。\n\n如果靠机会和机缘呢？\n\n作为一个挂师，我也可以告诉你，天地无仁，以万物为刍狗。天道是绝对会讲究公平的，\n\n每一个人都平等的享有致富的机会，\n\n但并不是所有人都可以把握。所以真正拉开贫富差距的是什么？\n\n就一句话。司马迁在史记当中的一本货值列传里有句话是这么说的无才坐立，\n\n少有斗志，然后是既饶争实。\n\n意思就是，当你是个穷光蛋的时候，你需要很勤快的出卖体力维持生活。\n\n当你稍微有点资本以后呢，你需要靠的是脑子去拼杀。\n\n当你已经富有了，你需要争的是时势。也就是说，你想从穷人变小康，\n\n你需要的是体力上的勤。你如果想从小康变中产呢？\n\n你需要的是脑力上的勤，对吧？中产变富豪呢，\n\n你需要的是格局上的勤。那有没有抄近路的方法？\n\n有，这条视频就是在讲抄近路的方法。我在看卦的这些年，\n\n总结了四个有钱人都具备的特质，\n\n答案我都给你讲出来，抄不抄，抄多少，看你自己。第一，就是极度的弃德重礼。\n\n丸子中有句话是这么说的苍蝇食而知礼节，\n\n衣食足而知荣辱。\n\n白话说就是赚钱的时候，不要去想什么高尚的面子，面子是你成功以后别人给你的。\n\n但是你会发现，大多数赚不到钱的人，他们挑肥拣瘦，\n\n生意不体面不干，工作不体面不干，有事了先谈，\n\n感情，先要面子。造成的结果是什么？就是错过无数的机会。\n\n我记得有一句年轻人都特别爱说的话，\n\n就是只恨大雪庙前没有我。\n\n我不知道有多少人懂这个梗啊，但是我们想一下，当时的你是不知道大雪庙吗？你知道，\n\n那你是不想去大雪庙吗？\n\n也不是，你是要面子，你是怕被人说。\n\n后来呢？大雪庙前的那个年轻人，\n\n财富自由，对吧？我忘了叫什么了。身后的人呢？\n\n豪宅？名车？当然，我不是在鼓励这些，\n\n我只是在用这个极端的例子想要告诉你，这个社会的上升渠道，\n\n已经被资本毒死了。想往上走，你就只能为他人所不为，\n\n当下社会一定属于不要脸的人。\n\n第二就是冷酷的断臂求生，敢于重制。\n\n易经中有句话叫穷则变，变则通，通则久。\n\n就是我在这些年的看卦生涯中，我发现了很多人，他是意，他不是，\n\n意识不到错误，他能知道自己错了，\n\n但是他被沉没成本给拖垮了。就是很多人都会跟我说，哎，\n\n师兄，我知道不对，但是我都干了这么久了，我都付出了这么多了，\n\n我想再坚持一下，造成的结果呢，就是不断的累积沉没成本，\n\n越付出越多，越多越舍不得，直到把自己彻底的给拖垮掉。\n\n那想跨越阶级，你正确的做法应该是什么？\n\n是不断试错，哪怕投入的再多，\n\n也不恋战，只要走到死胡同，马上重新洗盘，马上重新开始，\n\n直到遇到一条可以走通的路，然后疯狂努力。\n\n第三就是懂得守其词。\n\n道德经的第二十八章有句话是这么说的知其雄，\n\n守其雌，天下为兮。就是你会发现很多人稍微有点成就了，\n\n他就开始装大爷，开始显摆，开始开始四处树敌，\n\n告诉你，但凡是这种人，他一定走不远。\n\n那很多人都会说，我没装大爷，我也没树敌，我只是显摆了显摆。但是你别忘了，\n\n人性深处最邪恶的东西是什么？是嫉妒，嫉妒之心会驱使着这个人做任何事情，\n\n但是他们不会嫉妒富豪榜上的任何一个人，\n\n他们只会羡慕他们，但是呢，他们会嫉妒身边的人稍微有点成就，\n\n这是人性。\n\n所以懂得藏起来，一定是你在上升过程中非常重要的一个技能。\n\n老人们常说闷声，发大财为什么？因为示弱才能大幅度的降低别人对他的警惕，\n\n用哭穷去挡住身边的吸血鬼，\n\n否则你稍微有点起色了，一定会被身边人拉下水，\n\n借钱，投资，帮忙，总之有无数种办法去收割你，\n\n有无数种道德绑架的方法。第四就是顶级的阶级背叛能力，\n\n我估计这一点很多人都会给出反对意见，\n\n但是经历过的人一定懂，就是你也可以去品啊。\n\n就但凡是混的不好的人，他们都讲究苟富贵勿相忘，\n\n而真正可以完成阶级跨越的人呢？\n\n他们会毫不犹豫的进行圈层切割。\n\n庄子的大宗师中有句话是这么说的泉和于，\n\n香与路。反正后面我忘了前半句了，\n\n后半句是相濡以沫，不如相忘于江湖。\n\n就是两条鱼在烂泥里面互相吐口水续命。\n\n听起来好像确实感人，但是你不觉得悲哀吗？\n\n与其相互感动，你为什么不赶紧去想办法跳回水里呢？\n\n所以第四点的核心是什么是变冷血，\n\n分清楚什么是你的事，什么是别人的事，真的这一点非常重要，\n\n否则在这个人情社会，你真的就会有帮不完的忙，\n\n操不完的心。天之道，损有余而补不足。\n\n人之道则不然，损不足以奉有余。\n\n人类社会的财富分配规律就是人之道，\n\n说白了就是掠夺那些那些认知不足的人，\n\n让他们双手把钱奉送给高认知的人。\n\n所以这四点他可以很快拉高你的认知，你只要记住并且刻在脑子里去执行他，\n\n你就一定是被人知道所供养的那一方。", "account_name": "博闻文化（目清师兄）", "account_owner": "博闻文化（目清师兄）", "account_type": "竞品"}, {"id": "7637872703499914874", "title": "赚钱最快的方式就是做个二道贩子#传统文化", "date": "2026-05-09", "likes": 2454.0, "comments": 72.0, "shares": 248.0, "collects": 761.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "", "account_name": "逸恒自在", "account_owner": "泓泓", "account_type": "本号"}, {"id": "7612331871233600741", "title": "缘起则聚 缘尽则散", "date": "2026-03-03", "likes": 2453.0, "comments": 98.0, "shares": 212.0, "collects": 540.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "人与人之间最残忍的真相就在于，一旦你们完成了彼此身上的课题，\n\n天道便会确保你们再无重逢之日。\n\n换句话说，就是所有的相遇，本质上都是一场阶段性的互补，\n\n碰巧你们在相遇的那一刻，你们从彼此身上各取到了所需，\n\n完成了某种因果的交互。所以，真的不用遗憾谁谁谁离开你，\n\n或者说因为谁的离开而难过。任何缘分都是从相遇的那一刻开始倒计时的，\n\n相遇就意味着你们会分开，\n\n分开就意味着你们要遇见下一位了。兰因絮果，一期一会。", "account_name": "博闻文化（目清师兄）", "account_owner": "博闻文化（目清师兄）", "account_type": "竞品"}, {"id": "7633035687243529123", "title": "原则就一个，放到一切离💰近的地方", "date": "2026-04-26", "likes": 2445.0, "comments": 178.0, "shares": 102.0 戾气都太重了，\n\n很多人都已经是千疮百孔了，\n\n赔钱，失业，破产，断供，关门等等一系列的事情正在不断的压垮他们，\n\n让他们越来越压抑，迷茫，焦虑，抑郁，自闭。\n\n所以很多人身上的怨气真的已经是随时可能爆发了，\n\n大多数人都是憋了一肚子怨气不知道往哪撒的状态，\n\n所以你可能不经意间的一个动作，\n\n甚至是不经意间的一个眼神，\n\n都会刺激到一个人，一旦爆发，他很有可能就会把他所有的怨气发泄在你的身上，\n\n即便你很强，最大不了就是他和你同归于尽，对吧？所以当下这个时候，\n\n尽可能的远离人群，尽可能的不要和陌生人发生摩擦，\n\n尽可能的不要把自己暴露在阳光下，\n\n尽可能的别在任何的社交场景中炫耀你人生的进展，\n\n否则你就是很容易会引起别人的嫉妒，\n\n然后暗地里把你当做当做出气的靶子。\n\n就昨天我一个客户去他闺蜜家，\n\n无意间发现了她最好的闺蜜，竟然给她扎了个小人，\n\n虽然这个东西没什么用啊，但说实在的，这个就像是吃了一只苍蝇一样，\n\n虽然影响不大，但是她恶心人啊！\n\n原因呢，就是因为她考上了一考上了一个一流大学，\n\n她闺蜜没考上。我还有一个客户，就今年过年的时候，\n\n家里工厂着火了，他以及他父母这么多年的心血。\n\n就一夜之间全毁了。最后一查监控，\n\n他发小放的原因呢，也是因为他赚钱了，\n\n但是发小没赚钱。\n\n就这种例子，我相信大家身边应该都比比皆是。\n\n所以当下社会，你不仅要遵循幸福者退让原则，\n\n你还要遵循幸福者消失原则。\n\n开车不要加塞插，排队的时候不要插队，\n\n公共场所打电话或者说话的时候不要太大声，碰到别人第一时间要说对不起，\n\n电梯里尽量往后站，\n\n因为你真的不知道外面的人，他们都是一个什么状态。\n\n所以保命法则是什么？就八个字谨言慎行，\n\n如履薄冰。道理非常简单，\n\n就是别人挨饿，你吃肉，这件事没关系，但是你不能吧唧嘴啊！", "account_name": "洪洞师兄(目清)", "account_owner": "洪洞师兄(目清)", "account_type": "竞品"}, {"id": "7589490064825011456", "title": "#随拍 #道家文化", "date": "2025-12-30", "likes": 2381.0, "comments": 56.0, "shares": 1584.0, "collects": 802.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "", "account_name": "博闻文化（目清师兄）", "account_owner": "博闻文化（目清师兄）", "account_type": "竞品"}, {"id": "7567704756644089137", "title": "#随拍#道家思想", "date": "2025-11-01", "likes": 2378.0, "comments": 166.0, "shares": 766.0, "collects": 433.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "", "account_name": "博闻文化（目清师兄）", "account_owner": "博闻文化（目清师兄）", "account_type": "竞品"}, {"id": "7611470504322821989", "title": "#随拍#道家文化", "date": "2026-02-27", "likes": 2372.0, "comments": 135.0, "shares": 348.0, "collects": 709.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "为什么好人没好报？因为宇宙不讲理道德，天道也不讲理\n\n道德。道德是人道的东西，是人制定出来的东西，\n\n和天道是没什么关系的。道德经讲天地不仁，\n\n以万物为刍狗。也就是说上面根本就不关心道德是什么。\n\n归根结底，道德它是社会规则，它和宇宙规则没什么关系，\n\n它是在法律之外用来约束人的。\n\n说白了就是它和婚姻一样，是维持社会稳定的产物。\n\n纵观历史你也会发现，它也和婚姻一样。\n\n不同的地区，不同的朝代，规则标准也是不同的。\n\n因为规则的建立者不同，所以道德标准也就不同，\n\n所以这个东西它是浮动的。就像是你小时候听话会获得奖励，\n\n但是你长大了进入社会如果听话的话，反而会让你受到惩罚。", "account_name": "洪洞师兄(目清)", "account_owner": "洪洞师兄(目清)", "account_type": "竞品"}, {"id": "7592122306722730937", "title": "给大家的新年大礼包正在努力准备中，希望大家收到后在新的一年里诸事顺遂、平安喜乐！#传统文化 #道系青年", "date": "2026-01-06", "likes": 2358.0, "comments": 257.0, "shares": 24.0, "collects": 46.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "一曲多天了，道不起当年天涯路远，谁人了解？如果花惹了白月下去北京沧海等风来，继续思念等可来。", "account_name": "逸恒自在", "account_owner": "泓泓", "account_type": "本号"}, {"id": "7601474302726130996", "title": "#道家文化 #随拍", "date": "2026-01-31", "likes": 2356.0, "comments": 156.0, "shares": 413.0, "collects": 499.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "", "account_name": "博闻文化（目清师兄）", "account_owner": "博闻文化（目清师兄）", "account_type": "竞品"}, {"id": "7628487614974564601", "title": "课题#国学文化 #道系青年 #智慧人生 #干货分享", "date": "2026-04-14", "likes": 2356.0, "comments": 100.0, "shares": 363.0, "collects": 534.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "为什么很多人明明彼此喜欢，却无法在一起？不是感情不够深，也不是谁做错了，是这段关系从一开始就不在同一条线上给人看着。这些年，我发现最让人心疼的不是被背叛，也不是被抛弃，而是那些明明两个人非常有感觉，但怎么都走不到一起。你说他不爱，他爱，你说你不爱他，你也爱，但就是不行。时间、身份、处境都不对，差的不是感情，是上面给你们安排的出场顺序。道德经说，天地不仁，以万物为刍狗，天地没有偏性，他不会因为你们的感情深就给你开路。缘分这个东西有他自己的时间表，你遇见他的时候，也许他已经有了自己的生活，也许你还没有长成他需要的样子。这不是谁的错，是剧本里的这一页就是这么写。从我们这行来看，这种事儿有一个说法，相遇是真的，但课题不是。\n\n是让你在一起，是让你们完成各自身上的某样东西。你在他身上看到了你缺失的部分，他在你身上照见了他需要面对的东西。等这个课题走完了，你们的缘分也走近了。易经说，时止则止，时行则行，动静不知其时，祈祷光明，该停的时候停，该走的时候走，顺着时机来，路才是量。感情也是如此，你拼命想留住一个留不住的人，你不是在爱他，你是在跟上面较劲。这些年呢，见过太多的人，在一段不可能的感情里泡了3年，出来的时候整个人都废了。不是感情伤了他，是他把自己困住，他走不出来，不是因为疼爱，而是甘心。你付出了多少，是你的选择，你的得到的，是上面的安排。这两件事从来不挂钩，前世不欠，今生不见，今生若见，必有应有，有些人出现在你的生命里。\n\n不是来陪你走到最后的，是来教一些你学不会的东西，等你学会了，这段关系也就圆满了。", "account_name": "逸恒师兄", "account_owner": "昭熹", "account_type": "本号"}, {"id": "7632167645257590139", "title": "提醒#传统文化", "date": "2026-04-24", "likes": 2347.0, "comments": 222.0, "shares": 638.0, "collects": 215.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "", "account_name": "逸恒自在", "account_owner": "泓泓", "account_type": "本号"}, {"id": "7538716577241566479", "title": "小道士的日常，观里忙碌而快乐的一天 #道观日常 #道系青年 #道家文化", "date": "2025-08-15", "likes": 2341.0, "comments": 181.0, "shares": 41.0, "collects": 32.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "儿是早碧透了，谁家的光苏细薄书衣苦十年寒窗。如今灯下仙途红袖天下半生浮名，只是虚妄三月一。", "account_name": "逸恒", "account_owner": "泓泓", "account_type": "本号"}, {"id": "7601093349568142708", "title": "每个物件都是踏踏实实走了流程的，愿大家收到后，新的一年里，岁岁常安，事事皆顺意！#传统文化 #道系青年", "date": "2026-01-30", "likes": 2323.0, "comments": 881.0, "shares": 119.0, "collects": 101.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "上个视频爆了呢，想不到这么多人喜欢我们的手链，已经买了手链的原主们可以等一下啊，现在啊，正在加工，后续呢，还会走一些流酒千秋皆如风，更有沸雪酌与风与风。", "account_name": "逸恒", "account_owner": "泓泓", "account_type": "本号"}, {"id": "7612944686642567547", "title": "其实旺自己是有铉学的...#传统文化", "date": "2026-03-03", "likes": 2322.0, "comments": 77.0, "shares": 511.0, "collects": 241.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "其实望自己一定是有玄学的，站在挂失的角度说，真正能让自己一路走上坡路的人，都做对了一件事儿，就是不管人在哪儿，跟谁相处，他都只说好话。很多人遇到点事儿，他就抱怨吐槽，比如我最近太倒霉了，我根本赚不到钱，我怎么遇不到好人？别觉着这是过过嘴瘾，其实这绝对是在消耗你的气运，因为在玄学里，你的嘴巴就是最好的风水。归根到底，语言是有力量的，你天天喊穷叫苦，烂人烂事儿啊，他就会追着你跑。道家讲万物有灵，你越是敬重他，他越会竭尽所能的保护你，反之，你越嫌弃他，他就会越排斥你。", "account_name": "逸恒自在", "account_owner": "泓泓", "account_type": "本号"}, {"id": "7627361740359011603", "title": "福祸无门 惟人自召 #目清师兄 #道家文化 #感悟人生 #学习", "date": "2026-04-11", "likes": 2296.0, "comments": 108.0, "shares": 326.0, "collects": 732.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "一个汉卦的告诉你啊，一个人，一个正常人，想发财，想彻底好起来，其实非常简单，只需要记住并且理解太上感应篇里的8个字，记住这8个字，你的运气就将不可逆转的变化，福祸无门，为人自重。咱先不解释是什么意思，咱先来反向观想一下，一个人走下坡路本质是因为什么？\n\n是老天针对他吗？\n\n很明显不是。\n\n本质上是他自己想往下走。\n\n再说直白点，就是他不断的和，是因为他不断的在和烂人烂事儿纠缠，可能因为舍不得，可能因为懦弱，可能他根本就没想那么多，总之就是一个人走下坡路，一个人混不好，本质上就是他自身在不断的和烂人烂事纠缠，在不断的和不对的人，不对的事儿纠缠，然后这个过程中消耗了他大量的精气神儿，导致他没办法全力的面对生活，然后。\n\n生活就会走下坡路，就会好不起来。\n\n没错吧？所以你就会发现，这个社会上出现了两种人。\n\n第一种就是每天处理各种乱七八糟的事情，今天同事给他甩个锅，明天亲戚找他这个钱，后天朋友找他倒个苦水，她人生的大半气血全部都浪费在了这些乱七八糟的事情上。\n\n那第二种呢，就是极度的理智，任何人任何事儿，只要让他感到消耗了，不管对方是谁，哪怕是至亲至爱，他也会立刻止损什么，牵制他，他就放弃什么。\n\n那这两种人，你觉得哪一种会过得好？\n\n明显是第二种，因为当一个人强行切断了对他人的希望，强行把气血聚拢到自己身上的时候，他的生活必然是走上坡路的。\n\n但是很多人他不懂这个道理，他永远不知道人的承载能力是有限的，他永他永远都不知道一切都是用气血交换的。\n\n而人的气血是有限的。你别忘了。\n\n和小人纠缠，就没空维护贵人，接纳晦气，就装不下财气。\n\n所以开头那句话是什么意思？意思就是你想怎么生活，其实你是可以选择的。\n\n前几天我和客户聊天，他跟我倾诉他有多苦，他有多难，我说你真没多苦，你自己愿意和这些烂人烂事儿纠缠。\n\n然后纠缠的身心疲惫了，然后开始抱怨老天对你不好，实际上真的是对你不好吗？\n\n真不是，是你愿意纠缠。\n\n我说你这个就是又当又立啊。\n\n一边遇到烂人烂事儿舍不得断，一边又嫌麻烦，又觉得消耗你，又觉得自己命苦。\n\n我说，你看哪一个过得好的人，哪一个身居高位的人，哪一个实现阶级跃迁的人和你一样了？和你一样天天管别人的事儿了，和你一样天天掺和别人的事儿了，哪个不是把精力都放在自己身上了？\n\n我给人看卦，这些年，我是真的发现易经讲的同声相应，同气相求，真的是一点儿错都没有。普通人都认为灾祸和福气是从天而降的，但实际上呢，命运就是一面镜子，你做什么，它就回馈给你什么。种瓜得瓜，种豆得豆，真的太公平了。", "account_name": "博闻文化（目清师兄）", "account_owner": "博闻文化（目清师兄）", "account_type": "竞品"}, {"id": "7634829969894314331", "title": "没事就多带老婆买买衣服#国学文化 #道系青年 #智慧人生 #干货分享", "date": "2026-05-01", "likes": 2279.0, "comments": 68.0, "shares": 8805.0, "collects": 313.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "", "account_name": "逸恒师兄", "account_owner": "昭熹", "account_type": "本号"}, {"id": "7621136181190833787", "title": "究竟什么才是避谶#道家文化#提升自己#认知#目清师兄#张雪峰", "date": "2026-03-25", "likes": 2264.0, "comments": 103.0, "shares": 1137.0, "collects": 685.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "毕趁这个话题又登上热搜了，给大家又敲了个警钟。起因是张雪峰老师，一个改写了无数寒门子弟命运的引路人，倒在了他41岁这个本该大展宏图的年纪。紧接着网友就翻出了他20年的一条微博，大概内容就是别人问他，如果躺在躺在抢救室，他会想什么？\n\n他半开玩笑的说，我会想，千万别把我救过来，终于可以休息了。紧接着在几年后的昨天，也就是24号，张老师抢救无效走了。\n\n真的抑郁成谶了，紧接着全网就开始讲避称，首先这个行为确实关乎命运，确实重要，是否懂得避称确实关乎很多人命运的走向，但是我大概看了一下，没一个把避称讲明白的。\n\n说起谶，很多人都觉得是乌鸦嘴，觉得是乱说话招来了不好的事情。避谶呢，就是少说对自己不好的话，这个太浅了，我告诉你。\n\n其实B称它分为两个维度，首先最基本的就是说话这个维度。\n\n烦死了，累死了，这些类似的话本质上就是在造称嘛。太平经理讲言出虎口，气不于天，不可复收。大概意思就是在高维的视角里，语言根本不是毫无意义的，声波是你内在磁场和外在宇宙进行交互的一个物理接口，也就是神与气的交互嘛。\n\n每一句话都是一个能量代码，他会信，引来相等的事情。当你现在把穷、累、烦、枯死这些低、贫、衰败的词汇挂在嘴边的时候，本质上就是在不断的感召吸引这些。所以表层的逼称呢，就是多说些好话，给自己制造一个好的语言风水。不过这个太基础了，地身这个话题是我二四年开始讲的，当时全网1000多万人看过我的视频，紧接着全网的玄学博主就开始抄。\n\n也怪我当时没讲太细，就导致他们也没抄太细，今天咱着重讲一下深层的含义啊。\n\n避善绝对不是简单的多说好话，少说丧气话，这个太基础了，就只要是个会说话的孩子，他都会说好话。其实更重要的是什么？是脑子里念头的逼沉，这一点大多数人是做不到的。思维造成道家讲起心动念皆是风水，你大脑里每一次闪过的烂念头，本质上就是在潜意识里疯狂彩排你的失败嘛，对吧？这个比随口的一句丧气话更致命。太上感情篇里讲，夫心起于善，善虽未为，而吉神已随之，心起于恶，恶虽未为而起，而凶神已随之。这其实科学也不是不能解释。比如当你脑子里出现一个我不行，我害怕的念头是哪怕只有这么一秒钟，负面磁场肯定也锁定你了，因为你的心脏会收缩，你的气血会加速，这个时候你的磁场不存在，不变化。\n\n因为慌，因为乱，你的能量肯定会急剧下降，所以念头就是因果的种子嘛。\n\n所以真正的避称是什么？应该是控制念头。\n\n比如，你脑子里冒出了万一失败了怎么办？老板是不是在针对我这种恶性念头，你就应该强行压制他，不要顺着他往下想。再比如，你做事儿之前，你应该观想的是你成功的画面，而不是去预设你失败的场景。\n\n再比如，你看到别人开豪车住大房子，对吧？你的第一念头不应该是这钱不是好道来的。\n\n你可以想，他的今天就是你的明天，这个才是真正的逼尘开口造吉，这个太基础了，大家都会说好话。\n\n但是思维必胜一定是降维打击。如果仅仅是多说两句好话，你就能有好的命运的话，那这个世界的玩法太简单了，真正困难的是更深层次的控制念头，这才是逼事。", "account_name": "洪洞师兄(目清)", "account_owner": "洪洞师兄(目清)", "account_type": "竞品"}, {"id": "7627810188532606321", "title": "回归#国学文化 #道系青年 #智慧人生 #干货分享", "date": "2026-04-13", "likes": 2239.0, "comments": 128.0, "shares": 109.0, "collects": 266.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "你知道吗？一个人能量回归的时候，他的身上会发生一些变化，有时候自己可能都没有察觉，但是已经在走上坡路了。第一，心境比起一时的得失，短暂的利益，你更愿意去做长期且有复利的事情，面对外界的所有干扰和诱惑，你学会了屏蔽。第二，你的主体性变强了，你的目标感、边界感会逐渐的清晰，你不会选择再当老好人，而是学会了沉默和拒绝。第三，你开始学会给自己提供情绪价值，语言上也不会说那些负面的话，而是学会了肯定自己。当你的情绪不再焦虑，心力不再耗散，自然你就能把前方的路看得更清晰。当你的频率高了，万事万物都会来帮你。\n\n无声无量。", "account_name": "逸恒", "account_owner": "昭熹", "account_type": "本号"}, {"id": "7635842076411694378", "title": "这是一条关于财富的天机： #目清师兄 #随拍 #学习 #道家文化", "date": "2026-05-04", "likes": 2223.0, "comments": 69.0, "shares": 311.0, "collects": 889.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "", "account_name": "洪洞师兄(目清)", "account_owner": "洪洞师兄(目清)", "account_type": "竞品"}, {"id": "7625707982499712308", "title": "人生是一条长线，不要硬刚命运！ #目清师兄 #道家文化 #感悟人生 #学习", "date": "2026-04-07", "likes": 2217.0, "comments": 119.0, "shares": 350.0, "collects": 651.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "泄露个天机给你啊，有没有想过，现实层面里混的好的这部分人和混的不太如意的这部分人，他们的区别到底在哪？\n\n是命好不好吗？明显不是，天道是平衡的，不存在说谁能一直不好。\n\n那是努力程度的区别吗？很明显也不是，因为没有人会不想让自己的生活越来越好，那些躺平不再努力的，大概率也是连续受挫之后才没心气。\n\n但是，你绝对不能否认，他们也曾付出过努力。\n\n在这些年给人看卦的生涯中，我就真的慢慢的发现，其实这些过得好的人都是在有意无意中触摸到一条天道，他们在掌握了这条天道以后，很大程度上都达到了人生顺遂的目的。\n\n在周易的能量守恒系统里，叫天地盈虚与时消息，黄帝阴符经里写的是日月有数，大小有定，他们讲的大概意思都是。\n\n运势从来都不是一条直线往上的，天下所有的财富、机缘甚至是大运，都是有绝对的额度限制和保质期的。\n\n那为什么说这一部分人彻底明白并且接纳掌握了这条天道以后，人生会不可逆转的变好呢？\n\n咱先讲一个故事，我有一个客户，他是做主播的，我们是在他最火的时候认识的，那会儿我刷到过几次他直播，直播间一直就是5万人，6万人，多的时候七八万人。\n\n但是呢，他一个月就播个三四次，有一次我们俩吃饭，我就问他，我说你现在这么赚钱，你为什么不努努力啊？他说反正他火了，钱还不是什么时候赚都可以，我说真不是，我说你必须得明白，人的运势是存在周期性的，你可能过两年没有这么好，他说没事儿的，就算以后直播间人气下滑了，我有这么大粉丝量，我也能赚钱。结果就是第二年，第二年的后半年，将近第三年的时候，他在开播的时候，直播间就几千人。\n\n他心态崩了，播不下去了，开始视频带货，紧接着货出问题，账号被限流了。\n\n现在重新做账号也做不起来，生活肉眼可见的窘迫。\n\n我相信这个错误应该大多数人都犯了，所有过不好的人都犯了，这是一个认知的错误。\n\n什么错误的认知？就是人不是要一辈子一直赚钱，而是要在某一个周期里赚够一辈子的钱。\n\n我不知道有多少人能理解这句话，但是你必须得明白，你赚到钱真的不是因为你比别人聪明，而是因为天道的财富正好流经了你这里，就像大海涨潮一样，是有周期性的。\n\n但是，大部分人在顺境的做法是什么？发呆、庆祝、享受，以为自己好起来就不会落下去了，以为赚钱的机会是自来水拧开就有，但真不是啊。\n\n我上海的一个客户，那真的财富自由了，他太自由了。\n\n他那套四五百平的那个江景平层，据说就值一两个小目标，我不知道值多少钱，反正我就知道绝对是很贵。他卡里常年存着十位数，现在依旧是每天朝九晚五的上班。\n\n有一次我们俩聊天，我说你能不能给我的这个粉丝以及现在的年轻人们给点建议，我说我回去当素材，他想了半天，他就说了一个观点。\n\n就是想发财，就要对财富有一种极度的饥饿感和恐慌感，一旦发现自己正踩在运势的浪尖上，就要不断的告诉自己，这个风口马上就会过去，这个客户马上就会跑，这笔钱是我这辈子赚的最后一笔钱，带着这种末日感把执行力拉满，不要想着度假，不要想着怎么犒劳自己，不要想着赚够了，因为你不知道明天会怎么样，也不知道以后会怎么样。\n\n这个绝对不是贪婪。\n\n这是在天道的周期面前，对命运保持绝对的敬畏，真的，我当时我听完这个话，我说你真的活该有钱，你把道家的中心思想顺势而为算是理解透了，算是玩明白了。\n\n道德经讲物壮则老，是为不道，不道早已。其实意思就是当你觉得一切大好的时候，就是衰败的开始。\n\n我师傅早些年给我讲过一个比喻，我觉得非常恰当，就是他说人生是一条长途赛道，这条赛道上有山路，有乡间小路，有公路，有的人生来是越野车，有的人生来是小轿车，当然还会有自行车、电动车。\n\n正确的跑法是什么？是你如果是小轿车，那你就应该在山路上开慢点，然后到了公路上努努力。但很多人是怎么做的？他是一台小轿车，到了公路上飘了啊，觉得太轻松了，老子从此以后天下无敌，慢悠悠的开到了山路上呢，开不动了，开不动，他又急了，疯狂踩油门，然后抛锚，那你说是路不行吗？是车不行吗？好像都不是，是认知不对。\n\n希望你看到这条视频的时候，一切还来得及。", "account_name": "博闻文化（目清师兄）", "account_owner": "博闻文化（目清师兄）", "account_type": "竞品"}, {"id": "7632566675540635046", "title": "想要变好，记住这四个字：锁 绝 隐 聚#道家文化 #目清师兄", "date": "2026-04-25", "likes": 2214.0, "comments": 36.0, "shares": 899.0, "collects": 1392.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "", "account_name": "你的好朋友目清", "account_owner": "你的好朋友目清", "account_type": "竞品"}, {"id": "7597843765956541286", "title": "家里有小孩的千万要注意", "date": "2026-01-21", "likes": 2213.0, "comments": 78.0, "shares": 4374.0, "collects": 536.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "憋了好几天了，我觉得这个事儿还是得说一说，可能有点儿扫兴啊。就是从玄学的角度来说，我不建议任何家长在任何的社交场景中发布自己孩子的照片儿或者视频，包括也不要用孩子当头像、当壁纸之类的。尤其马上年底了，大家肯定会有各种各样的活动，免不了就得晒孩子几个点啊。首先道教认为孩子的元气如嫩芽，小儿无秀福，过度的曝光就像是气成风泽散打破巨蜥藏风的这个生长环境，说白了就像是让幼苗暴晒烈日，那后果就可想而知了。还有一点呢，就是孩子的照片或者是日常细节等信息暴露在这个公共空间当中，就很容易和外界的这个能量产生纠缠，比如嫉妒啊，恶意等等一些负面能量。总之就是小儿属假，过度晒照属于是露假。\n\n违背了这个赤子之真，守性以全其身的理论，所以希望大家都能注意一下吧。", "account_name": "你的好朋友目清", "account_owner": "你的好朋友目清", "account_type": "竞品"}, {"id": "7630086725558517219", "title": "#传统文化", "date": "2026-04-18", "likes": 2198.0, "comments": 63.0, "shares": 365.0, "collects": 229.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "当前的时代，真正的红利只有一个，就是保持身体健康。拼命的时代过去了，保命的时代来了，因为现在大家觉得不是工作、车子、房子，而是良好的心态和深度的睡眠。当大家在焦虑失眠的时候，你能闭目养神，神不外驰，你就是在聚餐。这个世界啊，只会留给两种人，身体好的人和心情好的人，身心健康才是你这辈子最稳的闭环。", "account_name": "逸恒", "account_owner": "泓泓", "account_type": "本号"}, {"id": "7606291885636494490", "title": "晚开的石榴往往是最红的#国学文化 #道系青年 #智慧人生 #干货分享", "date": "2026-02-15", "likes": 2196.0, "comments": 129.0, "shares": 261.0, "collects": 208.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "晚婚别发愁，迟来的缘分更长久。你看这个石榴树，开花晚，但是结出来的石榴往往是最红的。\n\n你心地善良，上面自然会给你挑选合适的伴侣。\n\n结婚不是赶火车，有时候急反而不好。\n\n当遇到那个一起面对困难，既温柔又相互理解的那个人，幸福自然就来了。\n\n而且婚姻都是在说明书里写好的，也是一个人报的体现，\n\n属于你的跑不了，不属于你的也强求不来。所以我们常说因缘天注定，\n\n不用急，顺其自然就好了。", "account_name": "逸恒师兄", "account_owner": "昭熹", "account_type": "本号"}, {"id": "7597655474788512505", "title": "#法务流通处", "date": "2026-01-21", "likes": 2168.0, "comments": 135.0, "shares": 109.0, "collects": 335.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "", "account_name": "博闻文化（目清师兄）", "account_owner": "博闻文化（目清师兄）", "account_type": "竞品"}, {"id": "7600754395362269681", "title": "#随拍#道家文化", "date": "2026-01-29", "likes": 2162.0, "comments": 45.0, "shares": 332.0, "collects": 593.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "一个人改运最快的方式是什么？其实就一个字，换。人的大运十年一换，但如果你嫌十年太久，你也可以主动去换自己的运。那么问题来了，怎么换？换什么？第一，换地场，也就是换水土。在九天应元，雷声普化天尊玉殊宝经中有提到过，夫风土不同，则禀受自溢。意思就是说，不同的地方，气候、水土会滋养不同的人，说白了就是一方水土养一方人。如果你在一个地方一直都翻不了身，一直赚不到钱，一直霉运不断，那就说明这个地方并不适合你。我们常说足旺流原吉，家贫走他乡，树挪死，人挪活。换个地方，换个水土，气运也就自然会发生变化。第二呢，就是换人场，也就是换圈子。近朱者赤，近墨者黑，你和什么人经常在一起，就会形成什么样的人品、人气，人气有人的地方就会有气场，什么样的人，什么样的气场，如果你身边个个都积极向上，那你也太颓废不了。第三，换意识场，就是换掉自己的认知，尝试接触一些之前没接触过的，尝试接纳一些。\n\n之前接纳不了的，很有可能就会从中发现新的机会，也可以尝试多读一些经典，因为书中自有黄金屋，如果实在读不下去，那就试一试行万里路，如果行万里路你也做不到，那就试一试阅人无数，多和不同的人去接触，多听前辈们讲讲道理，总之就是尝试用各种方法去打破你认知的局限。第4，换身体上，也就是换自己的生活习惯，早睡早起，坚持运动，少喝酒，吃点健康的东西，把自己的身体状态调整到最佳，你的头脑也会跟着清醒，你的执行力也会变强。就是我给人看事儿，这些年我就真的发现很多人他不是没有好运，是他好运来了，他没有一个好身体，他的执行力拉不起来，他有点儿有心无力的感觉，所以天大的好运，他也接不住，例如换自己的心念场。我们常说，一念启动十方身上阴阳好坏相伴而生。一件事情，如果你只关注坏的一面，那他就会无限糟糕。但是如果你往好的方向去想一想，其实也就那样，要么成功，要么成长，没有白活的一生。\n\n自助者，天助之，把自己的心态给他调整好，即便是身处低谷，也别太沮丧。人这一生三起三落，好的时候别骄傲，落的时候也别自负，我会过去。", "account_name": "洪洞师兄(目清)", "account_owner": "洪洞师兄(目清)", "account_type": "竞品"}, {"id": "7630463940891348270", "title": "社会上混得好的人，都做对了哪些事 #目清师兄 #道家文化 #感悟人生 #学习", "date": "2026-04-19", "likes": 2157.0, "comments": 96.0, "shares": 268.0, "collects": 772.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "", "account_name": "博闻文化（目清师兄）", "account_owner": "博闻文化（目清师兄）", "account_type": "竞品"}, {"id": "7610671103263019328", "title": "你总想去窥探掵运，殊不知连窥探本身也是你掵中的一环，直到有一天被伤透后，你不看了，决定顺其自然，可连不看同样也是你掵中的一环。 做这行这些年，最大的感慨是，如果没端起这碗饭，我绝对想象不到，这世上有这么多被“情关”扼住咽喉的人。二十多岁的小姑娘，会问我为何总遇渣男，总被男人短择；三十出头的女生，会倾诉一路感情的不顺，问我何时才能遇到那个对的人；甚至四十多岁的大姐，求我如何斩断老公在外面的纠缠，不甘心在婚姻里就此放手。 爱恨嗔痴、众生皆苦，一个“情”字，困了多少人的一生？ 这世间的感情，论不清对错，有人求不得，有人守不住，有人醒不来，也有人放不下。 我也懂来找我的人，要的不是对感情的空头承诺，只是那份说不出口的委屈，能在茫茫人海中，能被懂的人稳稳地接住一次。毕竟人生就是这样，身在局中时，难免觉得情就是全部；只有帮你跳出剧本，你才知道天地有多宽阔。 最后想跟你说：缘来不拒，缘去不留，如果觉得在这段关系里太累了，别硬扛。给自己一个喘息的机会，无论多么艰难，请永远善待自己，请相信，剧本里的烂摊子，一定会翻篇。 #碎碎念", "date": "2026-02-25", "likes": 2147.0, "comments": 148.0, "shares": 54.0, "collects": 117.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "", "account_name": "逸恒", "account_owner": "泓泓", "account_type": "本号"}, {"id": "7580252124639643001", "title": "#随拍#法物流通处", "date": "2025-12-05", "likes": 2146.0, "co le": "#道家文化 #随拍", "date": "2026-01-03", "likes": 2085.0, "comments": 75.0, "shares": 1374.0, "collects": 331.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "", "account_name": "博闻文化（目清师兄）", "account_owner": "博闻文化（目清师兄）", "account_type": "竞品"}, {"id": "7637125649726990321", "title": "还清了就了了#国学文化 #道系青年 #智慧人生 #干货分享", "date": "2026-05-07", "likes": 2055.0, "comments": 160.0, "shares": 441.0, "collects": 310.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "", "account_name": "逸恒师兄", "account_owner": "昭熹", "account_type": "本号"}, {"id": "7627455707784252699", "title": "要赚一辈子的钱，而不是一辈子都在赚钱 #目清师兄 #道家文化 #感悟 #学习", "date": "2026-04-11", "likes": 2048.0, "comments": 56.0, "shares": 316.0, "collects": 622.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "一个看卦的告诉你啊，一个人，一个正常人，想发财，想彻底好起来，想达到现实层面，混的所谓还不错，其实只需要记住并且理解周易里的一句话，记住这句话，你的运气就将会不可逆转的变好。齿惑之虚以求身也，龙蛇之蛰以存身也。先不解释是什么意思啊，咱先来想一下，普通人之所以普通，之所以窘迫是因为什么？首先排除性格、家庭、学历、长相、才华等等这些表面的相，因为这些虽然重要，但并不足以拖垮一个人。那你说是命运？努力？智商吗？很明显也不是，因为天下万物分阴阳，阴阳各掌物极其平衡，每一个人都会平等的享有一些优势。就比如性子急的人，性子急可以是缺点，但也可以是优点。再比如头脑灵敏的人，脑子转的快可以是优点，但是在很多事情上也是缺点，所以这些明显也不是决定性因素。我告诉你是什么，是普通人都有一个非常致命的心理绝症，他们都极度的恐惧，无所事事，他们总觉得只要我每天还在忙，只要我还在折腾，我就一定会好起来。这个太扯了，你随便去观察任何一个有钱人，任何一个混的好的人，他们没有任何一个人是靠一辈子每天都在赚钱成为富人的，他们一定是在某一个特定的风口赚到了一辈子都花不完的钱。所以我经常说，人不要想着一辈子都赚钱，你要想的是怎么在一个周期里赚一辈子的钱，因为谁都不是超人，谁也没有办法一直保持高能量状态，所以你就会发。现这个社会上很直观的出现了两种人，第一种就是一辈子都在努力，运好的时候呢，赚点钱，然后运不好的时候再亏回去。第二种呢，就是会极其精准的，在好的时候猛猛的赚一波钱，然后在不好的时候继续停下来，好好休息。这一定是两种截然不同的人生。因为第二种人，他可以更大程度的把握好运，他在不好的时候休息够了，在上场的时候，他的状态是完美的。但是第一种呢，他永远在战斗，所以他的状态永远不会太好。人这一生，气血是有限的，心气是有限的，是存起来在顺境的时候一波打掉，还是逆境顺境都拿去一点点磨，一点点用？你的主观意识一定是可以选择的。所以开头那句齿惑之躯，以求深也，龙蛇之者，以存深也是什么意思？说白了就是潜龙勿用。你就算是条龙，肚子里有通天的本事，时机没到，你也得老老实实趴着折腾，就一定会有无数种办法惩罚你。而龙之所以是龙，不是因为它能飞多高，而是因为它能大能小，顺境的时候它兴风作浪，但是逆境的时候呢，它比虫子的姿态都低。这就是对天道绝对的敬畏，因为时势造英雄，而不是英雄造时势。比如没有秦末的天下大乱，那刘邦就是个泗水亭的流氓。没有元末的民不聊生，朱元璋就算是把骨头熬干了，他也是要一辈子的饭。所以看到这，我相信很多人都明白了应该怎么做，应该在好的时候把执行力拉满，好好做事，然后不好的时候，把心静下来，踏踏实。实的休息，因为人的一生三起三落，你不会一直顺利，也不会一直不顺利，重要的是什么？重要的是把握顺利的时候，躲过不顺的时候。", "account_name": "博闻文化（目清师兄）", "account_owner": "博闻文化（目清师兄）", "account_type": "竞品"}, {"id": "7609882279367987365", "title": "财发狠心人！#道家文化#提升自己#认知", "date": "2026-02-25", "likes": 2024.0, "comments": 102.0, "shares": 460.0, "collects": 607.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "", "account_name": "博闻文化（目清师兄）", "account_owner": "博闻文化（目清师兄）", "account_type": "竞品"}, {"id": "7587706821965958458", "title": "#随拍#道家文化", "date": "2025-12-25", "likes": 2022.0, "comments": 83.0, "shares": 499.0, "collects": 302.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "年底了，有一个非常重要的玄学提醒啊，但凡是今年过得还算可以的，\n\n有两件事千万别干。第一就是别买什么大件东西，比如太好的车子啊，\n\n房子啊这些。一个人的衰败和转折，往往都是从他购置了大件物品开始的，\n\n不要轻易的打破你钱财的这个流转。第二就是别四处炫耀，\n\n别和人争执，把自己在人群中彻底藏起来。静水深流离，\n\n火越来越旺，又赶上这个即将到来的这个赤马弘扬，\n\n浮躁的人越来越多，咱哪都挺好的，没必要。", "account_name": "洪洞师兄(目清)", "account_owner": "洪洞师兄(目清)", "account_type": "竞品"}, {"id": "7586606635688496421", "title": "#随拍#道家文化 #人生感悟", "date": "2025-12-22", "likes": 2022.0, "comments": 83.0, "shares": 252.0, "collects": 229.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "", "account_name": "博闻文化（目清师兄）", "account_owner": "博闻文化（目清师兄）", "account_type": "竞品"}, {"id": "7581779298600914234", "title": "这段时间逸恒有点忙，有些私信没能及时回复，请大家多担待。 翻私信的时候，看到太多朋友因为婚恋、情感发愁：有的受过情伤不敢再爱，把心门紧紧关上；有的被年龄推着相亲，相到心态崩溃来求安慰；还有人眼见身边人都成家了，自己却孤身一人，越等越慌张。 今天想对有这方面焦虑的你，说些心里话。 老话说，“姻缘自有天定，时机未到莫急”，因缘和合讲究的是什么？是水到渠成，就像春耕秋收，时机没到，再着急也没用。 对有些人来说，晚婚反而是对你最大的保护。你以为错过的是遗憾，其实躲过一场劫难。就像前段时间有个找我的粉丝，她在20几岁很懵懂的年纪就冲动的把婚结了，然后过来问我，自己在这段婚姻里度日如年，现在还能不能放手。 你看，年轻时多些磕磕绊绊，反而能让你更清楚自己想要的是什么；而立之后有了物质积累，才会让你在感情里更有底气，不必委屈求全。你现在的单身，只是剧本里的时机问题，该来的人还在披荆斩棘向你走来。 所以，别让焦虑打乱自己的生活节奏。好好享受美食，没事晒晒太阳、逛逛公园，把自己照顾好，当你心态平和，生活越来越顺，整个人活得鲜活又明亮的时候，同频的美好也会悄悄向你靠近。 最后，愿各位历尽千帆，终能遇见属于自己的幸福。 你的朋友 逸恒#碎碎念 #缘分 #道系青年", "date": "2025-12-09", "likes": 2018.0, "comments": 124.0, "shares": 43.0, "collects": 51.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "", "account_name": "逸恒自在", "account_owner": "泓泓", "account_type": "本号"}, {"id": "7621034390373666084", "title": "千万不要过早固化自己的人生！ #目清师兄 #道家文化 #提升自己 #认知", "date": "2026-03-26", "likes": 1991.0, "comments": 70.0, "shares": 289.0, "collects": 648.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "不要和任何人分享我今天说的这个内容啊，因为这个社会从来不鼓励大家去研究上升通道，有史以来，任何组织都在千方百计的让你沦陷在奶头溜里，为的就是封死你的上升通道。\n\n他们好更安稳的享受更多资源嘛，对吧？今天这条视频我站在一个挂失的角度跟你聊，一些学校不教，父母也不懂得人生真相就是一个人要一个人彻底好起来之前，他要做的事情绝对不是早早的买车买房，结婚生子。\n\n绝对不是早早的把自己的圈层，把自己的人生固化起来，这样你就好不起来了，而是要尽可能的让自己和周围的一切物品处在流动当中，用流动创造新的人生，创造新的世界。\n\n别急着反驳，咱从科学和玄学的角度拆开讲。首先科学角度讲，一个人如果长期处于稳定的状态，他的决策力，他的判断力都会进入进入一个休眠状态，这就好像你只要一回到家里，你就会自然放松，这是一个道理，因为没有危险，因为一切都是按部就班的，你的大脑自然而然的就会放松警惕。\n\n反过来呢，你会发现你开始流动起来，你走出去，你的大脑是亢奋的，你的感官灵敏度、决策力、观察力、行动力都会瞬间被拉起来，你会变得亢奋。\n\n这是人类基因里的东西，你的基因就会告诉你外面有风险，必须要打起精神。还有就是空间决定机会密度，这也是一个很科学的理论，什么意思？就是你接触的空间越大，你遇到的人、事、物，遇到的信息就会越多，你能抓住的机会就越多。\n\n听起来很悬，但是仔细想想，你会发现其实就是个概率问题。\n\n你想一下，你每天三点一线，两点一线，你能认识谁？同事、同学、家人、外卖小哥，对吧？你能接触到什么信息？公司的八卦，朋友圈的广告，短视频的算法推荐，但是一个经常出门的人呢？他的人生就多了无数种可能。\n\n玄学角度呢，就是人会被环境带来的能量场所影响，当能量流动起来，财富自然也就会跟着流动起来。\n\n因为我们自身的能量一定是不够平衡的，我们必须要多接触大自然里的水元素、风元素、火元素、土元素这些。\n\n这些才能让我们身体的能量流转起来，流通起来。人人都说走运，走运嘛，就是走起来运才回来，一方水土养一方人。\n\n不同的环境，滋养的人一定是不同的，这就好比是一个池塘，它的水特别容易臭，但是活水呢，你看江河，江河湖海。\n\n它很难不清澈，很难有异味儿。\n\n我们可以再换个角度。\n\n你不多尝试，你是不会知道你到底适合哪种人生的。\n\n人生真的不是到了年纪就必须要结婚，必须要生子，必须要稳定下来的，包括就算你不到年纪，人生也真的不一定要求安逸的，每个人适合的人生是不一样的。\n\n所以，人在彻底好起来之前，要做的绝对不是早早的安稳，早早的求稳。\n\n早早的把自己的人生给固化起来，充分的把握流动的意义，加以运用到生活中，你的人生才会有无数种新的可能。\n\n否则你不用想了，你大概率会复制你父亲或者你母亲的一生，就这么简单。", "account_name": "博闻文化（目清师兄）", "account_owner": "博闻文化（目清师兄）", "account_type": "竞品"}, {"id": "7635340870249631010", "title": "一定要远离你身边的这三种人！！ #目清师兄 #随拍 #道家文化 #学习", "date": "2026-05-03", "likes": 1987.0, "comments": 83.0, "shares": 368.0, "collects": 636.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "", "account_name": "洪洞师兄(目清)", "account_owner": "洪洞师兄(目清)", "account_type": "竞品"}, {"id": "7594378039232892175", "title": "#道家文化 #随拍", "date": "2026-01-12", "likes": 1984.0, "comments": 55.0, "shares": 467.0, "collects": 450.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "", "account_name": "博闻文化（目清师兄）", "account_owner": "博闻文化（目清师兄）", "account_type": "竞品"}, {"id": "7581790304890850597", "title": "#随拍#道家智慧", "date": "2025-12-09", "likes": 1984.0, "comments": 59.0, "shares": 404.0, "collects": 185.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "", "account_name": "博闻文化（目清师兄）", "account_owner": "博闻文化（目清师兄）", "account_type": "竞品"}, {"id": "7625483566532611363", "title": "低谷期，其实就是在救你的命 #目清师兄 #道家文化 #感悟 #学习", "date": "2026-04-06", "likes": 1982.0, "comments": 102.0, "shares": 301.0, "collects": 609.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "低谷期就是在救你的命。有一个非常反常识的真相，就是你真正的成长，真正的蜕变，其实都发生在逆境，都是在你人生的低谷，最困难、最煎熬的状态下完成的。发生的就是我们必须承认一个残忍的真相，在这个世界上，我们做对的大部分事情都是源自运气，而那些我们做错的事情才是我们真实的实力。你所看到的任何一个人的强大、通透、杀伐、果断，全部都是来自于一次又一次的失败和苦难，无一例外。\n\n因为人在顺境是不可能成长的，顺境只会让你变得松懈、骄傲、自满。\n\n所以，你人生中遇到的任何一个战无不胜、非常厉害的人，都一定经历过一段人生的至暗时刻，都一定有过一段暗无天日，你无法想象的大起大落。\n\n然后才能换来他在高处的坦坦荡荡，坦然自得。\n\n那什么叫地步？什么叫治安？时刻就是赚不到钱，得不到爱。你曾经相信的，你曾经坚信不移的坚定永远都不会失去的，都会崩塌，你所有的付出都会付诸东流，你所有的努力都会被全盘否定。\n\n但是你必须搞清楚，这不是在折磨你，而是在救赎你。\n\n这是在打破你原有的认知，以让你更好的踏上新的人生道路，因为不破不立啊，对不对？不彻底摧毁是不可能彻底重建了，你只有经历了彻底的崩塌，你才能在废墟上建立新的认知，建立新的秩序，实现真正的脱胎换骨，凤凰涅槃。\n\n老话说，天欲福，人必先以为祸敬之。那什么是真正的脱胎换骨？\n\n你欠债满世界躲债，债主突然不催了，那是脱胎换骨吗？\n\n是涅盘重生吗？明显不是，你感情受挫，痛不欲生，每天醉生梦死，对方突然回心转意，是涅磐重生吗？\n\n明显也不是，这些都只是你暂时的绕开了困境，但是只要你的底层逻辑没有重建，你的认知没有提升，这些靠你侥幸躲开的困难在未来一定会十倍百倍的再次砸向你，因为问题没有被解决。所以真正走出低谷是什么？是你在逆境中彻底打破自己原有的认知，完全改变自己的行为模式，在下一次面对同样的事情时，你给出了不同的选择。\n\n这个阶段，你是只感受到了煎熬，还是认真的做出了改变，真的就决定了你以后会面对什么样的人生。有的人在低谷只感受到了痛苦，他毫无长进，那低谷期对他的意义就仅仅是折磨他。但有的人呢，开始自省，开始敬畏，开始承认自己的无知，那低谷期给他的意义就是一次全新的蜕变，就是一次涅盘。\n\n道德经讲知不知上不知之病，其底层逻辑就是，一个人如果没有经历过置之死地而后生，那他所拥有的所有东西都是没有根的，都是虚无的，都是可以瞬间失去的。\n\n逆境长毛病，逆顺境长毛病，逆境长本事，等你把所有的都失去了。\n\n把所有的失去都看作是天道为你挡下的灾难，把所有的意外看作是老天对你强行纠错，不再问为什么是我，而是开始思考这件事情能够给我带来什么经验，能够帮我改掉什么样的毛病。这个时候，你所拥有的所有东西都是扎实的，都是有根的。\n\n当下你觉得走投无路，10年之后你再回头看，你就会发现，正是当年那场把你逼上绝路的变故，逼你长出了翅膀。所以，不要抱怨低谷，享受低谷，在低谷期尽可能的学习，尽可能的长本事。", "account_name": "博闻文化（目清师兄）", "account_owner": "博闻文化（目清师兄）", "account_type": "竞品"}, {"id": "7631528277190062793", "title": "人生建议：一定要多打 是不具备分辨能力的，你是上头的。\n\n你如果失败过，你就可以回想一下，你当初做的决定，是不是真的挺不理智的，是不是都挺上头的？\n\n道家有一句话叫凡为辛苦，皆为强求。在当下这个社会，所有你辛苦找到的项目和机会，本质上都是为你专门设计的坑，只要你有我要找个项目干这种心态，你身上散发出来的那种焦虑和饥渴，在猎手的眼里，你就变成了行走的肥肉一块儿。\n\n那正确的做法，我们又要引入一个概念，就是财富是对你认知的奖赏，不是对勤奋的补偿。也就是说，你赚钱一定是你在某一个方面有独特的认知，或者在某一个方面有非常完善的认知，所以你能赚到钱。\n\n所以你该怎么做？你该在某个领域某个方面深耕，然后等个机会，因为人有冲天之志，非运不可自通，因为择一夜，谋士养命，等一运扭转乾坤，而不是每天毫无意义的奔波找项目，去相信那些三天回本五天暴富的鬼话。这个世界上就算真的掉馅儿饼，它也砸不到你头上，就算真的掉馅儿饼，你也得接得住啊，你没有锅，你可能会被砸死的。\n\n还是那句话，不要因为想创业而去创业，不要因为想当老板而去当老板，你要因为遇到了一个合适的机会去创业，去当老板。", "account_name": "博闻文化（目清师兄）", "account_owner": "博闻文化（目清师兄）", "account_type": "竞品"}, {"id": "7604386136957973937", "title": "快速转运的秘法#道家文化#认知#提升自己", "date": "2026-02-08", "likes": 1893.0, "comments": 46.0, "shares": 329.0, "collects": 679.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "这是一条关于运势的天机啊。如果你明明很努力，但是生活一直没什么进展，甚至越努力越糟糕，干来干去就像是竹篮打水，甚至负债，众叛亲离，人生失控，那么这条视频一定要耐着性子把它给看完。首先要明确一点，就是很多人倒霉并不是因为他真的到了霉运的年份。\n\n为什么？因为世间万物分阴阳，阴阳各占五，五极其平衡，这个是没有争议的，但是想过没有，很多人他的霉运占了6，甚至占了7，甚至占了8，占了9。\n\n所以很明显，这个问题是出在他自己身上的。\n\n是他自己先有问题，然后影响了这个运，而不是运有问题影响了他，这个顺序一定要搞清楚，所以我总结了几个特别管用的望远镜技巧，建议大家可以记住或者把它收藏好，状态不对的时候可以拿出来用一用，或者看一看。\n\n第一就是守住你的能量。\n\n很多人他运气变差，其实问题都出在了能量泄露，所以一定要学会清晰自己的边界，守护自己的能量，把乱七八糟的这个人际关系清一清，搞清楚什么是你的事儿，什么是别人的事，什么是你该关注的，什么是无所谓的，对吧？乱七八糟的人和事儿都直接不回应，不接话，不辩论，不生气，不纠缠，学会课题分离。\n\n什么意思？说白了就是别人的看法，别人的期待，本质上都是别人的课题。\n\n你选什么，信什么，怎么活是你的课题。\n\n落实到实际生活中呢？\n\n当别人提出一个要求，你需要做的就是要扪心自问，你是想做还是不想做。\n\n那么至于对方被拒绝以后，他是难受还是崩溃，或者是记恨你，本质上和你的关系不大，因为这个是他的课题。\n\n守住你的边界就是守住你的能量口袋。不让一些。\n\n歪瓜裂枣，随便伸手进来就逃走，你的运气这个非常重要。因为。\n\n很多小忙看似是帮了一下，但实际上呢，你就背了因果了，这个非常重要。第二呢，就是借掉你的比较之心。道理很简单，这个世界就像是一个台阶。\n\n你向上看，永远有人，向下看，也永远有人向上看你难免会自卑，向下看呢，难免会骄傲，所以你只要还在比较，你就是在恶性循环，就是我经常被问到的一个问题，就是。\n\n师兄，我是我身边谁谁谁都结婚了，我还单身，我好焦虑啊，或者师兄，哎，我发小今年赚了好多钱，我觉得他把我碾压了。\n\n就是给人看卦。这些年我发现大家的焦虑，大家的内耗，大家的着急，都是因为他们在做比较，但是大家都忽略了一个很重要的点，极有个性，你因为别人结婚了，你着急结婚，然后随便就找个人把婚姻定下来了，但是结婚以后呢，发现这个人并不太适合你。\n\n这个时候进也不是，退也不是。\n\n你因为看到别人发财了，你也着急创业，结果呢，干上干上以后发现项目并不完善，但是钱都投进去了，那么这个时候进也不是，退也不是，就是你会发现你一旦急，一旦开始比较，就会导致你步入一个特别窘迫的境地当中。所以。\n\n戒掉比较是非常重要的，因为它可以让你有一颗平常心，它可以让你的心平静下来，更冷静，更直观的去做选择，他可以让你更 ", "likes": 1861.0, "comments": 139.0, "shares": 436.0, "collects": 295.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "从玄学的角度来说，一个人的富运、婚运和子运是不太可能同时具备的，白话说就是，比如一个女人，她有个好父亲，那他就很难有一个好老公和出类拔萃的儿子。当然男人也是一样的，因为咱们普通人最大的特点就是普通，因为父亲、伴侣、孩子这三个当中能有一个厉害的就已经非常幸运了。当然现实生活中那种命特别好的大概能战胜两样，这种人就已经可以在人群中活得非常的风光体面了。", "account_name": "洪洞师兄(目清)", "account_owner": "洪洞师兄(目清)", "account_type": "竞品"}, {"id": "7628649403586219315", "title": "当你拿回主体性，你的人生才刚刚开始！ #目清师兄 #道家文化 #感悟人生 #学习", "date": "2026-04-15", "likes": 1859.0, "comments": 128.0, "shares": 315.0, "collects": 593.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "泄露个天机给你啊，给人看卦。这些年，我非常直观的看过无数翻身走好运的案例，\n\n也对比过无数从底层挣扎怎么都好不起来的案例。\n\n然后慢慢的我就总结出来了一个有点反人性的真相。\n\n就那些真正能够好起来的人，他们在走好运的第一阶段，都无一例外的做了一件事情，\n\n就是变得自私。\n\n先不用急着反驳我，咱一条视频讲清楚究竟是为什么。\n\n首先我们要明确一个点，就是这里的自私并不是世俗理解的为了自己的好处去损害别人的利益。\n\n这里的自私，你可以理解为是一种状态，\n\n在心理学上叫主体性，在我们道教呢，叫精神内守，叫借假修真。\n\n就是我们可以先观察一下身边那些怎么都过不好自己生活的人，\n\n他们的行为是什么样的。在工作的地方当老好人，\n\n在家里被破烂亲戚吸血，\n\n谈个恋爱处处迎合对方，生怕得罪生怕得罪任何人，处处谨慎，\n\n处处小心。但是他过好了吗？明显没有。\n\n为什么？因为他用了错误的逻辑去玩人生这场游戏。\n\n庄子在无庸论里讲山山木自寇也高火自坚也。\n\n桂可食，故乏之其可用，故搁之。\n\n就是本质上，他们太不自私了，他们完全丧失了自己的主体性，\n\n他们成为了别人世界里的耗材，\n\n成为了别人世界里的工具，那他凭什么过得好？\n\n这就好像是你会在乎你们家门的感受吗？\n\n还不是想摔就摔。那咱再说直白点，\n\n这些丧失了主体性的人，他们和大门有什么区别？他们就是一个工具啊。\n\n但是反过来呢？你？去看那些过得好的，\n\n首先他就没有那么多烂好心，他绝对不会主动讨好或者迎合谁，\n\n因为他知道别人怎么看他，和他半毛钱关系没有，他的时间精力是用来服务自己的，\n\n不是用来迎合别人的。\n\n这就是清静经讲的人能常清静，天地悉皆贵。其次就是他们绝对不会主动去帮谁管谁，\n\n他们拒绝谁都没有负罪感，\n\n他们有一个明确的边界，任何人都不能打着亲情、友情的幌子来道德绑架他。\n\n还有更重要的一点，就是这部分人，他们因为自己活得自私，\n\n自己不帮助任何人，所以他们从来不会指望任何人来帮助他，\n\n他的希望不会寄托于外界，\n\n他的所有需求，经济需求，精神需求，他都会自己努力满足自己，\n\n久而久之，他越来越强，这就是一个良性循环。你会发现，\n\n那些过的不好的，归根结底是为什么？因为他对别人好，然后他就希望别人对他好。\n\n他的时间用来服务别人，所以他希望别人也来服务他。\n\n但是我不理解，为什么不能直直接自己服务自己呢？\n\n这就是典型的交换思维和弱者逻辑。但是别忘了，\n\n别人对你的态度，永远只取决于你的绝对实力和你对他的利用价值，\n\n这和你是否尊重他，是否对他好没有一点关系，\n\n甚至可能你对他越好，他越看不起你。\n\n恩生于恨，恨生于恩，就是这个道理。所以我开头说，\n\n一个人是否足够自私，真的就决定了他这一生是否顺遂。\n\n你这一生拢共就三万多天，为自己活，真的是理所应当。", "account_name": "博闻文化（目清师兄）", "account_owner": "博闻文化（目清师兄）", "account_type": "竞品"}, {"id": "760395828 , {"id": "7592899577297063203", "title": "#道家文化 #随拍", "date": "2026-01-08", "likes": 1642.0, "comments": 55.0, "shares": 311.0, "collects": 897.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "", "account_name": "博闻文化（目清师兄）", "account_owner": "博闻文化（目清师兄）", "account_type": "竞品"}, {"id": "7609885847866097765", "title": "你同情谁你就会背负谁的命运！#提升自己#道家文化#认知", "date": "2026-02-24", "likes": 1640.0, "comments": 59.0, "shares": 270.0, "collects": 382.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "分享一个关于命运的天机啊，这是一个全网没有人敢告诉你的玄学铁律，\n\n也是一个挂失干了十几年总结出来的一个保命法则。\n\n就是我在这些年，我很直观的看过无数个翻身走好运的案例，\n\n然后慢慢的我就发现了这个有点反人性的真相。\n\n确实啊，咱身处人情社会，但我还是想说，就是你共情谁，\n\n你就会背负谁的命运，而你一旦背负的多了，你最后一定会被拖进深渊。\n\n就是你会发现那些过得不好的人，\n\n越是过得不好的人，他就越喜欢操心别人，\n\n但是他们都不知道的是，人的精力是有限的，\n\n你的注意力放在哪，就决定了你会收获什么。\n\n就非常非常直观的一个例子啊！\n\n为什么大多数人发家是背井离乡发的家，不是在老家发家，\n\n枪过没有？张三是河北的，他去河南发家了，\n\n李四是河南的，他去河北发家了。那你说是地方的问题吗？\n\n真不是，归期根本是，为什么？是因为他们跳出了这个人情圈子，\n\n他没有那么多牵绊，他不需要考虑太多事情，\n\n他可以非常专注的去做自己的事情，\n\n所以他把事情做好了。玄学中有个词叫磁场共振，\n\n说白了就是你把注意力放在哪，你的磁场就会和哪和谁纠缠到一起。\n\n你可以想一下，如果你每天纠缠的都是一些乱七八糟的事情，比如\n\n王五的，王五家狗死了，\n\n招六家猫病了，刘七家打架了，\n\n你都要去管管，都要去看热闹，都要去掺和一下，\n\n那长此以往，你就把自己活成了一个一个居民管委会的大娘，\n\n对吧？但是大娘起码还有工资啊，你连工资都没有，\n\n你得多廉价呀，你怎么会好呢？\n\n我记得前两年我发视频说过，人变好的前提一定是锻炼出来了自己的钝感力。\n\n什么意思呢？其实就是\n\n外界发生了什么，你都不用太在意，因为本质上外界发生的大多数事情和你没什么关系，\n\n你即便去插手，\n\n你也改变不了什么。再说难听点，就是你连自己的人生你都没过的太明白，\n\n你就不要想着去帮谁脱离苦海了，\n\n你能管好自己，你就已经非常成功了，真的。", "account_name": "洪洞师兄(目清)", "account_owner": "洪洞师兄(目清)", "account_type": "竞品"}, {"id": "7632934381178997369", "title": "蛐蛐#传统文化", "date": "2026-04-26", "likes": 1631.0, "comments": 35.0, "shares": 121.0, "collects": 319.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "", "account_name": "逸恒自在", "account_owner": "泓泓", "account_type": "本号"}, {"id": "7597450545669882789", "title": "#随拍#道教文化#法物流通处", "date": "2026-01-21", "likes": 1607.0, "comments": 100.0, "shares": 113.0, "collects": 200.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "母鸡是下蛋的，咱这个叫钱母，已经一万多单了，好不好大家都有个评判，\n\n就即便是有几个明显的恶评，咱这个好评率也已经无限接近百分百了。\n\n道理很简单，因为咱这个是用前朝的标准印钱模板，\n\n一张一张做的印退，每一张都有独立的编号，每张背面都有我们师兄弟的签名以及我师傅手写的祝福语。\n\n流程走完了，道经师宝也给大家盖上了，\n\n收到以后，原则就是放在一切离前进的地方，\n\n过年了别忘了给家里人也带一张。", "account_name": "洪洞师兄(目清)", "account_owner": "洪洞师兄(目清)", "account_type": "竞品"}, {"id": "7614067254641012581", "title": "#随拍#道家文化", "date": "2026-03-08", "likes": 1607.0, "comments": 61.0, "shares": 317.0, "collects": 309.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "一个命好的女人，要么有一个厉害的父亲，这个需要靠命要么能驾驭厉害的男人，\n\n这个靠脑子要么能教育出厉害的儿子，\n\n这个靠言传身教。如果想要靠自身变厉害，\n\n那这个代价就太高太大了。而且，\n\n如果自己变厉害了，放在女人身上，那就不叫命好了，\n\n那叫命苦。", "account_name": "博闻文化（目清师兄）", "account_owner": "博闻文化（目清师兄）", "account_type": "竞品"}, {"id": "7599940509892726016", "title": "#道家文化 #随拍", "date": "2026-01-27", "likes": 1607.0, "comments": 64.0, "shares": 277.0, "collects": 300.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "", "account_name": "博闻文化（目清师兄）", "account_owner": "博闻文化（目清师兄）", "account_type": "竞品"}, {"id": "7625597199045350002", "title": "低谷期就是在救你的命！#目清师兄 #道家文化 #随拍", "date": "2026-04-06", "likes": 1603.0, "comments": 55.0, "shares": 543.0, "collects": 732.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "低谷期就是在救你的命。有一个非常反常识的真相，就是你真正的成长，真正的蜕变，其实都发生在逆境，都是在你人生的低谷，最困难、最煎熬的状态下完成的发生的。这是我们必须承认一个残忍的真相，在这个世界上，我们做对的大部分事情都是源自运气，而那些我们做错的事情才是我们真实的实力。你所看到的任何一个人的强大、通透、杀伐、果断，全部都是来自于一次又一次的失败和苦难，无一例外，因为人在顺境是不可能成长的，顺境只会让你变得松懈、骄傲、自满。所以你人生遇到的任何一个战无不胜、非常厉害的人，都一定经历过一段人生的至安时刻，都一定有过一段暗无天日，你无法想象的大起大落，然后才能换来他在高处的坦坦荡荡，泰然自得。那什么叫低谷，什么叫治安？时刻就是赚不到钱，得不到爱。你曾经相信的，你曾经坚信不移的坚定永远都不会失去的，都会崩塌。你所有的付出都会付诸东流，你所有的努力都会被全盘否定。但是你必须搞清楚，这不是在折磨你，而是在旧重，这是在打。\n\n过你原有的认知，你让你更好的踏上新的人生道路，因为你不破不立，对不对？不彻底摧毁是不可能彻底重建了，因你只有经历了彻底的崩塌，你才能在废墟上建立新的认知，建立新的秩序，实现真正的脱胎换骨。凤凰涅槃，老话说天欲扶人，必先以为活尽治。那什么是真正的脱胎换骨？你欠债满世界躲债，家属破然不催了，那是脱胎换骨，是涅磐重生吗？明显不是，你感情受挫，痛不欲生，每天醉生梦死，对方突然回心转意，是涅磐重生吗？明显也不是，这些都只是你暂时的绕开了困境，但是只要你的底层逻辑没有重建，你的认知没有提升，这些靠你侥幸躲开了困难，在未来一定会十倍百倍的再次砸向你，因为问题没有被解决，所以，真正走出低谷是什么？是你在逆境中彻底打破自己原有的认知，完全改变自己的行为模式，在下一次面对同样的事情时，你给出了不同的选择，这个阶段你是只感受到了煎熬，还是认真的做出了改变，真的就决定了你以后会面对什么样的人生。有的人在低谷只感受到了痛苦，他毫无长进，但低谷期对他的意义就仅仅是折磨的。但有的人。\n\n开始自省，开始敬畏，开始承认自己的无知，那低谷期给他的意义就是一次全新的蜕变，就是一次涅盘。道德经讲，知不知上，不知之病，其底层逻辑就是，一个人如果没有经历过置之死地而后生，那他所拥有的所有东西都是没有根的，都是虚无的，都是可以瞬间失去的。顺境长毛病，逆境长本事。当你把所有的都失去了，把所有的失去都看作是天道为你挡下的灾难，把所有的意外看作是老天对你强行纠错。不再问为什么是我，而是开始思考这件事情能够给我带来什么经验，能够帮我改掉什么样的毛病。这个时候，你所拥有的所有东西都是扎实的，都是有根的。当下你觉得走投无路，10年之后你再回头看，你就会发现，正是当年那场把你逼上绝路的变故，逼你长出了翅膀。所以，不要抱怨低谷，享受低谷，在低谷期尽可能的学习，尽可能的长本身。", "account_name": "你的好朋友目清", "account_owner": "你的好朋友目清", "account_type": "竞品"}, {"id": "7629285918066834011", "title": "变好之后一定要提前饲灾！#道家文化 #目清师兄 #学习", "date": "2026-04-16", "likes": 1584.0, "comments": 46.0, "shares": 808.0, "collects": 564.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "说个玄学啊，如果觉得自己某一阵运气特别好，状态特别好，赚钱顺利，感情顺利，这个时候千万别得意忘形，你要立刻马上做一件事情，就是提前四灾，也就是厄运对冲。皇帝宅经中有句话这么说的，欲求大吉，必先小凶。咱先不解释这些是什么意思啊，咱先设想一下，为什么普通人他的好运维持不久，比如赚钱达到某一个位置，30万、50万或者100万就，然后就不管再怎么努力，都没办法再往上递增了，只要钱一到这个数字，就会有各种各样的事儿找上门，不是家人生病，就是东西坏了，再或者就是莫名其妙的被坑一遍，硬生生的让他把这笔钱给花掉。我告诉你这是为什么？因为这个世界的运行规律就是物极必反，乐极生悲，祸兮福之所以，所以四灾厄运对冲的意义就是牺牲一些可控的小损失来换取命运的豁免权。\n\n本质上四灾是一种平衡，知道就包括我很多大客户，就是现实层面混的比较好，比较有钱的那些，他们如果在一个阶段没发生点儿小意外之类的，他真的会非常棒，因为他知道这很有可能是在憋个大的，因为他们知道这个世界上所有的好运都是有代价的，如果你不主动去付这个代价，那么上面就会连本带利的拿走这个代价，注意是连本带利。至于怎么私灾，其实也并不难，比如你突然赚到一笔钱，或者项目极其顺利的时候，你可以主动破点财，比如拿点钱捐掉，或者分给员工，或者请客吃个饭买个单之类的。当然了，如果你实在舍不得，你可以去干点脏活累活或者爬个山，对吧，用汗水和疲惫去抵消一下也是可行的嘛，但总之就是千万不要追求长期的顺利，很多时候生活中突然出现一些小意外，比如车有点剐蹭，或者遇到个烂人恶心你一下，或者是被人占个便宜之类的，你真的不用当成坏事。\n\n这都是用来平衡你的，好的，这个叫小凶化大劫。易经讲一阴一阳之谓道，你不可能只占福，也不可能只占祸，当然你也不可能只占福不占货，你也不可能只占货不占福。所以真的任何时候别太贪心，你不会什么都有，也别灰心，你不会什么都没有，得到的多了，就想办法散出去一些，为的是平衡人。如果一个周期什么都得不到了，也别灰心，这很有可能是在平衡你接下来的好人生就是这样起起落落。但是一定要切记，你不会把好事儿占尽，你也不会把坏事儿占尽，因为上面要维持平衡。", "account_name": "你的好朋友目清", "account_owner": "你的好朋友目清", "account_type": "竞品"}, {"id": "7569514562223918459", "title": "#随拍#道家智慧", "date": "2025-11-06", "likes": 1580.0, "comments": 42.0, "shares": 545.0, "collects": 176.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "手镯、手表、手链都要往左带，不要听什么左金右银。咱们老祖宗讲究的是左进右出，还有就是你不要在你手上、身上带太多的首饰。你首饰多，你可以换着戴，但是咱不能搞得跟潘家园大爷一样，对吧？最后 "你的好朋友目清", "account_type": "竞品"}, {"id": "7526169331542232377", "title": "上次讲了找老婆的，这次讲讲找老公的面相技巧#道教文化", "date": "2025-07-12", "likes": 1520.0, "comments": 325.0, "shares": 2217.0, "collects": 356.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "找老公尽量找圆脸方脸的，找那种贱眉或者卧蚕眉的，杂乱无章或者断眉的，尽量离远点，找鼻梁挺直，鼻头有肉的，不找鼻梁塌陷或者鼻头尖尖的，额头得找宽阔饱满的，不能找额头窄小凹凸不平的，要找眼神坚定清澈明亮的，别找飘忽不定，经常眯眼的，找下巴圆润有肉的，别找下巴尖尖或者往后缩的。", "account_name": "洪洞师兄(目清)", "account_owner": "洪洞师兄(目清)", "account_type": "竞品"}, {"id": "7583677143747104037", "title": "#随拍#道家文化", "date": "2025-12-14", "likes": 1510.0, "comments": 204.0, "shares": 707.0, "collects": 320.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "不管男女老少啊，都不太建议穿偏衣，老时候管这玩意儿叫鸳鸯衣，还叫绝离。什么情况下要穿呢？比如童年的夫妻，一个先走了，另一个就要穿，还有生孩子夭折了，下一个就要穿。总之，这个东西一定要注意一下。", "account_name": "洪洞师兄(目清)", "account_owner": "洪洞师兄(目清)", "account_type": "竞品"}, {"id": "7631869097807203313", "title": "收到后就放在一切离💰近的地方", "date": "2026-04-23", "likes": 1500.0, "comments": 119.0, "shares": 58.0, "collects": 120.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "", "account_name": "逸恒自在", "account_owner": "泓泓", "account_type": "本号"}, {"id": "7629173431354936586", "title": "记住这四破四立，快速拉开你和同龄人的差距！！ #目清师兄 #道家文化 #感悟人生 #学习", "date": "2026-04-16", "likes": 1479.0, "comments": 45.0, "shares": 241.0, "collects": 530.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "一个看卦的告诉你啊，一个人，一个正常人，想要混的不错，或者说想要和其他人拉开差距，其实并不难，只需要记住道家棋书画书中的这四破四立，只需要记住这四破四立，你肯定比周围人优秀，肯定比周围人过得好，肯定能和周围人拉开不小的差距。\n\n破于善利无情，破嗔怒立掌控，破成负利内守，破虚妄利藏锋。\n\n咱今天把它拆开来，一个一个讲，首先破于善利无情，这其实也完美对应了道德经中的天地不仁，以万物为刍狗。我在这些年的看卦生涯中，真的我发现绝大多数过不好自己生活的人，他们都有一个通病，就是太爱管闲事儿。\n\n看见谁有点困难，都想管一管，都想帮帮忙，最后帮来帮去。自己人生的大部分气血都消耗在别人身上，我还是那句话，人的气血是有限的，一切都是用气血交换的。普通人原本就少的可怜的气血，不拿来关注自己，不拿来做自己的事儿，他不可能过得顺利。\n\n为什么道德经的第5章开头就是一句天地无人，以万物为刍狗，其实就是在告诉你，这天下的万事万物都有它既定的发展规律，你不该也不能去掺和。这个世界上只有三种事儿，你的事儿，别人的事儿，老天的事儿。\n\n别人的事儿你掺和的多了，老天就自然要找你事儿了。所以真的一定要记住，无情一点儿，允许一切发生，反而是最大的慈悲。\n\n第二，破嗔怒力掌控。这其实也对应了黄帝阴符经中的宇宙在乎手，万化生乎身。这个世界唯一不变的就是一直在变。人活一世，本质上就是一个不断解决问题的过程，但是你会发现，这个社会上会出现两种人。\n\n有一种就是遇到问题就开始抱怨大环境不好，感情破裂就开始抱怨对方是个人渣，他遇到问题的第一反应是，凭什么这么对我，为什么我这么倒霉？另一种呢，从来不抱怨出现问题，解决问题，遇到问题，他脑子里只有这件事儿让我损失了多少，我怎么才能把损失降到最低？我下一次怎么避免类似的事情发生？\n\n这一定就造就了两种完全不同的结果，牛奶打翻了，你是站在原地，惋惜、愤怒、悲伤、难过，都没有任何意义。\n\n我师傅说过一句话，他说人在解决，人是在解决问题的过程中变强的，是在抱怨问题的过程中被弱化的。真的，我觉得说的太对了，今天分享给你。第三就是破成复力内守，这一点其实对应了黄帝内经中的恬淡虚无，真气从之，精神内守，病安从来。就是说一个人如果太关注外界，太在乎外界的看法，太关注外界发生了什么，他的先天气血是不可能聚拢到一起的。\n\n太关注外界的看法，你的动作就会变形，你会潜移默化的为了迎合外界的看法去改变你的行为。\n\n太关太关注外界发生了什么，你的注意力就永远没办法集中到自己身上。\n\n道教有一个词叫成负，就是说本质上每一个人都是一个能量载体，如果你承载的外界的事物太多，那么你就没办法承载自身的思，自身的思维，自身的好运。\n\n你就活成了一个傀儡，因为本质上每个人能承担的东西是有限的。\n\n所以，很大程度上，人生的修行其实就是一场内守的修行。\n\n第4就是破虚妄，立藏锋。道德经讲国之利器，不可示人。我在这些年的看卦生涯中，我是真的发现很多人都他不是没机会往上走，他是稍微有点进展了，他就马上开始炫耀，他在他太在乎别人怎么看到了。\n\n刚赚了点钱，马上贷款买个豪车，事情还没成，先和七大姑八大姨吹一遍。他们永远搞不清楚一个真相，就是这个世界上真的不是谁都希望你好的。人的嫉妒之心太恐怖了，他会驱使着这个人去做任何事情。\n\n所以你会发现，身边那些真正的有钱人，他们最怕的就是让别人知道他有钱。\n\n他们会尽可能的低调，尽可能的保守，至于别人怎么看怎么说都影响不到他，因为不重要，自己过得好，自己知道就行了。\n\n不破不立，大破大立，就这四破四立，破则自足，立则安生。", "account_name": "博闻文化（目清师兄）", "account_owner": "博闻文化（目清师兄）", "account_type": "竞品"}, {"id": "7590563110177509882", "title": "钝感力，很重要#随拍#干货分享#道家文化#人生感悟", "date": "2026-01-02", "likes": 1464.0, "comments": 39.0, "shares": 183.0, "collects": 316.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "所有的事情你都不要去管，核心就是4个不要，不要对每一件事都有反应，不要在乎和你无关的东西，不要操心你左右不了的事情，不要害怕还没发生的灾难。这些年有一句话，我一直把它奉为真理一样的存在，就是你不在乎什么，什么就会消失，你介意什么，什么就会层出不穷。说白了就是你要有钝感力，不管外面发生了什么，你都尽量不去关注，不去回应，只要是和你无关的事情，你都不要太在乎。\n\n你现在可以回想一下啊，就是你过往的人生中，是不是其实有无数件事情都是可做可不做，可关注可不关注的，比如。\n\n别人骂你一句，你要么就选择当下骂回去，要么你就选择隐忍，然后忘了他，但是你不能纠缠，你不能被他骂一句，你就难受一整天，甚至难受3天，难受5天，这个代价就太大了。再比如。\n\n别人说你胖，别人说你丑，这个其实本质上和你也没什么关系，就算咱真的胖，真的丑，那恶心的是他本质上和你也没什么关系，再比如哪一个流量明星谈恋爱了，谁谁谁出了点八卦，哪怕是身边的人谁谁谁有点丑闻。这些人其实。\n\n和你的关系也都不大，你完全没有操心的必要。再比如就是一些你完全左右不了的事情，你都没有去操心的必要，比如谁赚不到钱，再比如谁非要去撞哪个南墙，你都完全没必要操心。人的精力一定是有限的。\n\n当然。\n\n如果你活成了村口大娘那个年纪，或者说活成了村口大娘那个心态，你非常确定自己的人生不会有什么改变，有什么作为了，那你确实你可以拿个板凳，然后坐村口去参与一下，但是没到那个年纪之前，没到那个心态之前，你就得学会堡自己的这个注意力，锻炼好自己的钝感力。\n\n别那么敏感。", "account_name": "洪洞师兄(目清)", "account_owner": "洪洞师兄(目清)", "account_type": "竞品"}, {"id": "7637116 法。道德经里讲多言数穷，不如守忠。\n\n不管是你的语言还是你的念头。如果每天都是我太穷了，这件事成不了，我烦死了，我累死了，\n\n你日常生活中造的这些秤就会不断的给你吸引不好的事情，所以一定要控制自己的念头和自己的嘴巴。\n\n斩长尾说白了就是你需要清理掉大部分的人际关系。庄子在大宗室里讲相濡以沫，\n\n不如相忘于江湖。水干了，两条鱼相互吐口水和面，\n\n看似很感人，实际上有意义吗？你和那些天天给你找麻烦的亲戚，找你抱怨社会的酒肉朋友，\n\n只会消耗你，索取你的伴侣，本质上也是在相濡以沫。你们看似抱团取暖，\n\n看似很感人，实际上就是互相消耗。如果你人生大部分的气血精力都用来维护这些东西，\n\n你就不存在会有多余的精力去向上烦恼，展望新。你手里明明没有任何筹码，\n\n还天天想着遇到个贵人，想着中彩票，想着谁能良心发现对你好点。\n\n这些不切实际的期待，只会不断加重你的沉没成本。道家清静经中讲众生之所以不得真道，\n\n唯有妄性。说白了就是，不要指望，\n\n不要希望任何人来救赎你，你的生活变好了，就只有一种可能，就是你变好。\n\n第二，顿顿什么？炖财、顿智、顿贤。首先，顿财。老子曾经告诫孔子良骨深藏若虚，\n\n君子胜德，容貌若愚。意思就是人性有一个极其肮脏的底层在吗？\n\n就是他允许陌生人发呆，但是绝对不允许身边的人比自己过得好给人看发。\n\n这些年，我是真的发现了，人的嫉妒之心真的是太恐怖了，他可以驱使着人做出任何事情。\n\n我相信经历过的人应该都懂我在说什么。所以赚钱了，买好车了，买大房子了，\n\n都尽量不动声色，你越透明，你就越安全。其次，顿智。\n\n这点非常多的人都做不到，但其实不管是职场还是生意场，先牺牲的永远是那个显得最聪明，最能干的人，\n\n因为所有的烂活，所有的黑锅，都会扔给他。庄子中讲过一故事，\n\n山上长的笔直的树，全部被砍了，都没砍，只有那些长得歪瓜裂枣的那些树，\n\n因为无用，反而活了千年。这个其实就是无用之用，方为大用。\n\n不该你赚的钱，不该你出的风头，强行闭眼装瞎。除非你真的有那么聪明，\n\n否则你表现的过于聪明，对你来说一定是一场灾难。第三，顿心。黄帝阴不丁长积在目，\n\n天机暗藏。你的眼睛，你的表情，你的嘴，都是泄露你底牌的漏洞。\n\n事以密成，于以亵渎。事情没有百分百落地之前，钱没有彻底装进口袋之前，\n\n谁都不要讲，连神明都不要说。第三，畏因果。不第三，这个畏其实包含了很多，\n\n第一就是畏因果，然后畏淫，畏淫啊，畏人心。首先，畏因果太上感恩天天讲，\n\n福祸无门，惟人自召，善恶之报如影随形。比法律更严格的就是因果。\n\n比如你编一个谎话，这个是因，这个因就需要你用无数个谎话去圆，这个就是果。再直白一点，\n\n你喝酒喝了一晚上，这个是因，第二天一整天迷迷糊糊，这个就是果。所以，任何时候，\n\n切记因果是一只会回头的箭，害人终害己。为盈满呢？\n\n道德经的第九章讲驰而盈之，不如其己驰而锐之，不可长保。金玉满堂，\n\n莫之能守。永远记住，天道既满，妻才子如寿，普通人能得一二就已经是圆满了。\n\n别贪心，你不会什么都有也别灰心，你不会什么都没有。\n\n为人心庄子讲人心险于山川，难于知天。永远记住一句话不要高估你和任何人的关系，\n\n不要高估你和任何人的感情。决定人行为的是处境，绝对不是人品。\n\n合伙人、亲戚、伴侣，包括你的父母、你的至亲至爱，任何人你都需要防一手，\n\n不是因为你不信任，而是你需要对人性保持绝对的敬畏。第四，风风武贼风、底线风惊起\n\n道德经讲五色令人目盲，五音令人耳聋。\n\n这个世界就是一个巨大的多巴胺陷阱。短视频、游戏、画卷、新闻都在不断的盗取你的算力，\n\n盗取你的经历。实际上这些事情和你关系大吗？真的不大。\n\n修一点点顿感力出来，外面发生了什么你都不要太在意，专注好自己脚下的路，专注好自己的生活。\n\n封底线道德经讲鱼不可脱于渊，国之利器不可失。很简单，你的资产，\n\n你的底线，你的保底，都是你的利器。不管！别人怎么pua你怎么怎么道德绑架你，\n\n只要动了你的核心利益，立刻翻脸，封死你的底线，一步都不退，\n\n最后风惊起。黄庭经讲仙人道士非有神，鸡精累气已成真。\n\n泛滥的情欲，深夜的内耗，都是在用气血做交换。永远记住，一切都是用气血换来换来的。\n\n人的一生气血是有限的，做任何事情之前，先想一想，\n\n用你宝贵的气血所交换，到底值不值，然后再去做满目疮痍时，\n\n鲜血断臂求生。", "account_name": "你的好朋友目清", "account_owner": "你的好朋友目清", "account_type": "竞品"}, {"id": "763290926 nt_name": "逸恒", "account_owner": "昭熹", "account_type": "本号"}, {"id": "7612686527340104970", "title": "#随拍", "date": "2026-03-02", "likes": 419.0, "comments": 19.0, "shares": 74.0, "collects": 182.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "说个天大的秘密啊，就是站在挂尸的角度来说，有钱人为什么有钱，\n\n顺遂的人为什么总是可以心想事成？\n\n其实真的不是他们有多精于算计，而是他们在有意无意当中，\n\n触摸到了一条天道。\n\n这种视频我不知道能存在多久啊，但是我建议大家既然刷到了，就认真把它看完。\n\n因为这是一个挂失干了十几年，总结了无数人以后，\n\n对于财富的一个总结。因为如果你想要获取财富，\n\n你就必须要理解财富，否则你即便是走了狗屎运，\n\n获得了少量的财富，你也一定是驾驭不了的。\n\n咱废话不多说啊。首先我们要先引入一个概念，\n\n财富。它分为有形财富和无形财富。有形财富呢，就是你的车房存款。\n\n无形财富呢，就是能够驱使你获取财富的途径和资源。\n\n科学角度讲，\n\n就是你有没有学历，有没有专业技术，有没有社会经验。玄学角度来说呢，\n\n就是你有没有智慧，有多少气韵，你的取材手段是什么？\n\n你能扛得住多少财。那么毋庸置疑，\n\n智慧一定比学历更重要，取材手段一定比专业技能更重要。\n\n因为有高学历或者有专业技能的人，\n\n属于是士农工商的工部，他这一生成为企业骨干或者单位管理层的概率会更大一些。\n\n那么为什么我说智慧比取材手段会更重要呢？\n\n这个里面其实蕴含了一个道，\n\n世间万物的生发顺序，一定是从无到有的，\n\n对吧？你赚了多少钱，并不是因为你打工这个事件本身，\n\n而是你自身蕴含了多少能量，能够输出多少的内容和价值。\n\n这都属于是无的范畴。有呢，指的就是你有了初始能量以后，\n\n再把拥有的能量转化为物质的本事，\n\n对吧？这个时候你才能获得现实层面的财富。\n\n这就是对应了我刚才说的，世间万物生于有，\n\n但是有生于无。所以这也就是为什么很多企业十几年甚至几年就能够成为企业龙头，\n\n因为他在最初一定是选择了一个辐射极广，服务大众的行业去做的。\n\n所以财富的获取一定是和你所创造的价值划等号的。\n\n说白了就是你创造一份价值，你便获取一份财富。\n\n你服务的人越多，你获取的财富也就越多。\n\n比如说你服务你老板一个人，所以你就只能获得你老板的工资。\n\n而你如果每天服务一百个人呢，那就很有可能是一家小吃店的老板\n\n服务一千个人呢，你也许就是一家大超市的老板，一万个人呢，\n\n你也许就是一个短视频博主，对吧？总之就是你的初始能量越多，\n\n你输出的价值和兑换的货币自然也就会越多。\n\n讲到这，我相信很多人都会说，哎，\n\n师兄我是有这个觉悟的，别着急，咱继续往下讲。\n\n那为什么有这个觉悟的人，他还是赚不到钱呢？\n\n因为这部分人，他们自认为自己比较聪明，自认为认知高于身边的人，\n\n所以他会有惰性，这个惰性就会驱使着他，\n\n当他的生活水平受到威胁的时候，他才会爬起来去赚钱，\n\n那么这个时候其实恰恰就是他能量最低的时候。\n\n但是你仔细想一下，当你的生活一团糟的时候，\n\n然后各种事情牵扯着你，你能够？保证自身的精神状态是正常的就已经非常不错了，\n\n你怎么可能再有明辨是非的能力去做事呢？\n\n所以生活中很多人失败是因为什么？\n\n就是因为他越挫越勇，他从来不懂得养精蓄锐，\n\n也从来不给他的运一个爬升喘息的机会。\n\n所以任何低谷期的人来找我，不管他跟我说出多么惊天炸裂的项目和想法，\n\n我都会劝他缓一缓，让你自己缓一缓，也让你的运缓一缓。\n\n我常说的一句话就是人有冲天之志，非运不可自通。\n\n虽然躺平不会让你的状态变好，但起码不会让局面更糟。\n\n所以千万不要等到自己的生活水平已经受到威胁了再去起来做事，\n\n这个时候你是做不了的。\n\n而且这里我们又要引入一个概念，就是总结来说就一句话，\n\n我不多解释啊，听不懂的反复反思，直到你理解为止。就是你不要因为想创业而去创业，\n\n你要因为遇到了一个合适的项目再去创业。\n\n我可以很负责任的告诉你，很多人一生的失败都是因为他不懂这句话。\n\n那么这个时候肯定会有人说，\n\n这些我都理解，师兄，我也没有在状态很糟的时候才去努力，我也没有在很顺的时候躺平休息，\n\n但是我还是赚不到钱。\n\n那么我们继续往下讲，我们又要继续引入一个概念，\n\n就是你不理财，财不理你，世间万物都要讲究一个平衡对吧？\n\n而一旦失衡，关系就会破裂，然后就会相互失去\n\n对吧？说白了就是如果前面的错误你没犯，\n\n那么你很有可能就是没有学会维持你和才的平衡。\n\n那么什么是平衡呢？举个例子啊，张三二四年攒了十万块钱，\n\n他年底的时候为了奖励自己，首付了一台三十万的车子。\n\n李四呢，二四年攒了八万块钱，他全部存到了卡里。\n\n那你觉得他们两个谁赚到大钱的概率更大呢？\n\n一定是李四，因为他二五年二六年对吧？\n\n现在是二六年，二六年开年就可以拿着八万块钱继续滚雪球，\n\n他的雪球是从八万开始往上滚的。而张三呢，\n\n他背上了车贷，开年如果赚不到钱，他就开始慌了，\n\n慌就会可能导致着他做出无数个错误的决定，\n\n一步错，步步错，然后踏入一个恶性循环。\n\n我记得有一位富豪榜上的人说过，就是我之所以可以持续赚钱，\n\n是因为我有底气，我有被动收入，我不会因为急而乱做去二，\n\n我不会因为急而去乱做决定。\n\n所以其实足以见得财富的分配是非常重要的一件事。说白了就是很多人，\n\n他败就败在了稍微看到点曙光的时候，他的虚荣马上上头，然后马上开始消费，\n\n他从来不给自己留后路，只要一顺，他就觉得哎，老子天下无敌。\n\n但是你一定要知道，任何人的好运都是有年限的，\n\n也许五年，也许八年，也许十年，\n\n总之就是花无百日红，人无千日好，你的雪球在这几年里滚起来也就滚起来了，\n\n如果滚不起来，你就继续过举步维艰的生活。\n\n就是我在近些年看卦的生涯中，我发现有很多人，\n\n他败就败在了他需要创业，他遇到好项目的时候，他没有本金，\n\n他一点积累都没有。说到这，我相信还有。\n\n一部分人以上说的这些，他自己全部都懂，但他还是赚不到钱。\n\n那你就可以检查一下你自身，你一定会有一个问题，\n\n过分节俭。我曾经在全真贯里的时候，\n\n我遇到过一对夫妇，他们每年都来烧香，但是他们从来不拜财神，\n\n因为他们相信勤能致富，他们只求平安。\n\n但是后来的故事是什么？是夫妻两个人每天打两份工，\n\n每天家庭的开销不超过十块钱，家里没有床，\n\n他是用木板搭了一个床，\n\n不是炕，不是农村的炕啊，是用木板搭了一个床，连床都舍不得买。\n\n等他的钱攒到四十万的时候，他们家孩子把胳膊摔断了，\n\n然后治病花了三十万。后来又攒，攒到一百万的时候，\n\n这家的男主人公骑摩托车撞了一个老大爷，然后赔了八十万。\n\n就日子过来过去，还是没有钱。如果你问我为什么？\n\n其实道理非常简单，就是他们把财富分配成了死水。\n\n大家都知道，财五行属水，那么水需要什么？水是需要流动的，\n\n它需要不断的流动，它才有可能会聚集成江河湖海，\n\n否则它就是一滩发臭的死水。\n\n他们还犯了一个错误是什么？他们确实渴望金钱，他们也确实穷怕了对吧，\n\n否则不会常年打两份工。但是他们忽略了一个点，\n\n富在树，树不在劳深。如果你只是想平稳的度过余生\n\n对吧？那么很简单，你够努力够勤劳就行了。\n\n但是我相信你能把这么长的一条视频看到现在，\n\n你绝对不是在渴望底层平稳的生活。\n\n所以你就一定要懂得一个道理，财富是对认知的奖赏。\n\n不是对勤奋的补偿。", "account_name": "你的好朋友目清", "account_owner": "你的好朋友目清", "account_type": "竞品"}, {"id": "7632906405277123018", "title": "高手都在用的顶级心法：借假修真#目清师兄 #道家文化 #知识分享", "date": "2026-04-26", "likes": 411.0, "comments": 13.0, "shares": 87.0, "collects": 171.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "", "account_name": "你的好朋友目清", "account_owner": "你的好朋友目清", "account_type": "竞品"}, {"id": "7507107837983509819", "title": "母鸡下蛋，钱母呢？#法器 #道家文化", "date": "2025-05-22", "likes": 403.0, "comments": 40.0, "shares": 49.0, "collects": 39.0, "duration" 间做合适的事儿。顺的时候骄傲老子天下无敌，虚度光阴，一旦不顺的时候，他就慌了，我得创业，我得给自己打鸡血，我得越挫越勇。但生活中很多人失败是因为什么？就是因为他越挫越勇，他从来不懂得养精蓄锐，也从来不懂得在合适的时间做合适的事儿，他从来不给自己的运一个爬升喘息的机会，也从来不让自己休息休息。所以任何处在低谷期的人来找我，不管他，不管他跟我说出多么惊天大裂的项目和想法，我都会劝他缓一缓，让你自己缓一缓，也让你的运缓一缓。我常说的一句话就是，人有冲天之志，非运不可自动虽然躺平，不会让你的状况变好，但起码他不会让你的局面更糟。你应该在你很顺利的时候多去做事，在你很顺利的时候别停下来，在你不太好的时候让自己适当休息。但是很多人把这个搞反了，这里我们又要引入一个概念，总结来说就是一句话，这里我不多解释啊，能懂的人肯定是能明白这句话有多。\n\n那么大连听不懂的，我建议你反复反思，直到理解为止。你不要因为想创业而去创业，你要因为遇到了一个合适的项目再去创业，包括婚姻也是一样的，你不要因为想结婚而去结婚，你要因为遇到了一个合适的人所以去结婚。我可以负责任的告诉你，很多人一生的失败就是因为他不懂这句话，那么这个时候有人就会说，这些我都理解，但是我还是赚不到钱，不急，我们继续往下讲，我们又要研究一个概念，你不理财，财不理你，世间万物都要讲究一个平衡，一旦失衡，这个关系就会破裂，然后就会互相失去，说白了就是这部分人可能就是没有学会维持你和财的平衡，一旦失衡了，你们就相互失去了。那什么是平衡呢？举个例子啊，张三二四年攒了10万块钱，他年底的时候为了奖励自己首付了一台30万的车，李四呢，二四年攒了8万块钱，他全部存到卡里了，那你觉得他们两个谁赚到大钱的概率更大呢？一定是李四，因为他开年就可以拿着他这8万继续滚雪球。\n\n他的雪球是从8万开始滚的，但张三如果开钱，赚不到钱，他就慌了，因为他背上了车贷，慌就会导致他做错无数个决定，慌不择路，一步错，步步错，极有特性。我记得某一位富豪榜上的人就说过，他之所以可以持续赚钱，是因为他有底气，因为他有被动收入，他不用为了生活的基本水平而去着急，不会因为急去乱做决定。所以其实足以见得财富的分配是非常重要的。说白了就是还有一部分人，败就败在他稍微看到点曙光的时候，虚荣马上上头，马上开始胡乱消费，他觉得老子又天下无敌了，他从来不给自己留后路。但是你要知道啊，任何人都好运，它都是有年限的，也许5年，也许八年，总之花五百日红，人无千日好。你的雪球在这几年里面，起来就滚起来了，滚不起来你就得继续过举步维艰的生活，我相信很多人可能会败在哪里，他需要创业，他遇到好项目的时候，他没有本金，因为他从来不积累。说到这儿，我相信还有一部分人以上说的这些。\n\n你全部都懂，但还是赚不到钱，那么你可以检查一下你的自身，你一定有一个问题，就是过分节俭，不冲突，和刚才说的不冲突。分享一个小故事，我曾经在全真观里的时候，我遇到过一对夫妇，他们每年都来烧香，但他们从来财神殿，从来不去，因为他们相信勤能致富，他们只求平安，只求家人顺间。但后来的故事是夫妇，这夫妇两个人每天都打两份工，他们家每天的家庭开销不超过10块钱，就当下收回。家里没有床，用木板搭了一个床，下面是用砖搭的，上面放了个木板，不是炕，只是搭了一个床。后来攒到40万的时候，孩子摔断了胳膊，治病花了30双，后来又攒到100万的时候，这个家的男主人骑摩托车撞了个老大爷，赔了80万，那这日子过去还是没钱，那你问我为什么？其实很简单，就是他们把财富分配成了死水，大家一定要明白一个道理啊，就是财五行出水，那么水需要什么？水需要流动，它需要不断的流动才有可能会会。\n\n欲成江河不害，否则他就是一摊发愁的死水。他们还犯了一个错误是什么？他们确实渴望金钱，他们也确实穷怕了，否则他不穷怕了，不会常年打两份甚至三份工。但是他们还忽略了一个点，叫富在付出，不在劳身。如果你只是想平稳的度过余生，那么很简单，你够努力就行，你够勤劳就行。但是我相信你能把视频看到这儿，你绝对不是一个渴望底层生活，渴望平稳生活的人，那么你就一定要懂得一句话，就是财富是对认知的奖赏，不是对勤奋的补偿。富在输出，不在劳身。", "account_name": "你的好朋友目清", "account_owner": "你的好朋友目清", "account_type": "竞品"}, {"id": "7638854902840202139", "title": "混的好的人和混的不如意的区别#目清师兄 #随拍", "date": "2026-05-12", "likes": 217.0, "comments": 6.0, "shares": 30.0, "collects": 73.0, "duration": 0, "hook": "   const compVids=hub.videos.filter(v=>v.account_type==="竞品").slice(0,5);
  const ownVids=hub.videos.filter(v=>v.account_type==="本号").slice(0,3);

  return React.createElement("div",{style:{maxWidth:860,margin:"0 auto"}},
    React.createElement(Card,{style:{padding:"36px 44px"}},

        [{l:"企微进线",v:s.total_wechat+"人"},{l:"营收",v:"¥"+fmtFull(s.total_revenue)},{l:"播放量(自有)",v:fmt((s.total_play_dy||0)+(s.total_play_sph||0))},{l:"视频总数",v:(s.total_videos||0)+"条"}].map((b,i)=>React.createElement("div",{key:i},

          React.createElement("div",{style:{fontFamily:font,fontSize:18,color:C.accent,fontWeight:600,marginTop:4}},b.v)

      alerts.length>0&&React.createElement("div",{style:{marginBottom:18}},

      ),

      rows.length>0&&React.createElement("div",{style:{marginBottom:18}},
        React.createElement("h4",{style:{fontFamily:font,fontSize:14,paddingLeft:10,borderLeft:`3px solid ${C.accent}`,margin:"0 0 8px"}},"操盘手明细"),
        React.createElement("ul",{style:{margin:"8px 0 0",paddingLeft:24,color:C.ink2,lineHeight:2,fontSize:13}},rows.map((r,i)=>React.createElement("li",{key:i},r.operator+": 进线"+(r.this_week||r.wechat||0)+"人 营收¥"+fmtFull(r.revenue||0))))

// ═══════════════ APP ═══════════════
