是触及了命理学中最隐秘的造化机制，\n\n然后他才有可能好起来。\n\n鬼谷子的隐秘心法中有记录大运将至，必先杀心，觉恩掌果，方结心局。\n\n什么叫杀心？什么叫觉恩掌果？普通人眼里的转运是春风得意，\n\n是贵人相助，但是我告诉你，真的错了。运势发生显著改变的前兆，\n\n往往往往都伴随着极度的痛苦、背叛、孤独和六亲不认。这里我们要引入一个观点，\n\n就是天道要维持平衡，既然要维持平衡，那他就会让每一个人都平等的拥有好运，\n\n但是很多人为什么没有？因为他不懂这套规则，所以他有一颗泛滥的圣母心，\n\n有脆弱的自尊心，以及对底层烂人烂事的共情心。\n\n所以你会发现，那些突然转运变好的人，根本不是懂得了什么高深的商业模式，也不是走了狗屎运，\n\n更不是出现了一个贵人帮他之类的，而是他们突然大彻大悟的明白了一个道理，\n\n就是只要我还在顾及身边这些烂人烂事的感受，\n\n只要我还舍不得这些消耗我的关系，我就永远不配往上走。\n\n因为天道运行的底层逻辑是同频共振，对不对？你？天天和一层底层人，和一群底层人在一起抱怨生活，\n\n天天为了几百块钱的得失纠结内耗，你为了照顾亲戚朋友的感受，\n\n然后委屈自己等等无数种连你自己都知道很傻的行为，那你怎么可能还有多余的气血去维持你往上走？\n\n因为人的气血是有限的，一切都是用气血交换的。\n\n那么这个时候，聪明人就知道要怎么做了，聪明人就明白怎么让自己好起来了。就三步，\n\n就记住三条铁律，你的运势将会不可逆转的变化。一、物理隔绝对烂人烂事多，\n\n看的每一眼都是对自己的不负责任。\n\n不和任何人纠缠，戒掉所有无效社交，你不需要亲戚，不需要朋友，你不需要任何人。\n\n我相信很多人都会有这个经历，自己即将要好起来的时候，朋友叫去喝酒，亲戚叫去帮忙，\n\n再或者朋友劝你踏实点，亲戚劝你别好高骛远，一来二去，机会错过了。\n\n这就是底层社会的现状，因为没人希望你好，真的你太好了，\n\n就显得他们不好了，他们烂在泥里，你也不能试图站起来。所以第一步就是断舍离，\n\n给自己一个干净的磁场，这是最底最底层的逻辑，\n\n这是你要为自己的好运打下的一个地基。第二就是戒掉自证。本人看画这些年，我真的发现很多人一直倒霉，\n\n一直被消耗，因为他陷入了一个自证陷阱，他总想证明他是个好人，他总自我感动。\n\n但是你不需要证明你是个好人，别人怎么看你，跟你有什么关系？\n\n老板压榨你，为了证明自己有能力，为了证明自己负责任，然后拼。命加班，亲戚朋友pua你，\n\n你为了证明自己重感情，不自私，然后疯狂倒贴。这太傻了，别人怎么看你，\n\n跟你有什么关系？鬼谷子的第一篇百合篇里就有讲扬动而行，因止而藏。你说我自私，\n\n那我就自私，你说我冷血，那我就冷血。你说我变了，那我就变了。我没有向你解释的必要，\n\n我没有向你证明的必要。只要利益不发生冲突，所有的指责和误解，我直接照单全收，\n\n做自己想做的，因为没有人会为我的人生负责，我只能为自己的人生负责。\n\n第三就是课题分离。鬼谷子的绝例篇里有讲绝情定宁万事之机。\n\n任何人生抉择，你所做的任何决定，都要以自己的感受，以自己的利益为先。\n\n比如，当对方向你提出要求时，不管他是你的老板，还是合伙人，还是兄弟闺蜜伴侣，你只需要基于你的本心，\n\n判断你是否愿意接受就可以了。至于对方被你拒绝以后，是愤怒，是伤心还是难过，\n\n在乎着你的行为会给对方造成什么严重后果，这本质上是对方的人生课题，\n\n和你没什么关系。所以永远记住，运势的逆转，从来不是和风细雨的，它是一场极其残酷的洗髓换血。\n\n掘恩长果不是让你变得没感情，不是让你变成没感情的畜生。\n\n掘恩长果是让你绝对理智，对自己的命运负起百分百的责任。\n\n你不需要向任何人交代，你只需要向你自己交代，因为没有任何人会给你买单。", "account_name": "你的好朋友目清", "account_owner": "你的好朋友目清", "account_type": "竞品", "comment_analysis": null}, {"id": "7632155993187647206", "title": "命里一尺，难求一丈#道家文化 #知识分享 #目清师兄", "date": "2026-04-24", "likes": 191.0, "comments": 5.0, "shares": 43.0, "collects": 59.0, "duration": 0, "hook": "", "ref": [], "tags": [], "transcript": "一个看卦的告诉你，命里一尺难求一丈，人家一生有4样东西，从你出生的那一刻就已经被定 // ═══════════════ BENCHMARK ═══════════════
const Benchmark=()=>{
  const hub=D();
  const vids=hub.videos||[];

  // Compute anomaly data per competitor account
  const competitorAccounts=[...new Set(vids.filter(v=>v.account_type==="竞品").map(v=>v.account_name))];

  const benchmarkData=competitorAccounts.map(name=>{
    const accVids=vids.filter(v=>v.account_name===name);
    accVids.sort((a,b)=>(b.likes||0)-(a.likes||0));
    const topVid=accVids[0];
    const avgLikes=accVids.length>1?accVids.reduce((s,v)=>s+(v.likes||0),0)/accVids.length:topVid?.likes||1;
    const avgShares=accVids.length>1?accVids.reduce((s,v)=>s+(v.shares||0),0)/accVids.length:topVid?.shares||1;

    // Find anomaly videos (likes > 2x average)
    const anomalyVids=accVids.filter(v=>(v.likes||0)>avgLikes*2).slice(0,3).map(v=>({
      title:$(v,"title").slice(0,30),
      platform:"抖音",
      likes:fmt(v.likes),
      avg:fmt(Math.round(avgLikes)),
      pct:avgLikes>0?Math.round(((v.likes||0)-avgLikes)/avgLikes*100):0,
      comments:fmt(v.comments),
      shares:fmt(v.shares),
      sharesAvg:fmt(Math.round(avgShares)),
      sharesPct:avgShares>0?Math.round(((v.shares||0)-avgShares)/avgShares*100):0,
      date:v.date||"—",
    }));

    const anomalyScore=Math.min(100,Math.round(anomalyVids.length*30+Math.min(40,accVids.length>0?(accVids[0].likes||0)/Math.max(avgLikes,1)*10:0)));

    return {
      name,
      anomalyScore,
      anomalyVideos:anomalyVids,
      videoCount:accVids.length,
      totalLikes:accVids.reduce((s,v)=>s+(v.likes||0),0),
    };
  }).filter(b=>b.videoCount>0).sort((a,b)=>b.anomalyScore-a.anomalyScore);

  const [selected,setSelected]=useState(0);
  const acct=benchmarkData[selected];

  if(benchmarkData.length===0)return(<div style={{padding:40,textAlign:"center",color:C.muted}}>暂无竞品数据</div>);

  return(<div>
    <SectionTitle right="按异常程度排序 · 基于2x均值检测">对标账号 · 异常监控</SectionTitle>
    <div style={{display:"grid",gridTemplateColumns:"260px 1fr",gap:16}}>
      <div>
        <Card style={{padding:0}}>
          {benchmarkData.map((a,i)=>(<div key={i} onClick={()=>setSelected(i)} style={{padding:"14px 16px",borderBottom:`1px solid ${C.line}`,cursor:"pointer",background:selected===i?"rgba(125,79,42,0.06)":"transparent",borderLeft:selected===i?`3px solid ${C.accent}`:"3px solid transparent"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
              <span style={{fontWeight:600,fontSize:14}}>{a.name}</span>
              <span style={{fontSize:11,fontWeight:600,color:a.anomalyScore>80?C.orange:a.anomalyScore>60?C.gold:C.muted,background:a.anomalyScore>80?"rgba(198,98,44,0.1)":a.anomalyScore>60?"rgba(155,139,115,0.15)":C.bg2,padding:"2px 8px",borderRadius:4}}>异常度 {a.anomalyScore}</span>
            </div>
            <div style={{fontSize:11,color:C.muted}}>{a.anomalyVideos.length}条异常内容 · {a.videoCount}条视频</div>
          </div>))}
        </Card>
      </div>
      <div>
        {acct&&(<>
          <Card style={{marginBottom:16}}>
            <SectionTitle right={`异常度评分 ${acct.anomalyScore}/100`}>{acct.name} · 异常内容</SectionTitle>
            {acct.anomalyVideos.length===0&&<div style={{padding:20,textAlign:"center",color:C.muted2,fontSize:13}}>近7日内无显著异常内容</div>}
            {acct.anomalyVideos.map((av,i)=>(<div key={i} style={{padding:"14px 0",borderBottom:i<acct.anomalyVideos.length-1?`1px solid ${C.line}`:"none"}}>
              <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10}}>
                <span style={{fontSize:10,padding:"2px 8px",borderRadius:3,background:"rgba(198,98,44,0.1)",color:C.orange,fontWeight:600}}>爆</span>
                <span style={{fontWeight:600,fontSize:14}}>{av.title}</span>
                <Tag>{av.platform}</Tag>
                <span style={{fontSize:11,color:C.muted,marginLeft:"auto"}}>{av.date}</span>
              </div>
              <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:12}}>
                {[
                  {label:"点赞",value:av.likes,avg:av.avg,pct:av.pct>0?"+"+av.pct+"%":av.pct+"%"},
                  {label:"评论",value:av.comments,avg:"—",pct:"—"},
                  {label:"分享",value:av.shares,avg:av.sharesAvg,pct:av.sharesPct>0?"+"+av.sharesPct+"%":av.sharesPct+"%"},
                ].map((m,j)=>(<div key={j} style={{padding:"8px 12px",background:C.bg2,borderRadius:6}}>
                  <div style={{fontSize:11,color:C.muted}}>{m.label}</div>
                  <div style={{fontFamily:font,fontSize:18,fontWeight:600,color:C.accent,marginTop:2}}>{m.value}</div>
                  {m.avg!=="—"&&<div style={{fontSize:11,marginTop:4}}>
                    <span style={{color:C.muted2}}>均值 {m.avg}</span>
                    <span style={{marginLeft:6,fontWeight:600,color:C.jade}}>{m.pct}</span>
                  </div>}
                </div>))}
              </div>
            </div>))}
          </Card>

          <Card>
            <SectionTitle>{acct.name} · 数据概览</SectionTitle>
            <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:12,marginBottom:12}}>
              {[{l:"视频总数",v:acct.videoCount+"条"},{l:"点赞总量",v:fmt(acct.totalLikes)},{l:"异常视频",v:acct.anomalyVideos.length+"条"}].map((m,i)=>(<div key={i} style={{padding:"10px",background:C.bg2,borderRadius:6,textAlign:"center"}}>
                <div style={{fontSize:11,color:C.muted}}>{m.l}</div>
                <div style={{fontFamily:font,fontSize:16,fontWeight:600,color:C.accent,marginTop:4}}>{m.v}</div>
              </div>))}
            </div>
            <div style={{fontSize:12,color:C.muted2,lineHeight:1.8}}>
              异常检测规则：点赞数超过该账号均值的 2 倍视为异常内容。异常度 = 异常视频数 × 30 + 最高点赞偏离度。
            </div>
          </Card>
          <Card style={{marginTop:16}}>
            <SectionTitle>AI 分析</SectionTitle>
            <div style={{padding:"20px",textAlign:"center",color:C.muted2,fontSize:13,lineHeight:1.8}}>
              LLM 分析待接入<br/>
              <span style={{fontSize:11}}>将自动生成该账号近期数据的分析文字</span>
            </div>
          </Card>
        </>)}
      </div>
    </div>
  </div>);
};

// ═══════════════ REPORT ═══════════════
const Report=()=>{
  const hub=D();
  const [rType,setRType]=useState("daily");
  const s=hub.summary||{};
  const rows=hub.private_pool?.rows||[];
  const alerts=hub.alerts||[];
  const compVids=(hub.videos||[]).filter(v=>v.account_type==="竞品").slice(0,5);
  const ownVids=(hub.videos||[]).filter(v=>v.account_type==="本号").slice(0,3);
  const topOwn=ownVids.length>0?[...ownVids].sort((a,b)=>(b.likes||0)-(a.likes||0))[0]:null;

  return(<div style={{maxWidth:860,margin:"0 auto"}}>
    <div style={{display:"flex",gap:8,marginBottom:16}}>
      {[{k:"daily",l:"日报"},{k:"weekly",l:"周报"},{k:"monthly",l:"月报"}].map(({k,l})=>(<button key={k} onClick={()=>setRType(k)} style={{padding:"6px 18px",borderRadius:6,border:`1px solid ${rType===k?C.accent:C.line}`,background:rType===k?"rgba(125,79,42,0.06)":"transparent",color:rType===k?C.accent:C.muted,fontSize:13,fontFamily:font}}>{l}</button>))}
    </div>

    {rType==="daily"&&<Card style={{padding:"36px 44px"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",paddingBottom:18,borderBottom:`2px solid ${C.ink}`,marginBottom:22}}>
        <div>
          <div style={{fontSize:11,color:C.muted2,letterSpacing:"0.15em",marginBottom:6}}>愿实文化 · 日报</div>
          <h2 style={{fontFamily:font,fontSize:22,margin:0}}>{hub.data_date} 运营日报</h2>
        </div>
        <div style={{width:48,height:48,background:C.accent,color:"#fbf5e9",display:"flex",alignItems:"center",justifyContent:"center",fontFamily:font,fontSize:14,fontWeight:700,borderRadius:4,transform:"rotate(-4deg)"}}>日报</div>
      </div>
      {/* KPI strip */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:14,padding:14,background:C.bg2,borderRadius:8,marginBottom:22}}>
        {[
          {l:"企微进线",v:Math.round(s.total_wechat||0)+"人"},
          {l:"营收",v:"¥"+fmtFull(Math.round(s.total_revenue||0))},
          {l:"播放量(自有)",v:fmt(Math.round((s.total_play_dy||0)+(s.total_play_sph||0)))},
          {l:"视频总数",v:(s.total_videos||0)+"条"},
        ].map((b,i)=>(<div key={i}>
          <div style={{fontSize:11,color:C.muted}}>{b.l}</div>
          <div style={{fontFamily:font,fontSize:18,color:C.accent,fontWeight:600,marginTop:4}}>{b.v}</div>
        </div>))}
      </div>
      {/* Dynamic sections */}
      {rows.length>0&&(<div style={{marginBottom:18}}>
        <h4 style={{fontFamily:font,fontSize:14,paddingLeft:10,borderLeft:`3px solid ${C.accent}`,margin:"0 0 8px"}}>操盘手明细</h4>
        <ul style={{margin:"8px 0 0",paddingLeft:24,color:C.ink2,lineHeight:2,fontSize:13}}>
          {rows.map((r,i)=><li key={i}>{r.operator}: 进线{r.this_week||0}人{r.revenue>0?", 营收¥"+fmtFull(r.revenue):""}</li>)}
        </ul>
      </div>)}
      {topOwn&&(<div style={{marginBottom:18}}>
        <h4 style={{fontFamily:font,fontSize:14,paddingLeft:10,borderLeft:`3px solid ${C.orange}`,margin:"0 0 8px"}}>今日亮点</h4>
        <ul style={{margin:"8px 0 0",paddingLeft:24,color:C.ink2,lineHeight:2,fontSize:13}}>
          <li>{$(topOwn,"account_name")}「{$(topOwn,"title").slice(0,30)}」👍{fmt(topOwn.likes)}，为自有内容最佳{topOwn.shares>0?", 分享"+fmt(topOwn.shares):""}</li>
          {rows.length>0&&rows.some(r=>(r.this_week||0)>10)&&<li>进线主力：{rows.filter(r=>(r.this_week||0)>10).map(r=>r.operator+(r.this_week||0)+"人").join(" · ")}</li>}
          {alerts.length>0&&<li>⚠ {$(alerts[0],"account")} {$(alerts[0],"text")}</li>}
          <li>自有播放量 {fmt(Math.round((s.total_play_dy||0)+(s.total_play_sph||0)+(s.total_play_xhs||0)))}，总营收 ¥{fmtFull(Math.round(s.total_revenue||0))}</li>
        </ul>
      </div>)}
      {compVids.length>0&&(<div style={{marginBottom:18}}>
        <h4 style={{fontFamily:font,fontSize:14,paddingLeft:10,borderLeft:`3px solid ${C.gold}`,margin:"0 0 8px"}}>竞品观察</h4>
        <ul style={{margin:"8px 0 0",paddingLeft:24,color:C.ink2,lineHeight:2,fontSize:13}}>
          {compVids.slice(0,3).map((v,i)=><li key={i}>{$(v,"account_name")}「{$(v,"title").slice(0,25)}」👍{fmt(v.likes)} ↗{fmt(v.shares)}</li>)}
        </ul>
      </div>)}
    </Card>}

    {rType!=="daily"&&<Card style={{padding:"36px 44px"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",paddingBottom:18,borderBottom:`2px solid ${C.ink}`,marginBottom:22}}>
        <div>
          <div style={{fontSize:11,color:C.muted2,letterSpacing:"0.15em",marginBottom:6}}>愿实文化 · {rType==="weekly"?"周报":"月报"}</div>
          <h2 style={{fontFamily:font,fontSize:22,margin:0}}>{rType==="weekly"?"近7日运营周报":"近30日运营月报"}</h2>
        </div>
        <div style={{width:48,height:48,background:C.accent,color:"#fbf5e9",display:"flex",alignItems:"center",justifyContent:"center",fontFamily:font,fontSize:14,fontWeight:700,borderRadius:4,transform:"rotate(-4deg)"}}>{rType==="weekly"?"周报":"月报"}</div>
      </div>
      <table style={{width:"100%",borderCollapse:"collapse",fontSize:13,marginBottom:22}}>
        <thead><tr style={{borderBottom:`1px solid ${C.line2}`}}>
          {["指标","本期","上期","环比"].map((h,i)=>(<th key={i} style={{padding:"8px 10px",textAlign:i===0?"left":"center",fontSize:11,color:C.muted,fontWeight:500}}>{h}</th>))}
        </tr></thead>
        <tbody>
          {[
            {m:"企微进线",tw:Math.round(s.total_wechat||0)+"人",lw:"—",d:"—"},
            {m:"营收",tw:"¥"+fmtFull(Math.round(s.total_revenue||0)),lw:"—",d:"—"},
            {m:"自有播放量",tw:fmt(Math.round((s.total_play_dy||0)+(s.total_play_sph||0))),lw:"—",d:"—"},
            {m:"视频总数",tw:(s.total_videos||0)+"条",lw:"—",d:"—"},
            {m:"评论总数",tw:(s.total_comments||0)+"条",lw:"—",d:"—"},
            {m:"异常告警",tw:(alerts.length||0)+"条",lw:"—",d:"—"},
          ].map((r,i)=>(<tr key={i} style={{borderBottom:`1px solid ${C.line}`}}>
            <td style={{padding:"10px",fontWeight:500}}>{r.m}</td>
            <td style={{textAlign:"center",fontFamily:font,fontWeight:600}}>{r.tw}</td>
            <td style={{textAlign:"center",color:C.muted}}>{r.lw}</td>
            <td style={{textAlign:"center"}}><Delta v={r.d}/></td>
          </tr>))}
        </tbody>
      </table>
      <div style={{fontSize:11,color:C.muted2,marginTop:8}}>上期数据需积累2个周期后自动填充 · 环比为空白表示暂无可比数据</div>
    </Card>}
  </div>);
};

// ═══════════════ APP ═══════════════
const tabs=[
  {id:"overview",label:"今日总览"},
  {id:"ranking",label:"爆款排行"},
  {id:"video",label:"视频详情"},
  {id:"comments",label:"评论洞察"},
  {id:"benchmark",label:"对标账号"},
  {id:"report",label:"报告"},
];

function App(){
  const [tab,setTab]=useState("overview");
  const [vid,setVid]=useState(0);
  const hub=D();

  return(<div style={{fontFamily:sans,background:C.bg,minHeight:"100vh",color:C.ink}}>
    {/* Top nav */}
    <div style={{background:C.paper,borderBottom:`1px solid ${C.line}`,padding:"12px 24px",display:"flex",alignItems:"center",gap:24,position:"sticky",top:0,zIndex:20}}>
      <div style={{display:"flex",alignItems:"center",gap:10,flexShrink:0}}>
        <div style={{width:34,height:34,borderRadius:6,background:`linear-gradient(140deg,${C.accent},${C.accent2})`,color:"#fbf5e9",fontFamily:font,fontSize:18,fontWeight:700,display:"flex",alignItems:"center",justifyContent:"center"}}>愿</div>
        <div>
          <div style={{fontFamily:font,fontSize:14,fontWeight:600}}>愿实数据中枢</div>
          <div style={{fontSize:9,color:C.muted2,letterSpacing:"0.1em"}}>CONTENT INTELLIGENCE</div>
        </div>
      </div>
      <div style={{display:"flex",gap:2,flex:1,justifyContent:"center",flexWrap:"wrap"}}>
        {tabs.map(t=>(<button key={t.id} onClick={()=>setTab(t.id)} style={{padding:"6px 14px",border:"none",borderRadius:6,fontSize:13,fontFamily:font,fontWeight:tab===t.id?600:400,background:tab===t.id?"rgba(125,79,42,0.08)":"transparent",color:tab===t.id?C.accent:C.muted}}>{t.label}</button>))}
      </div>
      <div style={{display:"flex",alignItems:"center",gap:6,fontSize:11,color:C.muted,flexShrink:0}}>
        <span style={{width:8,height:8,borderRadius:"50%",background:C.jade}}/>
        数据: {hub.data_date||"—"}
      </div>
    </div>
    {/* Content */}
    <div style={{padding:"22px 28px 80px",maxWidth:1200,margin:"0 auto"}}>
      {tab==="overview"&&<Overview setTab={setTab} setVid={setVid}/>}
      {tab==="ranking"&&<Ranking setTab={setTab} setVid={setVid}/>}
      {tab==="video"&&<VideoDetail vid={vid} setTab={setTab}/>}
      {tab==="comments"&&<Comments/>}
      {tab==="benchmark"&&<Benchmark/>}
      {tab==="report"&&<Report/>}
    </div>
  </div>);
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
